 sjalvolki_defectors_decision_tt: "Five counties will be settled by Sjalvolki settlers, restoring the local population"
 sjalvolki_defectors_decision_increases_event_troops_tt: "You will be able to field a larger host when Cenware next invades"
 sjalvolki_defectors_decision_unpopular_tt: "#N This will be unpopular with your subjects#!"
 sjalvolki_defectors_decision_desc: "As much as Cenware would like us to believe otherwise, his Imperrech is far from immune to division. Several of his chieftains could likely be swayed to join us in exchange for land. Naturally, this idea has received some pushback."
