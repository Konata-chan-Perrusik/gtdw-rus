 unite_the_eastern_coast.t: "Unite the Eastern Coast"
 unite_the_eastern_coast_decision_desc: "It is said that a great [kingdom|E] once ruled these shores. With our might unparalleled across the eastern passages, it is time that one rules them again."
 unite_the_eastern_coast_decision_tooltip: "Unite the Eastern [pirate_coast|E]"
 unite_the_eastern_coast_decision_confirm: "The Stars Shall Guide Us"
 unite_the_eastern_coast_decision_tt: "Your primary [kingdom|E] title [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] will integrate any kingdom you [completely_control|E] in [GetGeographicalRegion('nightcoast_biozone').GetName] except for $k_ufaliracci$."
 take_control_of_spice_trade.t: "Secure the Spice Trade"
 take_control_of_spice_trade_decision_desc: "The vast riches of the [pirate_coast|E] Spice Trade have driven many to despair, but it is finally within our reach."
