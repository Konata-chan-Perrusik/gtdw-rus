 ask_conclave_for_help_decision: "Ask the Conclave for Help"
 ask_conclave_for_help_decision_tooltip: "We might need to set political squabbles aside in the interest of mutual self-preservation"
 ask_conclave_for_help_decision_tt: "You will work more closely with the Conclave for the next three years in order to better coordinate the war effort"
 ask_conclave_for_help_decision_increases_concave_power_tt: "#N This will likely increase the Conclave's power#!"
 ask_conclave_for_help_decision_conclave_immune_tt: "#N The Conclave will be immune to hostile intrigue actions for the next 3 years#!"
 ask_conclave_for_help_decision_desc: "Though my interests are inherently contradictory to those of the Conclave, and both sides are acutely aware of this, Cenware presents an existential threat to both — Rhesus is at least intelligent enough to see that. I could offer a temporary truce until the Sjalvolki are dealt with."
 ask_conclave_for_help_decision_confirm: "Make an Offering of Peace"
 move_against_conclave_decision: "Move Against a Member of the Conclave"
 move_against_conclave_decision_tooltip: "My enemies are not just those without, but those within the realm as well"
 move_against_conclave_decision_tt: "I will try to bring about the downfall of one of the Conclave's members"
 move_against_conclave_cooldown: "This can only be done once every 6 months"
 move_against_conclave_decision_desc: "The Conclave has a seemingly unshakeable grip on the reins of state. If I and, hopefully, my successors are ever to rule in their own right, I will need to bring this group of schemers under control.\n\nWhile acting directly against them all would be a folly sure to cost me my head, I can try picking off their members one by one."
 move_against_conclave_decision_confirm: "Convene with my loyalists"
 conclave_no_councillors: "There are no members of the Conclave on your council, excluding Rhesus himself"
 defeat_rhesus_decision: "The Puppetmaster's Fall"
 defeat_rhesus_decision_tooltip: "Only one can sit the throne, and both me and Rhesus have it in our sights"
 defeat_rhesus_decision_tt: "You will decide the fate of your mentor, former captor and rival"
 defeat_rhesus_decision_desc: "Rhesus is a politician and schemer without equal. As formidable as Cenware is on the field of battle, so is Rhesus in the halls of power. And like the High King of the Sjalvolki, he will not be beaten in one fight, and the fight will be intense indeed."
 defeat_rhesus_decision_confirm: "Have your final meeting"
