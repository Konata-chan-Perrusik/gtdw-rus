 add_province_modifiers_confirm: "Add province modifiers."
 add_province_modifiers_tooltip: "Add province modifiers."
 add_province_modifiers_desc: "Add province modifiers."
 gh_military_to_feudalism_decision: "Embrace [feudalism|E]"
 gh_military_to_feudalism_decision_desc: "The time has come to dissolve the rule of the Legion, and adapt to traditional methods of rule."
 gh_military_to_feudalism_decision_confirm: "So be it."
 gh_military_to_feudalism_decision_tooltip: "Change [government|E] to [feudalism|E]"

 raze_sophocos_decision: "Raze the Tower of Sophocos"
 raze_sophocos_decision_desc: "The Tower of [GetBuilding('01_sophocos').GetName] has stood for untold millenia, attracting pilgrims and travelers from across [aeras|E]. It is bound to be full of treasures ripe for our taking."
 raze_sophocos_decision_tooltip: "Raze Sophocos and take it's treasures"
 raze_sophocos_decision_confirm: "Claim Sophocos' Treasures"
 raze_sophocos_effect_tooltip: "You will raze [GetBuilding('01_sophocos').GetName], taking its treasures and setting its building back to level one."

 claim_the_isles_decision: "Claim the Isles"
 claim_the_isles_decision_desc: "The [shatteredisles|E] sprawl across the Sea of Empires like jagged fragments of a whole. It is time to put the pieces back together."
 claim_the_isles_decision_tooltip: "Stake your claim for the Shattered Isles"
 claim_the_isles_decision_confirm: "Claim the Isles"

 isles_retribution_war_decision: "Islander Sovereignty"
 isles_retribution_war_decision_desc: "For too long the continentals have encroached upon the salt — battered shores of our home, taking what is rightfully ours. We must put an end to it, and kick them back into the sea."
 isles_retribution_war_decision_tooltip: "Defend the Isles"
 isles_retribution_war_decision_confirm: "Retribution!"
 islander_warriors: "Islander Warriors"
 claim_the_isles_decision_effects_tooltip: "Your [house|E] gains access to a [casus_belli|E] for [counties|E] in the [shatteredisles|E]."
 isles_retribution_decision_effects_tooltip: "Your [house|E] gains access to a [casus_belli|E] for [counties|E] controlled by non-Islanders in the [shatteredisles|E]."
 isles_retribution_war_tt: "More than 25% of the [GetGeographicalRegion('world_ga_isles').GetName] must be controlled by a non-[Concept('shatteredisles','Islander')|E]"

 hire_protoshliti_warrior_decision: "Hire a Warrior from the Protoshliti"
 hire_protoshliti_warrior_decision_desc: "The Protoshliti is famous for providing the [Concept('aversaria','Aversarian')|E] legions with skilled and able soldiers. Now that the Champion Grounds have resumed its operations, perhaps I can procure one of these talented warriors to serve at my Court."
 hire_protoshliti_warrior_decision_tooltip: "You will be presented with a group of Protoshliti-trained warriors and may hire one of them for a fee"
 hire_protoshliti_warrior_decision_effect_tooltip: "You will look for a Protoshliti-trained warrior to join your Court"
 hire_protoshliti_warrior_decision_confirm: "Pay a visit to the Protoshliti"
 hire_protoshliti_warrior_decision_desc_tooltip: "You will attempt to hire a Protoshliti-trained warrior"

 hire_protoshliti_legon_decision: "Hire a Legon from the Protoshliti"
 hire_protoshliti_legon_decision_desc: "The Protoshliti is known to have produced not only skilled warriors, but also the greatest generals to have ever served [aversaria|E]. Officers trained in the academy's grueling courses possess a keen mind honed in strategy, and were instrumental to the Empire's centuries-long military supremacy."
 hire_protoshliti_legon_decision_tooltip: "You will be presented with a group of Protoshliti-trained Legons and may hire one of them for a fee"
 hire_protoshliti_legon_decision_effect_tooltip: "You will look for a Protoshliti-trained Legon to join your Court"
 hire_protoshliti_legon_decision_confirm: "Pay a visit to the Protoshliti"
 hire_protoshliti_legon_decision_desc_tooltip: "You will attempt to hire a Protoshliti-trained Legon"

 hire_aironoiakaan_magi_decision: "Hire a [magi|E] from the Aironoiakaan"
 hire_aironoiakaan_magi_decision_desc: "With the restoration of the Mayikprollolan Aironoiakaan, the east once again has a center of magical learning. Graduates from the prestigious academy are sure to be among the greatest [magi|E] of their generation — and for a price, I can have one of them serving in my court."
 hire_aironoiakaan_magi_decision_tooltip: "You will be presented with a group of Aironoiakaan-trained [magi|E] and may hire one of them for a fee."
 hire_aironoiakaan_magi_decision_effect_tooltip: "You will look for a Aironoiakaan-trained [magi|E] to join your Court"
 hire_aironoiakaan_magi_decision_confirm: "Send an emissary"
 hire_aironoiakaan_magi_decision_desc_tooltip: "You will attempt to hire a Aironoiakaan-trained [magi|E]"

 summon_disciple_from_the_burning_temple_decision: "Seek a Disciple from the Fire Temple of Korlacu"
 summon_disciple_from_the_burning_temple_decision_desc: "It is time to summoned forth an initiate worthy enough to be my disciple and advise me at court.."
 summon_disciple_from_the_burning_temple_decision_sel_tooltip: "You will be presented with a group of possible candidates to pick your Court [magi|E] from."
 summon_disciple_from_the_burning_temple_decision_tooltip: "You will be presented with a group of possible candidates to choose from"
 summon_disciple_from_the_burning_temple_quality_tooltip: "The quality of the candidates will depend on your [piety|E] level"
 summon_disciple_from_the_burning_temple_decision_confirm: "Send the messenger."

 request_heir_from_burning_temple_decision: "Seek an Heir from the Burning Temple"
 request_heir_from_burning_temple_decision_desc: "It is time to summon forth an initiate worthy enough to be my disciple."
 request_heir_from_burning_temple_decision_tooltip: "As the High Priest of the Sacred Flame, you will be presented with a group of possible candidates to pick your [heir|E] from."
 request_heir_from_burning_temple_decision_quality_tooltip: "The quality of the candidates will depend on your [piety|E] level"
 request_heir_from_burning_temple_decision_confirm: "Send the messenger"

 request_heir_from_the_grove_decision: "Seek a Disciple from the Sacred Grove"
 request_heir_from_the_grove_decision_desc: "It is time to summon forth an initiate worthy enough to be my disciple."
 request_heir_from_the_grove_decision_tooltip: "As the High Sepattan, you will be presented with a group of possible candidates to pick your [heir|E] from."
 request_heir_from_the_grove_decision_quality_tooltip: "The quality of the candidates will depend on your [piety|E] level"
 request_heir_from_the_grove_decision_confirm: "Send the messenger"
 
 request_magi_from_the_grove_decision: "Recruit a Skilled Magi from the Sacred Grove"
 request_magi_from_the_grove_decision_desc: "It is time to summon forth an initiate worthy enough to join my court."
 request_magi_from_the_grove_decision_tooltip: "You will be presented with a group of possible candidates to pick your Court [magi|E] from."
 request_magi_from_the_grove_decision_quality_tooltip: "The quality of the candidates will depend on your [piety|E] level."
 request_magi_from_the_grove_decision_confirm: "Send the messenger"

 request_heir_from_the_pit_decision: "Pray for a Worthy Heir"
 request_heir_from_the_pit_decision_desc: "From whence we come and to where we all return — the Pit is the beginning and the end of all things, the caress of the true gods beyond [aeras|E], and the place where flesh and ichor are joined into black blood. It is from there that I shall call forth an initiate worthy to be my disciple."
 request_heir_from_the_pit_decision_tooltip: "You will be presented with a group of [GetTrait('gh_blackspawn_1').GetName( GetNullCharacter )] candidates to pick your [heir|E] from"
 request_heir_from_the_pit_decision_quality_tooltip: "The quality of the candidates will depend on your $PF_piety_opposite$ and the Blackspawn [trait|E] level"
 request_heir_from_the_pit_decision_confirm: "Send the messenger"

 declare_rivarisian_kingdom_decision: "Declare a Kingdom for the Rivarisians"
 declare_rivarisian_kingdom_decision_desc: "For too long have the people of the rivers been persecuted by warring lords, [Concept('clerical_control_of_chevalie','power-hungry theocrats')|E] and greedy merchants. No longer! Our people shall form a new kingdom, and prove ourselves equal to all the other children of [chevalie|E]! Let them see the riches of our cities and the pride in our hearts, and bow to our freedoms forever!"
 declare_rivarisian_kingdom_decision_confirm: "Forge a new path for our people!"
 declare_rivarisian_kingdom_decision_tooltip: "The oppression of the Riverfolk shall end!"

 gh_divine_mission_decision: "The Will of the Gods"
 gh_divine_mission_decision_desc: "Darkness swells, and the schemes of my dark masters tighten around the throat of the world. In their majesty, the gods have given me a task — a divine mission to further their will upon this plane. They are capricious, and I must make haste to act upon my sworn purpose."
 gh_divine_mission_decision_tt: "The gods shall commune with you once the mission is complete"
 gh_divine_mission_decision_tooltip: "Track the progress of the assigned mission"
 gh_divine_mission_decision_confirm: "Masters' will be done"

 # Dahangon
 gh_restore_bronzeport_bureaucracy_decision: "Restore the Bureaucracy of the Bronzeport"
 gh_restore_bronzeport_bureaucracy_decision_desc: "The High Ministers of the [Concept('bureau_bronzeport','Bronzeport')|E] have always been elected by the merchants and officials of the Bureau. To do otherwise is in direct contravention of the esteemed and most noble charter of the Heaven-Ordained Semi-Autonomous Bureau of the Bronzeport."
 gh_restore_bronzeport_bureaucracy_decision_tooltip: "Restores the Bronzeport's government into a republic."
 gh_restore_bronzeport_bureaucracy_decision_confirm: "The Bronzeport shall belong to the people once more!"

 restored_bronzeport_modifier: "Restored Bronzeport Bureaucracy"
 restored_bronzeport_modifier_desc: "The restoration of the Bronzeport's bureaucracy has resulted in a temporary boost in trade."
 bronzeport_restorer_modifier: "Restorer of the Bureau"
 bronzeport_restorer_modifier_desc: "This character has restored the Bronzeport's bureaucracy, earning the love of his republic vassals."

 establish_southsea_protectorate.t: "Establish the Protectorate of the Southsea"
 establish_southsea_protectorate_decision_desc: "The southern seas of Dahangon have long been beyond the grasp of the Empire. No more."
 establish_southsea_protectorate_decision_tooltip: "Establish a new Protectorate in the southern seas."
 establish_southsea_protectorate_decision_confirm: "The Seas are Ours to Rule!"

 gh_kedari_magocracy.t: "Convene the Rite of Marks"
 gh_kedari_magocracy_decision_desc: "For too long have the best of us stood alone in the shadows. It is high time that we convene to unearth the great marks lost to our people."
 gh_kedari_magocracy_decision_tooltip: "Change your government into a magocracy."
 gh_kedari_magocracy_decision_confirm: "To a new age of magic!"

 reclaim_naklans_legacy.t: "Reclaim Naklan's Legacy"
 reclaim_naklans_legacy_decision_desc: "The greatest of our leaders have oft claimed to be reincarnations of [naklan_the_golden|E]. For our people know that even in death, power does not fade, but instead waits for an opportunity to return to its rightful wielder."
 reclaim_naklans_legacy_decision_tooltip: "Announce to the world your claim of being Naklan Reborn"
 reclaim_naklans_legacy_decision_confirm: "I have returned!"
 reclaim_naklans_legacy_capital_tt: "Our capital is located at [GetTitleByKey('c_shadowflats').GetNameNoTier]"

 achieve_dayas_dream.t: "Achieve Daya's Dream"
 achieve_dayas_dream_decision_desc: "[nari_daya|E], the Mother of Us All, had been denied her queenship by weak and unworthy men. The time has come to correct this injustice."
 achieve_dayas_dream_decision_tooltip: "Achieve Nari Daya's dream, and sing her legend to the stars."
 achieve_dayas_dream_decision_confirm: "Our Thorns Shall Never Break!"

 create_aversaria_anastereias_decision.t: "Form Aversaria Anastereias"
 create_aversaria_anastereias_decision_desc: "[Concept('aversaria', 'Aversaria\\'s')|E] ashes settle into [aeras|E], and our once proclaimed 'pure' blood mixes with the people of [kasiryat_biozone|E]. The time has come to decide: do we cling to tradition, imposing a new order in attempts to supplant the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )], or do we let it go? Should we embrace the cultures of our new neighbors and subjects, and create something new?" 
 create_aversaria_anastereias_decision_tooltip: "Form a new [Concept('aversaria', 'Aversarian')|E] empire on the shores of Kasiryat"
 create_aversaria_anastereias_decision_confirm: "Let us decide our new destiny!"
 create_aversaria_anastereias_generic_effect_tooltip: "You will create [GetTitleByKey('e_aversaria_anastereias').GetNameNoTier] and be given a choice between integrating with the peoples of the Kasiryat and subjugating them"
 create_aversaria_anastereias_decision_hybridization_tooltip: "If you choose to integrate and [completely_control_region|E] the [kingdoms|E] of [GetTitleByKey('k_dartar').GetNameNoTier], [GetTitleByKey('k_hyratan').GetNameNoTier], [GetTitleByKey('k_taleshtadendar').GetNameNoTier], and [GetTitleByKey('k_kasharya').GetNameNoTier], as well as the [duchies|E] of [GetTitleByKey('d_taliron').GetNameNoTier], [GetTitleByKey('d_batset').GetNameNoTier], and [GetTitleByKey('d_detbora').GetNameNoTier], they will become a [de_jure|E] part of the new [empire|E]"
 create_aversaria_anastereias_decision_traditionalist_tooltip: "If you choose to subjugate and [completely_control_region|E] the [duchies|E] of [GetTitleByKey('d_taliron').GetNameNoTier] and [GetTitleByKey('d_bazauuk').GetNameNoTier], they will become a [de_jure|E] part of the new [empire|E]"

 solidify_aversaria_anastereias_decision.t: "Solidify Aversaria Anasterias"
 solidify_aversaria_anastereias_decision_desc: "While we claimed the whole of [kasiryat_biozone|E] at the inception of our [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )], many along the river still spurn our authority. Yet with these recalcitrant lands now under our control we can render our claim unassailable in truth as well as it is on paper."
 solidify_aversaria_anastereias_decision_tooltip: "Expand the [de_jure|E] borders of the new empire"
 solidify_aversaria_anastereias_decision_confirm: "Let None Renounce Our Claim"
 solidify_aversaria_anastereias_effect_tooltip: "All of the optional [titles|E] not claimed in the original decision will become a [de_jure|E] part of [GetTitleByKey('e_aversaria_anastereias').GetNameNoTier]"

 restore_nalmavast_priesthood_decision: "Restore [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] Priesthood"
 restore_nalmavast_priesthood_decision_desc: "Although the notion of a united [ROOT.Char.GetFaith.GetAdjective] priesthood is little more than a distant memory, what once was may yet be restored. With the foundations secured, I shall convene the priests to choose a new $nalmavast_religious_head_title$ among their ranks to lead the faithful."
 restore_nalmavast_priesthood_decision_tooltip: "Reform your faith to shed the wounds of the past"
 restore_nalmavast_priesthood_decision_confirm: "For Nalma, for our people"
 restore_nalmavast_priesthood_decision_holy_sites: "You control at least one [CHARACTER.GetFaith.GetAdjective] [holy_site|E]"
 restore_nalmavast_priesthood_decision_tt: "The [THIS.Char.GetFaith.GetAdjective] priesthood is re-established"
 nalmavast_tradition: "Tradition"
 nalmavast_tradition_tooltip: "Your faith will largely remain the same"
 nalmavast_tradition_desc: "We shall mend our traditions and restore all that has been"
 nalmavast_pluralist: "Adaptation"
 nalmavast_pluralist_tooltip: "Your faith will become more pluralist"
 nalmavast_pluralist_desc: "The challenges of yesteryear have changed us, and we are stronger together"
 nalmavast_righteous: "Mysticism"
 nalmavast_righteous_tooltip: "Your faith will become more righteous and mystical"
 nalmavast_righteous_desc: "The sacred lore is ours alone, let us keep it this way"
 nalmavast_fundamentalist: "Retribution"
 nalmavast_fundamentalist_tooltip: "Your faith will become more fundamentalist and warlike"
 nalmavast_fundamentalist_desc: "Weakness has been the reason of our downfall, and it will be so no more"

 reclaim_krehejad_decision: "Reclaim the Land of Our Mothers"
 reclaim_krehejad_decision_desc: "Since our defeat in the [war_of_all_islands|E], our people have been cast adrift like a sailor tossed overboard. And yet we shall not slide gently into oblivion. Through sword and sail, we have reclaimed our homeland from the [Concept('aversaria','Aversarians')|E] and now stand poised to unite the [warrior_women_ehatm|E]. All that remains is to announce our dominion over the waves once more."
 reclaim_krehejad_decision_tooltip: "Reclaim the Homeland of the [warrior_women_ehatm|E]"
 reclaim_krehejad_decision_confirm: "Let the seas tremble once more!"
 reclaim_krehejad_decision_effect_tooltip: "Krehejad will be made into an [empire|E], and split into two [kingdoms|E]."


 agadari_resurgence_decision: "Resurgence of the E'hat'm"
 agadari_resurgence_decision_desc: "While the lands of our mothers have been reclaimed, it is no secret that we remain a minority in our homeland. We must recall our lost kin in [Glossary('Cyrat','cyrat_encyclopedia_desc')] to return home to aid in the revitalization of our homeland. With our control over the home islands secure, all that remains is to deliver the offers of voyage home."
 agadari_resurgence_decision_confirm: "Let us be reunited, now and forever"
 agadari_resurgence_decision_tooltip: "Recall the [warrior_women_ehatm|E] from [Glossary('Cyrat','cyrat_encyclopedia_desc')]" 
 agadari_resurgence_custom_decision: "Cannot have more than 1 vassal with non-[GetCulturePillar('heritage_agadari').GetName] [culture|E]"
 agadari_resurgence_tooltip: "[counties|E] in your realm may switch to your [culture|E] and faith"
 agadari_homecoming_tooltip: "The [GetCulturePillar('heritage_agadari').GetName] people in [GetGeographicalRegion('cyrat_biozone').GetName] will be given the choice to abandon it to return to [GetGeographicalRegion('krehejad_biozone').GetName]"

 krehejad_seize_dethskel_decision: "Lay Claim to the Straits of Dethskel"
 krehejad_seize_dethskel_decision_desc: "Since the [aironoian_bronze_age|E], the strait bordering the [Glossary('Redlands','redlands_encyclopedia_desc')] has been a vital thread connecting trade from east to west. By consolidating the region under our control, we can legitimize our dominion over the coast as a force of stability."
 krehejad_seize_dethskel_decision_tooltip: "[GetTitleByKey('k_dethskel').GetNameNoTier] will become a [de_jure|E] part of [GetTitleByKey('e_krehejad').GetNameNoTier]"
 krehejad_seize_dethskel_effect_tooltip: "If you hold the [duchy|E] of [GetTitleByKey('d_zaradar').GetNameNoTier], it will become a [de_jure|E] part of [kingdom|E] of [GetTitleByKey('k_dethskel').GetNameNoTier]"
 krehejad_seize_dethskel_decision_confirm: "The flow of commerce rests in our palm"

 
 
 declare_establishment_of_Yuankang_decision.t: "Declare the Establishment of Yuan-kang"
 declare_establishment_of_Yuankang_decision_desc: "For hundreds of years since our ancestors came from the homeland to establish Bronzeport in the South Sea, throughout this long history, Bronzeport has always submitted to other powers, trading freedom for a meager existence. We once bowed under the tyranny of Lanonan, and afterward were forced to swear allegiance to [loen_chaeon|E]. \n\nToday, Kathun-Kai is divided, the Protectorate of Lanonan is weak, while our nation's strength is steadily rising. Now is the time! We are no longer the so-called '[bureau_bronzeport|E]'. In the name of Yuan-kang, we declare our independence and establish our nation! From this day forth, the Bronzeport people shall control their own destiny!"
 declare_establishment_of_Yuankang_decision_tooltip: "Establish a brand-new republic"
 declare_establishment_of_Yuankang_decision_confirm: "Long live Yuan-kang!"
 declare_establishment_of_Yuankang_decision_1.tt: "[GetGeographicalRegion('trade_confluence_bronzeport_core_area').GetName][region|E] will be incorporated into the [de_jure|E] of [GetTitleByKey('e_yuankang').GetNameNoTier][title|E]"
 build_takaday_coastal_avenue_decision.t: "Build Coastal Avenue"
 build_takaday_coastal_avenue_decision_desc: "Since ancient times, the presence of the Takaday Forest has separated the east and west of Dahangon. This natural barrier greatly increased the travel distance between the two regions, forcing travelers to detour around the forest via the Pakara's Pass to the north or use sea routes. Only a few bold explorers dared attempt to cross the forest directly, usually vanishing without a trace.\n\nTo reduce the impact of the Takaday Forest, an audacious plan was discussed. This plan proposed clearing trees and beasts along the sparsely forested coastal area to build a road. Fortified with fortresses and [magi|E], it would connect the east and west. Although requiring immense resources initially, once completed, the entire Dahangon region would benefit from it."
 build_takaday_coastal_avenue_decision_tooltip: "The way to connect the east and the west"
 build_takaday_coastal_avenue_decision_confirm: "Start building."
 build_takaday_coastal_avenue_decision.tt: "It will take one to three years to build this road."
 proclaim_chin_lin_emperor_decision.t: "Proclaim Chinlin Emperor"
 proclaim_chin_lin_emperor_decision_desc: "Throughout its history, Dahangon has never been fully conquered by Kathun-Kai. Even when the Protectorate of the Southsea claimed jurisdiction over the region, it failed to extend its influence deep into the wetlands and jungles. Yet this reality has now been shattered. I have accomplished an unprecedented feat—ruling all of Dahangon as a Kathuni monarch. Statues of myself and my descendants will be forever enshrined in the golden palace of Dawang Tarmak, gazed upon by Banwagul and Kathuni nobles alike, alongside the visages of [Concept('naklan_the_goldern','Naklan')|E]'s progeny."
 proclaim_chin_lin_emperor_decision_tooltip: "An unprecedented new dynasty."
 proclaim_chin_lin_emperor_decision_confirm: "Crowned in Dawang-Tarmak!"
 proclaim_chin_lin_emperor_decision.tt: "All your vassals who belong to the [GetCulturePillar('heritage_easterner').GetName][heritage|E] and have an opinion more than#I  50#! will adopt the Chenhan [culture|E]."
 conquer_the_kashirya_states_decision.t: "Conquer the Kashirya States"
 conquer_the_kashirya_states_decision_desc: "[kashirya|E], a fertile realm steeped in [magic|E], has throughout history borne the ambitions of many great monarchs who established monumental empires here—first the [otachedian_empire|E], followed by the [taryaad_saramsaasan|E]. Yet, the opulence of this land led these empires to gradual decay and decline. Within mere generations, those once-colossal realms crumbled, as though no sovereign could long maintain dominion over Kashirya. \n\n But now, as the nations of Dahangon unite under the banner of Chinlin, the Kathuni blood burning in our veins drives us to conquer new lands and turn our gaze upon distant realms where [naklan_the_golden|E] has yet to tread. Our invincible armies shall cross the Kharadan Mountains! Chinlin will not be the last empire to march into Kashirya—but it shall be the most enduring and successful in its rule!"
 conquer_the_kashirya_states_decision_tooltip: "Rule the west."
 conquer_the_kashirya_states_decision_confirm: "Conquer Kashirya!"
 conquer_the_kashirya_states_decision.tt: "We will decide whether to collaborate with [vidvaookeyatran_scholarly_caste|E]."
 dahnagon_change_control.tt: "The Control level in Every [de_jure|E] [county|E] will changes by#P  +25#!."
 advance_into_the_shrunfan_decision.t: "Advance into the Shrunfan"
 advance_into_the_shrunfan_decision_desc: "In the eastern lands, where the great river flows through valleys embraced by rolling hills and dense forests, there once stood the realm of the Saielaians. They established a vast and glorious dynasty, which was ultimately conquered by martial forces originating from the same lands as our forebears. The mighty Shrunfan Kingdom was utterly vanquished. However, after centuries of upheavals and decline, Kathun-Kai no longer holds sway. Rebellions have shattered the once-invincible Lanonan army, and the region is now fragmented among rival powers. As the most powerful Kathuni empire in the Southsea, Chinlin rightfully claims the mantle of the fractured Kathun-Kai, asserting sovereignty over the ancestral territories of the Saielaians. We shall subjugate them, compel their tribute, and extend our dominion to lands the Dahangon people have never before reached in their history."
 advance_into_the_shrunfan_decision_tooltip: "The new territory of Chinlin Empire."
 advance_into_the_shrunfan_decision_confirm: "Announce our arrival"
 restore_the_tilolan_system_decision.t: "Restore the Tilolan System"
 restore_the_tilolan_system_decision_desc: "The monarchs of Dahangon governed through a unique social system known as [tilolan|E]. Vassals traveling between the [GetBuilding('01_dawang_tarmak').GetName] and their domains not only kept the monarch informed of regional affairs but also replenished the treasury with tributes. However, after [naklan_the_golden|E]'s death, the Tilolan system fell into semi-collapse, becoming heavily reliant on the personal prestige of the Dahangon monarch to sustain it. Whenever a new ruler ascended the throne, previously compliant nobles often seized the opportunity to break away from the system. \n\nToday, Chinlin has replaced the former Dahangon dynasty as the core of the Tilolan framework. To prevent a recurrence of such instability, we have reformed the Tilolan system by extending the duration of court visits and instituting intricate procedures for attendance. This compels nobles to divert resources originally allocated for their domains toward maintaining ceremonial standards. Furthermore, central officials are dispatched to participate in governance while nobles are away from their territories, ultimately neutralizing local authority and ensuring the central government's influence."
 restore_the_tilolan_system_decision_tooltip: "Strengthen our rule."
 restore_the_tilolan_system_decision_confirm: "Improved the system."
 restore_the_tilolan_system_decision.tt: "Based on the number of [vassal|E] at different tier [title|E], You will gain @influence_icon!#P [SCOPE.ScriptValue('dahnagon_vassl_power_value')|0]#!."
 restore_the_tilolan_system_decision_one.tt: "Based on the number of [vassal|E] at different tier [title|E], You will gain @prestige_icon!#P [SCOPE.ScriptValue('dahnagon_vassl_power_value')|0]#!."
 dahangong_people_surrender_effect.tt: "More citizens and nobles of Dahangon will @skill_diplomacy_icon!#V Recognize#! your [dynasty|E]'s rule and embrace Chenhan[culture|E]."
 grant_the_artisans_guild_royal_title_decision.t: "Grant the Artisans Guild Royal Title"
 grant_the_artisans_guild_royal_title_decision_desc: "Dahangon boasts a time-honored tradition of craftsmanship, with numerous regions home to their own artisan guilds. These guilds, both large and small, have long enabled the nobles of Dahangon to effortlessly create treasures and construct magnificent edifices. With the establishment of the Chinlin Empire, the demand for skilled artisans has surged across various endeavors. To meet this growing need, we must organize these artisans of Dahangon and expand their ranks, ensuring they contribute their talents to the service of the nascent dynasty."
 grant_the_artisans_guild_royal_title_decision_tooltip: "Unify artisans guild"
 grant_the_artisans_guild_royal_title_decision_confirm: "Establish an official guild."
 grant_the_artisans_guild_royal_title_decision.tt: "[development|E] level in Every [county|E] with artisan-related [building|E] in any [holding|E] changes by#P  +3#! and gain [GetModifier('recruit_artisan_modifier').GetNameWithTooltip][modifier|E] for 20 years"
 craftsmen_buildings_number_value_desc: "You must have more than#S  15#! Artisan [building|E] or its upgradesin in [realm|E] (Current: [SCOPE.ScriptValue('craftsmen_buildings_number_value')|0])\n#italic The list of [building|E] that meet the criteria is as follows:\n#T  ·#![GetBuilding('wind_furnace_04').GetName]\n#T  ·#![GetBuilding('artisan_quarters_04').GetName] \n#T  ·#![GetBuilding('smiths_04').GetName]\n#T  ·#![GetBuilding('siege_works_03').GetName]\n#T  ·#![GetBuilding('blacksmiths_03').GetName]#! "
 rebuild_the_pearl_of_dahangon_decision.t: "Rebuild the Pearl of Dahangon"
 rebuild_the_pearl_of_dahangon_decision_desc: "Dawang Tarmak is revered by all Banwagul people as their most sacred city. In Banwagul literature, it is often depicted as an extraordinary realm that gathers all the splendor and magnificence of the world, celebrated as the 'First City of Dahangon'. For centuries, it has served as a primary pilgrimage site for the Dahala[faith|E], holding a transcendent status that has made its fate inextricably linked to the rule over Dahangon. \n\n However, the [Concept('ratarakaw','Catastrophe')|E] that erupted in 1242 IS nearly reduced Dawang Tarmak to ashes, with the ensuing shockwaves devastating several surrounding regions. Yet, through the efforts of the Chinlin Empire, [Glossary('Yuydu','GH_YUYDU_GLOSS')] has risen from the ashes, reborn with even greater brilliance. It now stands before the world as our new capital, destined to thrive for millennia to come."
 rebuild_the_pearl_of_dahangon_decision_tooltip: "Restore this beautiful city."
 rebuild_the_pearl_of_dahangon_decision_confirm: "Repair the city."
 rebuild_the_pearl_of_dahangon_decision.tt: "Depending on the repair level of the [Glossary('Yuydu','GH_YUYDU_GLOSS')], [GetTitleByKey('c_catchers_east').GetNameNoTier] will @skill_stewardship_icon!#V Receive#! bonuses of varying levels."
 claim_naklan_ancestry_decision.t: "Claim Naklan Ancestry"
 claim_naklan_ancestry_decision_desc: "[naklan_the_golden|E] was an extraordinarily great monarch who, for the first time, united the warring tribes of Dahangon into a single state and left behind numerous enigmatic legends. Over centuries, through generations of Banwagul oral traditions, Naklan has been elevated to a divine status. It is widely believed that his sacred lineage was endowed with mystical powers, entrusted with the leadership and governance of the Dahangon peoples. \n\n As a result, nearly every Banwagul ruler has claimed ancestral ties to the Naklan family. As outsiders in Banwagul society, asserting this lineage would help bridge the distance between the Chinlin and the Dahangon populace, lending legitimacy to the new royal house in the eyes of both nobles and commoners."
 claim_naklan_ancestry_decision_tooltip: "Claiming our status as descendants of Naklan."
 claim_naklan_ancestry_decision_confirm: "Shape blood vessels."
 chinlin_nolan_add_bloodline_effect_desc: "Every one of your offspring will gain the [trait|E]#V  [GetTrait('gh_scion_of_nolan').GetName(GetNullCharacter)]#!, as will Their male descendants."
 enfeoff_family_members_decision.t: "Enfeoff Imperial Clan"
 enfeoff_family_members_decision_desc: "The territory of the Chinlin Empire, under the governance of our wise Monarch, has expanded to an unprecedented scale, far surpassing any previous Dahangon regime in history. While this brings immense glory, the cost of governing such a colossal entity has gradually increased. Orders from Yuydu often take several months to reach the borderlands, fostering serious secessionist tendencies in remote regions. If this continues, these territories will inevitably begin to oppose Chinlin's rule. \n\n To address the issue of controlling the frontier, we have chosen to appoint members of the [Concept('dynasty_members','Imperial Clan')|E] to various regions, allowing them to exercise authority in the name of the emperor and strengthen central power. These stationed imperial relatives will have the power to collect taxes, levy troops, and appoint officials, responsible for coordinating local resources and promptly suppressing rebellious forces."
 enfeoff_family_members_decision_tooltip: "Strengthen local management."
 enfeoff_family_members_decision_confirm: "Send them to the frontier"
 chinlin_dynasty_vassal_opinion_desc: "Every [vassal|E] of your [dynasty|E] gains#P  40#! [opinion|E] of#V  you#!#italic  (-1.20/year)(Grateful)#!"
 chinlin_county_controls_add_desc.tt: "Every [county|E] in your [realm|E]"
 make_chinlin_descision_desc: "You have completed#V  Advance into the Shrunfan#![decision|E] and#V  Conquer the Kashirya States#![decision|E]."
 chinlin_dynasty_vassal_member_value_desc: "You have more than#S  30#! [vassal|E] of your [dynasty|E]. (Current: [SCOPE.ScriptValue('chinlin_dynasty_vassal_member_value')|0])"
 mobile_fortress_in_the_jungle_decision.t: "Mobile Fortress in the Jungle"
 mobile_fortress_in_the_jungle_decision_desc: "The [Concept('elephant_cavalry','War Elephants')|E] of [kashirya|E] are historically renowned. These mighty creatures were a nightmare for infantry and significantly hindered Chinlin's advance during the campaign in Kashirya, repeatedly inflicting heavy casualties on our forces. \n\n Now that Kashirya has been defeated, we can learn from this expertise and introduce elephants into Dahangon. Their massive bodies can easily traverse complex wetland terrain, proving invaluable in both combat and logistical transport. Moreover, the majestic presence of elephant herds will enhance the authority of the imperial house."
 mobile_fortress_in_the_jungle_decision_tooltip: "Introduction of elephant species from Kashirya"
 mobile_fortress_in_the_jungle_decision_confirm: "Domesticated elephants"
 mobile_fortress_in_the_jungle_decision.tt: "Every [county|E] that has [GetBuilding('elephant_pens_05').GetName][building|E] or its upgradesin"
 mobile_fortress_in_the_jungle_decision_tt: "You have more than 1000 [elephant_cavalry|E]."
 mobile_fortress_in_the_jungle_decision_one_tt: "You must have more than#S  15#! [GetBuilding('elephant_pens_05').GetName][building|E] or its upgradesin in [realm|E] (Current: [SCOPE.ScriptValue('craftsmen_buildings_number_value')|0])"
 develop_inland_water_transport_decision.t: "Develop Inland Water Transport"
 develop_inland_water_transport_decision_desc: "The Tagsan River is a mighty, rushing torrent. As the cradle of Dahangon civilization, countless towns are scattered along its banks, granting it immense navigational value. However, conducting trade along the river has historically been fraught with difficulties—shallow mudbanks and steep sections frequently trap vessels, while internal strife has further hampered commercial development. \n\n Now, we finally possess the capability to harness the value of the Tagsan River. To meet the growing trade demands within the river basin, we must tame this great serpent. By applying advanced Kathuni construction techniques to expand ports and dredge the waterways, it will transform into a thriving artery of commerce, channeling wealth directly into the heart of the Chinlin Empire."
 develop_inland_water_transport_decision_tooltip: "Promote trade development."
 develop_inland_water_transport_decision_confirm: "Dredge the waterway."
 chinlin_inland_water_transport_value_desc: "You must have more than#S  15#! [GetBuilding('common_tradeport_06').GetName][building|E] and [GetBuilding('caravanserai_05').GetName][building|E] or their upgradesin in [GetGeographicalRegion('trade_confluence_tagsan_navigable_area').GetName][region|E] (Current: [SCOPE.ScriptValue('chinlin_inland_water_transport_value')|0])"
 develop_inland_water_transport_decision_trigger_desc: "The [development|E] level in Every [county|E] located in the [GetGeographicalRegion('trade_confluence_tagsan_navigable_area').GetName][region|E] that is not Wastelands is greater or equal to#bold  15#!"
 chinlin_inland_water_transport_income_value_desc: "Based on the number of [building|E] that meet the criteria, you will gain @gold_icon!#P  [SCOPE.ScriptValue('chinlin_inland_water_transport_income_value')|0]#!"
 develop_inland_water_transport_decision.tt: "Every [county|E] located in the [GetGeographicalRegion('trade_confluence_tagsan_navigable_area').GetName][region|E]"
 chinlin_vassal_opinion_add_desc: "Every [vassal|E] hold any [title|E] located in the [GetGeographicalRegion('trade_confluence_tagsan_navigable_area').GetName][region|E] gains#P  15#! [opinion|E] of#V  you#!#italic  (-1.20/year)(Grateful)#!"
 develop_dahangon_wetlands_decision.t: "Develop Dahangon Claysea"
 develop_dahangon_wetlands_decision_desc: "Much of the land in Dahangon remains shrouded in deep marshes and dense forests, with only a small portion having been reclaimed for cultivation, hindering the development of towns. If we can organize efforts to clear these natural obstacles, the vibrant wetlands of Dahangon could be transformed into fertile fields, providing a steady stream of revenue and grain for their rulers."
 develop_dahangon_wetlands_decision_tooltip: "Endure great hardships in pioneer work."
 develop_dahangon_wetlands_decision_confirm: "Let's cultivate this land."
 hill_or_werlands_or_floodplains.tt: "The [terrain|E] of the [holding|E] is hills,or wetlands, or floodplains."
 change_watermills_level_effect_desc: "Upgrade the [GetBuilding('watermills_01').GetName][building|E] or its upgradesin on this [holding|E] by 1 level."
 establish_absolute_leadership_over_the_dahala_decision.t: "Establish Absolute Leadership over the Religious"
 establish_absolute_leadership_over_the_dahala_decision_desc: "The [religion|E] of the Banwagul people is primarily centered around#V  Dahala#!, a religious system deeply influenced by philosophy. After [the_battle_of_balinbada|E], the Protectorate of the Southsea was established, and the#V  Fourteen Heavenly Methods#!, along with other [yizhou|E] Religions, spread deeply along trade routes into the Southsea, resulting in a complex religious landscape within the Dahangon region. The fragmented topography further exacerbates religious disparities between areas.\n\n Now, with an increasing influx of Kathuni migrants into the Chinlin Empire, conflicts between different [faith|E] have intensified severely, even threatening Chinlin's rule. The old policy of religious tolerance is no longer suitable. We must establish a single state faith, expel other beliefs, and eradicate these destabilizing factors."
 establish_absolute_leadership_over_the_dahala_decision_tooltip: "The Emperor is the one and only master."
 establish_absolute_leadership_over_the_dahala_decision_confirm: "Establish our state religion."
 fhmr_winner_decisions.tt: "All [head_of_faith|E] of#V  Dahala#![religion|E] will be destroyed."
 winner_of_dahangon_religious.tt: "Because you are#V  Kai-jiao#!, you gain the#I  Following Bonuses#!#T  :#!"
 fhmr_winner_decisions_one.tt: "Every [county|E] that follows the#V  Dahala#![religion|E] in your [realm|E]"
 religion_in_dahangon_region_percentage_value_desc: "More than 75% of [GetTitleByKey('e_chinlin').GetNameNoTier][title|E] [de_jure|E] [county|E] adhere to your [religion|E]. (Current: [SCOPE.ScriptValue('fourteen_heavenly_methods_in_dahangon_region_percentage_value')|0]%)"
 protect_dahala_religious_head_one_desc: "You hold the [head_of_faith|E] [title|E]."
 protect_dahala_religious_head_two_desc: "The [head_of_faith|E] in your [faith|E] is your [vassal|E]."
 dahala_religion_control_dahangon_region_desc: "You have completely control over all the [holy_site|E] of your [faith|E] and it belong to your [faith|E]"
 make_religious_leader.tt: "[GetTitleByKey('e_chinlin').GetNameNoTier][title|E] will become the [head_of_faith|E] of your [faith|E]."
 dahala_winner.tt: "Every [county|E] in your [realm|E] that does not follow the#V  Dahala#![religion|E], its [faith|E] has a chance to change to your [faith|E]."
 create_random_holy_order_decision_effect_desc: "A [holy_order|E] of your [faith|E] will be founded."
 winner_of_dahangon_religious_dahala.tt: "Because you are#V  Dhala#!, you gain the#I  Following Bonuses#!#T  :#!"
 penetrate_into_the_tuleang_mountainous_area_decision.t: "Penetrate into the Tuleang Mountainous Area"
 penetrate_into_the_tuleang_mountainous_area_decision_desc: "To the west of Dahangon lies the rugged terrain of the Tuleang Mountains, home to a community whose customs and traditions stand in stark contrast to the cultures of Dahangon. These mountain tribes originate from the distant [north_kharadan_biozone|E], and their enigmatic, unconventional magic often leaves outsiders feeling unsettled. \n\n Our forces have now established control over this region. Perhaps relocating settlers from elsewhere would help consolidate our governance in this area."
 penetrate_into_the_tuleang_mountainous_area_decision_tooltip: "Venture deep into these magical tribespeople."
 penetrate_into_the_tuleang_mountainous_area_decision_confirm: "Immigrant Mountain."
 restore_the_protectorate_of_lanonan_decision.t: "Restore the Command of Lanonan"
 restore_the_protectorate_of_lanonan_decision_desc: "Finally, as the smoke of battle cleared over the Cang River plains, the extraordinary leadership of [ROOT.GetCharacter.GetFirstNameNoTooltip] bound the Lanonan people together, restoring the Command of the Lanonan. Under the mighty banner of the Command, we shall march toward an even more glorious and prosperous future, with the vast realms of the South Sea awaiting Lanonan's conquest. For Kathun-Kai, for the Dragon Emperor, we swear to forge anew our glory!"
 restore_the_protectorate_of_lanonan_decision_tooltip: "The first step to restore order."
 restore_the_protectorate_of_lanonan_decision_confirm: "Proclaim the Renaissance."
 restore_the_protectorate_of_lanonan_decision.tt: "Every [GetCulturePillar('heritage_easterner').GetName][culture|E] [vassal|E]"
 give_cangriver_region_modifier.tt: "Every [county|E] in the [GetGeographicalRegion('world_ga_cangriver_formable').GetName][region|E]"
 threatened_by_lanonan.tt: "The Kingdom of Míat Shrunfan will begin to #N expand#! its @skill_martial_i!#V conmilitary forces#!"
 building_settlements_in_rovarska_decision.t: "Build Stronghold in Rovarska"
 building_settlements_in_rovarska_decision_desc: "The indigenous city-states of the [rovarska_biozone|E] region and [Concept('bureau_bronzeport','Bronzeport')|E] have long been commercial rivals. Despite the internal conflicts among these city-states, they would always unite in resistance whenever Bronzeport attempted to intervene, effectively blocking our influence in Rovarska. \n\nHowever, the occurrence of [frodbrokna|E] has disrupted the stalemate in the South Sea. With a temporary power vacuum emerging across the entire archipelago, now is an opportune moment to expand Bronzeport's trade network."
 building_settlements_in_rovarska_decision_tooltip: "Expand our influence"
 building_settlements_in_rovarska_decision_confirm: "Build Stronghold"
 mobilize_troops_and_prepare_for_war_decision.t: "Mobilize Troops and Prepare for War"
 mobilize_troops_and_prepare_for_war_decision_desc: "The clouds of war loom over Lanonan. To prepare for the inevitable conflict against the rebels, we must recruit new soldiers, train the troops, and gather war supplies. Once we have done everything within our power, Lanonan shall triumph over any foe."
 mobilize_troops_and_prepare_for_war_decision_tooltip: "A War That Decides Our Fate."
 mobilize_troops_and_prepare_for_war_decision_confirm: "Prepare for War."
 mobilize_troops_and_prepare_for_war_decision_tt: "Must have a Total $MILITARY_STRENGTH$ of [soldier_i] #V 8000#! or more"
 mobilize_troops_and_prepare_for_war.tt: "Every [knight|E]"
 shrunfan_kingdom_created_tt: "Must have created the [title|E] of [GetTitleByKey('k_miat_shrunfan').GetNameNoTier]"
 issueg_rand_proclamation_against_rebels_decision.t: "Issue Grand Proclamation Against the Rebels"
 issueg_rand_proclamation_against_rebels_decision_desc: "Now that provisions are ample and the state is secure, it is time to inspire the troops, issue a proclamation, and pledge to march south to reclaim the lost lands of Lanonan. This is the collective aspiration of thousands upon thousands of Lanonan's youth and the goal for which we strive."
 issueg_rand_proclamation_against_rebels_decision_tooltip: "The time is ripe."
 issueg_rand_proclamation_against_rebels_decision_confirm: "Issue Grand Proclamation!"
 dispatch_xin_xue_propagandists_to_overseas_decision.t: "Dispatch Xin Xue propagandists to overseas"
 dispatch_xin_xue_propagandists_to_overseas_decision_desc: "The scholar-officials generally regard Xin Xue as a monstrous threat, labeling those who champion the welfare of the common people as rebels and ruthlessly suppressing them. As a result, Xin Xue struggles to spread openly. However, these foolish and rigid individuals fail to grasp the true essence of Xin Xue, simplistically dismissing its followers as mobs—an oversight that presents us with an opportunity. By packaging the ideas of Xin Xue within the guise of other 'compliant faiths', we may well evade the scrutiny of the Jiu Xue rulers and thereby strengthen our cause."
 dispatch_xin_xue_propagandists_to_overseas_decision_tooltip: "Spread our thoughts."
 dispatch_xin_xue_propagandists_to_overseas_decision_confirm: "Grow in the shadow."
 dispatch_xin_xue_propagandists_to_overseas_decision_1.tt: "Our disguise was quite successful"
 dispatch_xin_xue_propagandists_to_overseas_decision_2.tt: "The disguise has been discovered"
 founding_of_the_tongkang_society_decision.t: "Founding of the Tongkang Society"
 founding_of_the_tongkang_society_decision_desc: "Through unremitting efforts, Xin Xue has achieved a dominant position within the [Concept('bureau_bronzeport','Bronzeport')|E]. Its innovative ideas have been widely embraced and recognized by many ordinary people in Lakoeng, and supporters of Xin Xue now permeate every corner of the republic. Our influence in the southsea region has grown so strong that there is no longer any need to operate in the shadows as before. Establishing an open Xin Xue organization will greatly advance our cause."
 founding_of_the_tongkang_society_decision_confirm: "A great victory for Xin Xue!"
 founding_of_the_tongkang_society_decision_tooltip: "Xin Xue's power in Southsea has grown stronger."
 founding_of_the_tongkang_society_decision_tt: "At least 50% of [counties|E] in your [realm|E] are [GetFaithByKey('xin_xue').GetName]."
 founding_of_the_tongkang_society_decision.tt: "Every #V Kai-jiao#! [county|E] located in the [GetGeographicalRegion('world_ga_southsea_formable').GetName][region|E] has a certain probability of converting to the #V Xin Xue#! [faith|E]."
 spread_the_xin_xue_faith_desc: "Xin Xue is spreading"
 founding_of_the_tongkang_society_decision_1.tt: "Every #V Xin Xue#! [ruler|E]"
 founding_of_the_tongkang_society_desc: "Founded the Tongkang Society"
 recruit_compatriots_into_the_assault_rifle_corps_decision.t: "Recruit Guoren Assault Rifle Corps"
 recruit_compatriots_into_the_assault_rifle_corps_decision_desc: "Unlike the incompetent noble rulers, whose governance is sustained by gold and violence—upholding a corrupt force that serves only their personal interests—the regime of Xin Xue stands in stark contrast. We rely on the people, building an army that acts for the good of all. By harnessing the newly introduced firearm technology from Kathun-kai and recruiting devoted young men who champion Xin Xue, we can swiftly form the Guoren Corps—an army ablaze with zeal."
 recruit_compatriots_into_the_assault_rifle_corps_decision_tooltip: "Open Recruitment call to Arms."
 recruit_compatriots_into_the_assault_rifle_corps_decision_confirm: "An Advanced Army."
