 offer_patronage_to_sepattan_decision: "Offer Patronage to the High Sepattan"
 offer_patronage_to_sepattan_decision_desc: "As a champion of the Sacred Path, it is my duty to honor and empower the High Sepattan, the spiritual steward of our faith. By offering my patronage, I will strengthen the bond between the crown and the temple, securing divine favor and ensuring the prosperity of our holy places."
 offer_patronage_to_sepattan_decision_tooltip: "Enacting this decision will enhance your standing with the clergy, increase the influence of the Nattanan faith, and fortify your position as its divinely chosen protector."
 offer_patronage_to_sepattan_decision_confirm: "Send the messenger."


