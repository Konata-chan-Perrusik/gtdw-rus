 #defeat_rhesus_decision_desc: "Rhesus is a politician and schemer without equal. As formidable as Cenware is on the field of battle, so is Rhesus in the halls of power. And like the High King of the Sjalvolki, he will not be beaten in one fight, and the fight will be intense indeed."
 #defeat_rhesus_decision_confirm: "Have your final meeting"
 
 lessons_of_cenware_decision: "Lessons of Cenware"
 lessons_of_cenware_decision_tooltip: "My clash with the barbarian High King has taught me more than a few lessons"
 lessons_of_cenware_decision_desc: "Cenware was widely considered the greatest warrior and tactician of recent memory, and a man without equal on the field of battle.\n\nUntil we crossed paths.\n\nNow, the world looks upon me, shocked, as Cenware's hordes lie shattered at the tip of my sword, [aversaria|E] saved by my hand. I have entered the ranks of the greatest military masterminds of all time."
 lessons_of_cenware_decision_confirm: "Embrace my new Reputation"
 #lessons_of_cenware_decision: "Lessons of Cenware"
 #lessons_of_cenware_decision_tooltip: "My clash with the barbarian High King has taught me more than a few lessons"
 #lessons_of_cenware_decision_desc: "Cenware was widely considered the greatest warrior and tactician of recent memory, and a man without equal on the field of battle.\n\nUntil we crossed paths.\n\nNow, the world looks upon me, shocked, as Cenware's hordes lie shattered at the tip of my sword, [aversaria|E] saved by my hand. I have entered the ranks of the greatest military masterminds of all time."
 #lessons_of_cenware_decision_confirm: "Embrace my new Reputation"
 purge_conclave_decision: "Purge the Conclave"
 purge_conclave_decision_tooltip: "The time for subtle politics is over"
 purge_conclave_decision_tt: "You will launch a massive purge against any current and former members of the Conclave faction, wiping it out for good. Obviously, this bloodshed will be seen as extraordinarily tyrannical."
 conclave_faction_power_below_100: "The Conclave faction has less than 100% power"
 purge_conclave_decision_desc: "Rhesus' downfall nears, but so do his minions' daggers to my back. If I am [Concept('aversaria','Aversaria')|E]'s best hope, I cannot have my focus be consumed by petty court politics.\n\nDrastic measures must be taken."
 purge_conclave_decision_confirm: "Start preparations..."
 invite_legio_axiaothea_decision: "Contact Legio XXI"
 invite_legio_axiaothea_decision_tooltip: "An unlikely ally, but a possible one."
 invite_legio_axiaothea_decision_tt: "Legio XXI 'Axiaotheia' will be given one of your counties and will give you significant support in the upcoming war."
 invite_legio_axiaothea_decision_desc: "The [Concept('aversaria','Imperial')|E] Legions are, to put it mildly, in shambles. The only two that are in any remote fighting capacity are Anoterion, which is too far east to be of use, and Axiaotheia, whose blind adherence to a dead cause will make any negotiations strained.\n\nHowever, I do have the lucky advantage of the World-Breaker himself now being surrounded on all sides by my allies. If I were to send them his head, perhaps they would join me?"
 invite_legio_axiaothea_decision_confirm: "Send Aeschraes' head south"
 defeated_cenware: "You have defeated Cenware at least once."
 aeschraes_killed: "Aeschraes has been killed through my own actions."
 
 new_iyrossi_capital_decision: "Construct a New Iyrossi Capital"
 new_iyrossi_capital_decision_tooltip: "A new capital for a new age."
 new_iyrossi_capital_decision_tt: "Your capital will be transformed into a your choice of either a palace or temple metropolis holding and gain a special building. This will take a year of work."
 new_iyrossi_capital_decision_desc: "At long last the Iyrossi are free from the [Concept('aversaria','Aversarian')|E] yoke. Alas, so much of our history has been sullied by their hands. Our historic capital at To Pedíthípsi is an uninhabitable wasteland — more a mocking exhibit of Imperial arrogance than a viable foundation for the center of our new state, and Palát to Mytidon is out of the question for obvious reasons. Though we may hold our past dear, we must establish a new capital from which to rule fair Mytidon. Be advised, the costs will be high and construction will take a full year to complete."
 new_iyrossi_capital_decision_confirm: "Being constructing a new capital."

 new_mountain_home_decision: "A New Mountain Home"
 new_mountain_home_decision_tooltip: "Announce a new homeland for your people"
 new_mountain_home_decision_tt: "Your capital county is the capital of one of the following duchies:"
 new_mountain_home_decision_desc: "Our old homeland, nestled in the highest peaks, is now lost to us forever. For so long we have wandered in unfamiliar lands, searching desperately for a new home. That ends today!\n\nWe have found a suitable location, and already Goans have begun to gather. Here, in this New Mountain Home, we will rebuild our society, and surely stand until the end of time."
 new_mountain_home_decision_confirm: "Proclaim our new homeland."
