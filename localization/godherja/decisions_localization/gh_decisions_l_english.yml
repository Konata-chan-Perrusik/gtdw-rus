 assert_korlacan_supremacy_decision: "Assert Korlacan Supremacy"
 assert_korlacan_supremacy_decision_desc: "The time has come to cleanse the land of heresy and root out the seeds of wickedness that threaten the purity of the Korlacan people. By asserting our divine mandate, we will drive out the blasphemers, unify the faithful, and build a new civilization that embraces innovation rather than rejecting it. Let the world tremble before the righteous might of the Korlacan faithful and the Bringer of Fire."
 assert_korlacan_supremacy_decision_confirm: "Our sacred jungle must be cleansed."
 assert_korlacan_supremacy_decision_tooltip: "Let the wicked Nattanan tremble in my wake."


 establish_aungkyi_thuriya_decision: "Establish Aungkyi Thuriya"
 establish_aungkyi_thuriya_decision_desc: "With the last of the heretical remnants crushed beneath my boot, the time has come to unite the lands under a single banner--the Empire of Aungkyi Thuriya. This glorious realm shall stand as a testament to the might of Korlacu and the triumph of civilization over chaos. Its blazing spires will pierce the heavens, and its light will guide all who seek enlightenment, order, and progress."
 establish_aungkyi_thuriya_decision_confirm: "By the Eternal Flame, let Aungkyi Thuriya rise!"
 establish_aungkyi_thuriya_decision_tooltip: "Unify your lands into the Empire of Aungkyi Thuriya, gaining immense prestige and solidifying your legacy as the chosen of Korlacu."


 reignite_the_fires_of_industry_decision: "Reignite the Sacred Fires of Industry"
 reignite_the_fires_of_industry_decision_desc: "The Sacred Fires of Industry, once the pride of our civilization and the source of our progress, have long been extinguished by the chaos of heresy and neglect. To reignite them is to restore the divine mandate of Korlacu, bringing light to darkness and order to chaos. Through this act, we shall affirm the supremacy of civilization and industry, proving that the fire of progress burns eternal in the hearts of the faithful."
 reignite_the_fires_of_industry_decision_confirm: "The fires will burn anew!"
 reignite_the_fires_of_industry_decision_tooltip: "Reignite the Sacred Fires of Industry, granting significant bonuses to development and production across your realm, and restoring the prominence of the Priesthood of the Eternal Flame."
 #verified_korlacan_tooltip: "You must be of a [GetFaithByKey('korlonalmic').GetName] or [GetFaithByKey('korlenalmic').GetName] faith and of [GetCulturePillar('heritage_korlacan').GetName] [heritage|E] to upgrade this building."
