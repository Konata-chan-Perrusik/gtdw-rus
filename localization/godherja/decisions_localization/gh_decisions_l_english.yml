 disseminate_imperial_edification_decision.t:"Disseminate Imperial Edification"
 disseminate_imperial_edification_decision_desc: "Lanonan is a remote and uncivilized land, far from the heart of [yizhou|E] civilization. The people living here are largely unfamiliar with the rites and music, mired in ignorance. One of the key purposes of the Dragon Emperor in establishing the Command of the Lanonan was to enlighten the region and spread advanced culture. By founding schools and teaching the script of Kathuni, we can transform the locals into subjects no different from those in the heartland of Kathun-kai, casting off the barbaric customs of the frontier."
 disseminate_imperial_edification_decision_confirm: "Educate the People."
 disseminate_imperial_edification_decision_tooltip: "Promoting the Kathuni Culture"
 disseminate_imperial_edification_decision.tt: "The #P Effectiveness#! of this [decision|E] scales progressively with the #V level#! of the local [GetBuilding('xuegong_01').GetName] lines [building|E]."
 kathuni_change_culture_desc: "Influenced by Kathuni Culture"
 accept_saielaian_as_part_of_kathunkai_decision.t:"Accept Saielaians as part of Kathun-Kai"
 accept_saielaian_as_part_of_kathunkai_decision_desc: "For centuries, the Saielaian people had sought to break free from the rule of the Celestial Dynasty, regarding Kathun-kai as invaders and steadfastly resisting all things Kathuni. The struggle against unending rebellions had never ceased since the establishment of the Protectorate. However, as the ancient saying goes, constant dripping wears away the stone. Through years of dedicated governance, Kathuni customs and ways have permeated every aspect of life in the Lanonan region. The locals no longer seek independence but instead regard themselves as subjects of Kathun-kai. At last, the Protectorate has fulfilled the mission entrusted to us by the Dragon Emperor, making Lanonan truly a part of the Celestial Realm."
 accept_saielaian_as_part_of_kathunkai_decision_confirm: "Assimilate the Saielaians"
 accept_saielaian_as_part_of_kathunkai_decision_tooltip: "Lanonan shall forever belong to the Celestial Empire."
 accept_saielaian_as_part_of_kathunkai_decision.tt: "Every #V Saielaian#![heritage|E] [county|E]"
