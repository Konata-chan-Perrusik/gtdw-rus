 conclave_faction_power_below_50: "The Conclave faction has less than 50% power"
 abolish_the_conclave_decision_tt: "All of the Conclave's lands and gold will be confiscated. You will convert back to the mainstream [Concept('aversaria','Aversarian')|E] faith."
 abolish_the_conclave_decision_desc: "The scheming of the Conclave may have accidentally made possible my rise, but they are not my allies, nor will they define my reign. It is time to end this charade of an institution."
 abolish_the_conclave_decision_confirm: "Crush Rhesus' Legacy"
