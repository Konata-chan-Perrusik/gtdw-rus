 stress_loss_chort_decision: "Consume Chort Cakes"
 stress_loss_chort_decision_desc: "Just a few bites, and the stress seems to flow from my body. My mind begins to fog, and a sense of peace and restfulness overcomes me. There is nothing that is quite as relaxing as good chort!"
 stress_loss_chort_decision_tooltip: "Let your stress melt into a drug-induced haze"
 stress_loss_chort_decision_confirm: "Bring me a platter!"

 revive_ertomax_kingdom_decision: "The Return of Aryvann Vos"
 revive_ertomax_kingdom_decision_tooltip: "Declare the kingdom of [ertomax|E] restored"
 revive_ertomax_kingdom_decision_desc: "The ancient kingdom of Aryvann Vos has been lost to our people since [ertomax|E], but it is not yet beyond restoration. If I were to pull together the heartlands beneath my banner, none could deny the return of the realm of Ertomax to the face of Aironoi."
 revive_ertomax_kingdom_decision_confirm: "The kingdom of Ertomax, restored!"
 revive_ertomax_kingdom_decision_tt: "Become the ruler of Aryvann Vos"

 restore_astilik_empire_decision: "Restore the Astilik Empire"
 restore_astilik_empire_decision_desc: "The lands of Aironoi still remember our touch — and soon, they shall feel it once again. I will restore the [astilik_empire|E] of old and lead my people into a new golden age. [Glossary('Astil Elatos','GH_ASTIL_ELATOS_GLOSS')]!"
 restore_astilik_empire_decision_tooltip: "Restore the great [astilik_empire|E]"
 restore_astilik_empire_decision_confirm: "Towards a new dawn!"
 restore_astilik_empire_decision_north_tt: "You control more than [SCOPE.ScriptValue('astilik_empire_formable_percent_value')|0]% of the [GetGeographicalRegion('custom_astilik_empire_north').GetName] [region|E]\n(Current: [SCOPE.ScriptValue('current_controlled_astilik_empire_north_region_owned_percent_value')|0]%)"
 restore_astilik_empire_decision_north_county_tt: "[GetTitleByKey('c_asiupoli').GetNameNoTier] must be held by you or a [vassal|E]"
 restore_astilik_empire_decision_east_tt: "You control more than [SCOPE.ScriptValue('astilik_empire_formable_percent_value')|0]% of the [GetGeographicalRegion('custom_astilik_empire_east').GetName] [region|E]\n(Current: [SCOPE.ScriptValue('current_controlled_astilik_empire_east_region_owned_percent_value')|0]%)"
 restore_astilik_empire_decision_east_county_tt: "[GetTitleByKey('c_tsetarva').GetNameNoTier] must be held by you or a [vassal|E]"
 restore_astilik_empire_decision_effect_north_tt: "If you control more than [SCOPE.ScriptValue('astilik_empire_formable_percent_value')|0]% of the [GetGeographicalRegion('custom_astilik_empire_north').GetName] [region|E], all owned [counties|E] in the [GetGeographicalRegion('custom_astilik_empire').GetName] [region|E] that are not of [GetCulturePillar('heritage_kherkeloi').GetName] [heritage|E] will gain [GetModifier('restore_astilik_empire_culture_modifier').GetNameWithTooltip] [modifier|E] for #V 10 years#!"
 restore_astilik_empire_decision_effect_east_tt: "If you control more than [SCOPE.ScriptValue('astilik_empire_formable_percent_value')|0]% of the [GetGeographicalRegion('custom_astilik_empire_east').GetName] [region|E], the [restorer.GetCulture.GetName] [culture|E] will gain #V 100%#! [cultural_acceptance|E] with all other [GetCulturePillar('heritage_kherkeloi').GetName] [cultures|E]"

 patronize_halite_temple_decision: "Patronize the Halite Temple"
 patronize_halite_temple_decision_desc: "The Halite Temple was once a renowned center of research and learning, and it may yet become such once again. By establishing close ties with the Temple, I can harness the knowledge of the Wane-Tenders to my advantage and enrich my people for centuries to come."
 patronize_halite_temple_decision_tooltip: "Sponsor the Halite Temple and advance your [culture|E] with their knowledge"
 patronize_halite_temple_decision_confirm: "Sponsor the Temple"
 patronize_halite_temple_decision_culture_head_tooltip: "You are the [culture_head|E] of the [GetPlayer.GetCulture.GetName] [culture|E]"
 patronize_halite_temple_decision_effect_mastery_tooltip: "The [patron.GetCulture.GetName] [culture|E] increases its mastery of the #V $wane_tender_harmoniarchy_name$#! [Concept('magic_type','School of Magic')|E] by #V 1#!"
 patronize_halite_temple_decision_effect_school_tooltip: "The [patron.GetCulture.GetName] [culture|E] adopts the #V $wane_tender_harmoniarchy_name$#! [Concept('magic_type','School of Magic')|E]"

 anaanides_purification_decision: "Take a Step of Purification"
 anaanides_purification_decision_desc: "To reach the holy land of Anaan, I must purify myself of sin. It is time to take the next step in this long journey."
 anaanides_purification_decision_tooltip: "You take a step of purification to purify your soul."
 anaanides_purification_decision_confirm: "Begin the Preparations!"
 anaanides_final_step_decision: "Take the Final Step to Anaan"
 anaanides_final_step_decision_desc: "My efforts to cleanse myself through meditation and prayer culminated in my soul being pure of sin. At long last, it is time to take the final step to Anaan and face the Great Judge."
 anaanides_final_step_decision_tooltip: "You take the final step in the journey to Anaan."
 anaanides_final_step_decision_confirm: "It is time to end this long journey."
 anaan_ascension_desc: "Zealot ascended to Anaan"
 eloi_reclaimed_desc: "Eloi has been reclaimed"
 alau_koev_flame_festival_decision: "Celebrate Alau Pyesali"
 alau_koev_flame_festival_decision_tooltip: "Prepare your flesh for the opening of the [fire_gate|E]"
 alau_koev_flame_festival_decision_desc: "Alau Pyesali, the Festival of Fire, is an ancient tradition amongst my people. If I am to prove myself worthy to escape this cold world, I must let the sacred flame touch my flesh."
 alau_koev_flame_festival_decision_confirm: "I will purify myself!"
 alau_koev_flame_festival_decision_tt: "Take the steps to the Great Flame"
 iyrossi_kill_aversarians_decision_valid_desc: "Any vassal or held county is Aversarian"
 iyrossi_kill_aversarians_desc: "Slaughtered Aversarians"
 gh_debase_currency_decision_2_tooltip: "Sacrifice a large amount of [prestige|E] in return for an instant influx of gold."
 gh_debase_currency_decision_4: "Debase Currency"
 new_eastern_empire: "Form a New Empire in the East"
 new_eastern_empire_desc: "With our powerbase well established, and the crises of the past now behind us, we can finally look to establish a proper [Concept('aversaria','Aversarians')|E] Empire in the East. Asuipol was the capital of the old Empire for a long time, and it shall be again. It is time for a new state to rise from the Ashes and reclaim our birthright! Hail Aautokratia Hecaeda!"
 new_eastern_empire_confirm: "Establish the new state"
 new_eastern_empire_tooltip: "It is time to form a new [Concept('aversaria','Aversarians')|E] Empire in the East."
 legio_xcv_reborn: "Reform the Legio XCV Viesuados"
 legio_xcv_reborn_desc: "With the rebels firmly crushed, and the troubles of our past defeated, we can now begin to build anew, and bring glory back to our legion."
 legio_xcv_reborn_confirm: "Reform the Legion"
 legio_xcv_reborn_tooltip: "It is time to reclaim the glory of the Legio XCV Viesuados."
 legio_xcv_rivals: "The remnants of the Legio XCV 'Viesuados' must have been brought back into the fold, or crushed under foot."
 legio_xcv_reborn_2: "Reform the Legio XCV Viesuados"
 legio_xcv_reborn_2_desc: "With the rebels firmly crushed, and the troubles of our past defeated, we can now begin to build anew, and bring glory back to our legion."
 legio_xcv_reborn_2_confirm: "Reform the Legion"
 legio_xcv_reborn_2_tooltip: "It is time to reclaim the glory of the Legio XCV Viesuados."
 become_pirate_emperor: "Declare an Empire in the Pirate Coast"
 become_pirate_emperor_desc: "None can stand against me and my endless wealth. It is time to immortalize myself across the seas."
 become_pirate_emperor_tooltip: "Become a pirate unmatched on the seas"
 become_pirate_emperor_confirm: "To legends untold!"
 the_scarred_rise_up: "Shatranjaya!"
 the_scarred_rise_up_desc: "For years, our brothers and sisters have been tormented by the harsh rule of the so called 'men of commerce'. For too long, have we been used and abused, our way of life mocked, our families torn asunder. We, who are the silent whisper of the forest, the swift moving stream of the dense jungle, the apex predators. No longer! The Scar-Bound will lead us to a glorious future. We pledge our resolve to him, scarring our faces and baring our chest. We have chosen a fitting name for this rebellion; Shatranjaya, or 'Total Victory', for we know we shall succeed or die trying."
 the_scarred_rise_up_tt: "The warriors of Tanumarei rally around you. Calling themselves Azaki Mard or 'Warriors Of Freedom', their single goal echoes in their hearts alike; the liberation of their homelands from their cruel overlords."
 the_scarred_rise_up_tooltip: "Take control of your people's destiny"
 the_scarred_rise_up_confirm: "The Scarred rally to freedom!"
 azaki_mard: "Azaki Mard"

 become_king_taykovi_decision: "Royal Ambitions?"
 belisarios_enemies_dead_desc: "Aeschraes, Gorassos, and Maurikios must be dead and buried for you to consider anything like this."
 become_king_taykovi_decision_confirm: "Bring me my crown."
 become_king_taykovi_decision_tooltip: "King Frostblood has a nice ring to it."
 become_king_taykovi_decision_desc: "King?  What need have I to be a king?  There are men I must kill."
 become_king_taykovi_decision_enemies_dead: "Why should I not be a king?  Are there not those who already name me rightful Aautokrator of a dead [aversaria|E]?  And none rival my prestige and pedigree in the Straits of Ageotaros.  Let us drop all pretense.  If I am to redeem the Drakaxiad, it must be in fortune as well as blood."

 belisarios_tries_to_forget: "More to Life"
 belisarios_tries_to_forget_desc: "Now that I am a king, perhaps I ought to focus on other things than revenge."
 belisarios_tries_to_forget_tooltip: "Has your bloodlust been sated, oh mighty king?"
 belisarios_tries_to_forget_confirm: "Reflect on your life."
 belisarios_enemies_must_not_bedead_desc: "My sword is thirsty."
 ####################
 # STORYLINE - COIS #
 break_strings_decision: "Break my Strings"
 break_strings_decision_tooltip: "I am no longer quite as controllable as I used to be"
 break_strings_decision_desc: "Though I am still far away from actually being fully in control of my realm, I am no longer a puppet dancing on my master's strings, either."
 break_strings_decision_confirm: "Take Control of your Destiny"
 recruit_wayfather_decision: "Recruit Waymaster"
 recruit_wayfather_decision_tooltip: "Your servants will suggest a number of suitable candidates for a Waymaster to serve as our court chaplain"
 recruit_wayfather_decision_tt: "We will be able to recruit a Waymaster to serve as our court chaplain"
 recruit_wayfather_decision_desc: "In our faith each of us is dedicated to a chosen Lifepath, and Waymasters serve as our guides on the path to bettering ourselves. Every court would be spirtually lost without a proper Wayfather or Waymother."
 recruit_wayfather_decision_confirm: "Send out a messenger"
 search_for_notable_decision: "Search for a Notable Individual"
 search_for_notable_decision_tooltip: "Look for an educated lowborn of your culture and religion to fill whatever role you need."
 search_for_notable_decision_desc: "I will gather the best talent seekers in the realm and have them search for skilled lowborn to serve in my court or to serve other roles."
 search_for_notable_decision_confirm: "Send for the talent seekers."
 reunite_boqqarut_decision: "Reunite the Boqqarut"
 reunite_boqqarut_decision_tooltip: "You will proclaim yourself the Boqqar of a reunified Damota"
 reunite_boqqarut_valid_desc: "You hold all of the [GetGeographicalRegion('world_es_core_damota').GetName]"
 reunite_boqqarut_decision_desc: "Though torn down in the fires of the [etami_tetenik|E], with petty warlords carving their own kingdoms from its corpse, the [boqqarut_damotada|E] once more shall rise. Where once there was chaos and devastation, order and prosperity will reign, and all Damota will bask in our glory and splendour. We need only make the proclamation."
 reunite_boqqarut_decision_effects: "You will become known as the restorer of Damota"
 reunite_boqqarut_decision_confirm: "Damota is reborn!"
 integrate_gisreddes_decision: "Integrate the Gisreddes"
 integrate_gisreddes_decision_desc: "For centuries [peti_gisredde|E] and its cousin [grande_gisredde|E] have been an abnormality inside Chevalie, always resisting the authority of the High King. Now we can finally do away with the legal absurdity known as the [gisreddepact|E] and formally subordinate the cities and the [council_of_gisredde|E] to our rule."
 integrate_gisreddes_control_timer_no: "You must have had uninterrupted control over both the Gisreddes for 80 years (until [GetCurrentDateWithDiff( GetVarTimeRemaining( TITLE.MakeScope, 'integrate_gisreddes_timer') )])."
 integrate_gisreddes_control_timer_yes: "You must have had uninterrupted control over both $c_peti_gisredde$ and $c_grande_gisredde$ for 80 years."
 integrate_gisreddes_decision_complete_desc: "The Gisreddes become de jure integrated into Chevalie, and will no longer create unrest."
 integrate_gisreddes_decision_confirm: "The [gisreddepact|E] is no more!"
 gisreddi: "Gisreddean"
 adopt_pirate_ways: "Embrace Piracy"
 adopt_pirate_ways_desc: "Whether due to your realm being poor, a lust for adventure, or just simple greed, there comes a time when every ruler considers piracy."
 adopt_pirate_ways_confirm: "Raise the anchor!"
 adopt_pirate_ways_tooltip: "You will give up your old ways and turn your realm into a [pirate|E] haven!"
 adopt_pirate_ways_through_liege: "Embrace Piracy"
 adopt_pirate_ways_through_liege_desc: "Whether due to your realm being poor, a lust for adventure, or just simple greed, there comes a time when every ruler considers turning [pirate|E]."
 adopt_pirate_ways_through_liege_confirm: "Raise the anchor!"
 adopt_pirate_ways_through_liege_tooltip: "You will give up your old ways and turn your realm into a [pirate|E] haven akin to your liege."
 avenge_ayule_expedition_decision: "Avenge [ayule_expedition|E]"
 avenge_ayule_expedition_decision_tooltip: "You will proclaim Damotan rule over the northern lands."
 avenge_ayule_expedition_decision_desc: "Long ago, Ayule attempted to conquer the lucrative lands to the north, which would forever secure Damota's trade, and place the vital Gonan road under our hegemony. Though his attempt ended in a humiliating disaster, we have avenged the defeat at Lazzan, and the fields of his defeat will eternally be ours."
 avenge_ayule_expedition_decision_confirm: "Raise the Banners High!"
 declare_yourself_malaak: "Declare yourself Malaak"
 declare_yourself_malaak_tooltip: "Ohrasik's will flows through you"
 declare_yourself_malaak_desc: "For years now I have followed Ohrasik's will, proving myself to be a righteous being time and time again. Now, though, it is time to officially bind my will to his and declare myself Malaak."
 declare_yourself_malaak_confirm: "Let the ceremony begin"
 declare_yourself_malaak.tt: "The head of faith title will not be inherited on succession"
 declare_yourself_malaak_holy_sites: "You must control at least 3 Ahridar [CHARACTER.GetFaith.GetAdjective] [holy_sites|E]"
 abandon_pirate_ways: "Abandon Piracy"
 #abandon_pirate_ways: "Stop being a pirate"
 abandon_pirate_ways_desc: "Piracy no longer serves our needs. It is time to once again return to traditional rule."
 abandon_pirate_ways_confirm: "Well, at least we get to keep the loot"
 abandon_pirate_ways_tooltip: "You will give up your [pirate|E] ways and become an [feudal|E] lord!"
 declare_yourself_the_pirate_king: "Declare yourself the Pirate King"
 declare_yourself_the_pirate_king_tooltip: "Become the king of pirates"
 declare_yourself_the_pirate_king_desc: "Me feats are unmatched and my coffers overflowing. It is time to immortalize my name."
 declare_yourself_the_pirate_king_confirm: "To fame and fortune!"
 invite_rogues_decision: "Invite Rogues"
 invite_rogues_decision_desc: "As a pirate, I cannot afford to be too picky with the company I keep. I'm in need of capable fighters and lieutenants, and if I spread my message to ports far and wide, many are sure to flock to my fleet."
 loot_tabik_betemisit: "Loot the Tabik Bētemisīt"
 loot_tabik_betemisit_desc: "The Mogowai have long waited within their gilded halls, praying for the return of their dead god. And nothing more symbolizes their dark purpose than the [GetBuilding('01_tabik_betemisit').GetName], the Empty Palace, intended to house their 'Most High' upon His return from the grave. Such a monument to the Hooded Prisoner cannot be tolerated, for we know the truth. God is dead, and it is our duty to ensure that He remains so. Besides, such a gem-encrusted structure can surely provide us with funds, with which to continue our struggle against evil."
 loot_tabik_betemisit_tooltip: "Reshape an ancient monument"
 loot_tabik_betemisit_confirm: "He shall never return!"
 train_falcons_decision: "Go Falcon Training"
 train_falcons_desc: "Falconry is an ancient art that takes years to master and is punctuated with equal periods of exhilaration and disappointment. However, a falcon will be a great companion in my hunting endeavors."
 train_falcons_tooltip: "You will obtain a falcon and train it over a period of months."
 train_falcons_decision_confirm: "Time to take wing."
 gh_abdicate_decision: "Abdicate"
 gh_abdicate_decision_desc: "As I approach my twilight years, it might be time to contemplate my[SelectLocalization(GetPlayer.HasTrait(GetTrait('arrogant').Self), ' glorious ', ' ')]reign — and its possible end. Transferring power to my successor and assuming the role of a respected [GetTrait('gh_alatan').GetName(GetNullCharacter)] would be an honorable course of action, but the trappings of power are not always easy to let go of..."
 gh_abdicate_decision_tooltip: "Give up the reins of power and honorably abdicate"
 gh_abdicate_decision_confirm: "Time to Retire"
 gh_magocratic_reformation_decision: "Magocratic Reformation"
 gh_magocratic_reformation_decision_desc: "[magi|E] have always been among the most wise and venerated of our society, and my realm has gradually drifted to a state where its ruling elite is almost entirely composed of practitioners. It is largely only a matter of formality, then, to put pen to paper and officially codify magical ability as a legal prerequisite to holding power."
 gh_magocratic_reformation_decision_tooltip: "Towards a greater, more enlightened rule!"
 gh_magocratic_reformation_decision_confirm: "Issue the Edict"
 elephant_race_decision: "Attend an Elephant Race"
 elephant_race_decision_desc: "#F It is an ancient tradition amongst many cultures in Kashirya to race elephants against one another. I could attend such an event to show off my wealth and prestige#!"
 start_elephant_race_decision: "You attend the local games"
 start_elephant_race_decision_stress_lazy: "#N You will not lose [stress|E] since you are [GetTrait('lazy').GetName( GetPlayer )]#!"
 elephant_race_decision_tooltip: "You take yourself to the elephant track"
 elephant_race_decision_confirm: "The racing awaits!"
 gh_taryaad_saramsaasan_unification_decision: "Restore The Kingdom Of Paerasjatan!"
 taryaad_reformed_valid_desc: "You must completely control the empires of Naavjagarad and Vichacil"
 gh_taryaad_saramsaasan_unification_decision_confirm: "Our dynasty shall forever be etched in Kashiryan history!"
 gh_taryaad_saramsaasan_unification_decision_tooltip: "Reunite the lands of the Taryaad dynasty"
 gh_taryaad_saramsaasan_unification_decision_desc: "The name Taryaad is more than just a name. The meaning of the word has bled into the very lives of the Kashiryan people, symbolizing the end of anarchy and the descent of the gods themselves to bring harmonious rule to the people of Kashirya.\n\nOur dynasty, through many trials and tribulations, have become rulers of the lands of the [taryaad_saramsaasan|E] and brought forth a golden age like the ones before!"
 gh_taryaad_pretender_decision: "Claim The Throne Of Asojiva"
 gh_taryaad_pretender_decision_confirm: "To reclaim these lands is my birthright!"
 gh_taryaad_pretender_decision_tooltip: "You have proved yourself worthy of Asojiva's legacy"
 gh_taryaad_pretender_decision_desc: "Kashiryans have always lacked a good leader to lead it to a bright future. It was only when the gods themselves descended to Kashirya in the form of Asojiva to rid us of our hubris did we finally enter a period of peace and progress. Now that his lineage is gone, Kashirya needs a new leader — a divine being who can bring forth another prosperous age to Kashirya like the Taryaad. A being such as myself. For I have now proved to all in these lands that I am worthy. Worthy of leading the Taryaad name."
 otachedian_restoration_decision: "Rebuild Otached's Empire"
 must_control_majority_of_kashirya_decision_tt: "You control more than [SCOPE.ScriptValue('otachedian_formable_percent_value')|0]% of the [GetGeographicalRegion('GH_geographic_kashirya').GetName] [region|E] (Current: [SCOPE.ScriptValue('current_controlled_kashirya_decision_region_owned_percent_value')|0]%)"
 otachedian_restoration_decision_desc: "Once, a great conqueror ruled the lands of [kashirya|E]. Devastation and conflict followed after its fall, yet glory is still in reach. Reforge the imperial ambitions of Otached and his sons, and bring Kashirya into a new age!"
 otachedian_restoration_decision_tooltip: "Forge a new empire in Kashirya"
 otachedian_restoration_decision_confirm: "For the Glory of the Ölteni!"
 otached_restoration_decision_titles_tt: "All [titles|E] [de_jure|E] in Kashirya and Aironoi that you [completely_control|E] will become part of your new empire."
 otachedian_restoration_troops_effect_tt: "You get a loyal [army|E] of Öltenic [soldiers|E]:\n$BULLET_WITH_TAB$#V 1000#! $oltenic_horse_archers$ #weak ([archer_cavalry|E])#!\n$BULLET_WITH_TAB$#V 1000#! $oltenic_spearmen$ #weak ([spearmen|E])#!"
 otachedian_restoration_modifier_vassalization_effect_tt: "Increases Otachedian Law [tradition|E] #V $offer_vassalization_interaction$#! acceptance by #P +15#!"
 nick_lord_of_the_kasir: "Lord of the Kasiryat"
 form_stellios_aautokrata_decision: "Claim the Aautokrata"
 form_stellios_aautokrata_desc: "The mainland is gone, crushed beneath the Sjalvolki hordes. There is no Aautokratir left, only petty warlords making absurd claims. But here, in this Archexate, the old empire still stands. As the ruler of Krehejad, I am the final functioning piece of the [Concept('aversaria','Imperial')|E] government. And it is not a far leap to make from Archex to Aautokratir..."
 form_stellios_aautokrata_decision_tooltip: "Krehejad will be remade as an Aautokrata, and split into two Governorates."
 form_stellios_aautokrata_decision_confirm: "Raise the old banners!"
 blow_the_black_horn_decision: "Blow the Black Horn"
 blow_the_black_horn_decision_desc: "Blow the Black Horn and bring forth an army of spirits, but be warned, it is said that those who call for the Horn's power are doomed to feel its wrath."
 blow_the_black_horn_decision_tooltip: "Blow the Black Horn!"
 blow_the_black_horn_decision_confirm: "I shall accept this fate."
 death_by_blackhorn_tooltip: "#negative_value When your next [war|E] ends, the Black Horn will come to claim you.#"
 blow_the_blackhorn_decision_valid: "You possess the Black Horn [artifact|E]"
 change_to_feudal: "Change to Aristocratic."
 change_to_feudal_confirm: "Change to Aristocratic."
 change_to_feudal_tooltip: "Change to Aristocratic."
 change_to_feudal_desc: "Change to aristocratic."
 add_magic: "Add magic."
