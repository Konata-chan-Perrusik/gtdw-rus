 accept_saielaian_as_part_of_kathunkai_decision_1_tt: "The [cultural_acceptance|E] between Saielaian #weak (And Kandysar, Sansarim)#! and Your [culture|E] is at least #V 90#!"
 accept_saielaian_culture: "Accepted Culture"
 abolish_the_bureau_of_the_bronzeport_decision.t:"Abolish the Bureau of the Bronzeport"
 abolish_the_bureau_of_the_bronzeport_decision_desc: "As the Protectorate of the Southsea, established by decree of the Dragon Emperor, we possess the supreme authority in theory over all military and political affairs in the Southsea. However, since the ninth century, [Concept('bureau_bronzeport','Bureau of the Bronzeport')|E] in the south has become an independent institution, severing the Dahangon region, which originally fell under the governance of the Protectorate. For centuries, we have remained locked in a prolonged stalemate in the Southsea, until the [Concept('frodbrokna','Tianqin')|E] brought an end to Kathun-kai. Now, the Protectorate stands as the sole power capable of deciding the fate of the Southsea. The time is ripe to abolish the institution of Bronzeport, for governance in the Southsea must be unified."
 abolish_the_bureau_of_the_bronzeport_decision_confirm: "Declare its end"
 abolish_the_bureau_of_the_bronzeport_decision_tooltip: "Reiterate Our Sole Authority"
 abolish_the_bureau_of_the_bronzeport_decision.tt: "Every [vassal|E] of [GetTitleByKey('k_bronzeport').GetNameNoTier] becomes your Vassal"
