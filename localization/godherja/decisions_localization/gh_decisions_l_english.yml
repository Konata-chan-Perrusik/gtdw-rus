 become_thura_myinthein_decision: "Become Thura Myinthein" 
 become_thura_myinthein_decision_desc: "Take up the mantle of the legendary guardian of the Nattanan, Thura Myinthein, sworn protector of the Sacred Grove and all holy sites of nature. Embrace your destiny as the Champion of the Twin Gods by defending the sacred balance of the natural world against all who threaten it."
 become_thura_myinthein_decision_tooltip: "Anoint yourself as the prophesied savior of the Nattanan."
