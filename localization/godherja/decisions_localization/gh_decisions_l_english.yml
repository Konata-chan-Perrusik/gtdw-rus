 migrate_holy_sites_decision_tooltip: "Create new [holy_sites|E] of your [faith|E] in a [region|E] of your choosing"
 migrate_holy_sites_decision_desc: "As years have stretched into decades, few can still remember our spiritual roots. With our homelands and temples lost to [the_fog|E], we could carry our faith only in our hearts — until now. I shall consecrate new temples in this foreign land, and the worship of [GetPlayer.GetFaith.HighGodName] will endure forevermore."
