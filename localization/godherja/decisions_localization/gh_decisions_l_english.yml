 controls_the_spice_trade_house_modifier_desc: "This dynasty has taken control over the Spice Trade in the [pirate_coast|E]."
 flourishing_pirate_coast_trade_modifier_desc: "This [county|E] is experiencing a golden age of commerce and mercantilism."
 flourishing_pirate_coast_trade_modifier: "Flourising Trade"
 reformed_ufaliracci_modifier: "Reformed Ufaliracci"
 reformed_ufaliracci_modifier_desc: "This character has reformed the kingdom of [ufaliracci|E] in its old [Concept('ritualism','Ritualist')|E] capital."
 reform_ufaliracci_decision: "Reform the Silver Kingdom"
 reform_ufaliracci_decision_desc: "It has been centuries since the [siege_of_ufaliracci|E], yet the [silver_palace|E] stands tall once again over the [pirate_coast|E]. It is time for its kingdom to do the same."
 reform_ufaliracci_decision_tooltip: "Reform the Silver Kingdom"
 reform_ufaliracci_decision_confirm: "We Climb Ever Higher"
 reform_ufaliracci_duchy_tt: "You [hold|E] and [completely_control|E] any [duchy|E] which [de_jure|E] borders the [GetTitleByKey('d_trinapaawa').GetName], and which is part of a [kingdom|E] with more than two [de_jure|E] [duchies|E]"
 elevate_republic_administration_decision: "Reform the Republic"
 elevate_republic_administration_decision_desc: "Our traditions were suitable for managing the people of one city, but now that we rule many cities we have encountered growing pains, many now question the very institutions upon which our Republic is based. In order to prevent a descent into despotism we must normalize our administration of these territories, and formalize offices and governorships."
 elevate_republic_administration_decision_tooltip: "Adopt an Administrative Republican government type"
 elevate_republic_administration_decision_confirm: "In the name of the body politic!"
 must_control_majority_of_ayyar_decision_tt: "You control more than [SCOPE.ScriptValue('ascendancy_of_east_formable_percent_decimal_value')|0]% of the [GetGeographicalRegion('world_ws_ayyar').GetName] [region|E] (Current: [SCOPE.ScriptValue('current_controlled_ascendancy_of_east_decision_region_owned_percent_value')|0]%)"
 establish_legitimacy_over_kinilam_decision: "Establish Legitimacy Over Kinilam"
 establish_legitimacy_over_kinilam_decision_desc: "For too long, we have ruled as mere regents to the throne. It is high time we establish ourselves as its rightful rulers, and throw off the courtly requirements of regency."
 establish_legitimacy_over_kinilam_decision_tooltip: "Supplant the Regency of Kinilam once and for all."
 establish_legitimacy_over_kinilam_decision_confirm: "To a new age!"
