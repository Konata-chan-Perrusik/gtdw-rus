 renovate_palat_to_mytidon_decision: "Renovate the Palat to Mytidon"
 renovate_palat_to_mytidon_decision_tooltip: "Transform this stain on our landscape into a new capital."
 renovate_palat_to_mytidon_decision_tt: "Your capital will be transformed into a your choice of either a palace or temple metropolis holding and gain a special building. This will take a year of work and replace the Palat to Mytidon with a new building.\n\n#W This decision will mean effectively abandoning any attempts at building a new capital altogether.#!"
 renovate_palat_to_mytidon_decision_desc: "We are free once more, and have established a strong new kingdom. There yet remains a nagging question: from whence shall we rule Mytidon? To Pedithipsi is a haunted ruin unfit for a king. And founding a new capital altogether may be outside of our reach. Thankfully the [Concept('aversaria','Aversarians')|E] left behind an administrative building in our territory that we could simply renovate to serve our own purposes."
 hubarite_codex_decision: "Write a Codex"
 hubarite_codex_decision_desc: "As others have throughout the history of our people, I will ensure that my name and practices shall live forever by writing a legal codex to guide future generations."
 hubarite_codex_decision_tooltip: "You will write a legal codex"
 hubarite_codex_decision_confirm: "Bring me a pen!"
 create_filosi_school_decision: "Legally Harmonize with the Sjalvolki"
 create_filosi_school_decision_desc: "Our new Sjalvolki friends and neighbors have a legal and religious tradition that dates back centuries, and which they certainly feel is equal in respect and legitimacy to our own. While we obviously disagree, especially in regards to the worship of their strange foreign Hunt God 'Filos' there are many principles they hold which may be worth further consideration."
 create_filosi_school_decision_confirm: "Create the Filosi School!"
 create_filosi_school_tt: "Creates a new Legal School for your Faith, called the Filosi School."
 create_filosi_school_decision_tooltip: "Create a New Legal School"
 hubarite_empire_decision: "Elevate a Hubarite Empire"
 hubarite_empire_decision_desc: "The oldest tales of our faith tell of a time when the [magi|E]-Judges reigned over a golden age of prosperity, when grand swathes of [sarradon|E] and perhaps even pieces of [the_continent|E], were ruled over by benevolent emperors, ruling close to the Great Sun itself. Though the people of this empire have so long been crushed beneath the alternating boots of [Concept('wardenism','Wardenites')|E] and [Concept('ritualism','Ritualists')|E], and though even the exact borders of our ancient realm have been lost to the mists of history, it has finally been restored."
 hubarite_empire_decision_valid_desc: "You completely control at least 3 kingdoms"
 hubarite_empire_decision_confirm: "Praise the Great Sun!"
 hubarite_empire_decision_tooltip: "Restore the Hubarite Empire of old"

