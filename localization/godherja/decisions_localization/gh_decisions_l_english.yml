 gh_debase_currency_decision_4_tooltip: "Sacrifice a large amount of [prestige|E] in return for an instant influx of gold."
 gh_strengthen_currency_decision: "Strengthen Currency"
 gh_strengthen_currency_decision_desc: "With our capital now hosting a Royal Mint, the opportunity is ripe for us to introduce fresh new measures to strengthen our currency. Through measures such as withdrawing currency already in circulation, selling foreign assets, reform and lender negotiations we can bring about a much needed increase in the value of our currency."
 gh_strengthen_currency_decision_confirm: "A new economic dawn."
 gh_strengthen_currency_decision_tooltip: "Sacrifice a large amount of gold in return for an instant influx of [prestige|E]"
 gh_strengthen_currency_decision_2: "Strengthen Currency"
 gh_strengthen_currency_decision_2_desc: "With our capital now hosting a Royal Mint, the opportunity is ripe for us to introduce fresh new measures to strengthen our currency. Through measures such as withdrawing currency already in circulation, selling foreign assets, reform and lender negotiations we can bring about a much needed increase in the value of our currency."
 gh_strengthen_currency_decision_2_confirm: "A new economic dawn."
