 kikarsagi_kill_aversarians_decision: "Slaughter Aversarians"
 kikarsagi_kill_aversarians_decision_desc: "The [Concept('aversaria','Aversarians')|E] have shown themselves to be weak, and the weak get beaten. Bereft of the Mandate of Purity and dogs in the eyes of the Purest, we must massacre their weak race to become the Chosen Men and save the empire. No mercy for the weak! No retreat for the strong!"
