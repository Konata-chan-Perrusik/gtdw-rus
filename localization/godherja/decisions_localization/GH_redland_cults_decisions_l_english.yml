l_english:
 find_prism_decision: "Pray for Revelation"
 find_prism_decision_desc: "The Abyssal Prism has been lost, and it must be found. Without it there is no means by which to save the Void from the Sun's brutal light. We must stray from the warmth and comfort of the darkness into that abominable hellscape called order, and take back what is ours."
 find_prism_decision_tooltip: "You will be shown the Abyssal Prism's current holder."
 find_prism_decision_confirm: "Listen."

 redland_cults_elevation_decision: "Pray for Elevation"
 redland_cults_elevation_decision_desc: "Entropy is the birth and death of all things. It is an inevitability, a description, a fact. It is the very being of which everything consists, and the substance of which the end is made. Order, that terrible and constrictive creation, merely outlines the chaos to convince itself that it has form. The Void takes what will become, and from it creates what is. That backwardness left behind is the gift they give to us - magic, whispers, secrets - dark and beautiful.\n\nWe must humble ourselves, and pray for the strength to bring chaos to the worthy."
 redland_cults_elevation_decision_tooltip: "Your dominance over the cultists will be sanctioned."
 redland_cults_elevation_decision_confirm: "Submit."

 redland_cults_proliferation_decision: "Pray for Proliferative Growth"
 redland_cults_proliferation_decision_desc: "We have expanded the currents of entropy, and yet lack the power to direct them. The Void's Speakers will select a worthy host to guide the eddies of this new place, and reward us for our devotion."
 redland_cults_proliferation_decision_tooltip: "Your ungovernable demesne will be granted a new Master."
 redland_cults_proliferation_decision_confirm: "Grant Ascension."
 
 void_blessing_one_decision: "Pray for a Bountiful Harvest"
 void_blessing_one_decision_desc: "Of the pale denizens of the Redlands, many questions have been asked:\n\n#italic \"Who are they?\"\n\"What is their purpose?\"\n\"Why do they keep kidnapping our children?\"\n\"Where am I?\"\n\"Is there anyone out there?\"\n\"Please, anyone, can anyone help me?\"#! \n\nThe Dark Masters are more than happy to answer."
 void_blessing_one_decision_tooltip: "Servants of the Void will heed your call."
 void_blessing_one_decision_confirm: "Unleash the Chaff."
 
 void_blessing_two_decision: "Pray for Embodied Terror"
 void_blessing_two_decision_desc: "#italic \"Fear: The sight of darkness in a hallway at the dead of night.\n\n Dread: The knowledge that there is something within that darkness.\n\n Horror: The sight of that thing as it emerges from the darkness.\n\n Panic: The sound of that thing becoming closer, at an alarming rate.\n\n Shock: The feeling of your entrails being released from your body and your blood draining to the floor.\n\n Terror: The sensation of something malicious and incorporeal consuming your fading mind.\"#!\n\n-Amnaxos the Chronicler, \"Guide to the Redlands\", Book I, Appendix, Definitions"
 void_blessing_two_decision_tooltip: "Monsters and abominations will confront our prey."
 void_blessing_two_decision_confirm: "Reveal the Hidden."

 void_blessing_three_decision: "Pray for Hunger Manifest"
 void_blessing_three_decision_desc: "There is one constant which is shared by Chaos, Order, and all other things save for the Void itself: Desire. Chaos desires to spread, and Order desires to contain. Time desires its own movement forward, and Death desires Life's creation. Even Desire itself desires its own growth, just as the ascetics desire to be free of it. Men are born as babes with a desire for their mother's milk, and will eventually grow to desire bread, meat, drink, blood, and perhaps, far more unsavory things.\n\nWe will harvest this desire, and with it consume our enemies."
 void_blessing_three_decision_tooltip: "The starving masses will begin their hunt."
 void_blessing_three_decision_confirm: "May our Hunger be Never Sated."

 void_blessing_four_decision: "Pray for Anathema"
 void_blessing_four_decision_desc: "#italic \"Hypothesis of the Null Operant:\n A: Souls have a physical form.\n B: There exists an ethereal space within bodies where Souls may be put.\n C: Souls not originating from a body may be placed within it.\n D (Axiom): Souls separate from the body upon death.\n E: A body loses capacity for a Soul after death.\n F: Bodies move only through the action of a Soul.\n ((A ⊕ E) ⟚ (B ∧ C ∧ ¬E)) ∧ D ⊙ F.\n Observations:\n No weight is lost upon death ⇒ ¬A, B.\n Liches may possess their ritually prepared corpses ⇒ ¬E.\n Spirits may possess the unlucky living ⇒ C.\n The Magics of Blood and Death may move bodies externally ⇒ ¬F\n ∴ There must be a way for souls to spontaneously act with neither soul nor Magic.\n\n Author's Note: I'm so close, SO close. I can define the Void, but it should be NOT. How? Why??? A missing premise? A symbol, upside-down?#!\"\n\n-Amnaxos the Chronicler, \"Forbidden Logics,\" Book IV, Chapter III"
 void_blessing_four_decision_tooltip: "You will fill the empty space with Nothingness."
 void_blessing_four_decision_confirm: "Fill them with Nothing."

 void_blessing_five_decision: "Pray for Temporal Recognition"
 void_blessing_five_decision_desc: "To say that Chaos could have a king would be erroneous, for the very definition of entropy is its lack of order and definition. To say that Chaos could have no king would be similarly paradoxical, as no such rules can be imposed upon the vision of freedom itself. However, with our devotion proven and our sacrifices made, the Gods of the Void may temporarily grant us a throne that befits one."
 void_blessing_five_decision_tooltip: "You will receive an object of power."
 void_blessing_five_decision_confirm: "Kneel before the Dark."

 void_blessing_sundeath_decision: "Pray for True Freedom"
 void_blessing_sundeath_decision_desc: "#italic Once we were broken\nAnd then we were chained\nA hundred years sorrow\nDrilled into our brains\n\nA thousand years anger\nTen thousand of hate\nAnd ten more times that\nWith fear as our fate\n\nWe screamed at the silence\nWe burned in the cold\nWe kept with our Spirits\nBy killing our souls\n\nAnd then we were answered\nIn whispers so loud\nThe Void promised power\nTo put mortals aground\n\nAnd now they've Forgotten\nAnd now that we're free\nWe'll Shatter the light-\nBring this world to its knees#!"
 void_blessing_sundeath_decision_tooltip: "Order will no longer contain us."
 void_blessing_sundeath_decision_confirm: "We will blot out the sun."

 redland_cults_direct_rule_decision: "Pray for Temporal Preference"
 redland_cults_direct_rule_decision_desc: "#italic \"There is a maddening paradox within the Redlands- physically and philosophically. From everything I have learned of those depraved Redlanders - their rituals, their chants, their books and marks - they appear to have no purpose but to pray to the Void and worship its Gods. They spread chaos everywhere they go, taking things that make sense and inverting them into the very picture of insanity. They come from the Pit, and feed it with the |Markings Unintelligible| of the surrounding lands.\n\nBut how can that be? The Void is Nothingness itself, by definition! I have verified this and recorded its very lack of existence. There should be no Gods there, no |Writing Scribbled Over|, nothing! There should be no#! #S thing#! #italic there for them to pray to! The Void should be contradictory to the Redlanders- Anathema!\n\nSo why then, do they pray to that horrible Abyss? Are they merely moving this world there to make room for |Hole Torn through Page| here? Or is there something, even darker, deceiving them all?\n\nIn three weeks time I will arrive in the medial steppes, and from there make my journey through the ancient mountains. Concealed by spell and Forgotten song I will make my way to Ofnamm'm, and discover the truth.#!\n\n-Amnaxos the Chronicler, \"Letter to my most beloved pupil.\""
 redland_cults_direct_rule_decision_tooltip: "You will be granted dominion over Ofnamm'm."
 redland_cults_direct_rule_decision_confirm: "To the Pit."
