 proto_aversarian_religion: "Proto-Aversarian"
 proto_aversarian_religion_adj: "Proto-Aversarian"
 proto_aversarian_religion_adherent: "Proto-Aversarian"
 proto_aversarian_religion_adherent_plural: "Proto-Aversarians"
 proto_aversarian_religion_desc: "The most common name for the thousands of cults and faiths of the ancient [Concept('aversaria','Aversarians')|E] during (and prior to) the [Glossary('Polisocracy','GH_POLISOCRACY_GLOSS')]. Proto-Aversarian faiths normally centered in various amounts around [magic|E] and [magi|E], [aspect_blood], [dragons|E], [the_towers|E] and the endless sprawling ruins of the [Concept('the_continent', 'Shattered Coast')|E]. Each Polis generally worshipped their own variation of the wider faith with often little to unite one another besides a vague sense of cultural fraternity."