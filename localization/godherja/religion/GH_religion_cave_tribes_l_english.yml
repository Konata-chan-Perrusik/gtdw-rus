l_english:

 cave_tribes_religion: "Cave Tribes"
 cave_tribes_religion_adj: "Cave Tribe"
 cave_tribes_religion_adherent: "Undertribal"
 cave_tribes_religion_adherent_plural: "Undertribals"
 cave_tribes_religion_desc: "LONELY WRITE THIS"

 skrattaki: "Skrattaki"
 skrattaki_adj: "Skrattakiatt"
 skrattaki_adherent: "Skrattakiatti"
 skrattaki_adherent_plural: "Skrattakiattia"
 skrattaki_desc: "None remember before the [Concept('twist_of_the_tunnels','Great Unmaking')|E], when the Skrattakiatti still had eyes to see and worshipped mundane men without the ability to possess the [Concept('magic','Shadowgift')|E], for the priests have for eons maintained that this hated era of falseness and lies must be destroyed in all forms. While the first Skrattakiatti would use the Shadowgift to scourge their mind of the memories and replace it with the love of their god Skrallaviax — the great spider-queen whom taught the Skrattakiatti how to crawl across the cavern walls and to climb down the mighty abyss from whence she came — the practice has become ritual. Now, all Skrattakiatti perform the Thoughtpurge when they reach majority, destroying their memories and replacing them with the combined knowledge of their tribes."

 grotticand: "Grotticand"
 grotticand_adj: "Grotticander"
 grotticand_adherent: "Grotticander"
 grotticand_adherent_plural: "Grotticanders"
 grotticand_desc: "The keepers of [GetTitleByKey('b_grotto_of_the_golden_martyrs').GetNameNoTier], the holiest place in all the underworld, the Grotticanders would establish great farms and and holy temples in what was once the greatest of cities beneath the world. The thousands of strange and [Concept('aelfir','alien')|E] bodies found in the Grotto, clad in strange golden armor impossible to forge by the hands of man, were believed to have once been the ancient guardians of the Grotto from before any man walked the world below.\n\nSeeing themselves as the inheritors of this great legacy and dreading the return of the barberous creatures that no doubt slew the ancient wardens, the Grotticanders have taken to preserving the ancient place and warding it with the greatest of magics their tribes could produce. To this end, the bodies of these once great warriors have often been given new life to assist in both war and peace. While many find their strange visage's disturbing, and while more than one has regained some mad semblance of its once-life and slew many in a rampage before being banished, the great bounty of the Grotto and the assitance of the [Concept('gh_general_undead','undead')|E] have allowed the Grotticanders to form three great empires well before any interloper intruded from [Concept('aversaria','lands unknown')|E]."

 krothagg: "Krothagg"
 krothagg_adj: "Krothaggi"
 krothagg_adherent: "Krothaggi"
 krothagg_adherent_plural: "Krothaggis"
 krothagg_desc: "The children of the great First Kings, Djor the Mountain-Splitter and Grular the Wiseman, were said to have been led beneath the world to face the most hated enemies to all mankind, the cowardly and insidious [Concept('aelfir','Aecaggir')|E]. While Djor and Grular had driven them beneath the world in the [Concept('prehistory','Godwars')|E], the twin warriors united their tribes as the world cracked and broke and led a great army to ensure the black beasts never rose again.\n\nWhile the Krothaggi kings would dominate the underworld, the [twist_of_the_tunnels|E] would destroy their empire and leave only a fraction of the population in their strange new reality. Great Cormacan 'the Unbleeding', greatest of kings since Djor and Grular, would thereafter declare the world cursed and in need of righting, through righteous war and the recreation of the fallen Krothaggi Empire by a future savior-king."

 currataggagga: "Currataggagga"
 currataggagga_adj: "Currataggagglar"
 currataggagga_adherent: "Currataggagglar"
 currataggagga_adherent_plural: "Currataggagglarni"
 currataggagga_desc: "The Undergod Currataggagga, Keeper of Stone who had shifted the mountains and guarded a tribe of devout worshippers for aeons after the Great Scouring of the world above with the Slaying of the First Sun, was slain in the great battle against the Abyssal Dragon that once threatened to devour the world from within many eons ago. The tribe they left behind continued their worship of great Currataggagga until the discovery of Kuruthaggam, the Great Golem of the Divine Stones. Kuruthaggam would be whispered to life by the faithful, an ancient and terrible spirit filling their body and a newfound sense of hope and joy at life cleansing their soul from what they claimed were many evils against man from before any walked the underworld.\n\nKuruthaggam would lead the tribes to many victories against the threats of the underworld and lead to the Krothaggi forming a great empire in their name, but the machinations of the blind serpents of the abyss — the hated Skrattaki — and the arrival of the foul [Concept('aversaria','Overempire')|E] in Bleakbeacon and their dreaded bleakblight plague would turn the faithful's fortunes. First with the coma Kuruthaggam would be placed into by dark aboveland [magi|E], then with the loss of their body when the Currataggagga were forced to flee their plagued homeland in the heart of Ijrak Murkul."

 zivvirath: "Zivvirath"
 zivvirath_adj: "Zivvirathic"
 zivvirath_adherent: "Zivvirathi"
 zivvirath_adherent_plural: "Zivvirath'ai"
 zivvirath_desc: "The legendary Fishfolk of the underworld, as those [Concept('aversaria','Aversarian')|E] explorers who have encountered the Zivvirathi call them, have treaded the great waters of the undersea for far longer than any modern Empire has survived upon the surface. The most ancient of Zivvirathic lore, as recorded in the Great Book of the First Ones, claims that the ancestors of the Zivvirathi fled from a great reckoning between armies of steel armed with mighty firestaffs that scoured their ancient homeland of Uthuggui thanks to a portal that led them beneath world.\n\nIn the unending eons since, the Zivvirathi have introduced dozens of new gods to replace the old and forgotten ones only briefly mentioned in the Great Book. The primary three are Zikkuru, the Fishmother whom birthed the mighty Scalcarp that Zivvirathi raiders pride themselves on riding; Kam-kazoll whom opened the great portal and from whose blood all [magi|E] descend; and Zanzabu who taught the Zivvirathi how to build the first boats capable of sailing the undersea and granted them fins and gills in case they fell from them."

 underimperial_aagiokrata: "Underimperial Aagiokrata"
 underimperial_aagiokrata_adj: "Underimperial Aagiokratan"
 underimperial_aagiokrata_adherent: "Underimperial Aagiokratan"
 underimperial_aagiokrata_adherent_plural: "Underimperial Aagiokratans"
 underimperial_aagiokrata_desc: "When the city of Nevetexon crashed down into the [Concept('mayikrata','underworld')|E] thanks to the efforts of the [magi|E] Avaxon and his revolution against the [Concept('chaos_of_the_seventh_century','occupying')|E] [Concept('kartharadd','Kartharaddi')|E] armies they landed into a cavern at war. Upon their island in the middle of the great abyss the Currataggagglarni and Skrattakiattia warred, the newly arrived [Concept('aversaria','Imperials')|E] and the surviving Kartharaddi armies soon joining the great battle that destroyed much of what remained of Nevetexon.\n\nAvaxon's disciple, Zekros, would end the war with the opening of the Beaconlight and the signing of the Abyssal Peace. Thereafter, Bleakbeacon would become possibly the largest city in the underworld, and the strange confluence of tribals, Kartharaddi (oddly spared from the [Concept('night_of_the_bleeding_moon','fate of their aboveground kin')|E], and Imperials would see the formation of an Aagiokratan cult mixing each faith represented in the Abyssal Peace."