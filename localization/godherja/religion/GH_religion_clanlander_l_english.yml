l_english:
 dyrridic: "Dyriddi"
 dyrridic_adj: "Dyriddic"
 dyrridic_adherent: "Dyriddi"
 dyrridic_adherent_plural: "Dyrridic"
 dyrridic_desc: "While originally part of the greater milieu of tribal faiths spread across the ancient Clanlands, early conflict with the $kathanouxa_link$ Kathanouxaic Empire#! would drive the Dyriddi south and into conflict with the ancient tribes of modern Etepezea. In some places as conquerors, and others as refugees, the Dyriddi would rapidly syncretize with the more settled southerners while keeping to their tribal traditions. By the time of the early [Concept('aversaria', 'Empire')|E] the tribes worshipped the god Sortec, the warrior lightning-father who struck the first tree with a bolt from the heavens to give humanity fire and who taught them to swing their swords."