# Fallen Star
 fallen_star: "Cult of the Fallen Star"
 fallen_star_desc: "An enigmatic cult centered around the monstrous [fallen_star|E] who preaches that enlightenment can only be obtained through realization of the meaningless of life on [aeras|E], while true meaning can be found in worshipping the Fallen Star itself. Those who do not accept must be ground to dust and removed from this world, for they are the propagators of mankind's current state.\n\nWhile it is not widely known where the Fallen Star is — or even if it truly exists — the devout know that truly skilled and worthy zealots to the great Star will be summoned to its lair in their dreams, to be gifted the powerful boon of its magics and to be inducted into the 'true cult'."
