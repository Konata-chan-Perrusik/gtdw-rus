l_english:

 etepezean_religion: "Etapexe"
 etepezean_religion_adj: "Etapexeyn"
 etepezean_religion_adherent: "Etapexeyn"
 etepezean_religion_adherent_plural: "Etapexeyni"
 etepezean_religion_desc: "The cultural ancestors to the modern [Concept('aversaria','Aversarian')|E] cultures that now inhabit Etepezea — the Etapexe — inhabited the peninsula long enough that it has never been proven if Proto-Aversarian culture first emerged in Etepezea or the [Concept('shatteredisles','Isles')|E]. Their faiths, while not as disparate as those of their Islander cousins, nevertheless remained largely divided in both belief and practice. The greatest commonalities between Etapexe-descended faiths would be worship and fascination with the extensive ruins spilling across the Shattered Coast, veneration of both the [magi|E] and great warriors, and a deep-seated fear of dreams (in all varieties mundane, mystical, and metaphysical)."

 imperii: "Imperii"
 imperii_adj: "Imperii'a"
 imperii_adherent: "Imperii'ayn"
 imperii_adherent_plural: "Imperii'ayni"
 imperii_desc: "Imperii refers to the disparate pagan beliefs of the ancient Etepezeans, possibly even the ancient ancestor tribe of the Etapexe. Primarily based around the worship of various ruins and the attempt to restore ancient temples, the Imperii'a believe that structures can become home to spirits both spontaneously and from generations of their inhabitants. The pantheon of the Imperii is vast, but all agree on the existence of the [Concept('aersanon','Red Lord')|E] — the ruler of all spirits and the builder of all of the great ruins of the world, most commonly agreed to have once inhabited the [sea_tower|E]."
 imperii_old: "Old Imperii"
 imperii_old_adj: "Old Imperii'a"
 imperii_old_adherent: "Old Imperii'ayn"
 imperii_old_adherent_plural: "Old Imperii'ayni"