 the_garden_of_copper_title: "The Garden of Copper"
 the_garden_of_copper_desc: "A compilation of around forty poems written by an unknown poet who visited the mines of the upper valley of [amsar|E]. The work describes the mines as a subterranean garden, shafts likened to tree trunks, ore veins to vines, and the sound of pickaxes to birdsong. Interspersed are laments about the miners, presented as metaphors of withering life in smoke. The book has long been considered a poetic criticism of wealth built upon suffering."

 historical_dead_magic_grimoire_1_title: "Dead Magic: Compiled Notes of Mytica"
 historical_dead_magic_grimoire_1_desc: ""

 the_collected_poems_of_useysh_title: "The Collected Poems of Useysh"
 the_collected_poems_of_useysh_desc: "A compilation of nearly one thousand and two hundred poems written by Useysh 'the Hixartii', likely the most prolific and influential poet of his era. His subjects range from the [Concept('aervalr','moon')|E], to thyssaen peasants, to elaborate metaphors for the Sheharddi city-states. His style shifts constantly, from brief gnomic fragments to long, winding epics. The collection preserves several series of paired poems in which he answers his own earlier verses, allowing readers to follow the changes in his thought over decades of writing."

 the_five_sealed_springs_title: "The Five Sealed Springs"
 the_five_sealed_springs_desc: "The legendary tale of the magi-warrior Yīv, who traveled across western [amsar|E] to imprison five djinn within springs. Told in six extremely lengthy chapters, it recounts her journeys and battles, the rituals by which entities were bound, the treasures hoarded by the djinn, and the miraculous properties of the springs. Though treated by most as fiction, the descriptions have led generations of adventurers to search in vain for their locations."

 a_thousand_dishes_of_sarradon_title: "A Thousand Dishes of Sarradon"
 a_thousand_dishes_of_sarradon_desc: "Commissioned by $qanamsar_parashad_link$ Qanamsar Parashād#! in 1076 IS, this compendium gathered recipes from across [amsar|E], western and central [sarradon|E]. It preserves preparations ranging from simple honeyed Thyssaen breads to intricate dishes of spiced lamb from coastal Udhliyya, and extravagant and extremely difficult to prepare meals presented to the Lirēnāra of the Liraaj of [Glossary('Ayyar','ayyar_coast_encyclopedia_desc')]. The book was presented to the Qanamsar at his third marriage, where he famously demanded every dish be served in a single feast."

 on_the_paths_of_dream_title: "On the Paths of Dream"
 on_the_paths_of_dream_desc: "Collected writings of the dreamwalker Atan sha Pansareh, regarded as perhaps the greatest dream-magi after [gh_the_amsari_prophet|E] , at least among those not of their dynasty. The book preserves transcripts of his journeys through the realm of dream, including what he claimed was a partial success at fixing a place within it, and instructions for those seeking to reproduce his accomplishments."

 the_rise_and_reign_of_naza_title: "The Rise and Reign of Naza"
 the_rise_and_reign_of_naza_desc: "Written by the [Glossary('Damotan','damota_encyclopedia_desc')] adventurer Gibali during his journey in the distant east at the time rise of $crater_queen_naza_link$ Naza#! in the beginning of 9th century IS. The book recounts her campaign in the [Glossary('Crater','crater_encyclopedia_desc')], from the capture of [GetTitleByKey('d_sinasan').GetNameNoTooltip] to her eventual consolidation of the region. The book was later offered to $qanamsar_zayar_link$ Qanamsar Zayar#!, as a show of appreciation and the great friendship that flourished between the two men."

 in_search_of_the_lost_south_title: "In Search of the Lost South"
 in_search_of_the_lost_south_desc: "Written by the mathematician and astrologer Dirhezad, based on his own observations of the Sarradonian mountain ranges, the climate, and geography, he argues that [sarradon|E] must extend far beyond the Great Desert to the south, unknown to the known world. Dirhezad presents two possible theories: either an immense, uninhabited expanse, or a single great empire ruling the imagined lands, unwilling or uncaring to be known. The theory was dismissed outright by his contemporaries, considered absurd by most, Yet Dirhezad declared he would journey south to prove it and was never seen thereafter."

 the_campaigns_of_sharnira_title: "The Campaigns of Shar'Nira"
 the_campaigns_of_sharnira_desc: "This book was written by the scribe Ardek Yazmir, who accompanied $qanamsar_sharnira_link$ Qanamsara Shar'Nira#! throughout her conquests in [amsar|E]. It combines precise accounts of her campaigns with passages of personal thought attributed to the Qanamsara herself, making it one of the most detailed records of its kind. At points it is unstinting in its praise of Shar'Nira's victories, while in other sections it is openly critical of her choices, condemning acts the author describes as morally reprehensible. The flow between exaltation and censure is jarring, but gives the work an unusual candor.\n\nThis duality has led to speculation about Yazmir's relationship to Shar'Nira. The level of intimacy implied by the reflections, and the uncharacteristic freedom with which she is portrayed, have led many to believe he was among her unofficial concubines. The detailed logistical and strategic notes on Shar'Nira's campaigns, placed alongside her personal and at times sensual, even intimiate reflections, have made the chronicle a subject of interest both for military study and for those drawn to the intimacies of her private life."

 collection_of_note_worthy_dreams_vol542_title: "Collection of Note-worthy Dreams, Vol. 542"
 collection_of_note_worthy_dreams_vol542_desc: "A book stolen from a House of Dream. This compilation was assembled by dozens of [gh_frazan|E] who deemed the experiences of the faithful worthy of posterity. It preserves over two hundred dreams recounted by supplicants, copied as faithfully as possible in the words of those who dreamed them. For each entry the Frazan recorded short notes and their own reflections on the subject. Though much of the work seems useless to a commoner, it remains valued by the Frazan institution both for its sheer breadth of records and for what little it may preserve of true revelation."

 proclamations_of_the_emerald_pretender_title: "Proclamations of the Emerald Pretender"
 proclamations_of_the_emerald_pretender_desc: "Purportedly written by the alleged grandson of $qanamsar_parashad_link$ Qanamsar Parashād#!, the book preserves speeches and proclamations attributed to the so-called Emerald Pretender. Alongside denunciations of the 'false throne-sitter' of the [GetTitleByKey('e_amsari_hiklahn').GetNameNoTier], it contains long reflections on rulership, legitimacy, and the rights of peasants. The style is uneven, shifting between proclamation, argument, and invective, and many passages appear incomplete. Most scholars regard it as a later forgery, composed by multiple philosophers, toward the end of the [gh_emerald_rebellion|E]."

 annals_of_the_house_of_harthah_title: "Annals of the House of Ḥārthah"
 annals_of_the_house_of_harthah_desc: "Written by a scholar and courtier of Ḥannā, granddaughter of $harthah_link$ Ḥārthah ibn Sarradon#!, the book exalts the dynasty's deeds. It hails Ḥārthah as the great liberator who cast down the Agionist yoke and freed [sarradon|E] from its grip, celebrating his wisdom and resolve in cleansing the land of foreign corruption. It then turns to Ḥannā herself, depicting her reign as the fulfillment of his vision through the stability and peace she maintained, and presenting her house as the rightful stewards of the realm's future."

 unfinished_treatise_of_mamur_adabyn_title: "The Unfinished Treatise of Mamur Adabyn"
 unfinished_treatise_of_mamur_adabyn_desc: "Left incomplete at $mamur_adabyn_link$ Mamur Adabyn#!'s death, the book is a commentary on the law of contracts. It treats at length the rights and obligations between lender and borrower, with particular concern for interest, default, and the division of responsibility in caravan partnerships.\n\nAdabyn frequently cites the earlier jurist Harzid, noting points where his interpretations were unclear or contradictory. Some passages are no more than marginal notes, questioning a definition or adding examples from recent cases. The work breaks off during Adabyn's extended discussion of inheritance of debt, ending midway through a rebuttal of Harzid's opinion."

 wisemans_friend_title: "The Wiseman's Friend"
 wisemans_friend_desc: "A book of occult and spiritual guidance, written by Chevalien mystic Jasperre Verdane. It covers a broad amount of topics, including herbal remedies, religious advice, spirits and many other arcane topics, and has proven to be immensely popular among Marcher students of the esoteric — its historical suppression broadening its appeal even more."

 owl_dissections_title: "Owl Dissections"
 owl_dissections_desc: "Written by an anonymous Marcher known only as the Polymath, said to have been a Waysaint. This manuscript contains detailed anatomical diagrams of owls, cut apart in every conceivable manner. Chickenscratch diagrams of great complexity and illegibility ensure that the manuscript can only be reproduced via the magical arts."

 songwood_title: "The Songwood"
 songwood_desc: "An early Marcher text compiling various song stories sung by the Clanlander tribes of Kalathipsomi. It is said they once sang to the Wood on its journey."

 azure_tablet_title: "Azure Tablet"
 azure_tablet_desc: "An ancient grimoire of unknown provenance, popularly attributed to the mysterious Scarlet King."

 aeltheniax_anatomy_vol_2_title: "Aeltheniax's 'Anatomy', Volume II"
 aeltheniax_anatomy_vol_2_desc: "A book on human anatomy by one of the [Concept('mayikprolollans','Mayikprolollan')|E]'s most renowned scholars. This is the second, and far rarer volume, with a much greater focus on the arcane aspects of the body."

 aeltheniax_anatomy_vol_1_title: "Aeltheniax's 'Anatomy', Volume I"
 aeltheniax_anatomy_vol_1_desc: "A book on human anatomy by one of the [Concept('mayikprolollans','Mayikprolollan')|E]'s most renowned scholars. This is the first, and far more common volume, with a focus on the more mundane functions of the body; the cardiovascular system in particular."

 seventy_seven_cities_title: "Seventy-Seven Cities of the Greater World"
 seventy_seven_cities_desc: "Demetrios of Chumau was a renowned half [Concept('marchers','Chevalien')|E], half [Concept('aversaria','Aversarian')|E] writer whose two hundred books, treatises, pamphlets, poems, plays, and more cemented him as possibly the most important writer of the 10th century. His 'Seventy-Seven Cities' story both described in intricate detail and provided a short tale of what Demetrios considered the 77 greatest cities of the world, and even contains intricate descriptions of cities as far as the center of Adabyss or the mysterious lands of Shaxi-Shahai in the far east, all of which Demetrios claims to have seen for himself."

 historical_korlacu_grimoire_1_title: "Grimoire of the Sacred Flame"
 historical_korlacu_grimoire_1_desc: "This grimoire is a holy relic for the followers of Korlacu who believe that the Bringer of Fire himself imbued the pages of the book with the very essence of the Sacred Flame itself."

 historical_wood_law_grimoire_1_title: "Shapechanger's Codex"
 historical_wood_law_grimoire_1_desc: ""

 healing_water_rune_scroll_1_title: "Healing Water Rune"
 healing_water_rune_scroll_1_desc: ""

 magistrength_rune_scroll_1_title: "Magistrength"
 magistrength_rune_scroll_1_desc: ""

 auspex_of_temptation_rune_scroll_1_title: "Auspex of Temptation"
 auspex_of_temptation_rune_scroll_1_desc: "The caster uses [aspect_blood] magic to become hyperaware of the body language and other subtle cues of the object of their desire. However at higher levels the spell can make the castor more prone to stress from outside events."

 raise_bloodthralls_rune_scroll_1_title: "Raise Bloodthralls Rune"
 raise_bloodthralls_rune_scroll_1_desc: ""

 skeletalcraft_rune_scroll_1_title: "Skeletal Empowerment"
 skeletalcraft_rune_scroll_1_desc: "Bones are said to hold the very fiber of magic that binds a soul to its body, and many Magi are known to use them to empower their abilities."

 fire_magick_rune_scroll_1_title: "Fire Magic"
 fire_magick_rune_scroll_1_desc: "The humble fireball is perhaps the most widespread spell in all of [aeras|E]. Though it requires little training and almost no preparation to cast, numerous methods exist to allow a [magi|E] to 'precharge' stronger projectiles for a period of time."

 skull_of_the_purest_title: "Skull of the Purest"
 skull_of_the_purest_desc: "A 9th century compendium and commentary of a series of now-lost scrolls by the 4th century Thebastrine cleric Vilos Valon. The scrolls in question documented visions witnessed with the aid of the 'Skull of the Purest', an enigmatic artifact of unknown origin, fate or even confirmed existence.\n\nThe visions themselves are often barely coherent, their subject most often (where there is a discernable subject at all) acts of extreme cruelty and boundless depravity committed by a race identified by Vias as the 'First Men' of Aagiokratian myth. Interspersed throughout the book are also commentaries and analyses of the unknown 9th century author of the compendum, most often from a theological standpoint.\n\nRegardless of the visions' veracity, there is a profoundly unsettling quality to the text, and some of the more sinister chapters are considered difficult to even read entirely. At multiple points, the 9th century compiler alludes to the existence of more scrolls by Vilos Valon, but these were not included in the tome for reasons unknown."

 masenmalik_title: "The Fields of Pearls and Pits Full of Gold"
 masenmalik_desc: "Mas'en Malik was a prolific author who lived during the golden age of Ritualist rule over [sarradon|E]. This eclectic thirty five volume work is his most well known and widely read. While the series purports itself to be a history, Mas'en Malik's unorthodox style leads to a work full of fanciful stories, surprisingly accurate historical accounts, a treasure trove of classic Southern poetry, and dozens — perhaps hundreds — of Dead Magic rituals hidden in coded language throughout the book. Naturally, faithfully copied versions of this work are quite valuable. Oddly Mas'en Malik was not known to have been a magi himself. Leading theories are that the anonymous 'benefactor' he thanks at several points in the writing may have been behind the intricate cypher that is still being unlocked almost a thousand years later."

 kam_gutaran_title: "The Kam-Gutaran"
 kam_gutaran_desc: "An ancient book transcribed from an even older scroll allegedly written from stories from the Ayyar tribes some 2000 years ago, the Kam-Guataran describes a hundred different trades in intricate detail in an effort to encourage people to master their profession. While many of the tips on individual careers are outdated, the general life advice is surprisingly powerful and exceedingly insightful."

 bookofmaps_title: "Book of Maps"
 bookofmaps_desc: "This tome proudly bears the mark of the Aversarinas Enosi Cartegraftekon, or the [Concept('aversaria','Aversarian')|E] Cartographer's Union. Aversarian scholars are the only ones in the world (besides possibly the Adabyssians) who are known to have shown an interest in crafting truly accurate maps of the world, using a mix of science and magic to find the exact shape and size of every land mass. As was Imperial tradition, the territory of the Aautokrata is shown as far larger than it is in reality."

 grimoireofmethinoire_title: "Grimoire of Methinoire Methiclyz"
 grimoireofmethinoire_desc: "The Grimoire of Methinoire Methiclyz was captured by the Marcher knight Gaoff den va Spencer during the legendary raid on the Bloodmourn Stronghold. On a quest to free captives from a recent raid and avenge his brother Teryn, Gaoff and his band of Anti-Magi slew Methinoire and destroyed his undead army during a battle in the liches throneroom. The Grimoire was brought back south, and legends say was sold to the reigning Aautokratir for such a sum that the economy of [chevalie|E] soon collapsed from the glut of gold and silver."

 burntgrimoire_title: "Burnt Grimoire"
 burntgrimoire_desc: "This book has had quite a beating, its edges burnt and dozens of pages missing (either torn out or burned). Still, the full power it once held is still noticeable, and it radiates a surprising amount of magical energy for so ugly a vessel."

 afynehestoree_title: "A Fyne Hestoree od de Lunde av Cheavalee"
 afynehestoree_desc: "An old tome in an older version of what may be the modern [Concept('marchers','Chevalien')|E] language, or possibly a new tome written by the average farmer. Whether the result of age or illiteracy, the book gives a rather fantastical description of [Concept('marchers','Chevalien')|E] history from [Concept('chevalie_migratory_era','the era of the Gallicader tribes')|E] all the way to the [red_river_war|E], where it suddenly ends as if never having been finished."

 book_of_kurush_title: "Book of Kurush"
 book_of_kurush_desc: "An account by the Amsari prophet Kurush, wherein he describes his visions of Hell."

 journal_of_waymaster_germaine_dellecroix_title: "Journal of Waymaster Germaine Dellecroix"
 journal_of_waymaster_germaine_dellecroix_desc: "A fragmentary text detailing the life and travels of one Germaine Dellecroix as he seeks the far north of the continent. Several pages are missing at the end."

 the_lost_cities_title: "The Lost Cities"
 the_lost_cities_desc: "Interviews collected by scholars of the Mayikprolollan from the few survivors of Shade encounters across the Shattered Coast."

 book_of_forbidden_names_title: "Book of Forbidden Names"
 book_of_forbidden_names_desc: "An Amsari tome of demonological lore ostensibly written with the intention of helping counter the malevolent entities it describes, but in practice used for the opposite purpose just as often as not."

 amazingslaves_title: "Amazing Slaves and Where to Find Them"
 amazingslaves_desc: "Half fiction, half travel guide, this [Concept('aversaria','Aversarian')|E] story is what happens when a [magi|E] attempts to make a pamphlet for slaving tips an enjoyable fantastical epic. Generally failing in both regards, the long multi-page description of the thighs of [Concept('sarradon','Sarradonian')|E] women or the bizarre fourteen page hate filled rant about the author's rival Demetrios in the section about Iyrossi stewardship are generally strong indicators of what to expect from the story."

 fraternityofmagi_title: "A Response to 'The Fraternity of Magi'"
 fraternityofmagi_desc: "This book is a sentence by sentence response to a series of treatises written by the [Concept('aversaria','Aversarian')|E] [magi|E] Nothox Oemanaid named 'The Fraternity of Magi', a series of increasingly frantic essays suggesting the formation of a true Magocracy in Aversaria wherein all Magi live equally regardless of religion and culture.\n\nThe book, written by one of Oemanaid's many critics, offers a rather scathing commentary like most of the responses to the publication. Primarily, the book details the ridiculousness of the idea that Aversaria is not already a Magi Fraternity. The author points out how only Aversarians are human, and only Magi truly human, and that all humans of the Aautokratia have the highest standard of life and amount of rights in the known world. The author ends the book by suggesting that Oemanaid has sympathies for his slaves, and suggests they be executed for their beliefs."

 the_godherja_title: "The Godherja"
 the_godherja_desc: "Constructed by the semi-mythical Kruvonik 'Good-Word' sometime in the distant past and then later penned down by his blind apprentice Sjinlas 'the Stray', the Godherja remains to this day the most important and influential of the Sjalvolki sagas."

 dragon_tale_title: "The Dragon Tale"
 dragon_tale_desc: "The Dragon Tale' is the famous history of the [war_of_the_thousand_dragons|E] by [Concept('aversaria','Aversarian')|E] scholar Dexon Divantax. Describing in accuracy the civil war between the evil Dhaxiken and the good Letigano, along with the thieving dragons stealing the power of [magic|E] from good Aversarians and joining Dhaxiken in attempting to destroy the memory of the Purest. While generally hailed as an extremely accurate and well researched, if slightly dramaticized, story of the war, several critics have noted that the author (despite claiming to have written it during the war) is actually a pen name for Davon Davaonter, who lived some 500 years after the events of the story."

 womanknights_title: "On Womanly Knights"
 womanknights_desc: "This book was written by Chevalien scholar Michon Andreaux sometime in the 11th century to compile numerous smaller works by various authors of his time which argued for or against the concept of a woman being bestowed the title of knight, most likely due to the dubbing of the female Anti-Magi Rose den va Kreysauns at the beginning of the century by the warlord King Anton Descradau.\n\nWhile there are many examples in Marcher history of women warriors, the specific title of knighthood is one that has nearly never been given to a woman. While the works are generally in support of women fighting and none dare try and blemish the name of the many Marcher heroes of the fairer sex, Andreaux ends the work by claiming that female knights are themselves an attack against the 'strong and noble traditions' that the title holds, despite a begrudging admittance that Lady Rose's slaying of nearly a hundred undead and an [Concept('aversaria','Aversarian')|E] Magi before her 19th winter were somewhat impressive."

 pocket_guide_to_aversaria_title: "A Pocket Guide to Aversaria"
 pocket_guide_to_aversaria_desc: "A collection of maps and place descriptions throughout [GetTitleByKey('h_aversarinas_aautokrata').GetName]."

 manswelbestiarium_title: "Ragambald Manswel's Bestiarium"
 manswelbestiarium_desc: "Ragambald Manswel was a remarkably well traveled Marcher adventurer who purportedly sailed as far east as the borders of Kathun Kai. Upon his return to [chevalie|E] Ragambald began the laborious process of scribing his numerous journals and sketches into written form. The accounts contained within are an unparalelled and surprisingly accurate guide to the various fauna, magical and otherwise, which stalk the remote regions of [aeras|E]. Ragambald's own biography — supposedly recorded in a separate volume — has sadly been almost completely lost to history, but from his surviving work he must have been a remarkable and well educated man. Some have even suggested that Manswel may have been a pen name but this, as with everything else about Manswel's life is heavily disputed among Chevalien literati."

 contents_of_silver_title: "The Contents of Silver"
 contents_of_silver_desc: "A series of instructionals by an unknown Anti-Magi on the process of making and maintaining mirrors."

 greyfen_codex_title: "The Greyfen Codex"
 greyfen_codex_desc: "A grimoire that once belonged to the Hag of Greyfen, before she was slain by Sir Rene the Mustachioed. Despite the wealth of arcane knowledge contained within, the illiterate Sir Rene would lose the book in a game of dice in a Gisreddean tavern, after which it would disappear from the historical record for centuries. It would resurface in the 9th century after being recovered from the personal library of the infamous Thiscul den va Vescot."

 on_the_triune_blood_of_man_title: "On The Triune Blood of Man"
 on_the_triune_blood_of_man_desc: "A famous medical and philosophical text, attributed to the [Glossary('polis','GH_POLISOCRACY_GLOSS')] era polymath Mnestrios."

 the_voyagers_title: "The Voyagers"
 the_voyagers_desc: "The recorded dream journeys of the cabal of the Isochedron. Led by the Fifth-Finger Sanad adept Ishak, the Isochedrons pushed far beyond the known boundaries of astral projection, plumbing the depths of psyche and the outermost reaches of the spheres of heaven."

 clarifications_on_the_ivory_sea_title: "Clarifications on the Ivory Sea"
 clarifications_on_the_ivory_sea_desc: "An un-signed manuscript analyzing the nature of objects pulled from the dreams of the wakeless. It seems that there are rituals capable of sending someone into a never-ending slumber filled with fitful dreams. If such a dreamer has the gift of magic, sometimes the things which they dream about can slip through the cracks in their brutalized psyche and enter the waking world. Usually just objects."

 neverending_dream_title: "The Neverending Dream"
 neverending_dream_desc: "An Apti legend recounted by [Concept('aversaria','Aversarian')|E] scholars, the Neverending Dream tells of a boy trapped in his dreams."

 transcripts_of_contention_of_rajmun_title: "Transcript of the Contention of Rajmun"
 transcripts_of_contention_of_rajmun_desc: "The Contention of Rajmun was a major debate between the Head of Rajmun University, Scholar Prakesh Utamatar, and the Khathpatti-Consort of Adlurbad, Arjun Vhanati, to discuss the origins of the [sabar_lambay_raad|E]. Initially focused solely on the catastrophe, it became a moral and theological debate about the ethics of [Concept('magic','Magical')|E] experimentation. The scribe, Scholar Lubhai Advani, supplements the transcript with his own musings and interpretations."

 epic_of_talab_title: "The Epic of Talab"
 epic_of_talab_desc: "This ancient Sarradonian epic follows Talab, a personification of the constellation of the Wanderer, as he makes his way to the palace of the Emperor of Night. Along the way, he must overcome numerous obstacles and foes."

 high_chants_of_stargazers_title: "High Chants of the Watchful Stargazers"
 high_chants_of_stargazers_desc: "A collection of lost rites that once guided a forgotten order of astrologers in their quest for celestial harmony."

 splenderous_mirror_turned_inwards_title: "The Splendorous Mirror Turned Inwards"
 splenderous_mirror_turned_inwards_desc: "A manuscript detailing the mysterious art of 'Internal Alchemy'. The author claims that the works of alchemist [magi|E] in the physical world can be mirrored in the internal world, with an adept capable of fundamentally transforming their personality and vices via a number of careful processes."

 the_dancers_title: "The Dancers"
 the_dancers_desc: "A much maligned play of [Concept('aversaria','Aversarian')|E] origin, its script has nontheless survived in circulation in certain esoteric circles. It is by reputation inscrutably nonsensical, and scribed by either a particularly untalented amateur or a madman. Perhaps both."

 the_hippoxiad_title: "The Hippoxiad"
 the_hippoxiad_desc: "An [Concept('aversaria','Aversarian')|E] comedic play of obscure origins, known for being able to quite literally mesmerize its audience, among other effects."

 sound_of_veins_title: "Sound of Veins"
 sound_of_veins_desc: "An epic and homoerotic poem of the Opakhasian tradition describing the lusts and miseries of a Vampire."

 testament_to_yunusfur_title: "Testament to Yunusfur"
 testament_to_yunusfur_desc: "A booklet recounting the travels and martyrdom of the Sophocos-blessed prophet Yunusfur. It is said that she journeyed from one end of Sarradon to the other, teaching virtue and correct religious rites. This account is the only known reference to her existence."

 arl_janvreeps_series_title: "Arl Janvreep's Series On the World-Tree"
 arl_janvreeps_series_desc: "A compilation of etchings and charcoal rubbings originally made by Konijkmener Magi-Explorer Arl Janvreep during his expedition to the mysterious lands of the Partic following the disappearance of the [Concept('kartharadd','Kartharaddi')|E]."

 songs_of_the_sea_title: "Songs of the Sea"
 songs_of_the_sea_desc: "A collection of folktales recorded among the isolated communities of the Western Isles. It focuses on the figure of the Sea Queen, who rules a majestic kingdom below the waves, and her court of long-drowned sailors.\\n\\nInterlaced within tales of warriors, sailors and mystics are descriptions of ancient rites known as 'Salt Songs, which can both calm and enrage the wild oceans of the West."

 alkan_tabbot_title: "The Life of Alkan Tabot"
 alkan_tabbot_desc: "Though the writer of this book claims to be one 'Alkan Tabot', supposedly a mariner from the days of the Second Ran Kemsar, numerous apocryphal details within its pages make this extraordinarily unlikely. Instead, the true author is widely accepted to be the Sarradonian Safa Meli, who was known to have penned multiple such pseudonymous works throughout the course of her career. It follows Alkan's construction of a dolphin-shaped submersible vessel, and the many marine adventures which he and his crew embarked on."

 musings_on_flight_patterns_title: "Musings on the Flight Patterns of Birds"
 musings_on_flight_patterns_desc: "An anonymous journal written in both cypher and mirror-writing, containing notes on birds, the winds and other meteorological phenomena. The text appears to have taken a lifetime's worth of notes to complete. Its diagrams, drawn in exquisite detail, show the mechanics of flight and the properties of mysterious 'way winds'."

 sanasamadta_title: "Sanasamadta"
 sanasamadta_desc: "Of Kashiryan origin, this book details the legendary lives of half a dozen historic conquerors, from the historically certain Otached to the mythical Vitruna the Bull-Slayer. It is said to have once been popular courtly poetry, but has since fallen out of popularity. Its authorship is attributed to the poet Ashkora, though the name of this ancient sage js frequently appended to anonymous works to heighten their prestige."

 stony_affair_at_viridue_title: "The Stony Affair at Viridivie"
 stony_affair_at_viridue_desc: "One of the numerous plays detailing the adventures of renowned [magi|E]-Tektiv Thena Pyralis, the story marks Pyralis's first foray into the kingdoms of Chevalie. She must solve the mystery of the despised [court_magi|E] of Viridivie, who was seemingly turned into stone at the Duke's wedding. Surprisingly, it became wildly popular in the Kingdom of De Porte de Bastione, after an adaptation retooled Pyralis into a more heroic and chivalrous character."

 lessons_on_oejeynican_burials_title: "A Lesson on Funerary Rites and Practices in the Late Oejeynican Period"
 lessons_on_oejeynican_burials_desc: "In this work, Chevalien Scholars compiled what records persist of the ancient and intricate burial customs of the Ojyczaynz."

 kassidius_diagrams_title: "The Kassidius Diagrams"
 kassidius_diagrams_desc: "The collected notes taken by the [Concept('aversaria','Aversarian')|E] [magi|E] Kassidius, who dedicated his long career at the Mayikrata to the magical dissection of human souls in order to properly identify the metaphysical differences between nonhumans and Aversarians. His laboratory was said to have been the single largest consumer of slaves in the entire academy during its heyday."

 lonely_spirit_title: "Book of the Lonely Spirit"
 lonely_spirit_desc: "The diary of a reclusive Opakhasian [magi|E] known as Ververedex, who attempted to separate his soul from the fleshy confines of the body."

 aversariancookinginformational_title: "Aversarian Cooking Informational"
 aversariancookinginformational_desc: "This is a rather... impractical cookbook discussing how to craft the finest and greatest eats in [aversaria|E]. Seemingly written for the nobility, the costs of each ingredient is so exuberant that even the Aautokratir was most likely put out by them. Not only that, but each dish requires such obscene magical powers to craft that'd they'd each require hundreds of sacrifices. The book best serves as a conversation piece, primarily about how the Aversarians didn't end the world sooner. And vinegar in lead jars! Vinegar in lead jars!?"

 marcherswhatdoweknow_title: "Marchers: What do WE Know?"
 marcherswhatdoweknow_desc: "This book is a creation of the [Concept('aversaria','Aversarian')|E] Legon Parthanos who famously argued consistently for over thirty years the need for an invasion of [chevalie|E]. Marchers, What do WE Know goes over supposed reasons for his arguments, from the Chevalien use of Anti-Magic martial arts proof that they are beings from hell and why the masculinity of their woman would make them poor pleasure slaves."

 mightmagibuxommaiden_title: "The Mighty Magi and the Buxom Maiden: XXI"
 mightmagibuxommaiden_desc: "This popular [Concept('aversaria','Aversarian')|E] novel is one of many in a long running series of Aversarian romance novels. Generally considered ridiculous in other corners of the world, the story goes into tantalizing and sometimes obscene detail about the simmering lust between an exceptionally muscular and masculine bare chested [magi|E] and an exceptionally large-breasted naive and virginal princess who falls into his arms. It is considered disgusting and written at a child level by almost all who read and condemn it, and owned by most."

 fiftyshades_title: "Fifty Shades of Blood"
 fiftyshades_desc: "This [Concept('aversaria','Aversarian')|E] romance novel is both popular and widely banned in polite society. Detailing a tantalizing romance between a dominating Aversarian magi and his demure slave, the book goes into excruciating detail about the methods of his romance and the obscene leather contraptions he uses in it. Widely considered poorly written and disgusting, it nonetheless seems to sell in obscene amounts."

 adabyssianreport_title: "Adabyssian Report on Northern Civilization"
 adabyssianreport_desc: "This carefully sealed scroll contains a long-form report from what appears to have been Adabyssian spies sent north to study the north and its people's in preparation for eventual invasion. With references to reports going back some 300 years before [frodbrokna|E], the report generally concludes with agreement that the denizens of [sarradon|E] and [aversaria|E] are most likely a distant cousin to humanity, and have more in common with humanlike animals than they do civilized species."

 taleofsirkoeveux_title: "The Tale of Sir Koeveux"
 taleofsirkoeveux_desc: "The Tale of Sir Koeveux is a novelization of an old [Concept('marchers','Marcher')|E] legend about the elder Sir Koeveux, who became so lost in his old age that he somehow ended up north of the [Concept('the_lichdoms','Lichdoms')|E]. The tales tell of Sir Koeveux fighting an immortal Ice Queen, her sinister [magi|E] chancellors and knights, and an evil group of aliens with pitch-black skin. It is a cute tale, normally told to children for being so amusingly ridiculous."

 imperialcivilwar_title: "The Imperial Civil War: Beginning to End"
 imperialcivilwar_desc: "This book covers the [Concept('imperial_civil_war','Aversarian Civil War')|E] that took place between Aautokratir Aeschraes and Aautokratia Axiaothea from 1186 to 1200 IS. The book, instead of yet another fantastical retelling, is actually an extremely dry list of biographies, maps and witness accounts made to serve as a studyguide for future generations."

 nameofthewindknockoff_title: "The Sound of the Air"
 nameofthewindknockoff_desc: "The Sound of the Air is an [Concept('aversaria','Aversarian')|E] romance and adventure story that was somewhat popular before [frodbrokna|E]. Detailing the rise of Aautokratir Aaeschraes and painting him as the most talented youth in Aversaria's history, the book puts much focus on his time rising through the [mayikrata|E] and the rivalry and romance with his great counterpart Axiaothea. While very popular, and quickly followed by a sequel, the series never received a third book after Frodbrokna and the end of the world."

 tragedyinoejeynica_title: "A Tragedy in Oejeynica"
 tragedyinoejeynica_desc: "This series of essays by a mixed [Concept('aversaria','Aversarian')|E]-Chevalien group of scholars is an extensive look into what exact decisions and events came together to lead to the [sorrowing_of_oejeynica|E] and the rise of the [Concept('the_lichdoms','Lichdoms')|E]. While possibly overly detailed and dry, the book does include some insights in magic and how to prevent some of its worst excesses."

 sarradoniansteps_title: "1001 Sarradonian Steps"
 sarradoniansteps_desc: "1001 Sarradonian Steps is a series of tales each taking place from the perspective of a member of a different [Concept('ritualism','Ritualist')|E] sect. While a deep cultural icon for Ritualists and generally considered one of the high marks of Sarradonian literature, the book was nevertheless woefully dated within a decade of its publication, nearly all of the sects mentioned in the book either extinct, disbanded, merged, renamed, hunted down, or replaced by twice their number."

 chivalriccode_title: "The Chivalric Code"
 chivalriccode_desc: "The Chivalric Code is a treatise on how a true [Concept('marchers','Chevalien')|E] knight should act in their day to day life. The book gives an entire quarter of its pages to how to fight and treat others honorably, the role of the peasantry in society, sage knowledge on protecting the weak and defeating the [gh_general_undead|E] before spending the remaining 300 pages detailing profitable foreign markets, suggestions for negotiating mercenary payments, and known foreign fighting styles and how to kill their practitioners."

 griffonbestiary_title: "Griffon Bestiary"
 griffonbestiary_desc: "This bestiary is a description of various breeds of [Concept('marchers','Chevalien')|E] [griffons|E] and suggestions on how best to breed and train them. Once considered a necessity for many would-be Griffon Riders, today it is considered more worthy as a historical piece, several now-extinct breeds detailed with very well drawn pictures and diagrams."

 lasthippogriff_title: "The Last Hippogriff"
 lasthippogriff_desc: "The Last Hippogriff is a tragic series of writings by Marcher scholar Abaël Venodau, detailing his study and befriending of the Hippogriff Ketti, believed to have been the last of his species. The book reviews Ketti's bloodline and briefly describes the history of the Hippogriffs from their first discovery by the Chevaliens to their extinction from overuse in the [marcher_aversarian_wars|E]."

 howtomaimadragon_title: "How to Maim a Dragon"
 howtomaimadragon_desc: "An [Concept('aversaria','Aversarian')|E] guidebook on how to best kill a [Concept('dragons','Dragon')|E], it is a hotly debated topic whether the book was written before or after the invasion by the dragon [arthenax|E]. The distinction, they argue, would decide whether the manual is an accurate guide inspired by the killing, or a fantastical look at a boy killing his pet dragon."

 loveanddeathinasiupoli_title: "Love and Death in Asiupoli"
 loveanddeathinasiupoli_desc: "Love and Death in [GetTitleByKey('c_asiupoli').GetNameNoTier] is an [Concept('aversaria','Aversarian')|E] series of short stories about a doubt ridden ex-legionnaire in the city of [GetTitleByKey('c_asiupoli').GetNameNoTier] working as hired muscle. Hired by a beautiful Magi to find the killer of her husband, the hard-boiled Legionnaire navigates a dangerous web of the city's crime families as well as his own inner demons."

 silastavroaliveordead_title: "Silas Stavro - Alive or Dead!?"
 silastavroaliveordead_desc: "Silas Stavro - Alive or Dead!? is a series of [Concept('marchers','Chevalien')|E] (largely dictated) books and pamphlets by the increasingly elder and erratic Abaël Venodau. The series remains highly controversial to this day due to its seeming support of Stavroist beliefs; it claims that the Arch-Lich [silas_stavro|E] was not, in fact, killed in his invasion of the Marches and defeat at the hands of the [champion_of_chevalie|E], but is actually alive and regularly visits Abaël to enjoy tea and debates about romance literature. Its detractors claim it is a good example of Venodau having gone insane, its supporters claim it as a fantastic metaphorical piece."

 howtoreadabook_title: "How to Read a Book"
 howtoreadabook_desc: "A short story meant to teach Marcher peasants how to read and write, this copy is one of hundreds created at the behest of Lord Kavin Shevaun, who desired to perform great reforms to improve the lives of the peasantry but is also regarded as having no understanding of rulership. It appears that Shevaun realized his error soon after the final book was created, because he abruptly ended the program and demanded all copies of the book be burned."

 purelifefifth_title: "On Living a Pure Life - Fifth Edition"
 purelifefifth_desc: "'On Living a Pure Life' is one of dozens of books written by the Agionist Saint Katharitos. Focusing on how to live one's life to the fullest and how to act and treat others in order to most enjoy it, many of the suggestions in the book seem to outright contradict most of Agionist canon.\n\nThe edits created over the various editions have recontextualized and outright rewritten several verses as an attempt to translate it to the modern vernacular, explaining that the doctrinal conflicts were simply poor translations or misunderstandings of the text, and also explaining how as the most prolific of the Agionist Saints, Katharitos would inevitably have some minor contradictions."

 purebodyfifth_title: "On Earning a Pure Body - Fifth Edition"
 purebodyfifth_desc: "'On Earning a Pure Body' is one of dozens of books written by the Agionist Saint Katharitos. Focusing on how to perfect one's body and what it truly means to possess pure blood and a pure body, many of the suggestions in the book seem to outright contradict most of Agionist canon.\n\nThe edits created over the various editions have recontextualized and outright rewritten several verses as an attempt to translate it to the modern vernacular, explaining that the doctrinal conflicts were simply poor translations or misunderstandings of the text, and also explaining how as the most prolific of the Agionist Saints, Katharitos would inevitably have some minor contradictions."

 puremindfifth_title: "On Creating a Pure Mind - Fifth Edition"
 puremindfifth_desc: "'On Creating a Pure Mind' is one of dozens of books written by the Agionist Saint Katharitos. Focusing on how to train ones mind to be free of impurity such as hatred and doubt and to maintain a positive outlook on life, many of the suggestions in the book seem to outright contradict most of Agionist canon.\n\nThe edits created over the various editions have recontextualized and outright rewritten several verses as an attempt to translate it to the modern vernacular, explaining that the doctrinal conflicts were simply poor translations or misunderstandings of the text, and also explaining how as the most prolific of the Agionist Saints, Katharitos would inevitably have some minor contradictions."

 purelifefirst_title: "On Living a Pure Life - First Edition"
 purelifefirst_desc: "'On Living a Pure Life' is one of dozens of books written by the Agionist Saint Katharitos. Focusing on how to live one's life to the fullest and how to act and treat others in order to most enjoy it, many of the suggestions in the book seem to outright contradict most of Agionist canon.\n\nThis first edition is an extremely rare and often destroyed copy written in the Saint's own hand, making it explicitly clear how much his own views differ from the modern interpretation. One of the most notable verses says, 'And let it be known that the heart of a Puremost life is held thusly: In Kindness, in Compassion, and in Love. Love your friends and family, and your neighbor, and all you meet, for only love will save your soul.'"

 purebodyfirst_title: "On Earning a Pure Body - First Edition"
 purebodyfirst_desc: "'On Earning a Pure Body' is one of dozens of books written by the Agionist Saint Katharitos. Focusing on how to perfect one's body and what it truly means to possess pure blood and a pure body, many of the suggestions in the book seem to outright contradict most of Agionist canon.\n\nThis first edition is an extremely rare and often destroyed copy written in the Saint's own hand, making it explicitly clear how much his own views differ from the modern interpretation. One of the most notable verses says, 'It is not the place of us to judge those whose bodies are born weaker, or smaller, or twisted or perfect. The purity of the body is not judged by its structure or its form, it is judged by the care and love it is presented and crafted with. The most beautiful of courtesans may contain within them the cruelest and more impure of hearts, and the deformed slave may yet remain more pure than even the mightiest of Magi lords.'"

 puremindfirst_title: "On Creating a Pure Mind - First Edition"
 puremindfirst_desc: "'On Creating a Pure Mind' is one of dozens of books written by the Agionist Saint Katharitos. Focusing on how to train ones mind to be free of impurity such as hatred and doubt and to maintain a positive outlook on life, many of the suggestions in the book seem to outright contradict most of Agionist canon.\n\nThis first edition is an extremely rare and often destroyed copy written in the Saint's own hand, making it explicitly clear how much his own views differ from the modern interpretation. One of the most notable verses says, 'To focus your mind is not to fall into the clutches of magic or to remove all thoughts of compassion and kindness. It is to remain open to new ideas, to be eager in your experience of foreign ways, and to maintain the purety of thought to take in strange and disagreeable views and discover the fellow human who speaks them.'"

 travelsofsaintkatharitos_title: "The Travels of Saint Katharitos"
 travelsofsaintkatharitos_desc: "This book is an alleged autobiography by Saint Katharitos on various tales of his travels throughout [aversaria|E], [chevalie|E], and [sarradon|E]. The book is at various parts nail-biting, profound and heart-wrenching, and is generally considered Katharitos' seminal work. Widely reprinted, it is considered one of the greatest tales in the modern circulation, and plays based on it are widely popular around the known world."

 hundredtrials_title: "The Hundred Trials of Saint Sansia"
 hundredtrials_desc: "The Hundred Trials of Saint Sansia is a semi-biographical fiction novel following the life of the Agionist Saint Sansia, from her birth to her sacrifice at the Stand of the Martyrs. Each chapter revolves around a different period of her life and one of the many legendary trials she faced at each step of her troubled path from orphan to Saint. While many of the ending messages seem outright contradictory to modern Agionist beliefs, each ending also has a section written by the author reconciling it with Agionist doctrine by explaining that the writing is strictly metaphorical."

 bookofremedies_title: "Thysian Book of Remedies"
 bookofremedies_desc: "This book is a listing of medicines and remedies for various diseases and ailments both common and obscure, with treatment using both the best ingredients available and local ingredients in order to ensure even the peasantry would benefit from its knowledge. While generally respected and still widely circulated by healers, the book spends a controversial amount of time demanding the reader 'washeth the hands which heal in the purest of waters and alcohol', a step to most treatments most contemporary readers see as little more than time wasting ceremony. Another chapter often removed for not being worth the cost of printing speaks of diseases actually being spread by small evil beings unseen by human eyes, which is regularly regarded as a fit of fantasy when compared to the scientifically proven existence of humours."

 saintslawbook_title: "Saint Dikaynos' Lawbook"
 saintslawbook_desc: "This book is a collection of court hearings attended by or laws created by the Agionist Saint Dikaynos in his time as a jurist. Unlike most [Concept('aversaria','Aversarian')|E] jurists, Dikaynos always insisted that the law must be held independently of ones station, race, or beliefs, and would commonly go through great pains to ensure that he was not privy to the names, gender or bloodline of whoever he was trying. While many of the cases have been stricken from the record or censored, it nonetheless serves as a strong guide to following the Dikaynsite method of fair law and jury."

 rendingthechains_title: "Rending the Chains by Saint Calysto"
 rendingthechains_desc: "Rending the Chains is a series of essays supposedly written by Saint Calysto, patron saint of the Agionist Order of Saint Calysto's Key. The book primarily discusses how best to free the needy, most notably by forcefully enslaving them and then having them work to the death in service to true believers so that they may be reincarnated in the next life as a true believer, who may then go to a positive afterlife upon death. While often held as gospel by Calysto's Order, many academics believe the book was actually written several decades after his death by non-Agionist writers."

 calystojournal_title: "Personal Journal of Calysto 'Wave-Rider'"
 calystojournal_desc: "This weather-beaten booklet is little more than a few dozen dirtied pages sealed within a cracked leather binding. Proclaiming the words 'Calysto Cayne' in harsh lettering on the first page, it appears to be the personal journal of Agionist Saint and (forgotten by most) infamous pirate Calysto.\n\nThe journal gives little time for personal writings or philosophy, and the sentence structure and spelling of much of it suggests Saint Calysto either possessed some form of impediment or had only became literate late in his life. What the journal does contain is numerous charts, graphs, musings and ideas. All show the signs of a master and inventive sailor capable of designing improvements to his own ships, but they also show several lists of various slave pens and marketplaces around [Concept('aversaria','Aversaria')|E], with lists of best times to attack and shipping routes to transport slaves to safe havens. The end of the book even lists various Aversarian nobles and magistrates, listing them as notable proponents of slavery to be 'eliminated'."

 eosianswordcharter_title: "The Eosian Sword Charter"
 eosianswordcharter_desc: "The Eosian Sword Charter is allegedly a book on swordsmanship and how to act during battle by Saint Eos himself. The book covers many techniques ranging from strange and foreign with inspirations claimed from the far corners of the world to which Eos himself traveled as a mercenary, but also on the fair and respectful treatment of enemies and allies. In contrast to many contemporary guides to warfare from [Concept('aversaria','Aversaria')|E], the Eosian Sword Charter strongly focuses on respect, mercy, and the protection of the weak as 'righteous' ways to follow one's life and reach perfection as a warrior and as the personification of bravery."

 masuherid_tribe_and_their_ways_title: "An Account of the Masuherid Tribe and Their Ways"
 masuherid_tribe_and_their_ways_desc: "A book written by a traveling scribe who dwelt among the Masuherid for several seasons. It records their customs, stories, and daily practices in excruciating detail."

 tablet_of_the_first_dreamers_title: "Tablet of the First Dreamers"
 tablet_of_the_first_dreamers_desc: "A translation of an archaic text, describing a twisted version of Zaoranian mythology where Maiya is counted among [gh_amsari_first_dreamers|E]. The narrative diverges sharply from known Amsari traditions, portraying the Dreamers as central to creation alongside Zaoran. It has been dismissed it as a deliberate lampoon, an eccentric attempt at humor rather than a genuine account of faith."

 compendum_five_fathers_title: "Compendum of the Five Fathers"
 compendum_five_fathers_desc: "A truly massive compendum of the five foundational texts of [GetReligionByKey('wardenism_religion').GetName] - the Pillars of Virtue, the Records of the First Warden's Court, the Book of Days, the Visions and the Marginalia."

 dangerofathousandstars_title: "The Danger of a Thousand Stars"
 dangerofathousandstars_desc: "This book, by an unknown author, seems at first glance to be nothing besides a book of mad ramblings and esoteric conspiracy theories about ancient gods and cruel alien masters. Despite this, many followers of the Forgotten Saint claim that the book was actually penned by Their hand, and many followers carry a copy at all times, believing the Forgotten Saint was an all-seeing being."

 bannediyrossipoetry_title: "Book of Banned Iyrossi Poetry"
 bannediyrossipoetry_desc: "This book is a compilation of a hundred or so poems written by various Iyrossi literati over the breadth of the millennia since their enslavement. The vast majority of the poetry is either incredibly risqué or waxes at great length about the reflection of [Concept('aversaria','Aversarian')|E] blood in [Concept('aervalr','moonlight')|E]. While strictly banned by the Aversarians, it is Iyrossi who have historically destroyed such books, fearing Aversarian retribution against their entire culture."

 aeladaxostoaeliadias_title: "From Aeladaxos to Aeliadias"
 aeladaxostoaeliadias_desc: "This book is a widely printed publication detailing the life of Aautokratia Aeliadias who ruled during the 6th century. While the book covers most of her hundred plus years of rule, her victory over the [Concept('dragons','Dragon')|E] [arthenax|E], her massive magical powers and the massive rebuilding of [aversaria|E] she performed, over half of it is focused upon her famous origins. Primarily, it discusses the rather controversial point of her life, wherein she was born as Aeladaxos, but disliking her station as a male used powerful magics to embrace womanhood.\n\nThe author, one [magi|E] Kalathros, spends much of his time criticizing the detractors of the concept. Kalathros points out that Aeliadias was an Aversarian Magi and performed her transformation completely of her own power and volition, and argues that it should instead be celebrated as a true feat of magic and self-expression."

 compiledworksofvenodau_title: "Compiled Works of Abaël Venodau"
 compiledworksofvenodau_desc: "This book is a compilation of the most popular plays, tales, poems and treatises written by the eccentric 9th century writer Abaël Venodau. The most prominent being the eleven satirical and romantic poems that established the concept of a unified Chevalien identity and of the Fraternity of Chevalie."

 pillarsofaversaria_title: "The Pillars of Aversaria"
 pillarsofaversaria_desc: "Widely regarded as one of the most comprehensive overviews of [Concept('aversaria','Proto-Aversarian')|E] history, this thick tome is a compendum of the chronicles of what were, at the time of its writing in the early 4th century, considered the eleven greatest city-states of Aversarian antiquity — Orasbael ([GetTitleByKey('c_oraispol').GetNameNoTier]), Tylion (Tylossos), Valthronax (Vathassus), Andron (Andryn), Phaelax (Phanurias), Kadmeibael (modern location uncertain), Gortillon (Gortillai), Naucipax (Naupyrna), Phanara (Phanara), Aspomnox (Aspomnos) and Vysbael (Byzaropol)."

 ontheoriginofmankind_title: "On the Origin of Mankind"
 ontheoriginofmankind_desc: "This book covers the ever-ongoing, fiery controversy over whether the [Concept('aversaria','Aversarians')|E] had originated in Palitake or Tower Isle, or at least the status of the debate when the work was issued by the Archailogikos Sokonias in 1125. Though it attempts to take a moderate approach and provides arguments for both stances, a discerning scholar can clearly sense the pro-Palitakian bias."

 ataleoftwocities_title: "The Tale of Two Cities"
 ataleoftwocities_desc: "Part epic, part chronicle, this work follows the thousand odd years of legendary rivalry between the [Concept('aversaria','Proto-Aversarian')|E] city-states of Valthronax and Andron. Starting from their mythical foundation in around 900 BI by two estranged siblings, it goes on to cover the fabled (and likely wildly exaggerated) three hundred years of war between the two thereafter, their opposing roles in the wars of the Crimson-Teal Leagues, their perpetual side switching in the Arakkariac invasion, their simultaneous betrayals of Parthe'naxa at Kallane due to the mistaken belief that she was conspiring with one against the other, and finally their downfall to Dhace'nox's armies in 7 BI, who had beforehand tricked both into fighting the other."

 parthenaxiada_title: "Parthenaxiada"
 parthenaxiada_desc: "A biography of the early first century BI warlord-sorceress Parthe'naxa, and a chronicle of the four wars that would come to bear her name. After a brief introduction of her relatively obscure origins, it starts the action in earnest with her 91 BI coup in Phanara, her subsequent conquest of most of Tower Isle in the ensuing first and second Parthenaxic wars, her invasion of Palitake in 79 BI in the third, her defeat at Kallane four years afterward and exile, her miraculous and brilliant return to power in 73 BI and finally, ultimate defeat and suicide at the Amis River in 68 BI.\n\nThough her attempt to unite the warring [Concept('aversaria','Proto-Aversarian')|E] poli would come to naught, the two decades of unabated warfare and chaos would be the effective nail in the coffin to the already declining [Glossary('city-state','GH_POLISOCRACY_GLOSS')] system, and would lay the groundwork for Dhace'nox's own unification."

 edgeoftheworld_title: "The World's Edge"
 edgeoftheworld_desc: "Tylo'nax, perhaps the most legendary corsair in all [Concept('aversaria','Aversarian')|E] history, supposedly painted the coasts of the world red two thousand years ago, before swindling the Ranthus archipelago from its natives and founding his namesake city there. Though the myths surrounding his countless adventures are almost certainly an amalgam of various tales accrued in the vast timeframe between his supposed reign and their compilation, and his very existence rests upon dubious evidence at best, the fantastic stories have remained popular throughout history."

 ninetysixtasks_title: "Ninety-Six Tasks of Nauci'axa"
 ninetysixtasks_desc: "A beautiful, flowery poem retelling the legendary ninety-six tasks undertaken by the unnamed hero who sought the demi-goddess Nauci'axa's hand in marriage in the distant dawn of time, before supposedly founding a family — and the city of Naucipax (modern Naupyrna), with her. At various points joyful, heart-wrenching, grim, and in places outright bizarre and seemingly disjointed, the work is widely lauded as one of the crowning jewels of [Concept('aversaria','Aversarian')|E] literature. Notably, many of the tasks recorded within are, in fact, rituals of power used by Magi to this very day."

 natureofmatter_title: "Treatise on the Nature of Matter"
 natureofmatter_desc: "A rare collection of the surviving works of Khaci'aex, an enigmatic fourth century BI Aspomnox philosopher, mathematician and [magi|E]. Originally from Vysbael, his unorthodox school of thought preached a controversial dogma that eventually saw his flight to nearby Aspomnox, whose liberal rulers were more content with allowing him to teach his doctrine in peace. Today, he is mostly remembered for his role in founding the earliest known academy that exclusively studied what would become [dead_magic|E], and Aspomnox would continue to hold the distinction of being the only major [Concept('aversaria','proto-Aversarian')|E] [Glossary('city-state','GH_POLISOCRACY_GLOSS')] to primarily utilize it rather than [living_magic|E] for the rest of its independent history."

 ruleofmany_title: "Rule of Many"
 ruleofmany_desc: "An analysis and praise of the curious political system of [Concept('aversaria','Proto-Aversarian')|E] [Glossary('polis','GH_POLISOCRACY_GLOSS')] of Naupyrna, written by a local aristocrat known as Kleistha'nax, likely in the late first century BI. Centuries of rule by the Aestraex dynasty were brought to an end in 421 BI when the city's last monarch, the vicious, insane and likely cannibalistic Dioxa'nex the Younger was toppled in a bloody coup that saw his entire line perish. After being unable to decide upon a successor, the citizenry instead decided to pick a ruler from their ranks by gathering up all [magi|E] and having each cast their vote upon who should take the throne. Thus was elected Eliaxa'cea, a great reformer and the first to bear the title of Arkonir.\n\nAfter a successful 17 year reign, rather than passing the throne to her eldest child as would be the norm, she decided to instead recall the Magi of the city to yet again pick a successor — and thus a 400 year long tradition was born."

 thedragonandthescorpion_title: "The Dragon and the Scorpion"
 thedragonandthescorpion_desc: "An epic retelling of the attempted conquest of the [Concept('aversaria','Proto-Aversarian')|E] world by the Sarradonian Arakkaraic Empire in the late 4th century BI. The tale, while certainly awe-inspiring, doesn't make even a modicum of an attempt at objectivity. The primary enemy general, Naramaššin ad Hadur, breaker of Naucipax, burner of Orasbael, and butcher of Artexis, is especially smeared into near absurdity. Meanwhile, the deeds of the Aversarian defenders are exaggerated to rival those of the First Men themselves."

 arakkariacwar_title: "A History of the Arakkariac War"
 arakkariacwar_desc: "Unlike most other works on the topic, this dry and technical tome attempts to objectively analyze the Arakkariac War, which engulfed most of the [Concept('aversaria','Proto-Aversarian')|E] world from 338 BI to 332 BI.\n\nIt refutes numerous flawed views of the war that grip the popular imagination — for a start, that the Aversarians of the Tower Isle were enslaved and ritually cannibalized after their conquest by the Arakkariacs in 393 BI. Second, that Naramaššin's invasion was completely unjustified, as disproven by the countless records of Orasbaeli, Valthronax, and Tylonic provocations in the years leading up to the conflict. Finally, the assertion that the Arakkariac realm was left shattered and in retreat after the Battle of Paelon Hill, instead painting it as an important, but ultimately relatively small clash that merely proved the unprofitability of continued conflict.\n\nFurthermore, the work posits that the conquest would likely have been successful regardless, had the empire not disintegrated in a bloody civil war after its monarch died in the same year as the battle."

 lostpolis_title: "The Lost Polis"
 lostpolis_desc: "An analysis of one of the greatest mysteries of early [Concept('aversaria','Aversarian')|E] history — the complete disappearance of the hegemonic [Glossary('city-state','GH_POLISOCRACY_GLOSS')] of Kadmeibael sometime during the mid 2nd century BI. The last known record mentioning the city dates to 179 BI and notes no signs of decline or distress, but thereafter the previously major polis simply disappears from all record, forever.\n\nThe name of the settlement is not mentioned again until well into the 3rd century IS when Dioclea of Kacuse is the first to take note of the bizarre historical anomaly. Since then, numerous explanations have been put forward — a magical disaster, the effects of a particularly powerful Gedeora, but also more mundane causes — for example, intentional erasure from living memory after the loss of a war against one of its many rivals.\n\nEither way, its whereabouts remain unknown to this day, fuelling myths that the lost city is home to riches and power beyond human imagining."

 mawtalmunininguide_title: "The Eternal Lord"
 mawtalmunininguide_desc: "Often considered the foundational text for the Mawtalmuninin sect of Ritualists, this morbid tome argues that Death itself is the only true power on [aeras|E]. No other god has ever made themself so well known to the world's people as death has, and whilst anyone can doubt the existence of a diety, only the insane would doubt the existence of death. While suicide is not explicitly mandated — the Mawtalmuninin having not yet figured out how to spread their salvatory message from beyond the grave — the book does encourage living without care for one's continued wellbeing."

 expeditiontothenorth_title: "Expedition to the Northern Source: A Report"
 expeditiontothenorth_desc: "A comprehensive report on the 983 Aversarinas Enosi Cartegraftekon expedition to the source of the [northern_wayline|E]. One of the only three known major attempts to undertake this feat, it is noteworthy due to also being the only one of which records still survive — the 1101 one vanishing without a trace, and records of the 531 expedition by the [Concept('kartharadd','Kartharaddi')|E] going up in cinders with the destruction of the Imperium.\n\nThough it had begun with great optimism, the team of [magi|E] and explorers would rapidly encounter escalating difficulties, a hostile and bleak landscape, rising background magic levels and exposure sickness. Ultimately, the team was forced to turn back several hundred leagues short of their goal, noting that no tower was visible from their location, and concluding that the source might be buried, or of a fundamentally different nature than the Sea Tower, but certainly inaccessible.\n\nDisturbingly, several members of the expedition went delirious by the time the party turned back, and instead pressed on to their almost certain demise."

 howtheendbegan_title: "How The End Began"
 howtheendbegan_desc: "What begins as a mundane military log of Legio XXVI quickly turns into a chaotic assembly of notes, maps, and reports beginning in 1202. Though the frantic handwriting and annotiations are barely legible, it is one of the clearest glimpses into the origin and earliest sightings of the [Concept('the_fog','Fog')|E].\n\nFirst speaking of the sudden appearance of large numbers of hitherto unknown tribal peoples from the continental interior, it then analyzes the bizarre and confused reports given by captives, and finally the first sightings of the phenomenon itself in 1203. The author, presumably the Legon, shines lights on his attempts to warn the government in [GetTitleByKey('c_oraispol').GetNameNoTier] of the oncoming threat, only to receive silence at best, or outright mockery and accusations of treason at worst.\n\nThe final report is dated to 1221, the writer apparently having been mortally wounded during a battle against hirtherto-uncontacted tribals marching northwards for some unknown purpose. The very last passage records the vow given by all present to no longer serve the whims of any petty Aautokratir, but the interests of all humanity, and that the only enemy they shall know henceforth will be no man, but the corrupting embrace of the Fog itself."

 refutation_of_the_phantasmal_mist_title: "A Refutation of the Phantasmal Mist"
 refutation_of_the_phantasmal_mist_desc: "An official inquiry by the [mayikrata|E] into the then newly emergent [Concept('the_fog','Fog')|E], written in 1211 by a certain Master Procopion. To say that the matter is treated lightly would be an understatement, with the tone being more akin to a jape than an academic text.\n\nThe bulk of the work consists of a point by point refutation of the increasingly frantic pleas for support by Legon Iolianos of Legio XXVI 'Exodian', sent to both the [GetTitleByKey('e_mayikrata').GetNameNoTier] itself and the Aeschraeist administration of [GetTitleByKey('c_oraispol').GetNameNoTier]. Procopion's main arguments against the existence of the Fog are the unreliability of tribal witnesses, the intristic absurdity of a magical phenomenon not apparently associated with either the Living or Dead schools, the ability to ascribe many of the strange events sighted to more mundane reasons, and Iolianos' alleged Axiaotheaist sympathies. The idea of allowing barbarian tribes to migrate into [Concept('aversaria','Aversaria')|E] proper is treated with special mockery.\n\nNeedless to say, the work did not age well, and the [GetTitleByKey('e_mayikrata').GetNameNoTier] has quietly disowned it and Master Procopion a few decades after its publication."

 inquiryintothefog_title: "An Official Inquiry into the Matters of the Fog"
 inquiryintothefog_desc: "After Master Procopion's work was quietly blacklisted in 1235, the [mayikrata|E] launched yet another inquiry into the nature of the [Concept('the_fog','Fog')|E], this time far more serious. In stark contrast to the previous edition, it never attempts to deny or even downplay its existence, and though the tone does its best to stay cold and academical, there are undeniable hints of urgency between the lines.\n\nThe booklet reports that all attempts by Magi sent out into Greater Aversaria to stall the Fog had been met with total failure, and that studies of its nature and origin yielded little information. Furthermore, it confirms previously unverified reports of tribal humans dwelling within, but remarks that all attempts at communication were met with hostility, and that the single living captive — who was virtually constantly attempting to commit suicide until they succeeded — spoke no language known to scholars or barbarian interpreters.\n\nFinally, it touches upon the rumours of a newly emergent, third school of magic associated with the Fog and used by tribal Magi, but makes no definitive judgement here, claiming that the current evidence is inconclusive at best."

 clockworkcity_title: "The Clockwork City"
 clockworkcity_desc: "The travelogues of the Chevalien waypriest Climent of Vascount, who received rare permission from the Kartharadd Imperator to visit their throne city in 427 IS. The descriptions are almost utopian, speaking of a happy, loyal populace working in unison for the glory of their sovereign. Of course, this picture is in stark contrast with anything even unbiased scholars would say about the living conditions of the Imperium, leading many to dismiss the book as nothing but a propaganda piece written by Climent to ingratiate himself with his patron.\n\nOf much greater interest to the common reader, however, are the rather fascinating pages that talk about the city itself — an impressive metropole of marble and brass, with clockwork automata seemingly integrated into every facet of life. The credibility of these parts of the book have never been in question, for the Kartharaddi were widely known for their mastery of clockwork machinery.\n\nCuriously, though it would seem that the work originally referenced the name of the city several times, it is actually impossible to read these specific words. Depending on the reader, they are either simply blank gaps in the text, or garbled beyond recognition."

 annalsofblank_title: "The Annals and Lineages of ---------"
 annalsofblank_desc: "Widely postulated to have been the official history of the rulers of the Kartharaddi, the book is now practically worthless, as magical influences have rendered it completely devoid of useful information. Its contents vary based on the reader — some report that it is simply filled with nothing but blank pages, others that it is written in a language or script completely unknown to them, while another group claim that while the words are in their own tongue, the text seems to just be garbled nonsense with no discernible rhyme or reason, and that attempting to make sense of them leads to a splitting headache and feelings of nausea."

 whenaervalbleed_title: "When Aervalr Bled"
 whenaervalbleed_desc: "Written in 773 by retired [magi|E] and veteran of the [Concept('kartharadd','Kartharaddi')|E] wars, Periaxis Leisistratos, the book is an analysis of the infamous events of the night of [Concept('night_of_the_bleeding_moon','23rd of Velde 748')|E], of which the author was a firsthand witness of himself. Part of a legion sent deep into Kartharaddi territory at the time of the catastrophe, he describes the rapid death, and writhing agony that preceded it, of almost the entire Imperium in harrowing detail matched by virtually no other work.\n\nHe also goes on to cast doubts on the claims that the [Concept('aversaria','Aautokrata')|E] had caused the attack itself. In the two decades following the night, despite seeking information from countless Magi and higher-ups in the army, he has never actually located anyone that was aware of what would happen on that fateful day in advance — in fact, all of Aversaria's forces were seemingly caught completely flat-footed. Instead, Periaxis posits that what transpired was actually an attempt at a massive magical attack upon the Empire itself, and that the cataclysm was in fact intended for Etepezea, but failed for reasons unkown."

 treatiseofgoodpractice_title: "The Treatise of Good Practice"
 treatiseofgoodpractice_desc: "This treatise is the guiding book which establishes the generally accepted good standard for the education of [magi|E] in [aversaria|E] under the [mayikrata|E] teaching system. Initially written alongside the Concordial Pact after the [chaos_of_the_seventh_century|E], it has since seen nearly 400 official revisions by the [mayikrata|E] over the years, and serves as an incredibly detailed guideline for the science of magic and the best practices in the teachings of it."

 chevalienknightinoraispol_title: "A Chevalien Knight in Oraispol, 1262"
 chevalienknightinoraispol_desc: "A [Concept('marchers','Chevalien')|E] Knight in Oraispol, 1262, is a fantasy story by Chevalien scholar Mitheux Chridae imagining a Marcher knight named Maduex den va Chrisay in [GetTitleByKey('c_oraispol').GetNameNoTier] as the Sjalvolki conquer [Concept('aversaria','Aversaria')|E] around it. Maduex is exceptionally skilled with a blade, sharp with his tongue and wit, and stalwart of heart and in devotion to his Path, and battles evil Aversarian [magi|E] and warlords before joining the Sjalvolki to aid them in their fights. Maduex soon rises up the ranks, becomes the greatest of comrades with the Witch-Breaker himself, and then converts him to the [lifepath|E] and becomes his Wayfather.\n\nThe most popular of Mitheux's works, the idea of imagining a history that isn't proved novel enough for the obvious... oddities in the narrative to be ignored, and it has since become popular for troubadors to reenact. Its popularity proved so great that it caused several Wayfathers to even attempt to travel with and convert the Sjalvolki themselves, to mixed results."

 witchbreakerhero_title: "The Witch-Breaker, Hero of Heroes!"
 witchbreakerhero_desc: "This book, written by Chevalien scholar Mitheux Chridae during his long journeys with the Sjalvolki in an attempt to learn more about their culture, serves as a biography of Cenware Witch-Breaker for contemporary Marcher readers. The foreword claims that all information was provided by the Witch-Breaker himself, along with his contemporaries, and follows him from the legendary Dovahking in which he singlehandedly defeated all opposition (including his own brother) without killing a single man to claim his tribe to the Battle of the Elysian Pass where Chridade ended his journeys with the Sjalvolki.\n\nExtolling praise at nearly every possible moment, and containing several tales that are seemingly complete fantasy, Mitheux goes so far as to even add a chapter about how great a ruler he imagines Cenware would be and to fantasize about what it would be like to have him as a personal friend. Normally derided for such things, it nonetheless has received scholarly notice as the most notable contemporary attempt to document the legendary figure's life."

 sjalvolkipoetry_title: "Book of Sjalvolki Poetry"
 sjalvolkipoetry_desc: "A book of Sjalvolki poetry written by the Chevalien scholar Mitheux Chridae as part of his series of books detailing his journies with the Sjalvolki peoples during their invasions of [aversaria|E], each chapter provides a collection of a different tribe's poetry. Unlike the poetry of most western cultures, Sjalvolki poetry tends to take the form of battlefield poetry (or, as the Sjalvolki have taken a liking to ships, sailing poetry), and tends to be rather anarchic in structure and prose. Still, many of the verses remain inciteful or bely an oft ignored thoughtfulness to many of the Sjalvolki warlords, with several poems by Cenware Witch-Breaker himself especially standing out, especially a surprisingly melancholy composition from the Elysian Pass."

 bookofthefallen_title: "Book of the Fallen"
 bookofthefallen_desc: "The ledger is a listing of every name carved into the walls of the Crucible, the principle fortress on the border of [chevalie|E] and the [the_lichdoms|E]. It is customary for the comrades of fallen [antimagi|E] and soldiers who give their lives at the location to etch their names into the wall, sometimes with a short few words about them, and many pieces of Marcher poetry or literature discuss the wall in detail or use it as a metaphorical device. This booklet however, nearly 200 pages in length, eschews this to simply detail every name and any other sentences connected to it. While of little value to the casual reader, simply remarking upon its pages is quite the sobering experience."

 jacotwaldisse_title: "The Life of Jacot den va Waldisse"
 jacotwaldisse_desc: "The Life of Jacot den va Waldisse is a relatively short book discussing the Marcher [antimagi|E] Jacot den va Waldisse's life from humble beginnings as the son of a miller in a destitute village to their refusal to accept their lord's attempts to restrict their Pathchoice and harried escape to the Crucible to join the Orders and the Path of Nullification to his fighting in and death during the Red River War. Told by a contemporary, Jacot's comrade and believed best friend Sir Michael Vavassky, the book is considered a classic of Marcher poetry and comradery. Vavassky's loss and sadness at Jacot's horrible death at the hands of the Arch-Lich Silas Stavro — Jacot having given his life to ensure the Lich was distracted away from several wounded men (Vavassky included)—evident in every sentence and stanza of poetry added to break up each chapter.\n\nModern scholars have suggested that Jacot and Vavassky had a far closer relationship than friendship, though this remains highly controversial."

 delenelbook_title: "The Lilac Grove by Karthyn Delenel"
 delenelbook_desc: "This work is a first draft for a series of romance poetry written by legendarily brutal [Concept('aversaria','Aversarian')|E] warlord Legon [karthyn_delenel|E] of the Legio XIV 'Chain-Forgers'. Known for his horrible brutality, mentorship of Aversarian warlord Gorassos, and loyalty to Aautokratir Aeschraes (commonly known as the 'Lord of the Ashes'), this work seems to have been in progress sometime around when he was mortally wounded by Legan Isacea of Legio XXI 'Axiaothea' and his final execution by his pupil Gorassos.\n\nWhile A Lilac Grove is often crudely written and filled with multiple spelling and grammar mistakes, if one were to read it not knowing its author, they would most likely find it an exceptionally tender and heart felt series of tales with a masterful ability to control emotions through prose. Many readers would no doubt struggle not to cry as the young maiden who serves as the protagonist for many of the works struggles with her feelings of self doubt and discovery, especially as she falls in love with her best friend, the female Magi Anatheama. Readers would also be infuriated by the final poem, marked as the second to last, where Jadiaxa (the protagonist) resolves to beg Anatheama to run away with her as their village is consumed by the [Concept('the_fog','Fog')|E]... only for the works to end there, [karthyn_delenel|E] likely killed before he could finish the work."

 redlandsadventure_title: "Adventure in the Redlands"
 redlandsadventure_desc: "This book was published in the early 1100s IS by a possibly-fictional adventurer known as Lexenir, and claims to detail his journey through the Redlands of southern Aironoi. It paints a vivid picture of mysterious cults roaming the wastes, abducting the innocent for use in mysterious and sinister rituals to serve dark purposes. It tells of Lexenir's encounters with no less than 11 different cults, each of which possessed their own strange and violent traditions. These traditions, which range from ritual cannibalism to human sacrifice to drinking the blood of Redrunner settlers, are described in excruciating detail, as is his heroism in saving people from such terrible fates. The people of the Redlands are described in ways that make them sound less than human, claiming that they hide themselves during the day due to the sun's deadly light. \n\nThe book is accompanied by a series of drawings, which Lexanir claims are traditional Redlander art, consisting of complicated patterns of shapes, arranged so that they seem to suggest great monsters in their curving, spiraling lines. The book was received with mixed acclaim, and many have claimed that Lexenir, and his story, are both fabrications. Nonetheless it provides those who live across the far-flung Empire a taste of the mysterious Redlands."

 fourlodges_title: "The Four [lodges|E]"
 fourlodges_desc: "Written in the late 1100s IS by a Damotan scholar known solely as Mekha, The Four [lodges|E] is a history of the major social organizations that define Damotan life. The bulk of the book is focused on a detailed exploration of the events that gradually shifted the [Concept('lodges','Rayakuux Orders')|E] into the specialized social groupings they are today. From their foundation in 572 IS under Boqqar Datesh of the [olani_dynasty|E], to their subsequent role in the Second [tetenik|E], Mekha explores their initial functions and procedures, and how exactly they first became embroiled in politics on both the local and regional scale. Then, the writing focuses on the local scale, with the gradual divergence of individual chapters from the original mission, their official split in 682 IS being described as a mere confirmation. It then traces their roles as the [Concept('boqqarut_damotada','Boqqarut')|E] declined, with their powers growing at the expense of the state, and explains how by the time of the Third [tetenik|E], several large [lodges|E] had effectively ceased following all but the most direct orders. According to Mekha, the [zalreb_dynasty|E] was practically irrelevant, and the [etami_tetenik|E] was largely the result of their erosion of centralized power, an interpretation which is seen as controversial at best, though the work is well-respected in general."

 journalofseekers_title: "The Journal of Seekers"
 journalofseekers_desc: "The Journal of Seekers is not a single journal, but rather a compilation of various notable excerpts gathered by the Mogowai on their journeys to far-flung corners of the world. A new edition is released every 50 years, with the primary source of the journals being the library within the Irōchi Damotada, where the collected writings of all those who have journeyed north are stored. This particular version was first compiled in 1239, and features tales of widespread devastation in the wake of [frodbrokna|E]. A large portion is dedicated to the ongoing bloody struggle between the Agionists and Wardenites, with several eyewitness accounts of major battles, and even an interview with the Wardenite Mamur about the situation, in which he outlines a methodical approach. This interview is contrasted with the woe of another traveler, telling of their several near-death experiences while hiding from the Order of the Blind Watcher. In addition, it tells of the courts of various [Concept('aversaria','Aversarian')|E] warlords, such as the writings of a traveler who was present with Legio XXI 'Axiaotheia' during their campaign against Aeschraes, the man who brought down their empire. The Chevaliens concern almost all of the volume's remaining contents, with the story of a single man's adventure with a mercenary company in Beid Faluh."

 godslaverdictations_fix_title: "Personal Dictations of Chernivmala Cheskovara"
 godslaverdictations_fix_desc: "This tome is a Chevalien copy of the recovered 'personal dictations' of [Concept('kartharadd','Kartharaddi')|E] [Concept('liches','Lich')|E] Chernivmala 'God-Slaver' Cheskovara. Achieving Lichdom in the 7th century after journeying north and escaping her people, Cheskovara would proceed to become one of the Lichdoms many 'minor Liches', who spent most of her time struggling to carve out a necropolis and fight petty territorial wars with neighboring Liches without ever amassing enough power to mount a proper invasion south.\n\nThis memoir was likely written by several undead servants who, judging by several pages filled with curses and angered rebuttals of their 'brainless idiocy', were resurrected just to constantly follow Chernivmala and write down her words. On page twelve of over two thousand (though half of them have long been lost and forgotten due to most scholars considering the writing to be 'subpar'), the Lich states that this is because 'My glorious words will one day be beautiful holy texts! The people will worship me as divinity once I cast down their pathetic Gods! They must have their scripture! My words shall not be lost to history!'\n\nThe text was recovered by [antimagi|E] Sir Krenaud den Vy, who ventured north with the knightly Peti Gisreddean band of 'the Companions of the Winking Rose', and assaulted Cheskovara in her fortress of 'Everblight'. While they of course ensured the tale sounded suitably epic, a technical reading of their reports and a cross-referencing of the various accounts make it clear that Cheskovara was already seemingly on the verge of death when they found her, and her army had largely been destroyed earlier, as mentioned in several passages."

 thekardwenwhatweknow_title: "The Kardwen: What We Know"
 thekardwenwhatweknow_desc: "This report was written by Legan Cromus Rex on his encounters with the strange Kardwen. Previously thought just fabrications of the superstitous Sjalvolki, this report was the first official acknowledgement of the people by any form of [Concept('aversaria','Imperial')|E] authority. It starts by describing the arrival of a strange man to the Aversarian camp, wearing a cloak made from the sewn together wings of crows and using the antler of an elk as a walking stick. He then from his hilt lifted the severed head of a soldier who had dissapeared only a week beforehand. Seeing it as somekind of threat Cromus strucked the man dead where he stood. This was infact a mere gesture of reconciliation, Kardwen often exchange the heads of the fallen so that their spirits may enter the afterlife. This act, would unleash the wrath of the previously unknown Kardwen and result in the disastrous defeat of Legio XXIII.\n\nSent to the Aautokratir during the height of this conflict, Cromus depicts harrowing scenes on the frontier. Bodies gnawed to the bone hanging from every tree and men simply vanishing as they slept being common themes. Perhaps most unsettling of all, however, is the very tongue of the Kardwen themselves, which resembles the wind blowing through the trees and never rises above the volume of a whisper even when pleading for mercy."

 dethediaxnotes_title: "Personal Notes of Legan Dethediax"
 dethediaxnotes_desc: "This set of scrolls served as the personal notes of Legan Dethediax during her conquest and rule of the Iyrossi valley. While much of it involves the creation and theorizing of her 'Dethediaxian Law' that would govern the valley thereafter, numerous other sections deal with daily life, managing her legions, and dealing with then Aautokratir Phanagorax.\n\nWhile nothing in these texts show Dethediax as having any doubts in the [Concept('aversaria','Aversarian')|E] cause, it nonetheless shows no small amount of sympathy for the Iyrossi, and an especially large amount of hatred for Phanagorax himself. Several passages go so far as to call the Aautokratir a 'blithering idiot' who was 'in more danger of ending our rule in the valley as the Iyrossi'. An especially interesting passage details several small rebellions Dethediax was forced to negotiate or put down in secret to avoid an idiotic response from [GetTitleByKey('c_oraispol').GetNameNoTier], putting the common concept of the Iyrossi's 1000 years of servitude into question. Even more interesting is a quick mention of the 'children of Pothacleas', whom Dethediax apparently had smuggled away into the mountains in order to quell a rather large scale uprising around them."

 dethediaxiancodex_title: "Dethediaxian Codex"
 dethediaxiancodex_desc: "This codex contains the majority of Dethediaxian Law, the governing set of laws and mandates that largely regulated the treatment of the Iyrossi after their conquest in 200 IS by Aautokratir Phanagorax and Legan Dethediax. While obviously quite outdated now, it is nonetheless a masterwork in law and rulership, and is considered one of the world's crowning achievements in rulership."

 bluerobetreatise_title: "Blue Robe Treatise"
 bluerobetreatise_desc: "This scroll is a copy of the original 37-page treatise penned by Magister Velaras 'Bleak Speaker' Kreyshati at the onset of the [blue_robe_revolt|E]. He announces the Mayikprolollan Aironoiakaan's outright refusal to do further research on [selfreplicating_blood_magic|E], stating that no [Concept('aversaria','Aversarian')|E] [magi|E] would be ordered like a dog, even at the behest of a petty aautokratia.\n\nThe treatise further stated that henceforth, the academy declares neutrality in the [imperial_civil_war|E], and implored all Aversarian citizens to resist any attempt to force them out of their stronghold. It is said that the treatise, as well as the actions, of the so-called Blue Robes sent Axiaothea into such a rage that she tore down the six century old Lavaticas quarters of her estate in Asiupoli, and ordered four legions to assault the Aironoiakaan, thus starting hostilities in earnest."

 boqqarofknives_title: "Raleri: The Boqqar of Knives"
 boqqarofknives_desc: "First published in 853 IS, The Boqqar of Knives is a biography of one of the [boqqarut_damotada|E]'s most famed, and feared, rulers. The book covers the entirety of his publicly-known life, from his childhood in the Tabik Bētemisīt, to his sudden and unexpected ascendance to the throne, to the following decades of intrigue and secrecy, concluding with his death in 817 IS. More famously, however, is the books focus on unconfirmable theories and speculation about the unknowns of his life, addressing and even inventing rumors of his countless secret plots and many murders, stringing together the untimely demises of his rivals, and painting an incredibly believable picture of a shadowy puppetmaster pulling Damota on his strings.\n\nWhen published, the book was endorsed by Boqqar Kayoba, who sought to use its unflattering portrayal of his much-hated grandfather to distance himself from his shadow. Often considered the last great work of the [Concept('boqqarut_damotada','Boqqarut')|E], the tale told of Raleri within its pages is the narrative which history has chosen to believe."

 the_aaimorgeneia_title: "The Aaimorgeneia"
 the_aaimorgeneia_desc: "The Aaimorgeneia is a twelfth-century Aversarian political and social treatise by the then-famous philosopher Ameon Maphonas, espousing the idea of likening the only – from the author's perspective – empire of humankind to a family unit.\n\nDenouncing the thoroughly dismantled post-Dikaynosian Aversarian legal system, it instead argues for a stratified society governed exclusively through pseudo-familial relationships and filial piety. In such a system, castes were to be done away with and replaced by a linear chain of parent-child subordination, with pure-blooded Aversarians at the top and sanctioned sister races and peoples toward the bottom as house slaves (pets in some translations).\n\nThe treatise received mixed feedback upon publication, with many critics denouncing Ameon's liberal outlook and ideas."

 enchiridion_tharsanese_of_kasathox_title: "Enchiridion Tharsanese of Kasathox"
 enchiridion_tharsanese_of_kasathox_desc: "An extensive collation of Theyssianic alchemical formulae, principles and rituals compiled at [GetBuilding('01_tur_senach').GetName] during the waning years of the Arch-Magistracy of Kasathox; ultimately the most widespread work on the subject in [aversaria|E] on account of [theyssian_scrivenery_network|E] circulation."

