  ####AREA
  
  ###GENERAL
  
  ##LORE
  game_concept_tilolan:89 "Tilolan System"
  game_concept_tilolan_desc:89 "Tilolan, in the Banwagul language, means 'wholehearted obedience' and also refers to a Banwagul social institution. When [naklan_the_golden|E] was crowned as the first Emperor of the Banwagul people within [GetBuilding('02_dawang_tarmak').GetName], he demanded that all Banwagul lords, near and far, journey to his palace to pay homage and demonstrate their personal loyalty to him. Subsequent generations of monarchs emulated this practice to display their authority, which ultimately evolved into a convention of  Dahangon Empire.\n\n Every summer, lords from across the land would make the long journey to Dawang Tarmak and reside there for one to three months. During this time, the Emperor himself would receive these lords, hear their reports, and judge whether they had ruled their domains diligently and faithfully. On the rare occasions when the imperial throne was vacant, lords would instead journey to the palace of their liege lord (the highest-ranking lord they owed allegiance to) to pay homage. Regardless of whom they paid homage to, any lord failing to fulfill this obligation of attendance was considered a rebel."
  
  #EVENTS
  
  game_concept_ancient_shrunfan_era:89 "Ancient Shrunfan Era"
  game_concept_ancient_shrunfan_era_desc:89 "The Saelaians are thought to have arrived in the Southland some seven centuries before the dawn of the common era, sailing across the turbulent Xuming Sea in primitive vessels and dispersing first on the coast itself, and then increasingly along the Kirangi River as well. For eight hundred years, they would battle with the ever-dwindling indigenous peoples of the basin, the mighty Mutande of the northern highlands, and—most of all—each other.  \n\n The seeds of the Shrunfan Era would be sown 120 IS, when two events of incredible consequence happened in the span of the same year, though the import of only one would be immediately apparent. Bhumiraja, the greatest of the Mutarde powers, would be devoured by lava in a fiery magical cataclysm of its own making. In its place, a mountain of flame and brimstone would rise, bathing the entire region in ash and darkness; the ensuing chain reaction of famine, anarchy and migrations would cause chaos as far as the distant coasts, but the Mutande in particular would be left broken and disunited, reduced to easy pickings for the now-inevitable final ascent of the Saelaians: for in that very same fateful year, in a city-state on the banks of the Kirangi that until that point had no glory nor power to speak of, a prodigious young prince known as Ru would take the helm of rulership from his regent-mother. And not long after, he would set upon a campaign to finally unite the warring polities of the basin under the banner of his Shrunfan Kingdom. \n\n Those Saelaian cities and Mutande remnants that did not submit to Ru by diplomacy would be faced with the unenviable, and apparently impossible, ordeal of defeating his armies in battle; though the Shrunfan hosts were neither particularly impressive in scale nor equipment, the martial genius of their leader was so impeccable that they would allegedly never lose a single engagement, no matter how lopsided. After 17 years, Ru's undertaking would finally be complete, and his polity stretched from the Dahangon Wetlands to the Fengming Mountains. He would adopt the title of "God-King", ushering in the Radiant Age of the Southlands. Peace reigned, wealth flowed, art blossomed, and great feats of architecture rose across the kingdom. \n\n Yet despite all his pretensions, Ru was not immortal. As his own life entered first its dusk, and then its twilight, so too did the fortunes of the Radiant Age begin to sink below the horizon and the cracks upon his realm's foundation had already begun to form. When, after ten thousand and one sunsets, the God-King's spirit finally departed his body—according to his priesthood, to the distant dome at the edge of the sea, where he would rule eternally—night finally set upon the kingdom. The Radiant Age had ended, and now his successors would be left to violently vie for the heavenly throne in the darkness of the [age_of_strife|E]."
  game_concept_the_bloody_banquet:89 "The Bloody Banquet"
  game_concept_the_bloody_banquet_desc:89 "When Ru died, several of his children were not in the capital—they were either in their fiefdoms or on inspection tours. Only his second son, Suwan, remained in the royal city, so he was the first to learn the news. Sensing an opportunity, Suwan, using his authority as a prince, ordered the palace sealed to prevent the news from leaking. He publicly announced that God-King Ru's health had slightly improved and summoned the princes back to the capital for a celebratory banquet. Privately, he mobilized his trusted guards to prepare a coup, intending to seize the throne by force. \n\n By the end of Ru's reign, internal strife was already emerging within the Shrunfan Kingdom, with factions forming around different princes vying for succession. Suwan's movements were quickly detected by other factions, allowing the other princes to receive advance warning and prepare for the worst. \n\n As armies were normally forbidden from entering the palace, the princes arrived at the banquet with only a few personal guards. Suwan set an ambush within the palace, attempting to kill the other princes during the feast. However, his plan failed. Military forces from different factions soon arrived at the palace and began fighting. The entire capital turned into a vast battlefield, blood staining every inch of land. Legend says it took three days and nights of rain to wash the blood from the streets. In the end, several princes, including Suwan, were killed, along with many capital officials and nobles. The surviving princes retreated to their respective fiefdoms to prepare for the next round of conflict. \n\n This failed coup not only weakened the royal family's direct power but, more importantly, shattered the existing order. The kingdom's vassals and loyal tribes either joined a faction, remained undecided while waiting for the best offer, or simply closed their borders and stayed out of the conflict. The Shrunfan Kingdom fractured into countless hostile regimes, ushering in a century-long period of warlord rivalry."
  game_concept_age_of_strife:89 "Age of Strife"
  game_concept_age_of_strife_desc:89 "Due to the Angkaontara (meaning 'Fountain of Knowledge' a great library established during Ru's reign) being burned down in the chaos, the history of the Age of Strife is unclear. It wasn't until the 11th century, when the Kathuni scholar Tu Su compiled records from various Southsea regions into the 'Annals of the Southern Regions' that people gained some understanding of this period. \n\n The start of the Age of Strife is widely considered to be the [the_bloody_banquet|E] incident, which marked the end of the old Shrunfan Kingdom system. Nobles began to derive their legitimacy from their own military strength rather than royal appointment. Initially, the conflict remained among the royal family members, primarily fought by forces loyal to the various heirs. The heirs relied on their fiefdoms, using political and diplomatic means to win over local powerholders. Although the nobility had gained considerable autonomy in military and internal affairs, with this trend gradually expanding, overall, they still remained subordinate to the rule of the various heirs. \n\n As time passed, the remaining royal power dwindled. Royal family members were gradually marginalized, becoming mere puppets. Their former supporters transformed into warlords, who cared less about eliminating rival heirs and more about using the royal name to strengthen their own power. The royal descendants could only watch like caged canaries, raised high as banners by the warlords. Through marriage and various unsavory means, these ambitious individuals also ensured their own offspring carried the 'Divine Descendant' bloodline, using this to claim legitimacy. During this period, turmoil intensified further. Clear faction lines disappeared; warlords were driven by benefit, and betrayal and conspiracy became commonplace. The once-lofty royal descendants could only watch as warlords fought in their name. \n\n After the royal family's influence completely vanished, the sacredness of the title 'King' also dissipated. Countless individuals tried to crown themselves King of Shrunfan, comparing themselves to the legendary God-King Ru, such as the famous usurper Dailo. However, their ambitions were too obvious, invariably attracting the united attacks of other warlords, ultimately ending as neglected, broken corpses.\n\n After years of chaos, two main powers gradually emerged. In IS 257, Kaelong, from a frontier tribe, established the Chenka Dynasty with the northern city of Virapara as its core. In 261 IS, on the ruins of the old Shrunfan Kingdom, Queen Chan reunified the Kirangi River basin, founding the Samoy Kingdom. With this, the Age of Strife essentially ended. The Southland entered a period of North-South confrontation, which scholars call the [northern_and_southern_dynasties_period|E]"
  game_concept_northern_and_southern_dynasties_period:89 "Northern and Southern Dynasties Period"
  game_concept_northern_and_southern_dynasties_period_desc:89 "During this period, due to the rough balance of power between the two, although borders frequently shifted, neither could completely destroy the other. Except for the Mahantai Campaign, where Chenka's General Dasuo broke through the Samoy army's defenses and once approached its capital, neither side achieved a decisive victory. This stalemate lasted until the mid-5th century when some Saelaian immigrants crossed the Fengming Mountains and settled in the Cang River Plain. Through contact with local tribes, they learned of a vast empire further north—Kathun-Kai. This was the first contact between the Saelaians and a state from [yizhou|E]. \n\n Via the newly established northern trade routes, many goods from Kathun-Kai flowed into Chenka. The Chenka king quickly recognized Kathun-Kai's wealth and prosperity, submitting to it as a vassal. He hoped to utilize its advanced technology and powerful military to gain an advantage. Regarding this new tributary state, the Dragon Emperor displayed the magnanimity of the Celestial Empire. Kathun-Kai envoys brought weapons and equipment and assisted in training the Chenka army. By learning Kathun-Kai's military tactics, Chenka gradually gained the upper hand in the war, capturing several important cities in the central Southland. To counter this disadvantage, the Samoy Kingdom formed alliances through marriage with chieftains in the Dahangon Wetlands, gaining the support of the local people and using fierce Dahangon warriors to fight the Chenka army. \n\n By the late 5th century, the Chenka monarch was too young, and court affairs gradually fell into the hands of Chancellor Rithisak. Even vassals coming to the capital paid their respects at his residence instead of the palace. Wielding such immense power, Rithisak remained unsatisfied and attempted a coup to seize the throne from the young ruler. This coup, called the [yasong_incident|E] by historians, directly led to the [Concept('southern_campaign_against_chenka_and_the_establishment_of_lanonan','Kathun-Kai invasion')|E]."
  game_concept_yasong_incident:89 "The Yasong Incident"
  game_concept_yasong_incident_desc:89 "In 489 IS, Chancellor Rithisak, believing the situation was ripe, ordered his private army to march from his territory toward the royal capital. They met almost no resistance along the way; even the capital's gates were opened for them. The only holdout was at the palace gates. The guard commander, General Surya—a descendant of a noble family that had served the Chenka royal house for generations—declared he would never compromise with Rithisak. Outnumbered, he was ultimately killed by one of Rithisak's [magi|E]. The remaining guards, unwilling to continue resisting, surrendered, and the palace gates were opened. \n\n However, when Rithisak reached the entrance to the king's chambers, he was blocked by the Kathun-Kai envoy, Ye Hu. Ye Hu furiously denounced Rithisak for his disregard of hierarchy and his attempt to overthrow his superior. He led his retinue to block the chamber door, refusing entry. Neither side yielded. Rithisak, anxious to eliminate the young king fearing delays might bring trouble, ordered his men to swarm forward. They killed the envoy and his twenty-one attendants, then entered the chambers and strangled the young king with a bowstring. The next day, Rithisak hastily usurped the throne and had the remaining royal family members executed."
  game_concept_renshen_calamity:89 "The Renshen Calamity"
  game_concept_renshen_calamity_desc:89 "A few days after the Kathun-Kai forces appeared, while the newly crowned Rithisak was grappling with how to counter this army, a strange, massive dark cloud suddenly gathered over Virapara, blotting out the sun. Then, purple lightning bolts several meters in diameter struck down from the sky onto Rithisak's location within the palace. Subsequently, countless identical bolts of lightning fell, reducing all the residents of Virapara and thousands of towers to ashes along with them. Most scholars believe this was a massive spell cast by the Royal [magi|E] of Kathun-Kai, intended to display the Celestial Empire's power and assert its authority. This magical disaster not only destroyed Virapara; for millennia thereafter, the powerful magical residue failed to dissipate. Dark clouds still linger over the ruins, perpetually casting down thunderbolts, rendering the area uninhabitable and inaccessible."
  game_concept_southern_campaign_against_chenka_and_the_establishment_of_lanonan:89 "The stablishment of Lanonan"
  game_concept_southern_campaign_against_chenka_and_the_establishment_of_lanonan_desc:89 "When news of [yasong_incident|E] reached the north, it caused a great stir throughout Kathun-Kai. According to tradition, the succession of the throne in a state tributary to the Dragon Emperor required the approval of the Kathun-Kai court. Rithisak not only usurped the throne without authorization but also killed an envoy representing the [loen_chaeon|E]'s authority. This was undoubtedly a trampling of the Celestial Empire's prestige. The Dragon Emperor was furious and immediately issued an edict summoning armies from various vassal states to march south at full speed to exterminate this impudent barbarian. \n\n Upon learning this, Rithisak panicked, hastily gathering forces for defense. He even promised territorial concessions to the southern Samoy Kingdom in exchange for military aid. When Kathun-Kai's massive army appeared on the border, the entire Chenka Kingdom trembled with fear. However, what completely shattered the will to resist across Chenka was the Renshen Calamity that befell the capital, Virapara. \n\n Shortly after the [renshen_calamity|E], the Kathun-Kai army launched a fierce attack, crushing the leaderless combined forces of Chenka and Samoy like a tidal wave. Within a month, resistance in all cities was quelled, and the entire territory of Chenka fell. Subsequently, Kathun-Kai established the Lanonan administration to govern the former Chenka lands. Its full title was "The Military Government Command of the Lanonan," ruled by military officials from the Loen Chaeon. Part of the conquering army settled there permanently, becoming the earliest Kathuni immigrants in the region. The Samoy Kingdom henceforth remained the sole inheritor of the Shrunfan legacy, albeit not in the way it might have envisioned. Lanonan replaced Chenka, guarding Kathun-Kai's southern border."
  game_concept_the_southsea_campaign:89 "The Southsea Campaign"
  game_concept_the_southsea_campaign_desc:89 "Around the turn of the 6th and 7th centuries, Kathun-Kai was plagued by a series of internal crises. Its national strength declined daily, and garrison troops from border regions were recalled to the interior to maintain order. Its external influence diminished significantly. The Lanonan region also found itself isolated and without support. The Samoy Kingdom began funding rebellions within Lanonan territory and nibbling away at its borders through small-scale military engagements, gradually encroaching on its land. The depleted Lanonan garrison forces suffered repeated defeats, retaining only a few northernmost cities and teetering on the brink of collapse. \n\n By the mid-7th century, as many internal issues were resolved, Kathun-Kai gradually stabilized. The [loen_chaeon|E] decided to recover the territories lost during the period of internal turmoil. It was in this context that the Southsea Campaign was launched. In 668 IS, Kathun-Kai dispatched a small but elite force composed of battle-hardened veterans and allocated all necessary resources to support this expedition. \n\n In contrast, on the Saelaian side, although the Samoy Kingdom's territory had expanded, its royal authority had continuously weakened. The nation's land was almost entirely carved up by a few major families, and the royal house was reduced to borrowing money just to sustain itself, completely unable to organize an army to fight Kathun-Kai. The Samoy nobles could only muster their private armies for defense. To this end, they assembled a massive force, claimed to number 500,000, to confront the Kathun-Kai army, led by the most prestigious family within Samoy, the Wenyi family. \n\n However, the long-standing contradictions within Samoy did not dissipate with the appearance of an external enemy. Even before Kathun-Kai initiated the Southsea Campaign, several major families were already on the verge of armed conflict against each other. The allied army was fraught with severe internal strife from its inception, with many nobles secretly reaching agreements with the Kathun-Kai forces. Consequently, in 669 IS, after a single failed engagement, the allied army disintegrated due to the conflicting agendas of its members. The remaining forces put up a hasty defense at the capital before fleeing further south, seeking help from the rising power of the Dahangon polity. \n\n The leader of Dahangon at the time was a young and ambitious, capable monarch named Kanlermu. Through a series of reforms, he had enhanced central authority and national strength, subjugating most forces within the Dahangon Wetlands. Eager to consolidate his achievements with a major military victory and truly unify Dahangon, he readily agreed to send troops to aid their ally. He summoned forces from throughout Dahangon, calling on local nobles to provide military support. \n\n The commander of the Kathun-Kai expeditionary force at the time was Yao Qingxian. A follower of the Bynjar faith, he was well-versed in military strategy from a young age and possessed extensive knowledge of warfare. He keenly recognized that the Dahangon army was not an enemy that could be easily routed like previous foes. He preemptively sent spies to spread rumors within the Dahangon camp, claiming that Kanlermu intended to weaken the local nobles by sending their forces to their deaths. This sowed discord within the Dahangon army. He also actively intercepted rear-area intelligence, making Kanlermu believe that nobles in the rear were plotting against him, thereby pressuring him to seek a decisive battle quickly rather than wait for reinforcing troops to arrive. Through these stratagems, he weakened the Dahangon army's effectiveness. \n\n In the summer of 670 IS, after several minor skirmishes, the decisive battle that would determine the fate of the Southsea for centuries to come—[the_battle_of_balinbada|E]—began in the Sakimtud region of eastern Dahangon. On one side was the rising Dahangon hegemon; on the other was the self-proclaimed Celestial Empire, Kathun-Kai. Whoever emerged victorious would alter the developmental trajectory of the entire region."
  game_concept_the_battle_of_balinbada:89 "The Battle of Balinbada"
  game_concept_the_battle_of_balinbada_desc:89 "The Battle of Balinbada can be said to be the last battle of Kathun-Kai in [the_southsea_campaign|E].The battle erupted near the edge of a forest traversed by a river, typical of the Dahangon wetland terrain. Following the rainy season, the ground was muddy and slippery, making it difficult for soldiers to march quickly. The Kathun-Kai forces acted first, sending out a small detachment to hover near the enemy lines, carrying Yao Qingxian's commander's banner to lure an attack. Kanlermu took the bait. Eager for a quick victory, he dispatched all available forces under his command to cross the river and pursue, causing his rear formations to become disconnected from the vanguard. This stretched his battle line thin, leaving only a few personal guards defending Kanlermu himself in the center, creating a critically weak point. \n\n Due to poor reconnaissance, the Dahangon army failed to detect the Kathun-Kai ambush hidden in the woods. At this moment, the ambushing troops charged out. Under the cover of their [magi|E], they assaulted the location of the Dahangon commander, causing massive confusion. Kanlermu himself was momentarily thrown from his horse and knocked unconscious, and the royal standard representing his presence was cut down by the ambushers. The engaged Kathun-Kai troops, following the plan, loudly proclaimed that Kanlermu was dead. The forward troops of the Dahangon army, seeing their ruler's standard disappear and Kathun-Kai banners appearing behind their lines—and combined with the demoralizing effects of the earlier rumors—believed the claims. They hastily retreated back across the river under enemy attack, resulting in many drowning. Even after Kanlermu regained consciousness, attempts to rally the fleeing troops failed. He was forced to break out under the cover of his guards but was killed in the chaotic melee after being trampled by a frenzied war elephant. The Kathun-Kai army pursued the victory, capturing a significant number of local nobles. \n\n After the battle, the Dahangon army was decimated, suffering heavy casualties, while the Kathun-Kai side had only minimal losses from the initial engagement. With their monarch Kanlermu dead and many nobles captured, Dahangon had no means to continue resistance. Various regions submitted upon hearing the news. After the Kathun-Kai army marched to the gates of Dawang Tarmak and a treaty was signed, the entire Dahangon region was essentially declared conquered. \n\n With the campaign concluded, Kathun-Kai's supreme authority in the Southsea was firmly established. The Dragon Emperor created a new administrative body: "The Imperial-mandate Border-pacification Demonstrate-might Grand Protectorate of the Southsea,"abbreviated as the Protectorate of the Southsea, to govern the vast newly incorporated lands under Loen Chaeon's influence. The expeditionary force commander, Yao Qingxian, was appointed the first ruler of this organization due to his military achievements, concurrently holding the position of the 16th Lanonan General."

  #CHARACTERS
  game_concept_nari_daya: "Nari Daya"
  game_concept_nari_daya_desc: "The legendary warrior-queen of the Dayarka, Daya was the eldest daughter of [naklan_the_golden|E], and served as one of his chief advisors during his conquest of Dahangon. An ambitious and capable warrior, the princess contested her nephew's ascension to the throne after the death of Naklan, naming herself Nari, or Queen, and plunging Dahangon into civil war.\n\nDespite her prowess, however, Nari Daya was unable to take the throne, as most of her father's vassals rallied against her for breaking tradition. Wary of losing to a battle of attrition, she instead carved up a realm in the Kharadan mountains, where she established a matriarchal society alongside her most fervent followers."
  
  game_concept_naklan_the_golden: "Naklan the Golden"
  game_concept_naklan: "Naklan"
  game_concept_naklan_the_golden_desc: "A near-mythical ruler of Dahangon, Naklan the Golden is renowned for bringing together the different tribes of the Banwagul into a single empire.\n\nThe subject of many a legend, Naklan is claimed to have built the golden citadel of Dawang Tarmak in a single day that had two nights, as well as allegedly having gained immortality by bathing in the holy river of life.\n\nAfter a reign that lasted for a hundred years — a thousand in some epics — Naklan is said to have walked the path to power, before finally ascending the holy mountain and attaining true divinity."
  
