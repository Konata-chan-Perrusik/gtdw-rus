  game_concept_ratarakaw: "Ratarakaw"
  game_concept_ratarakaw_desc: "Occurring in the middle of the thirteenth century IS, the Ratarakaw is a catastrophe considered in Dahangon to be second only in severity to the [Concept('frodbrokna','Dusapyas')|E]. The disaster began with a sudden shattering of the noontide sky, revealing a lightless void from which a titanic structure fell hurtling towards the southeastern Kharadan mountains. The impact not only flattened the mountain it struck, but also caused severe quakes that tore apart the ancient citadel of Dawang Tarmak.\n\n The calamity also brought an end to the nearly successful uprising of Nalaykan, after the great chieftain was buried beneath the rubble of his own fortress, granting a much-needed reprieve to the beleaguered Kathuni of the Bronzeport."
  
