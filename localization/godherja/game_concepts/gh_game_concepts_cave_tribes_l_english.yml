  game_concept_twist_of_the_tunnels: "Twist of the Tunnels"
  game_concept_twist_of_the_tunnels_desc: "The Twist of the Tunnels was an event recorded in the histories of several separate tribes of the [Concept('mayikrata','underworld')|E], most notably in the histories of the Krothaggi.\n\nWhile the Krothaggi had built a great empire stretching throughout much of the underworld and even reaching some points of the surface, a [Concept('gedeora','magical calamity')|E] would see the world change in moments. Only a scant few regions of the Krothaggi Empire would survive, the tunnels around them twisting in new directions, the stoneworks of their great Empire having crumbled almost to dust seemingly in a moment.\n\nWhile there is no true agreement over what, exactly, the Twist of the Tunnels did to the Krothaggi or the world around them, many priests have claimed that the magics of the event had cast them eons into the future. All of the Krothaggi history since has been dominated by the dream of undoing the Twist, either by returning to the time they belonged, or after the centuries passed and the Krothaggi forgot their empire, by reuniting the kingdoms and spreading across the Underworld anew."
  
