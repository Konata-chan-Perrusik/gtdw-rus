l_english:
 must_hold_key_sarradonian_cities:0 "[GetTitleByKey('c_el_qulatha').GetNameNoTier], [GetTitleByKey('c_sophocene').GetNameNoTier], [GetTitleByKey('c_new_yrim').GetNameNoTier], and [GetTitleByKey('c_kudahhar').GetNameNoTier] must be in your [realm|E]"
 refound_east_mamur_decision:0 "Refound the Eastern Mamuramat"
 refound_east_mamur_decision_desc:0 "Vacant since the violent death of al-Hudi in 802 IS, the Eastern [mamuramat|E] was at one time a second, competing hub for [Concept('wardenism','Wardenite')|E] civilization. Its court at al-Qais was home to a vibrant cultural and legal tradition. Now, with our dominant position in the east we can restore the dignity of this once great land. Of course, doing so will certainly provoke conflict with the Central Mamur who illegally holds the title, but we can deal with him in time."
 refound_east_mamur_decision_tooltip:0 "Proclaim the restoration of the [GetTitleByKey('e_eastern_mamuramat').GetNameNoTier], equivalent in dignity and authority to the line of $mamur_tathtali_link$ Tathtali#!."
 refound_east_mamur_decision_confirm:0 "Become the East Mamur"
 refound_west_mamur_decision:0 "Refound the Western Mamuramat"
 refound_west_mamur_decision_desc:0 "Vacated since the collapse of the ruling House of Qassi in 678 IS and the subsequently permanent assumption of regency by the Central [mamuramat|E] in 682 IS, the [GetTitleByKey('e_western_mamuramat').GetNameNoTier] was the first to disappear as an independent force in [wardenism|E]. Now, after centuries of injustice, we stand prepared to reestablish it once more. Doing this will inevitably put us into conflict with the Central Mamur who holds the title as his birthright, but we are no cowards!"
 refound_west_mamur_decision_tooltip:0 "Restore the [GetTitleByKey('e_western_mamuramat').GetNameNoTier], bulwark against the Hiklahn!"
 refound_west_mamur_decision_confirm:0 "Become the West Mamur"
 refound_far_east_mamur_decision:0 "Refound the Far Eastern Mamuramat"
 refound_far_east_mamur_decision_desc:0 "Though never much liked by its three supposed peers, the Far Eastern [mamuramat|E] was no less legitimate than they. Usun Bishabelik's mission was a holy one undertaken at the request of the [Concept('the_first_warden','First Warden')|E] himself, and claims to the contrary are naught but slander and lies from those who refused to recognize his conversion. Now it is time for us to retake his legacy. Let us push the borders of the faith to distant Kashirya itself, and perhaps even beyond!"
 refound_far_east_mamur_decision_tooltip:0 "Proclaim the [GetTitleByKey('e_far_eastern_mamuramat').GetNameNoTier] and realize Bishabelik's ambitions."
 refound_far_east_mamur_decision_confirm:0 "Forward, til we meet the rising sun itself!"
 found_southern_mamur_decision:0 "Found the Southern Mamuramat"
 found_southern_mamur_decision_desc:0 "For the first time in history, the formerly heathen lands of Damota have been subdued. To maintain control of this southern realm, where once infidels plotted to raise the Dead God, it is time that a new [mamuramat|E] be declared, to insure that these conquests will never slip from our grasps. What the rest of the faith will think of such a proclamation, however, is yet to be seen."
 found_southern_mamur_decision_tooltip:0 "Found the [GetTitleByKey('e_southern_mamuramat').GetNameNoTier], to forevermore guard the southern edge of the faith!"
 found_southern_mamur_decision_confirm:0 "Become the Southern Mamur"
 found_far_western_mamur_decision:0 "Found the Far Western Mamuramat"
 found_far_western_mamur_decision_desc:0 "The great dream of the [Concept('wardenism','Wardenites')|E] — besides defeating the heretic [Concept('ritualism','Ritualists')|E] — has long been to see the west brought into the fold of faith. While the first great effort was halted by the betrayal of the Ayyar, their later conversion and redemption finally set our path right anew. Now, the west is finally united by the [Concept('the_first_warden','First Warden')|E]'s followers, and it is time for a new figure to step forth and lead them! Whether the rest of [sarradon|E] appreciate the arrival of a new Mamur is yet to be seen, however..."
 found_far_western_mamur_decision_tooltip:0 "Found the [GetTitleByKey('e_far_western_mamuramat').GetNameNoTier], and bring law to the sunset realm!"
 found_far_western_mamur_decision_confirm:0 "Become the Far Western Mamur"
 found_new_mamuramat_decision:0 "Found a New Mamuramat"
 found_new_mamuramat_decision_desc:0 "My realm's expansion across distant shores leaves the [Concept('wardenism','Wardenite')|E] faithful I rule over in an odd place. Technically our lands are outside the jurisdiction of any of the traditional [mamuramat|E]s, and many are starting to whisper that I should follow in the footsteps of the legendary Usun Bishabelik and declare myself a the leader of a new Mamuramat. It would certainly be unprecedented, but so is the very existence of a strong Wardenite realm outside of [sarradon|E]."
 found_new_mamuramat_decision_tooltip:0 "Found a completely new Mamuramat, and bring law to distant shores!"
 found_new_mamuramat_decision_confirm:0 "Proclaim a new Mamuramat"
 singular_mamur_faith_becomes_hostile_tt:0 "[GetPlayer.GetFaith.GetName] and [THIS.Faith.GetName] begin to mutually consider each other to be [GetHostilityLevelName( '(int32)2' )|V]"
 GENERIC_MAMURAMAT_NAME:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] Mamuramat"
 
 wardenite_mamur_reclaim_kotserion_decision:0 "A Triumph in Mukhtab!"
 wardenite_mamur_reclaim_kotserion_decision_desc:0 "We have driven the Agionists from Mukhtab — or as they called it in their barbarian tongue, "Kotserion". Our ordeal is far from over, and already the slaves to these saints of sin gather on our borders, ready to drive us back. Nevertheless, the entire [Concept('wardenism','Wardenite')|E] world hails our victory. Our efforts have gone a long way towards restoring the dignity and authority of the [Concept('mamuramat','Mamur')|E]."
 wardenite_mamur_reclaim_kotserion_decision_tt:0 "Provlaim your victory over the Agionists in Mukhtab."
 wardenite_mamur_reclaim_kotserion_decision_confirm:0 "Let the Afazariani tremble!"
 wardenite_mamur_reclaim_kotserion_decision_is_valid:0 "You must own the Kingdom of [GetTitleByKey('k_mukhtab').GetNameNoTier], and ensure there are no independant Agionists in its territory."
 wardenite_mamur_reclaim_decision_reward_1:0 "Will reset your ability to wage holy wars for entire kingdoms"
 wardenite_mamur_reclaim_decision_reward_2:0 "Will give you access to a further triumph once you push deeper into Agionist territory."
 
 wardenite_mamur_reclaim_sianna_decision:0 "A Triumph in Imbira!"
 wardenite_mamur_reclaim_sianna_decision_desc:0 "We have followed up our victory in Mukhtab, driving the Agionists further away from the heartland of the [mamuramat|E]. We are now one step closer to reclaiming the Eastern Island and the site of our faith's birth. Be warned however: while the [Concept('wardenism','Wardenite')|E] faithful rejoice at our continued momentum, the Agionists are likely consolidating their forces to resist us. We must tread carefully moving forward. On the other hand, we may now attempt to reassert our authority over some of the territories lost to the Mamuramat during our long decline."
 wardenite_mamur_reclaim_sianna_decision_tt:0 "Proclaim your victory over the Agionists in Imbira"
 wardenite_mamur_reclaim_sianna_decision_confirm:0 "Drive the Afazariani into the sea!"
 wardenite_mamur_reclaim_sianna_decision_is_valid:0 "You must own the Kingdom of [GetTitleByKey('k_emporia').GetNameNoTier], and ensure there are no independant Agionists in its territory."
 wardenite_mamur_reclaim_sianna_decision_reward_3:0 "Will allow us to demand fealty from the Kathsiti."
 
 wardenite_mamur_reclaim_gahzi_decision:0 "A Triumph in Gahzi!"
 wardenite_mamur_reclaim_gahzi_decision_desc:0 "The Agionists are in disorder. Our victorious armies have swept through Gahzi, putting any who refuse submission to the sword. Though our struggle has been great, only the dregs of their villainous orders remain to resist us. Let them rattle their sabers and ape bravery, they shall die just like their brothers and sisters in arms."
 wardenite_mamur_reclaim_gahzi_decision_tt:0 "Proclaim our victory in Gahzi!"
 wardenite_mamur_reclaim_gahzi_decision_confirm:0 "To the Eastern Isle!"
 wardenite_mamur_reclaim_gahzi_decision_is_valid:0 "You must own the Kingdom of Gahzi, and ensure no independent Agionists survive in its terrotory, or in the Tifrennesh highlands."
 
 wardenite_mamur_reclaim_skiadhadhes_decision:0 "A Triumph in Mohrtag Al-Badi"
 wardenite_mamur_reclaim_skiadhadhes_decision_desc:0 "The Agionists have nearly been driven from the mainland — Praise be to the [Concept('the_first_warden','First Warden')|E] and His Laws! Now only the final push along the coastline remains. Let the masked scum tremble on their stolen island, we shall be there soon enough. In the meantime, this victory has restored the [Concept('mamuramat','Mamur')|E]'s authority to the point that we may be able to reassert our authority over our brothers in faith in the east."
 wardenite_mamur_reclaim_skiadhadhes_decision_tt:0 "Proclaim our victory over the Agionists in Mohrtag al-Badi"
 wardenite_mamur_reclaim_skiadhadhes_decision_confirm:0 "The final victory is at hand!"
 wardenite_mamur_reclaim_skiadhadhes_decision_is_valid:0 "You must own the Kingdom of [GetTitleByKey('k_thaliteia').GetNameNoTier], and ensure no independent Agionists survive in its territory."
 wardenite_mamur_reclaim_skiadhadhes_decision_reward_3:0 "Will allow us to demand fealty from Harthah or his descendants."
 
 wardenite_mamur_reclaim_chegea_decision:0 "A Beachhead on the Eastern Isle"
 wardenite_mamur_reclaim_chegea_decision_desc:0 "The final reckoning of the Agionists is at hand. The followers of the so called "Forgotten Saint", the last Agionists standing, have tasted our vengeance on the beaches of Dhami. Though there may be years of bitter fighting ahead of us, we have proven that their heathen armies are no match for our virtue and courage. Forward, to the Warden's Prison itself!"
 wardenite_mamur_reclaim_chegea_decision_tt:0 "Let us begin the final struggle!"
 wardenite_mamur_reclaim_chegea_decision_confirm:0 "There shall be no place left for them to hide!"
 wardenite_mamur_reclaim_chegea_decision_is_valid:0 "You must own the Kingdom of [GetTitleByKey('k_eastern_frontier').GetNameNoTier], and ensure no independant Agionists survive in its territory."
 
 wardenite_mamur_reclaim_almubid_decision:0 "The Final Victory Over Agionism"
 wardenite_mamur_reclaim_almubid_decision_desc:0 "Never since the days of the Great Uprising has the Wardenite faith seen so great a triumph. Naught but a generation or two ago many [Concept('wardenism','Wardenites')|E] questioned the sacred rights of the [Concept('mamuramat','Mamur')|E]. But now? From the distant borders of the Amsari in the west to the Crater in the east the faithful sing our praises. Though some Agionists may lurk in various holdouts, their power has been broken forever. Now begins a new golden age for [sarradon|E]. An age of law. An age of Wardenism. An age of the Mamur."
 wardenite_mamur_reclaim_almubid_decision_tt:0 "Is our struggle finally at an end?"
 wardenite_mamur_reclaim_almubid_decision_confirm:0 "The Mamur is Triumphant!"
 wardenite_mamur_reclaim_almubid_decision_is_valid:0 "You must own the Kingdom of [GetTitleByKey('k_isle_of_visions').GetNameNoTier], and ensure no independant Agionists survive in its territory."
 wardenite_mamur_reclaim_almubid_decision_reward_3:0 "Will allow us to demand fealty from the Ayyar."
 
 wardenite_mamur_reassert_authority_kathsiti:0 "Reassert Authority Over the Kathsiti"
 wardenite_mamur_reassert_authority_kathsiti_desc:0 "The loss of the province of Uraghad was, in retrospect, a sign of things to come. The centuries to follow would see the [Concept('mamuramat','Mamur')|E]'s authority break down across the [Concept('wardenism','Wardenite')|E] world, resulting in the sorry state of affairs that led to the Saint's Crusade. However, under our leadership the ship of state appears to have been righted, and those who once denigrated our title as a relic of the past are being made to question their folly. Let us send messengers to the rebellious cities of Uraghad and the Barzawa demanding submission. They will understand the implicit threat..."
 wardenite_mamur_reassert_authority_kathsiti_tt:0 "Let us see who accepts and who refuses."
 wardenite_mamur_reassert_authority_kathsiti_confirm:0 "Let us Reassert our Rightful Authority"
 
 wardenite_mamur_reassert_authority_harthah:0 "Reassert our Authority over the Ḥārthahites"
 wardenite_mamur_reassert_authority_harthah_desc:0 "Though Ḥārthah may have had the best of intentions, his rebellion can no longer be tolerated. His descendants must bend the knee to the authority of the Mamur, or face the consequences."
 wardenite_mamur_reassert_authority_harthah_tt:0 "If they refuse, this will likely mean war."
 wardenite_mamur_reassert_authority_harthah_confirm:0 "They Will Bend the Knee."
 
 wardenite_mamur_reassert_authority_ayyar:0 "Rule the Ayyar Directly."
 wardenite_mamur_reassert_authority_ayyar_desc:0 "Since their arrival the Ayyar have successfully skirted the line between insubordination and submission. Their unique status came from a clever set of negotiations with the [Concept('mamuramat','Mamur')|E]s who came before us. That our ancestors were unable to secure full submission was a symptom of weakness, which has now been purged from the Mamur. With this in mind, let us remind the Ayyar of the requirements set upon them by their faith. We are sure they will do the right thing."
 wardenite_mamur_reassert_authority_ayyar_tt:0 "If they agree, they shall swear fealty to the Mamur"
 wardenite_mamur_reassert_authority_ayyar_confirm:0 "The Law of the First Warden is non-negotiable."
 k_dynamic_ayyar:0 "Governorship of Ayyar"
 
 blind_watcher_reform_decision:0 "Reform the Order"
 blind_watcher_reform_decision_tooltip:0 "Restore the Order to Dikaynos' vision"
 blind_watcher_reform_decision_tt:0 "You have taken over the Order and eliminated the corruption"
 blind_watcher_reform_decision_desc:0 "After so long in darkness, the corruption and injustice which has plagued our Order has been purged, and we once more administer true, unbiased justice as Dikaynos once did. It now merely requires one final edict to cement our reforms, to punish those who committed terrible crimes in the Saint's name, before the arduous work of seperating ourselves from our bloodstained actions can begin. However, though those within our ranks who sought to subvert our teachings have met their justice, the reckoning with the ones truly behind the scheme is yet to come, and will be bloody indeed..."
 blind_watcher_reform_decision_confirm:0 "For Justice Eternal"
 blind_watcher_reform_valid_desc:0 "Your Clique must have 60% or greater influence"
 blind_watcher_reform_correct_clique_desc:0 "You must be part of the Defenders clique"
 
 landed_order_reform_no_powerful_vassal_must_oppose_desc:0 "No non-imprisoned Powerful Vassal must hold a negative opinion of you"
 
 golden_hand_reform_decision:0 "Reform the Order"
 golden_hand_reform_decision_tooltip:0 "Restore the Order to Philantros' vision"
 golden_hand_reform_decision_tt:0 "You have taken over the Order and eliminated the corruption"
 golden_hand_reform_decision_desc:0 "After so long in darkness, the corruption and greed which has plagued our Order has been driven out, and we once more distribute wealth to those who truly need it rather than hoard it for ourselves. It now merely requires one final edict to cement our reforms, to punish those who committed terrible crimes in the Saint's name, before the arduous work of seperating ourselves from our bloodstained actions can begin. However, though those within our ranks who sought to subvert our teachings have been separated from their ill-earned wealth, the reckoning with the ones truly behind the scheme is yet to come.."
 golden_hand_reform_decision_confirm:0 "For Charity Eternal"
 golden_hand_reform_valid_desc:0 "Your Clique must have 60% or greater influence"
 golden_hand_reform_correct_clique_desc:0 "You must be part of the Dorogeros clique"
 
 sansias_rose_reform_decision:0 "Reform the Order"
 sansias_rose_reform_decision_tooltip:0 "Restore the Order to Sansia's vision"
 sansias_rose_reform_decision_tt:0 "You have taken over the Order and eliminated the corruption"
 sansias_rose_reform_decision_desc:0 "After so long in darkness, the corruption and cruelty which has plagued our Order has been driven out, and we can once more dedicate ourselves to the protection of the innocent instead of pointless cruelty. It now merely requires one final edict to cement our reforms, to punish those who committed terrible crimes in the Saint's name, before the arduous work of seperating ourselves from our bloodstained actions can begin. However, though those within our ranks who sought to subvert our teachings have met their justice, the reckoning with the ones truly behind the scheme is yet to come, and will be bloody indeed..."
 sansias_rose_reform_decision_confirm:0 "For Self-Sacrifice Eternal"
 sansias_rose_reform_valid_desc:0 "Your Clique must have 60% or greater influence"
 sansias_rose_reform_correct_clique_desc:0 "You must be part of the Kateigorúnoi to Ketigoménon clique"
 
 bleeding_martyr_reform_decision:0 "Reform the Order"
 bleeding_martyr_reform_decision_tooltip:0 "Restore the Order to Sansia's vision"
 bleeding_martyr_reform_decision_tt:0 "You have taken over the Order and eliminated the corruption"
 bleeding_martyr_reform_decision_desc:0 "After so long in darkness, the corruption and rot which has plagued our Order has been healed, and we can once more dedicate ourselves to healing the sick rather than cruel experiments. It now merely requires one final edict to cement our reforms, to punish those who committed terrible crimes in the Saint's name, before the arduous work of seperating ourselves from our bloodstained actions can begin. However, though those within our ranks who sought to subvert our teachings have met their justice, the reckoning with the ones truly behind the scheme is yet to come..."
 bleeding_martyr_reform_decision_confirm:0 "For the Healing of All"
 bleeding_martyr_reform_valid_desc:0 "Your Clique must have 60% or greater influence"
 bleeding_martyr_reform_correct_clique_desc:0 "You must be part of the Xeneftoi clique"
 
 pure_heart_reform_decision:0 "Reform the Order"
 pure_heart_reform_decision_tooltip:0 "Restore the Order to Katharitos' vision"
 pure_heart_reform_decision_tt:0 "You have taken over the Order and eliminated the corruption"
 pure_heart_reform_decision_desc:0 "After so long in darkness, the corruption and rot which has plagued our Order has been purified, and we can once more dedicate ourselves to achieving true Purity. It now merely requires one final edict to cement our reforms, to punish those who committed terrible crimes in the Saint's name, before the arduous work of seperating ourselves from our bloodstained actions can begin. However, though those within our ranks who sought to subvert our teachings have met their justice, the reckoning with the ones truly behind the scheme is yet to come..."
 pure_heart_reform_decision_confirm:0 "For the Purity of Love"
 pure_heart_reform_valid_desc:0 "Your Clique must have 60% or greater influence"
 pure_heart_reform_correct_clique_desc:0 "You must be part of the Apodromios clique"
 
 saint_calystos_key_reform_decision:0 "Reform the Order"
 saint_calystos_key_reform_decision_tooltip:0 "Restore the Order to Calystos' vision"
 saint_calystos_key_reform_decision_tt:0 "You have taken over the Order and eliminated the corruption"
 saint_calystos_key_reform_decision_desc:0 "After so long in darkness, our Order has finally been freed from the corruption and greed which has plagued it, so that we may once again fight to free the oppressed rather than enslave the innocent in a mockery of Calystos' teachings. It now merely requires one final edict to cement our reforms, to punish those who committed terrible crimes in the Saint's name, before the arduous work of seperating ourselves from our bloodstained actions can begin. However, though those within our ranks who sought to subvert our teachings have met their justice, the reckoning with the ones truly behind the scheme is yet to come, and will be bloody indeed..."
 saint_calystos_key_reform_decision_confirm:0 "For Freedom Universal"
 saint_calystos_key_reform_valid_desc:0 "Your Clique must have 60% or greater influence"
 saint_calystos_key_reform_correct_clique_desc:0 "You must be part of the Logisa clique"
 
 religious_extort_subjects_decision:0 "Collect Alms"
 religious_extort_subjects_decision_desc:0 "#F When I am in need of money, the pious should be happy to offer me their savings! After all, such generosity is the will of [ROOT.Char.GetFaith.WealthGodName]...#!"
 
 donate_to_golden_hand_decision:0 "Donate to Golden Hand"
 donate_to_golden_hand_decision_desc:0 "As a pious follower of Philantros, it is customary to show my generosity by supporting the Order of the Golden Hand."
 donate_to_golden_hand_decision_tooltip:0 "Prove your support for the Philantrosian cause"
 donate_to_golden_hand_decision_confirm:0 "It's for a good cause!"
 
 marcher_mercenaries:0 "Marcher Mercenaries"
 marcher_port:0 "Staple Port of the West"

 reform_great_tarrafent_decision: "Restore Great Tarrafent"
 reform_great_tarrafent_decision_desc: "Our people have lay disunited and scattered across the [Glossary('Great Desert','sarradonian_desert_encyclopedia_desc')] since Great Tarrafent finally collapsed. Perhaps, now that descendants of Marmal's Children walk again, the Ocean Dreamed can return once again."
 reform_great_tarrafent_decision_tooltip: "Use your legend across the dunes to reestablish Marmaladid rule in [sarradon|E]"
 reform_great_tarrafent_decision_confirm: "Let the Stars guide us!"
 reform_great_tarrafent_decision_powerful_vassals_tt_desc: "All of your [powerful_vassals|E] have a [culture|E] with the [GetCultureTradition('tradition_desert_nomads').GetName] [tradition|E]"
 nick_tuder_amhaddi: "Tuder-Amhaddi"
 historic_great_tarrafent: "Historic Tarrafent"
 every_non_root_faith_vassal_great_tarrafent: "Every non-[THIS.Char.GetFaith.GetAdjective] [vassal|E] or below in Historic Tarrafent"
 every_non_root_faith_county_tarrafent: "Every non-[THIS.Char.GetFaith.GetAdjective] [county|E] in Historic Tarrafent"
 every_non_tarrafent_uniter_faith_convert: "Converts to [great_tarrafent_uniter.GetFaith.GetName|V]"
 sarradon_decisions.1001.t: "[reclaimer.Getculture.GetNameNoTooltip|U] Great Tarrafent"
 sarradon_decisions.1001.desc: "For too long our people have remained aimless, stuck in our old ways after seeing what could be done in centuries past. The loss of Great Tarrafent put us on the backfoot.\n\nThat time has passed. With the restoration of the Dreamt Ocean, our courage and strength have been revitalized. Soon, we shall control the whole of the desert, and beyond."
 sarradon_decisions.1001.a: "Praised be the ancestors!"
 sarradon_decisions.1001.custom: "All [counties|E] in Historic Tarrafent"
 reform_great_tarrafent_culture_modifier: "Dreamt Ocean Restored"
 reform_great_tarrafent_culture_modifier_desc: "[promote_culture|E] (Marmaladid cultures only) Speed: #P +75%#!"
 unlock_great_tarrafent_decision: "fp3_unlock_meditation.tt: "Unlocks the Restore Great Tarrafent [decision|E]"
 fervor_great_tarrafent_reformed: "Great Tarrafent Reborn!"

 revive_the_chosen_magi_decision: "Revive the Talita Namit Practices"
 revive_the_chosen_magi_decision_desc: "Since the cataclysm of [Concept('the_decimation_of_sarradon','Halakdun')|E], the ancient customs that once defined Marmaladid society have disappeared into the sands as new practices and customs took their placee. We must seek to revive the place [marmaladid_chosen_magi|E] had in our society, and uncover what secrets have been lost."
 revive_the_chosen_magi_decision_tooltip: "Revive the Talita Namit [faith|E] and the [magic|E] school they once guided."
 revive_the_chosen_magi_decision_confirm: "Let the Magic Return"
 revive_the_chosen_magi.county_conversions.tt: "[counties|E] in your [realm|E] that share your [cultural|E] [heritage|E] might convert to $talita_namit$"
 restore_chosen_magi.every_converted_province: "$EFFECT_LIST_BULLET$ All [counties|E] that convert"
 fervor_gain_talita_namit_revived: "Talita Namit Practices"
 sarradon_decisions.2001.t: "The Return of Magic"
 sarradon_decisions.2001.desc: "The return of Talita Namit to our people has spread like wildfire across my realm. Soon, many more shall convert, and what [magi|E] remain in our ahans and enclaves will find their way to mine in hopes of being chosen. Who knows what secrets may be brought forth from the magic congregated in this endeavour."
 sarradon_decisions.2001.a: "Praised be the [realm_above|E]!"
 sarradon_decisions.2001.effect_school_tooltip: "Your [culture|E] adopts the #V $talita_namit_school_name$#! [Concept('magic_type','School of Magic')|E]"
 marmaladid_appreciation_modifier: "Marmaladid Appreciation"
 marmaladid_appreciation_modifier_desc: "This [county|E] has recently found an appreciation for the [Concept('marmaladid_chosen_magi','Old Ways')|E]"

 sarradon_decisions.3004.t:0 "The Eastern Lands Reclaimed"
 sarradon_decisions.3004.desc:0 "Hammuhat's decline since Harthah's death, once spoken of as certain, has been checked. Even the furthest reaches of the Sirwali shores, taken from us by the nomads and long outside our authority, stand with Khenemhat once more.\n\nMuch remains to be done, yet a new dawn rises for [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] and my people."
 sarradon_decisions.3004.a:0 "A mighty realm!"

 sarradon_decisions.3001.t:0 "Rise of the Almusid"
 sarradon_decisions.3001.desc:1 "The lands of the Sirwwali Coast have provided our people with lush and fertile ground to settle and expand.\n\nBy adopting some of the traditions from the locals, we will be able to better acclimate to the region."
 sarradon_decisions.3001.a:0 "To new friends and new beginnings!"

 sarradon_decisions.3002.t:0 "$sarradon_decisions.3001.t$"
 sarradon_decisions.3002.desc:0 "We are far from the lands that our ancestors called home, but it is these lands of the Sirwali Coast that we think of as our country. As the leader of my people, it is my responsibility to ensure future prosperity and if we are to flourish, then we must adapt to our new environment. We must learn from the people whose ancestors made use of these fertile grounds.\n\nBy this decree, we will change our way of life to benefit our kin. We will forge a new path as our own people."
 sarradon_decisions.3002.a:0 "A New People in a new land!"

 sarradon_decisions.3003.t:0 "$sarradon_decisions.3001.t$"
 sarradon_decisions.3003.desc:0 "A group of settlers hailing from the Deep desert have settled on the Sirwali Coast, making a new home for themselves there.\n\nTheir leader, [almusid_founder.GetTitledFirstName], has decreed that [almusid_founder.GetHerHis] people shall adopt several local customs and traditions to ensuring they will thrive in this new land."
 sarradon_decisions.3003.a:0 "What does this mean for the region?"
