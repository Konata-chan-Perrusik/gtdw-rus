# Modifier Descriptions
gh_golden_terror_character_modifier_desc:0 "This character has been marked as an enemy of the Golden Rule."
gh_golden_republic_modifier_desc:0 "This character founded the Golden Republic and unleashed the Terror."
gh_golden_terror_leader_modifier_desc:0 "This character has personally sent enemies to be hanged."
gh_golden_terror_legacy_tyrant_modifier_desc:0 "This character's rule is remembered as a reign of blood."
gh_golden_terror_legacy_moderate_modifier_desc:0 "This character's rule is remembered as necessary but restrained."
gh_golden_terror_survivor_modifier_desc:0 "This character endured the Terror and lived to see its end."

gh_golden_terror_modifier_desc:0 "The Hanging Tree is in full bloom. Neighbor denounces neighbor. Fear rules the streets."
reconstruction_modifier_desc:0 "The long work of rebuilding has begun. Fields are replanted, courts reopened."