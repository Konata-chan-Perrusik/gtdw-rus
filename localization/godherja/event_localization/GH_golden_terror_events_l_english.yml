l_english:

golden_terror_tt: "Golden Terror"
golden_terror_tt_desc: "The Heijrdwang Conspiracy represented the greatest threat to the Kanzelerij since the [bitter_war|E]. The discovery of letters between Raadilists and Marcher lords seeking military intervention to restore the [GetTitleByKey('d_konijkmener_monarchy').GetNameNoTier] outraged the Chancellery, leading to a bloody civil war in vain effort to restore the monarchy.\n\n At its end, the Kanzeler seized upon the conspiracy and civil war to justify what would become known as the 'Golden Terror;' a near fifteen-year period of revolutionary justice that would claim thousands of lives across the Granmaer Peninsula, and send many fleeing beyond its shores."

gh_golden_terror.0001.t:0 "The Heijrdwang Conspiracy"
gh_golden_terror.0001.desc:0 "For years, the Heijrdwang's supporters have whispered in the shadows of the Kanzelerij. For years, they have plotted to restore the [GetTitleByKey('d_konijkmener_monarchy').GetNameNoTier] to its former glory.\n\nBut now, it's all over.\n\nThe failed attempt to seize power with support from a number of noble and merchant families has ended in disaster. The "crown" is under lock and key, their supporters dead or scattered, and the Kanzelerij remains. But not all is right on the Granmaer. If the republic is to survive, we must end this farce of a lordship once and for all, and all those who followed with it."

gh_golden_terror.0001.a:0 "Death to the traitors! Let this be a lesson to all enemies of the Republic."
gh_golden_terror.0001.a.tt:0 "Execute [attacker.GetName] and destroy the [GetTitleByKey('d_konijkmener_monarchy').GetNameNoTier]\nMark all known monarchists as enemies of the Kanzelerij\nBegin the Golden Terror"


gh_golden_terror.0101.t:0 "The Revolutionary Tribunal"
gh_golden_terror.0101.desc:0 "A monarchist has been denounced before the Kanzelerij Tribunal. [accused.GetName] stands accused of conspiring against the Konijkmener, and the crowd outside the Hoen ver 'dt Grostvordre chants for blood."

gh_golden_terror.0101.a:0 "Death to the enemy of the people!"
gh_golden_terror.0101.b:0 "Imprison them. We are not savages."

gh_golden_terror.0102.t:0 "The Law of Suspects"
gh_golden_terror.0102.desc:0 "[suspect.GetName] has been denounced as an enemy of the Kanzelerij. Under the proposed Law of Suspects, anyone who 'by their conduct, relations, or remarks, shows themselves to be partisans of tyranny' can be arrested. Thousands could be imprisoned."

gh_golden_terror.0102.a:0 "No mercy for traitors."
gh_golden_terror.0102.b:0 "We cannot become tyrants ourselves."

gh_golden_terror.0103.t:0 "All That Glitters..."
gh_golden_terror.0103.desc:0 "The Terror has consumed everything. Even the moderates who once supported me now whisper of conspiracy. The Chancellery murmurs with fear and resentment, with some even thinking of declaring me a traitor."

gh_golden_terror.0103.a:0 "Purge them all! The Terror must continue!"
gh_golden_terror.0103.b:0 "It is over. I abdicate."

gh_golden_terror.0020.t:0 "All that Glitters..."
gh_golden_terror.0020.desc:0 "The Chancellery erupts in chaos. [betrayer.GetName] has risen to denounce me as a tyrant and enemy of the Kanzelerij. 'Terror has become the tool of one's ambition!' they cry. The deputies shout for arrest. Outside, the crowd that once cheered now calls for blood."

gh_golden_terror.0020.a:0 "What can I do but surrender..."
gh_golden_terror.0020.b:0 "Arrest them all! I will not suffer the fate I gave others."

gh_golden_terror.0021.t:0 "The Tyrant Falls"
gh_golden_terror.0021.desc:0 "[golden_terror_leader.GetName] has been executed. The one who brought us Terror now faces the same blade. Some say justice has been done, Others whisper that the Golden Rule has merely found a new master."

gh_golden_terror.0021.a:0 "The Golden Years continue..."

# End of Terror
gh_golden_terror.0015.t:0 "The Golden Terror Ends"
gh_golden_terror.0015.desc:0 "Fifteen years. Fifteen years of blood and fear due to the Raadilists attempts to reclaim their lost throne. Now, the judiciary committees disband, and the remaining prisoners granted amnesty. The Golden Rule is supreme across the peninsula."

gh_golden_terror.0015.a:0 "The Republic endures. That is enough."

gh_golden_terror.0016.t:0 "The Tyrant Falls"
gh_golden_terror.0016.desc:0 "[fallen_tyrant.GetName] is dead. The one who ruled through fear now lies in an unmarked grave, their followers scattered across the marsh. History will remember them not as a liberator, but as a butcher."

gh_golden_terror.0016.a:0 "Thus falls all tyrants."

