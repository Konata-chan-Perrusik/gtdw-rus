l_english:

 tirga_tissit_divination_decision: "Consult Tirga Tissit"
 tirga_tissit_divination_decision_tooltip: "What does the Spider hold?"
 tirga_tissit_divination_decision_desc: "Observe what secrets are hidden through the ritual of [Glossary('Tirga Tissit','tirga_tissit_glossary_desc')]."
 tirga_tissit_divination_decision_confirm: "Prepare the camel."
 tirga_tissit_divination_decision_tt: "You may gain [GetModifier('gh_divination_love_modifier').GetNameWithTooltip], [GetModifier('gh_divination_war_modifier').GetNameWithTooltip], [GetModifier('gh_divination_life_modifier').GetNameWithTooltip], or [GetModifier('gh_divination_spider_modifier').GetNameWithTooltip] for #high 5#! years."
 tirga_tissit_divination_decision_tt_spiritual: "You may gain [GetModifier('gh_divination_love_spiritual_modifier').GetNameWithTooltip], [GetModifier('gh_divination_war_spiritual_modifier').GetNameWithTooltip], [GetModifier('gh_divination_life_spiritual_modifier').GetNameWithTooltip], or [GetModifier('gh_divination_spider_spiritual_modifier').GetNameWithTooltip] for #high 5#! years."
 gh_court_astrologer_events.0001.t: "$tirga_tissit_divination_decision$"
 gh_court_astrologer_events.0001.desc: "My eyes follow [astrologer.GetFirstName] as [astrologer.GetSheHe] slits the sacrifical camel's throat, filling a large dish with its blood. [astrologer.GetHerHis|U] lips barely move as [astrologer.GetSheHe] recites incantations while holding a deadly looking spider above the bowl.\n\nSuddenly, [astrologer.GetSheHe] immerses the spider completely in the camel's blood, and just as quickly places it on the sacrifice's dry, sandy skin. The spider is let free, a skittering of blood vanishing in the sand, while [astrologer.GetFirstName] and [astrologer.GetHerHis] attendants interpret the pattern left behind."
 gh_court_astrologer_events.0001.a: "Speak to me of love."
 gh_court_astrologer_events.0001.a.success: "You will be surrounded by love"
 gh_court_astrologer_events.0001.a.success.tt: "You try not to shed a tear"
 gh_court_astrologer_events.0001.a.failure: "He Who Was is silent."
 gh_court_astrologer_events.0001.b: "Speak to me of war."
 gh_court_astrologer_events.0001.b.success: "You will win every battle"
 gh_court_astrologer_events.0001.c: "Speak to me of life."
 gh_court_astrologer_events.0001.c.success: "You will have a prosperous life"
 gh_court_astrologer_events.0001.d: "It's not the right time."
 gh_court_astrologer_events.0001.e: "Speak to me of laws."
 gh_court_astrologer_events.0001.e.success: "You will pass judicious sentences"
 gh_divination_love_modifier: "Loved by the Weave"
 gh_divination_love_modifier_desc: "The spider augured a warm love for this character."
 gh_divination_war_modifier: "Warrior of the Weave"
 gh_divination_war_modifier_desc: "The spider augured a victorious battle for this character."
 gh_divination_life_modifier: "Blessed by the Weave"
 gh_divination_life_modifier_desc: "The spider augured a long life for this character."
 gh_divination_spider_modifier: "Judged by the Weave"
 gh_divination_spider_modifier_desc: "The spider augured a judicious reign for this character."
 gh_divination_love_spiritual_modifier: "$gh_divination_love_modifier$"
 gh_divination_love_spiritual_modifier_desc: "$gh_divination_love_modifier_desc$\n#weak This modifier is more powerful because of the Spiritual [ethos|E]#!"
