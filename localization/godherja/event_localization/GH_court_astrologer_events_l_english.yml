 gh_decision_fertility_tirga_tissit: "Call for Tirga Tissit Assembly"
 gh_decision_fertility_tirga_tissit_tooltip: "Call upon your [GetCourtPositionType('court_astrologer_court_position').GetName()] to help you exploit [county_fertility|E] through the secrets of [Glossary('Tirga Tissit','tirga_tissit_glossary_desc')]."
 gh_decision_fertility_tirga_tissit_desc: "Oh, [ROOT.Char.GetFaith.FertilityGodName], bless our lands with your bounty. Let us remember the knowledge of our parents so our herd may prosper."
 gh_decision_fertility_tirga_tissit_confirm: "Our flock will flourish!"
 gh_decision_fertility_tirga_tissit_effects_tt: "Your [GetCourtPositionType('court_astrologer_court_position').GetName()] and other judges will perform the [Glossary('Tirga Tissit','tirga_tissit_glossary_desc')] to assess what must be done for the drylands of [fertility_county.GetName], granting bonuses to its [Concept('county_fertility', 'Fertility')|E]."
 gh_decision_fertility_tirga_tissit_bonus_tt: "The results of the Tirga Tissit assembly depend on the [county_fertility|E] of [fertility_county.GetNameNoTier], your [arcana|E] [skill|E] and the [arcana|E] [skill|E] of your [GetCourtPositionType('court_astrologer_court_position').GetName()]"
 gh_fertility_tirga_tissit_county_modifier: "Fertility Tirga Tissit"
 gh_fertility_tirga_tissit_county_modifier_desc: "A councl of judges performed the [Glossary('Tirga Tissit','tirga_tissit_glossary_desc')] in this county, and shared pastoral knowledge." 
 gh_court_astrologer_events.0300.t: "Tirga Tissit of Fertility"
 gh_court_astrologer_events.0300.desc: "[shaman.GetTitledFirstName] chants in verse while cutting the sacrifical camel's throat, two attendants standing ready with a large bowl. The chanting rises as [shaman.GetSheHe] brings forth a large spider, the crowd ready as if on the edge of their seats.\n\n"Let He Who Was remind us of knowledge lost, and secrets found. Let the Spider guide us through the web of confusion." [shaman.GetSheHe] says, immersing the spider into the blood before just as quickly placing it on the camel's skin. The arachnid flees as fast as it can, while [shaman.GetNameNoTooltip] and a litany of judges inspect the patterns left behind."
 gh_court_astrologer_events.0300.tt: "The assembly in [fertility_county.GetName] has begun."
 gh_court_astrologer_events.0300.a: "What secrets does the spider hold?"
 gh_court_astrologer_events.0300.b: "I will join [shaman.GetNameNoTooltip] in [shaman.GetHerHis] reflections."   

