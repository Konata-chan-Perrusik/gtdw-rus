 GH_RICE_oasis_event.0010.t: "Preparations"
 GH_RICE_oasis_event.0010.desc.intro: "As a [ROOT.Char.GetTitleAsNameNoTooltip], I have many worries and responsibilities."
 GH_RICE_oasis_event.0010.desc.faith: "Among those who believe in the [ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.GetFaith.PantheonTerm],"
 GH_RICE_oasis_event.0010.desc.culture: "Among the [ROOT.Char.GetCulture.GetCollectiveNoun],"
 GH_RICE_oasis_event.0010.desc: "it is not unheard of to seek advice through dreams at the tombs of the dead, or even in pits filled with deadly scorpions. For centuries, it has been our tradition to sleep in such places; the dreams we have there are said to give one great insight into the affairs of the world.\n\nAfter much traveling, I have arrived in [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]."
 GH_RICE_oasis_event.0010.desc.notable: "A local notable, who lived long ago, is said to be buried here."
 GH_RICE_oasis_event.0010.desc.ancestor: "One of my distant ancestors is said to be buried here."
 GH_RICE_oasis_event.0010.desc.saint: "A [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] saint is said to be buried here."
 GH_RICE_oasis_event.0010.desc.personal: "\n\nPrivate matters have weighed on me lately. I hope the dreams I have at this tomb will guide me in the right direction when it comes to carrying out my personal affairs."
 GH_RICE_oasis_event.0010.desc.political: "\n\nPolitical issues have been on my mind a lot. No matter if it's my enemies and rival factions, my underlings, or anyone else, I hope the dreams I have at this tomb will tell me how to carefully deal with them."
 GH_RICE_oasis_event.0010.desc.communal: "\n\nThe community's well-being concerns me the most. Am I doing the proper thing as their leader? Or do I need to change my current course of action? I hope the dreams I have at this tomb will provide me the answers I seek."
 GH_RICE_oasis_event.0010.desc.talfasomoll: "\n\nThe secrets of our world must be uncovered. The deadly stings my body will face shall open my soul to whatever knowledge [ROOT.Char.GetFaith.DeathDeityName|U] may wish to share."
 GH_RICE_oasis_event.0010.a: "I need to prepare well for this ritual."
 GH_RICE_oasis_event.0011.t: "The Tomb"
 GH_RICE_oasis_event.0011.desc: "Night falls as I come to the tomb in [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]. After receiving instructions by local [ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.Custom('DefaultPriestTitlePlural')] on how to sleep and what to do as I fall asleep, I am ready to perform this ritual!\n\nAs I fall asleep, my mind is focused intently on the questions I have about the issues in my life that have been bothering me."
 GH_RICE_oasis_event.0011.desc.talfasomoll: "Night falls as I come to the tomb in [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]. After receiving instructions by the local [ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.Custom('DefaultPriestTitlePlural')] on preparing the pit and how to breathe, I have readied my scorpion pit for this ritual.\n\nIt is difficult to rest easy, or safely, with the scorpions surrounding my every limb. At last, several sharp, burning stings erupt through my body like burning irons pressed beneath the skin. The last thing I see before slipping into a deeper slumber are the locals above, watching."
 GH_RICE_oasis_event.0011.a: "Time to travel to the realm of dreams...."
 GH_RICE_oasis_event.0012.t: "The Dream"
 GH_RICE_oasis_event.0012.desc.failure: "As the sun started to rise over the dawn sky, I awoke from my slumber, feeling tired and groggy. Unfortunately, I could not recall my dream well last night, and when I recalled the few details I could remember to the local [ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.Custom('DefaultPriestTitlePlural')], they said they could not make much sense out of it.\n\nIt appears that sadly, [ROOT.Char.GetFaith.PantheonTerm] [ROOT.Char.GetFaith.PantheonTermHasHave] decided that I am not worthy of receiving any advice.\n\nI suppose at the least, I visited the tomb of someone important."
 GH_RICE_oasis_event.0012.desc.success: "As the sun started to rise over the dawn sky, I awoke from my slumber, feeling refreshed and energized. With great clarity, I recounted what I could remember of my dreams the previous night to the local [ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.Custom('DefaultPriestTitlePlural')].\n\nThe main events of the dream that I could recall were that it featured #Bold [ROOT.Char.Custom('RICE_tuareg_dream_subject')]#!, and that I #Bold [ROOT.Char.Custom('RICE_tuareg_dream_action')]#!.\n\nAnyways, the [ROOT.Char.Custom('DefaultPriestTitlePlural')] helped me interpret the dream, and what [ROOT.Char.GetFaith.PantheonTerm] wanted to communicate to me about my affairs. I am relieved, all in all, that I received some divine guidance."
 GH_RICE_oasis_event.0012.desc.talfasomoll_success: "As the sun started to rise over the dawn sky, I awoke from within the pit to find the scoprions gone. My energy has not yet fully returned, but with each movement upward I feel life returning to my bones. With great clarity, I recounted what I could remember of my dreams the previous night to the local [ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.Custom('DefaultPriestTitlePlural')].\n\nLittle of it made sense when spoken aloud, and yet in my head it all seemed so clear and thorough, as if the knowledge was only made for me. I am relieved, all in all, that I have received some measure of guidance."
 GH_RICE_oasis_event.0012.desc.talfasomoll_failure: "As the sun shone harshly over the noon sky, I awoke full of pain and suffering from the pit. The scorpions have long since left, assuming my death, and they would not be far from the truth. Everything aches with such pain that I should be.\n\nIf I am to survive the week, I will need more than a good night's rest."
 GH_RICE_oasis_event.0012.a: "Now, it's time to go back home."

 GH_RICE_oasis_event.0021.t: "Takarakit"
 GH_RICE_oasis_event.0021.desc: "The [ROOT.Char.GetCulture.GetCollectiveNoun], as #italic Agdud Iqadib#!, greatly value the virtue of #italic takarakit#!, or reserve. That is, those who convey strong feelings like anger, love, and so on through indirect means are highly respected.\n\nLately, [courtier.GetFirstName] has gained a reputation for embodying #italic takarakit#! well. Many at my court and elsewhere have praised [courtier.GetHerHim] for this."
 GH_RICE_oasis_event.0021.a: "I can see why everyone says that!"
 GH_RICE_oasis_event.0022.t: "Taguella"
 GH_RICE_oasis_event.0022.desc: "Today, I'm enjoying some particularly delicious #italic taguella#! with some sheep and goat meat and spices. This flatbread has been a staple of [ROOT.Char.GetCulture.GetName] cuisine for as long as anyone can remember."
 GH_RICE_oasis_event.0022.a: "Yum yum!"
 GH_RICE_oasis_event.0023.t: "Inadan"
 GH_RICE_oasis_event.0023.desc: "The #italic inadan#! in [county.GetNameNoTier] have gained much renown lately for their products. Though the elite, noble castes of the [ROOT.Char.GetCulture.GetName] people, such as myself, keep our distance from these hereditary castes of smiths, jewelers, and artisans, their work is undoubtedly of great use to us."
 GH_RICE_oasis_event.0023.a: "Good to hear."


 GH_RICE_oasis_event.0030.t: "The Water Well"
 GH_RICE_oasis_event.0030.desc: "In the [Glossary('Sarradonian Desert','sarradonian_desert_encyclopedia_desc')], water wells are a rare and precious commodity. A well-to-do local notable wishes to sell one of the wells he owns in this region, and is offering a decent price for it."
 GH_RICE_oasis_event.0030.a: "It's a deal! The well belongs to me now."
 GH_RICE_oasis_event.0030.b: "I am not interested in this kind of deal."
 GH_RICE_oasis_event.0030.c: "For that price? I think you can do better."

 GH_RICE_oasis_event.0031.t: "Olives and Dates"
 GH_RICE_oasis_event.0031.desc: "Some locals from my territories have approached me with an offering of tribute of prized olives and dates from their village."
 GH_RICE_oasis_event.0031.a: "Your gift is much appreciated."

 GH_RICE_desert_event.0010.t: "Scarab-Beetles Sent"
 GH_RICE_desert_event.0010.desc: "I have sent a number of Scarab Beetles to [recipient.GetTitledFirstName]. We can only hope that [recipient.GetSheHe] will appreciate the gesture and think more highly of me, and that this will help improve relations between the two of us."
 GH_RICE_desert_event.0010.a: "Indeed"

 GH_RICE_desert_event.0011.opening: "[actor.Custom2('AppropriateGreeting',ROOT.Char)]"
 GH_RICE_desert_event.0011.desc: "I present to you these Scarab Beetles from our Burrows. They have been famed since ancient times for their speed and endurance, and they shall surely serve you and your warriors well. Please accept this gifts as a token of my friendship, and in the name of perpetual peace between our peoples."
 GH_RICE_desert_event.0011.a: "How delightful!"

 GH_RICE_desert_event.0012.t: "Counting Dung"
 GH_RICE_desert_event.0012.desc: "I am visiting an acquaintance of mine and noticed that his land smells rank with dung. It is nearly overwhelming, as the great scarab-beetles that scatter across his land feast so. I start counting out loud how many are here, but quickly one of my guards asks me to stop. It's superstitious to count the 'livestock' of someone else, and risks bringing them misfortune."
 GH_RICE_desert_event.0012.a: "Ah, I almost forgot! Good of you to remind me."
 GH_RICE_desert_event.0012.b: "Misfortune, you say? I never liked them anyways."

 GH_RICE_desert_event.0013.t: "Scarab Thief"
 GH_RICE_desert_event.0013.desc: "A thief recently attempted to steal several beetles from our stables. He managed to flee a short distance being being caught, with none of the livestock missing. Stealing such a creature is a heinous crime, considered the same as kidnapping or murder. Normally other officials would take care of such a matter, but due to extenuating circumstances I am responsible for the thief's fate."
 GH_RICE_desert_event.0013.a: "I'll trust my officials' judgement and let them handle this."
 GH_RICE_desert_event.0013.b: "Tradition is clear. Execute him."
 GH_RICE_desert_event.0013.c: "He can pay me a fine, that'll teach him a lesson."

 GH_RICE_desert_event.0014.t: "An Escaped Slave"
 GH_RICE_desert_event.0014.desc.diplomacy: "Escaped slaves from the other desert tribes are an all too common sight in the [Glossary('Great Desert','sarradonian_desert_encyclopedia_desc')]. Some of them are quite skilled. Today, one such ex-slave, a new arrival to our lands, offers [scope_spawn_runaway_slave.GetHerHis] services. [scope_spawn_runaway_slave.GetSheHe] once served as a slave to a powerful trader, and [scope_spawn_runaway_slave.GetSheHe] is knowledgeable in many languages and customs."
 GH_RICE_desert_event.0014.desc.martial: "Escaped slaves from the other desert tribes are an all too common sight in the [Glossary('Great Desert','sarradonian_desert_encyclopedia_desc')]. Some of them are quite skilled. Today, one such ex-slave, a new arrival to our lands, offers [scope_spawn_runaway_slave.GetHerHis] services. [scope_spawn_runaway_slave.GetSheHe] once served as a bodyguard. [scope_spawn_runaway_slave.GetSheHe] is a veteran of battle, and talented in several martial arts."
 GH_RICE_desert_event.0014.desc.stewardship: "Escaped slaves from the other desert tribes are an all too common sight in the [Glossary('Great Desert','sarradonian_desert_encyclopedia_desc')]. Some of them are quite skilled. Today, one such ex-slave, a new arrival to our lands, offers [scope_spawn_runaway_slave.GetHerHis] services. [scope_spawn_runaway_slave.GetSheHe] is able to read and do arthimetic, and previously helped [scope_spawn_runaway_slave.GetHerHis] master manage finanaces. [scope_spawn_runaway_slave.GetSheHe] is clearly a sharp, organized individual."
 GH_RICE_desert_event.0014.desc.intrigue: "Escaped slaves from the other desert tribes are an all too common sight in the [Glossary('Great Desert','sarradonian_desert_encyclopedia_desc')]. Some of them are quite skilled. Today, one such ex-slave, a new arrival to our lands, offers [scope_spawn_runaway_slave.GetHerHis] services. [scope_spawn_runaway_slave.GetSheHe] is vague on [scope_spawn_runaway_slave.GetHerHis] origins outside claiming involvement in crime. [scope_spawn_runaway_slave.GetSheHe] claims to have many useful connections abilities in subterfuge."
 GH_RICE_desert_event.0014.desc.learning: "Escaped slaves from the other desert tribes are an all too common sight in the [Glossary('Great Desert','sarradonian_desert_encyclopedia_desc')]. Some of them are quite skilled. Today, one such ex-slave, a new arrival to our lands, offers [scope_spawn_runaway_slave.GetHerHis] services. [scope_spawn_runaway_slave.GetSheHe] is not only literate, but unusually articulate and well-read. Perhaps [scope_spawn_runaway_slave.GetSheHe] was a sholar before [scope_spawn_runaway_slave.GetSheHe] was captured and enslaved? [scope_spawn_runaway_slave.GetSheHe] clearly has a knack for intellectual pursuits, and [scope_spawn_runaway_slave.GetSheHe] hopes [scope_spawn_runaway_slave.GetSheHe] can be of use to me."
 GH_RICE_desert_event.0014.desc.arcana: "Escaped slaves from the other desert tribes are an all too common sight in the [Glossary('Great Desert','sarradonian_desert_encyclopedia_desc')]. Some of them are quite skilled. Today, one such ex-slave, a new arrival to our lands, offers [scope_spawn_runaway_slave.GetHerHis] services. [scope_spawn_runaway_slave.GetSheHe] knows a great deal of survival in the more inhospital parts of the Desert, and even claims to know the locations of several ruins nearby that could be of use to us. Not only is [scope_spawn_runaway_slave.GetSheHe] literate, but [scope_spawn_runaway_slave.GetSheHe] possesses a smattering of knowledge on the arcane and supranatural."
 GH_RICE_desert_event.0014.a: "Let's hire [scope_spawn_runaway_slave.GetHerHim]!"
 GH_RICE_desert_event.0014.b: "I'm not interested, but [scope_spawn_runaway_slave.GetSheHe] can do as [scope_spawn_runaway_slave.GetSheHe] wishes."
 GH_RICE_desert_event.0014.c: "Runaway slave? Let's see if there's a reward!"

 GH_RICE_desert_event.0015.t: "A Mysterious Death"
 GH_RICE_desert_event.0015.desc: "A well-to-do fisherman on the [Glossary('Sirwali Coast','sirwali_coast_encyclopedia_desc')] who was considered something of a community leader amongst some of the commoner recently died in a tragic accident. While out fishing, his boat was lodged in a coral reef, and he was unfortunately attacked by reef sharks while trying to swim back. Investigations thus far have revealed foul play was involved, as his boat was sabotaged, and a man many claim was his rival, [distrustful_murderer.GetName], has been implicated. The evidence is very strong, but local judges have been worried by the rising threat of violence, so the sentencing has been passed to me."
 GH_RICE_desert_event.0015.a: "Why don't we let the locals decide?"
 GH_RICE_desert_event.0015.b: "This criminal shall be executed!"
 GH_RICE_desert_event.0015.c: "Eh, who cares?"
 GH_RICE_desert_event.0015.d: "We shall have a proper trial!"

 GH_RICE_desert_event.0016.t: "Mountains of Struggle"
 GH_RICE_desert_event.0016.desc: "Deep in the [Glossary('Great Desert','sarradonian_desert_encyclopedia_desc')] there is a range of mountains called the [Glossary('Usehhar Mountains','USEHHAR_MOUNTAINS_GLOSS')] that is said to possess many ancient necropoli buried deep under their rocks.\n\nLately, a number of peasant families, attracted by the potential of the large caves in the mountains, have started migrating their families to make a new home. Others fear this is a bad idea and believe such should be forbidden, lest the spirits of the dead be disturbed."
 GH_RICE_desert_event.0016.a: "Let the locals decide among themsleves, it's not my concern."
 GH_RICE_desert_event.0016.b: "Those people can move, why fear those who are already dead?"
 GH_RICE_desert_event.0016.c: "Those are justified concerns, we must forbid anyone from moving into the mountains."

 GH_RICE_desert_event.0017.t: "Hyena Attacks"
 GH_RICE_desert_event.0017.desc: "Some of the territory I control that is often used by caravans, merchants, and pilgrims has recently fallen prey to a roaming pack of [Glossary('hyenas', 'animal_type_hyena_encyclopedia_desc')]. While such attacks generally cause little harm and are not much cause for alarm, the merchants attacked were carrying important foodstuffs, and much of their product was eaten by the beasts! Since the merchant is fairly well-known, perhaps it may do to show some generosity and assist after this personal setback."
 GH_RICE_desert_event.0017.a: "He's rich already, I'm sure he'll be fine."
 GH_RICE_desert_event.0017.b: "I won't shy away from being generous!"



 send_scarab_beetles: "Gift Scarab Beetles"
 send_scarab_beetles_desc: "Send a gift of Scarab Beetles"
 opinion_scarab_beetle_gifts: "Gifted me Scarab Beetles"