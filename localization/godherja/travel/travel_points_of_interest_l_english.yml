EventPoIHistoricalNameOpakasijakLandings: "The Opakasijak Landings"
EventPoIHistoricalDescOpakasijakLandings: "Date: 1 Targade (6), 1265 IS#!\n#weak #! There is a stretch of unmarked beach in Platidnae where the surrounding islands block the waves, leaving the area silent and still besides the rise and fall of the tide. It was this location that Iordanes of Dusk, ruler of the nearby island of Tinitida, suggested the Imperreach land at. The beach thus became the launching point of the Imperreach conquest of Opakhasia, and the place where they united with the forces that had previously arrived at Tinitida before fording the strait."

