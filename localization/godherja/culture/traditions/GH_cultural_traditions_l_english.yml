 tradition_blood_of_giants_name: "Blood of Giants"
 tradition_blood_of_giants_desc: "This culture is said to descend from a warrior demigod of immense size whose blood still courses through their veins to this day."

 ##############################
 # RICE TRADITIONS INTEGRATED #
 ##############################
 
 tradition_RICE_agdud_iqadib_name: "Agdud Iqadib"
 tradition_RICE_agdud_iqadib_desc: "This culture descends from a rich history of nomadic life in the [Glossary('Sarradonian Desert','sarradonian_desert_encyclopedia_desc')] as part of the [marmaladid_great_tribes|E], and organizes their clans under both male and female leaders."
 culture_parameter_unlock_rice_cheaper_dream_divination: "The $activity_RICE_tuareg_dream_incubation$ [activity|E] is cheaper"

 tradition_RICE_oral_poetry_name: "Oral Histories"
 tradition_RICE_oral_poetry_desc: "This culture considers the memorization and retention of spoken poetry to be a noble art. It exists as one of the few forms of entertainment in the desert. Children grow up listening for many hours about cultural heroes and values."

 tradition_RICE_settled_nomads_name: "Settled Nomads"
 tradition_RICE_settled_nomads_desc: "This culture once lived a brutal, harsh existence amongst the dunes of the [Glossary('Sarradonian Desert','sarradonian_desert_encyclopedia_desc')], but have since settled into a sedentary lifestyle. They still, at times, maintain a wariness of centralized authority."


 tradition_kathunkai_cultural_circle_name:0 "People Of [Concept('kathuni_dragon_mythology','First Dragon')|E]"
 tradition_kathunkai_cultural_circle_desc:0 "We write the same characters, inherit the same history. The teachings of Dragon Empress Yao Ren Cai-Tiayang resonate within our minds. We are all part of Kathun-Kai, bound to one another as brothers."
 culture_parameter_kathuni_tolerance: "Gains #P 40%#! [cultural_acceptance_baseline|E] with other [Concept('culture','Cultures')|E] that possess the same [tradition|E]."

 tradition_lanonan_frontier_name:0 "LanoNan Frontier"
 tradition_lanonan_frontier_desc:0 "Living far from the core territory ruled by Kathun-Kai, the settlers of lanolan constantly battle the harsh natural environment and flesh-devouring beasts. For them, the weapons in their hands and the companions by their side are their sole reliance for survival in this wild land. Though development has made the local living environment less severe than in the past, the martial and united spirit still endures among them."
 tradition_conquered_name:0 "Conquered"
 tradition_conquered_desc:0 "Due to its long history of subjugation, the repeated failures of its uprisings have engraved submission deeply into the spirit of this culture. Prostrating itself before its conquerors has become the norm; resistance has ceased to be seen as an option."
 tradition_southern_nomads_name:0 "Southern Nomads"
 tradition_southern_nomads_desc:0 "Even far from the vast grasslands, the nomadic spirit of their culture has not faded. Across the rolling hills of the south, amidst dense forests, and upon vibrant wetlands, they discovered ways to preserve their traditional way of life, forming unique tropical nomadic customs."
 tradition_bloody_butcher_name:0 "Bloody Butcher"
 tradition_bloody_butcher_desc:0 "This culture habitually employs extremely brutal methods to suppress rebellions, often using instruments of torture to mercilessly torment dissidents. Its level of bloodshed is even sufficient to terrify the magi of [aversaria|E]."
 tradition_agricultural_community_name:0 "Agricultural Community"
 tradition_agricultural_community_desc:0 "This culture features extensive rural commune regimes in the countryside, where peasants engaged in collective labor and shared their harvests. They addressed challenges through inter-communal cooperation and refused to pay taxes to any lord. Any attempts to undermine this system would be met with fierce resistance from the peasants."
 tradition_road_to_resistance_name:0 "Road to Resistance"
 tradition_road_to_resistance_desc:0 "The invaders have occupied our homeland. Their crushing oppression has left our people wasting away day by day. Everything we hold dear has been defiled by those despicable villains! Fellow countrymen with a conscience still left within you—awake! Rise up! Swear to drive the invaders completely out of our land! With their blood, we shall feed our tormented children!"
 tradition_generational_maintenance_name:0 "Generational Maintenance"
 tradition_generational_maintenance_desc:0 "In this culture, weaponry and armor are regarded as extensions of the body. It is believed that only through day-in, day-out meticulous maintenance can the sharpest blades and sturdiest armor be forged. Many families possess weapons and armor passed down for centuries, yet through unbroken, meticulous care, these heirlooms remain as pristine as newly crafted pieces. Their masterful preservation techniques even rival those of professional metalworkers."
 tradition_southsea_sovereign_name:0 "Southsea Sovereign"
 tradition_southsea_sovereign_desc:0 "The people of Bronzeport have mastered the essence of commerce and trade. Their instinct to pursue profit seems deeply ingrained in their blood. These money hunters skillfully navigate between cities and ports, emerging victorious with each venture. Ordinary contracts appear as if enchanted, causing wealth to flow ceaselessly into their pockets."
 tradition_art_of_diplomacy_name:0 "Art of Diplomacy"
 tradition_art_of_diplomacy_desc:0 "In this culture's view, war is a losing proposition that simply drains wealth away. A single treaty negotiated at the table can secure far greater benefits than wallowing in the mud to slaughter each other. Therefore, as long as disputes can be resolved through diplomatic mediation, the rulers of this culture would never resort to war."
 tradition_shooting_specialization_name:0 "Shooting Specialization"
 tradition_shooting_specialization_desc:0 "In this culture, the art of archery is held in high regard. People begin honing their archery skills from childhood, enabling the military to recruit a large number of exceptional archers. Conversely, melee combat is viewed as a barbaric means, and few are willing to serve as infantry and set foot on the battlefield."
 tradition_yuankang_identity_name:0 "Yuankang Identity"
 tradition_yuankang_identity_desc:0 "Although our ancestors came from Kathun-Kai, we have developed our own unique culture. Today, we are people of Yuan-kang rather than Kathun-Kai."
 tradition_sarradon_legalistic_mercantilism_name:0 "Sarradon Legalistic Mercantilism"
 tradition_sarradon_legalistic_mercantilism_desc:0 "This culture adheres to a commercial code that blends legal traditions from the Sarradon region, emphasizing the guiding role of jurisprudence in business. It holds that a qualified merchant should abide by the law rather than engage in a single-minded pursuit of profit."
 tradition_dahangon_national_integration_name:0 "Dahangon National Integration"
 tradition_dahangon_national_integration_desc:0 "We have become deeply assimilated among the Tanarka people, and through prolonged interaction, we have acquired many local hues of Dahangon. This has made our culture more favored by the Tanarkans compared to other Kathuni traditions—we are not regarded as entirely alien."
 tradition_southsea_islander: "South-Sea Islander"
 tradition_southsea_islander_desc: "This culture has adapted to the turbulent seas and dynamic island environments of the South Sea region. Settlements of various sizes dot the scattered islands, while merchant vessels sail between them, weaving the archipelago into a closely-knit community." 
 tradition_dragonrider_cliques_name: "Dragonrider Cliques"
 tradition_dragonrider_cliques_desc: "The armies of this culture revolve around the machinations of many disparate cliques of feuding [Concept('dragons','dragonriders')|E]. While their armies may be disorganized and fall into the occasional [Concept('war_of_the_thousand_dragons','internal conflict')], when they reunite, the world shakes."

