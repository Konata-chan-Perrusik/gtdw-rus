 tradition_sand_skiffs_desc: "This culture has long held the secrets to wondrous technology known as [sand_skiffs|E] that are capable of navigating the [Glossary('Sarradonian Desert','sarradonian_desert_encyclopedia_desc')] as if it were a great sea."
