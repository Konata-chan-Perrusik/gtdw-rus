 artifact_votive_figure_name: "$artifact_name_prefix$ Aversarian Votive Figure"
 artifact_votive_figure_description: "An [Concept('aversaria','Aversarian')|E] sculpture of [SCOPE.Custom('ArtifactQuality')] craftsmanship. It is made out of [newly_created_artifact.GetFeatureText( 'votive_material' )] and is [newly_created_artifact.GetFeatureText( 'votive_carving' )].\n\n$artifact_votive_figure_explanation$ $artifact_votive_figure_age$"
 artifact_votive_figure_explanation: "[Concept('aversaria','Aversarians')|E] have long produced votive figures that were offered to sacred places across [aversaria|E]. Many depict the Aautokratirs, but other famous or powerful Aversarians are not uncommon."
 artifact_votive_figure_age: "This [newly_created_artifact.GetFeatureText( 'votive_characteristic' )]sample was likely made around the year [owner.MakeScope.Var('votive_age').GetValue|0]."

