l_english:
 
 artifact_gh_chaos_throne_name: "lirr'kesh ammm"
 artifact_gh_chaos_throne_desc: "Granted by the Void Gods to a deserving vessel, this throne is invisible from a distance - creating an illusion of the blessed Master floating through the air. It is only when one gets closer that they can see the true darkness within the throne, within themselves, within reality."