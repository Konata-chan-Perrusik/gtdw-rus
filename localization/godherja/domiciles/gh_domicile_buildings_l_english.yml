l_english:
 proving_grounds_mammoth_caravan_domicile_building: "Mammoth Caravan"
 proving_grounds_mammoth_caravan_domicile_building_desc: "#weak (Requires [GetDomicileBuilding('proving_grounds_01').GetName])#!\nA herd of hardy mammoths, the great beasts of the Old North, is a majestic—#EMP and terrifying#!—sight. Who could possibly bear to stand against someone who commands them?"
 proving_grounds_mammoth_caravan.tt.ate_mammoths: "You recently ate your mammoths"

 beetle_yurt_01_domicile_building: "Scarab-Rider [SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')]"
 beetle_yurt_01_domicile_building_desc: "A humble enclosure where hardy great scarabs are bred for pulling chariots. Trainers teach the basics of desert navigation, and instill the temperament needed to control these powerful beasts."
 beetle_yurt_02_domicile_building: "$beetle_yurt_01_domicile_building$"
 beetle_yurt_02_domicile_building_desc: "Improved breeding techniques yield stronger scarab. Chariot crews drill in dust storms, enhancing their effectiveness in warfare."
 beetle_yurt_03_domicile_building: "$beetle_yurt_01_domicile_building$"
 beetle_yurt_03_domicile_building_desc: "Specialized diets and armor enable the scarabs and their chariots to be faster and more resilient. Veterans share tactics for dominating the deep desert."
 beetle_yurt_04_domicile_building: "$beetle_yurt_01_domicile_building$"
 beetle_yurt_04_domicile_building_desc: "Elite scarabs are fitted with reinforced harnesses and chariot formations now exploit dunes for ambushes, striking fear across the sands."
 beetle_yurt_05_domicile_building: "$beetle_yurt_01_domicile_building$"
 beetle_yurt_05_domicile_building_desc: "A legendary strain of scarabs are cultivated, capable of prolonged marches through deep desert. Charioteers train to execute complex maneuvers in shifting sands."
 beetle_yurt_06_domicile_building: "$beetle_yurt_01_domicile_building$"
 beetle_yurt_06_domicile_building_desc: "The pinnacle of scarab mastery. Chariots become unstoppable forces, their thunderous charges turning deserts into graveyards."

 sand_skiff_yurt_01_domicile_building: "Sand-Skiff [SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')]"
 sand_skiff_yurt_01_domicile_building_desc: "A rudimentary repair station for priceless [sand_skiffs|E]. Respected members of the clan learn to harness their speed, improving both movement and trade across the dunes."
 sand_skiff_yurt_02_domicile_building: "$sand_skiff_yurt_01_domicile_building$"
 sand_skiff_yurt_02_domicile_building_desc: "Improved maintenance extends skiff range. Supply trains mimic their efficiency, allowing raiding parties to linger longer in deep desert."
 sand_skiff_yurt_03_domicile_building: "$sand_skiff_yurt_01_domicile_building$"
 sand_skiff_yurt_03_domicile_building_desc: "[sand_skiffs|E] are repurposed for reconnaissance. Raiding parties adopt better hit-and-run tactics, and can reach farther with lightning speed."
 sand_skiff_yurt_04_domicile_building: "$sand_skiff_yurt_01_domicile_building$"
 sand_skiff_yurt_04_domicile_building_desc: "Skiff routes stabilize remote oases. Settlements grow as trade networks expand, and cavalry raids grow deadlier."
 sand_skiff_yurt_05_domicile_building: "$sand_skiff_yurt_01_domicile_building$"
 sand_skiff_yurt_05_domicile_building_desc: "Master artisans are capable of restoring [sand_skiffs|E] nearly to their original glory. Pilots have become cultural icons, inspiring awe and fueling development."
 sand_skiff_yurt_06_domicile_building: "$sand_skiff_yurt_01_domicile_building$"
 sand_skiff_yurt_06_domicile_building_desc: "The last custodians of skiff-lore achieve miracles. Raiding parties rarely experience attrition in the desert, trade booms, and the clan's name spreads with every gust of wind."