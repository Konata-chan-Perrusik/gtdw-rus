l_english:
 # The Reach
 #c_ciderwell_desc: "This [county|E] has been covered in apple orchards since Kathanouxaic times, and its cider is known as some of the finest on the Shattered Coast."

 # Cornucopia
 c_gamlaberget_desc: "This [county|E] is well known for its abundance of Clanlander ruins, suggesting it was once a major trade port before being abandoned for unknown reasons."
  
 # Nattanan Region 
 c_nalmicn_quha_desc: "[Glossary('Nalmicn Quha','GH_NALMICN_QUHA_GLOSS')] is a place of the outcast, the dissident and the heretic. \n\n #color_dark_grey;italic \"Also in the third year of my reign, I restored virtue to the temple of Aungkan, which had become a home to great evil, whose priests had disgraced their station and (illegible). I cast them out into Nalmicn Quha to suffer among the ne'er do wells, the worshippers of Korlacu, the stray-paths, (illegible) and the cricket-eaters, for their offense against the Twin Gods was so great that even their death would not restore harmony to the land."#!$c_paths_edge_quote_attribution$"
 c_nalmicn_quha_quote_attribution: "\n  #color_dark_grey;italic ~ Taratalo Slab#!" 
 c_sugusuleaa_sugukya_desc: "The [Glossary('Sugusuleaa Sugukya','GH_SUGUSULEAA_SUGUKYA_GLOSS')] is a region of hills on the edge of Nattanan civilization. Locals have taken to herding sheep and other domesticated animals instead of hunting as Jerniem ordains and are thus known as Sugusuleaa or 'weak hunters'"
 c_sogo_tom_desc: "[Glossary('Sogo Tom','GH_SOGO_TOM_GLOSS')] is an isolated jungle valley where the Nattanan have held off those that threaten their lands for years beyond count. An ancient fortress in the mountain to the west contains ancient runes rumored to have once provided protection, but now serves primarily as a waystation for travelers."
 c_chan_jerniem_suleaan_desc: "[Glossary('Chan Jerniem Suleaan','GH_CHAN_JERNIEM_SULEAAN_GLOSS')] is said to be the favorite hunting ground of Jerniem the Hunter, making it a favored pilgrimage site for those that follow in his path."
 c_nen_nachan_desc: "[Glossary('Nen Nachan','GH_NEN_NACHAN_GLOSS')] a region of dense hills and deep gorges \n\n #color_dark_grey;italic \"In his typical low cunning, Thet Naung Zin chose the Serpent's Trail that winds through Nen Nachan as his route of attack; this in spite of all counsel against the move, for the area is well-known for its treacherous gorges in which many a hapless traveller lost his life. This folly would cost the king half his host by the time he finally reached Khupong." #!$c_dense_crags_quote_attribution$"
 c_dense_crags_quote_attribution: "\n  #color_dark_grey;italic ~ Sandalwood Chronicles#!" 
 c_nat_kan_desc: " [Glossary('Nat Kan','GH_NAT_KAN_GLOSS')] is where the Twin Gods struck down Akkharadahamma the Undying also known as the [Glossary('Akkhar Frecha','GH_AKKHAR_FRECHA_GLOSS')] who enslaved the north for centuries. His tomb is ever-guarded by the spirits of the dead that were oath-bound to prevent him from rising again in the deep spring underneath the hills and the ruins of his fortress."
 c_korle_lehtor_desc: "When Korlacu turned against the Twin Gods, he sought a place to establish his rule. In [Glossary('Korle Lehtor','GH_KORLE_LEHTOR_GLOSS')], within the [Glossary( 'Chan Kyawkorlacu', 'GH_CHAN_KYAWKORLACU_GLOSS' )], he forged a mighty fortress of metal and stone. Legend tells that it is here where the [Glossary('Korlo Rupan','GH_KORLO_RUPAN_GLOSS')] and [Glossary('Leh Rupan','GH_LEH_RUPAN_GLOSS')] were first forged, and where Korlacu first whispered his secrets to man."
 c_kuam_hullo_desc: "A peculiarity in the northern edge of the Nattanan Valley, [Glossary('Kuam Hullo','GH_KUAM_HULLO_GLOSS')] features strange trees with leaves growing low along the ground, and strange roots grasping unto the air. These roots boast magical properties, and are often used to craft the greatest bows of the Nattanan."
 c_adhit_tra_desc: "[Glossary('Adhit Tra','GH_ADHIT_TRA_GLOSS')] is said to be where the sun rests deep in the [Glossary( 'Chan Kyawkorlacu', 'GH_CHAN_KYAWKORLACU_GLOSS' )] - a belief bolstered by a red glow that flares in its peaks at night. The Korlacans prize stones quarried from this region for their unique property of bolstering conjured flames."
 c_moh_nalmicn_desc: "[Glossary('Moh Nalmicn','GH_MOH_NALMICN_GLOSS')] earned its name from the constant shroud of dense mist that covers the land — a peculiarity said to be a spell cast by the Twin Gods in the distant past. The mist is said to be a shield to their faithful, and those that mean them harm are led astray without ever finding a settlement."
 c_sogo_jern_desc: "The jungles of [Glossary('Sog Jern','GH_SOGO_JERN_GLOSS')] are notorious for the danger it presents to the unprepared. Still, hunters ever prowl the region despite its perils, for here alone can be found the [Glossary('Bin Nalmicaa','GH_BIN_NALMICAA_GLOSS')], whose hides are known to be supple as cloth, yet as durable as stone."
 c_carleh_sogotom_desc: "The [Glossary('Carleh Sogotom','GH_CARLEH_SOGOTOM_GLOSS')] takes its name from an ancient warlord’s fortress, destroyed when the Twin Gods and Korlacu freed the Nattanan. A crucible of heresy, it has seen many faiths rise and fall, leaving its current occupiers ever under the gaze of wary eyes."
