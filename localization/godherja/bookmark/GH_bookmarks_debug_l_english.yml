 bm_1200_the_empire_of_ash: "#debug The Empire of Ash#!"
 bm_1200_the_empire_of_ash_desc: "#debug Naught remains of Aversaria besides the ashes of its wonders and the bones of her children. The race of the pure, the true exemplars of humanity, the shining beacon of the Purest's grace in the sea of non-human barbarians... is gone, destroyed by its greatest exemplars.\n\nAautokratir Aeschraes fights to control his lands, claiming the devastation of Self Replicating Blood Magic and Frodbrokna are naught but proof that he still holds the right to rule Aversaria's corpse. Across the sea, Sarradon burns alongside Aversaria, and the north crumbles as the people of Katraddia race to escape what more and more name the Fog...#!"

 bm_1217_the_black_gold_league: "#debug The Black-Gold League#!"
 bm_1217_the_black_gold_league_desc: "#debug With the mysterious death of Dendon den va Seignon, Chevalie prepares for civil war. While Dendon's father was the dreaded Chrysé and the first High King to unite the Marchers in a generation, Dendon was always considered weak, too kind to stomp out the machinations of the unruly nobles and too afeared of the Liches to stop their increasingly brazen raids.\n\nIn opposition to his young and unexperienced son Gardfrei, the proud Valadecs and the ancient Monteaux have joined together in the Black-Gold League, pushing Gardfrei's cousin and childhood friend Teryn Valadec as their pretender to the throne despite accusations of their assassination of Dendon.\n\nWill the headstrong Gardfrei cement the Den va Seignon legacy and reunite the throne? Or will the Valadecs finally take the throne they've coveted for so many generations?#!"

 bm_1228_the_echoes_of_empire: "#debug The Echoes of Empire#!"
 bm_1228_the_echoes_of_empire_desc: "#debug Perhaps it is fitting that in the wait of Frodbrokna, the last aautokratir of [aversaria|E] reigns through repression and tyranny. Aautokratir Aeschraes sits upon an increasingly shaky foundation, ruling through an increasingly shaky network of assassins, bandits, and warlords. As the opposition mounts and Aversaria increasingly falls into anarchy, however, one must wonder how long Aeschraes has before his rebellious subjects or the growing hordes of northern refugees brings his dreams of grandeur to a bitter end...#!"
