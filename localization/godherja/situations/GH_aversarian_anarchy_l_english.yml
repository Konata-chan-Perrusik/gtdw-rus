 Etepezea_overview:0 "With [aversaria|E] in ruins, it is only a matter of time before the ancient heartland of [GetGeographicalRegion('governate_aversarian_etepezea').GetName|V] loses coherence. Severely depopulated, wartorn, ravaged by famine, and covered in dilapidated — and irreparable — infrastructure, even this most ancient of provinces will likely soon be lost to history.\n\nA wise Aversarian ruler might choose to embrace this future, and choose to build something new over the ruins. However, the memory of empire is not yet dead, and should order be restored to the Governorate, the old ways might prevail."
