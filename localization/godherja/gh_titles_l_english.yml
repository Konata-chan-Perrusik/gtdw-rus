 c_behemoths_lair_desc: "The 'behemoths' of cave-tribe legend — a hulking brown-furred bipedal beast with claws the size of a man and a mouth of jagged teeth — have yet to be seen by the few explorers who have entered these caves. Some scholars believe they had migrated out of the underworld some centuries before the [Concept('aversaria','Imperials')|E] even discovered the place, though to where they may have gone there is no answer."
