 c_new_yrim: "New Yrim"
 c_new_yrim_desc: "When Qasmud the Illuminated won the throne of [sarradon|E] after a bitter civil war, one of his first priorities was moving the royal seat away from Sihnamiyah, an act which he viewed as a clean break with a past steeped in pagan tyranny and decrepitude. For his new capital, he would choose a site in northeastern Kharadamat, naming it after the mythical Ritualist city of Yrim. For almost the entirety of the realm's remaining history, the kings of Sarradon would rule from this glittering metropole; and even after the kingdom was consigned to history, New Yrim would remain one of the most influential players in Kharadamatian politics."
