 c_epigrapheia: "Epigrapheia"
 c_epigrapheia_desc: "Epigrapheia was, throughout its millennia long history, often considered the greatest of the Thaliteian Hexapolis. The city's most famous landmark (which also gave it its name) are its ancient system of walls, which bear the accrued inscriptions of thousands of years of civilization upon nearly every free surface. Religious devotionals, royal biographies, mythological stories, and undecipherable texts in languages long lost to time are just some examples of the texts adorning Epigrapheia's primordial masonry."
