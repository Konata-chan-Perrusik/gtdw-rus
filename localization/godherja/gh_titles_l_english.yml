 c_aervalropolix: "Aervalropolix"
 c_aervalropolix_desc: "Also known by its ancient name of #EMP Aspomnox#!, Aervalropol was one of the great city-states of pre-Imperial [aversaria|E], and was most notable as the legendary birthplace of its school of [dead_magic|E]. Its worship of [aervalr|E] up to the age of the early Empire has resulted in its modern name. The region in the southern Imperial Isle where it once held hegemony is named after it to this day."
 b_phanara: "Phanara"
 b_thassontos: "Thassontos"
 b_magnaros: "Magnaros"
 b_sestamnus: "Sestamnus"
 c_aautokrateia: "Aautokrateia"
 c_aautokrateia_desc: "The fertile stretch of land between Argontia and Methoe was disputed by various poleis for centuries before the founding of the Empire until it was ultimately transferred to Dhaci'xen, the first Aautokratir, as a direct holding and source of income. For the next two centuries, the area would be one of the main sources of reliable taxes for the throne, though it would eventually lose its economic importance as vast stretches of wealthy land came into direct Imperial control with Aversaria's expansion. Despite this, it would remain a popular summer palace site for the rest of the Empire's history, even after ceasing to have any special administrative significance after Aautokrata Theyssia's 8th century reforms."
 b_chens: "Chens"
 b_myndessos: "Myndessos"
 b_palicos: "Palicos"
 c_argontia: "Argontia"
 c_argontia_desc: "The Seventeen Ships of Humanity of Aversarian myth supposedly made landfall here at the dawn of time, and the [county|E]'s name is a derivative of the word for 'ship'."
 b_protopol: "Protopol"
 b_pareos: "Pareos"
 c_methoe: "Methoe"
 c_methoe_desc: "This [county|E]'s name is a derivative of the old Aversarian word for wine, 'Mithox'; not only is it well-known for the quality of its vintage, but it was also the centre of numerous epicurean cults throughout history."
 b_amphorica: "Amphorica"
 b_amphorica_desc: "A proto-Aversarian deity of pleasure, M'phiris, had her most prominent centre of worship in this ancient city. It is also commonly regarded as the pioneer and likely namesake of the amphora vessel, though this has been hotly contested by the polis of Imphacro in Sarradon."
 b_koxis: "Koxis"
 b_koxis_desc: "An island in a sea of vineyards, this settlement's name is derived from the archaic word for 'red'."
 b_dorissos: "Dorissos"
 b_dorissos_desc: "Known as 'Tharix' in ancient times, the origin of this polis' name is uncertain."
 c_gortillaix: "Gortillaix"
 c_gortillaix_desc: "The city of Gortillai, situated near the western tip of the Imperial Isle, was one of the great city-states of pre-Imperial [aversaria|E]."
