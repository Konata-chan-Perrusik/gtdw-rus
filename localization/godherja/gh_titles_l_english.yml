 c_kamish_desc: "The Kamu were an ancient mountain tribe notorious for their regular raids into the Sihnamese heartland during the early history of the Kingdom of Sarradon, even briefly seizing its throne during the chaotic Iron-Crowns Period. Though they have long since vanished from history since their final subjugation in the 11th century BI, the eastern foothills of the Tasarnide Mountains are still named after them to this day."
