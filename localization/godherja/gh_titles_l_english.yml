 b_metricon: "Metricon"
 b_metricon_desc: "Metricon was once the sight of an imposing fortress founded by the once great Krustatti culture sometime in the 8th century BI. Porthoras, brother of Aautokratia Maklea, would be hidden there by the Malcoisiac military-nobility during her great Purges, leading to the two month Siege of Ghasts. Maklea would torment the garrison with horrifying visions until her brother was betrayed to her, and then allegedly 'burst him like a melon' while he begged for his life. The garrison commander would beg for the lives of himself and his soldiers, but after accidentally calling her 'terrible' instead of 'terrifying', half of the garrison would be killed and the other half imprisoned in the keep's catacombs — thereafter buried when Maklea razed the fortress with her [Concept('magic', 'magics')|E]."
