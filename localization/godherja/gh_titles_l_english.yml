 c_soterian_cities: "Sōterian Cities"
 c_soterian_cities_desc: "By the 10th century the northern chambers of the Imperial Atrium had become known as the 'Exsanian Cities' by the locals of its growing undercities, named after the controversial [Concept('first_men','First Woman')|E] of eclipses, dusk and the underworld. Upon the banning of the Exsanian Cults by Aautokratir Clytomedes after an alleged assassination attempt, Arch-Magi Axsia would purge over a hundred (alleged) Exsanian acolytes and ban the term, the Magisterial Council officially naming the region after its legendary gate shortly thereafter."
 b_gate_of_soter: "Gate of Sōter"
 b_gate_of_soter_article: "the "
 b_gate_of_soter_desc: "The legendary Gate of Sōter became legendary almost as soon as it was found, so large that a city could sit comfortably beneath its towering arch, the bars of its rent and broken portcullis larger than most towers. The massive piles of ancient metal scattered across the equally gargantuan 'gatehouse' would provide the Mayikrata with metals for nearly a century, and would be used to build the Black Gate from which thousands of cave beasts were beaten back early in the [mayikrata|E]'s settlement."
