 d_cormacans_cast_desc: "The great below echoes with tales of the Underking: Cormacan 'the Unbleeding'. Here it is said that he tamed the rockscair Dumuthand, and slew a thousand white-haired devils to purge their kind from the empire beneath the mountains. His body was said to remain unbloodied despite the hundred wounds inflicted upon him, and would turn to black stone upon the first touch of his daughter Kruttara."
