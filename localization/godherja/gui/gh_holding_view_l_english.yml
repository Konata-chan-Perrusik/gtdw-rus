l_english:
 HOLDING_VIEW_WASTELAND_COUNTY: "Uninhabited [county|E]"
 HOLDING_VIEW_TITLE_INFORMATION: "#T [Title.GetBaseNameNoTooltip]#!\n[Localize(Concatenate(Title.GetKey, '_desc'))]"
 COUNTY_HABITABILITY_TOOLTIP: "$holding_view_habitability_header$$holding_view_habitability_effects$$holding_view_habitability_warning$$holding_view_habitability_breakdown$$holding_view_habitability_threshold_breakdown$$holding_view_habitability_flavor$"
 COUNTY_HABITABILITY_TOOLTIP_OBSERVER: "$holding_view_habitability_header$$holding_view_habitability_breakdown$$holding_view_habitability_flavor$"
 holding_view_habitability_header: "#T County Habitability: [HoldingView.GetCountyTitle.MakeScope.ScriptValue('county_habitability_value')|0]/100 $holding_view_habitability_grade$#!"
 holding_view_habitability_effects: "\n[SelectLocalization( LessThan_CFixedPoint( HoldingView.GetCountyTitle.MakeScope.ScriptValue('county_habitability_value'), '(CFixedPoint)100' ), 'COLONIZATION_COST_PENALTY', 'COLONIZATION_COST_NO_PENALTY')]"
 COLONIZATION_COST_PENALTY: "[colonization|E] Cost is increased by [HoldingView.GetCountyTitle.MakeScope.ScriptValue('fast_habitability_penalty_value')|N%0]"
 holding_view_habitability_grade: "#weak ([HoldingView.GetCountyTitle.Custom('habitability_grade')|U])#!"
 habitability_grade_idyllic: "Idyllic"
 habitability_grade_untamed: "Untamed"
 habitability_grade_rugged: "Rugged"
 habitability_grade_nice: "Nice"
 habitability_grade_harsh: "Harsh"
 habitability_grade_inhospitable: "Inhospitable"
 habitability_grade_hostile: "Hostile"
 habitability_grade_damned: "Damned"
 habitability_alert_epiromnuvo: "\n@alert_icon! #alert_trial $setting_colonizable_epiromnuvo$ [eripomvuno_biozone|E] Game Rule is #bold not#! enabled#!"
 COLONIZATION_COST_NO_PENALTY: "No current effects, but if Habitability drops below 100, [colonization|E] will be slower and more expensive"
 holding_view_habitability_warning: "\n[AddTextIf(LessThan_CFixedPoint(HoldingView.GetCountyTitle.MakeScope.ScriptValue('county_habitability_value'),GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target',HoldingView.GetCountyTitle.MakeScope).ScriptValue('colonization_threshold_value')),Concatenate('@warning_icon! #X Habitability of this ',Concatenate(Concept('county','#E County#!'),Concatenate(' is below your #!',Concept('habitability_threshold','#E Habitability Threshold#!\n')))))]"
 holding_view_habitability_breakdown: "\nBase Habitability: #V 100#!#indent_newline:3 \n[HoldingView.GetCountyTitle.MakeScope.GetScriptValueDesc('county_habitability_value')|0]#!"
 holding_view_habitability_threshold_breakdown: "\n\n[habitability_threshold|E]: #V [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target',HoldingView.GetCountyTitle.MakeScope).ScriptValue('colonization_threshold_value')|0]#!#indent_newline:3 \n[GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target',HoldingView.GetCountyTitle.MakeScope).GetScriptValueDesc('colonization_threshold_value')|0]#!"
 holding_view_habitability_flavor: "\n\n#low The lands of [aeras|E] have been brought to ruin many times over the ages, leaving many corners of the world too [Concept('habitability','#E hazardous#!')] for human life and civilization.#!"

 COLONIZE_COUNTY_TOOLTIP: "[Character.GetPlayerInteractionWithTargetTitleTooltip('colonize_wasteland_interaction', HoldingView.GetCountyTitle)]\n\n#indent_newline:3 Cost: [GuiScope.SetRoot(GetPlayer.MakeScope).Custom('colonization_cost_currency')]#V [GuiScope.SetRoot(HoldingView.GetCountyTitle.MakeScope).AddScope('actor',GetPlayer.MakeScope).ScriptValue('colonization_cost_value')|0]#!\n[GuiScope.SetRoot(HoldingView.GetCountyTitle.MakeScope).AddScope('actor',GetPlayer.MakeScope).GetScriptValueDesc('colonization_cost_value')|0]#!"
 colonization_cost_currency_prestige: "[Concept('prestige','@prestige_icon!')]"
 colonization_cost_currency_gold: "[Concept('gold','@gold_icon!')]"
 colonization_cost_currency_piety: "[Concept('piety','@piety_icon!')]"

 HOLDING_TT_EMPTY_WASTELAND: "No Holding"
 CREATE_NEW_HOLDING_RUIN_BUTTON: "Settle Ruin Holding"
 CREATE_NEW_HOLDING_RUIN_BUTTON_TOOLTIP: "#T Settle [Concept('ruin_holding','Ruin')|E] [holding|E]#!\nSettle the [Concept('ruin_holding','Ruins')|E] in this [barony|E]\n[GetScriptedGui('settle_ruin_scripted_gui').BuildTooltip(GuiScope.SetRoot(Province.MakeScope).AddScope('actor', GetPlayer.MakeScope).End)]"
 CREATE_NEW_HOLDING_RUIN_HEADING: "Settle [Concept('ruin_holding','Ruin')|E] [holding|E]"
 CREATE_NEW_HOLDING_STILL_COLONIZING: "\n@warning_icon! #X This [county|E] is still undergoing [colonization|E]#!"
 SETTLE_RUIN_NOT_TRIBAL: "Your [government|E] type is [GetGovernment('tribal_government').GetName]"
 SETTLE_RUIN_TRIBAL_CAPITAL: "[Province.GetCounty.GetTitle.GetName] has a [tribal|E] holding"
 SETTLE_RUIN_EXTREME_DESERT: "[Province.GetTitle.GetName] has [GetModifier('extreme_desert_modifier').GetNameWithTooltip] [modifier|E]"
 COLONIZATION_PROGRESS_COOLTIP: "[colonization|E] Progress: [Concept('colonization','@colonization_progress_icon!')] #V [FixedPointToFloat(Holding.GetProvince.GetCounty.GetTitle.MakeScope.Var('colonization_story').Var('colonization_progress').GetValue)|1]/100#!"
 COLONIZATION_PROGRESS_OUTLINER: "[Concept('colonization','@colonization_progress_icon!')] #V [FixedPointToFloat(Holding.GetProvince.GetCounty.GetTitle.MakeScope.Var('colonization_story').Var('colonization_progress').GetValue)|1]/100#!"
 SETTLE_RUIN_HOLDING_TOOLTIP: "$SETTLE_RUIN_HOLDING_TOOLTIP_TITLE$\n$SETTLE_RUIN_HOLDING_TOOLTIP_FLAVOR$\n\n$SETTLE_RUIN_HOLDING_TOOLTIP_FIRST_STAGE$\n$SETTLE_RUIN_HOLDING_TOOLTIP_GOLD$\n\n$SETTLE_RUIN_HOLDING_TOOLTIP_COST$"
 SETTLE_RUIN_HOLDING_TOOLTIP_TITLE: "#T Construct [Localize(HoldingTypeItem.GetHoldingType.GetKey)|V]#!"
 SETTLE_RUIN_HOLDING_TOOLTIP_FLAVOR: "[AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'castle_holding'), 'building_type_castle_01_desc')][AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'city_holding'), 'building_type_city_01_desc')][AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'church_holding'), 'building_type_temple_01_desc')]"
 SETTLE_RUIN_HOLDING_TOOLTIP_FIRST_STAGE: "The first stage of this [holding|E] is the #V [AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'castle_holding'), 'building_castle_01')][AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'city_holding'), 'building_city_01')][AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'church_holding'), 'building_temple_01')]#!"
 SETTLE_RUIN_HOLDING_TOOLTIP_GOLD: "[AddLocalizationIf(LessThan_CFixedPoint(GetPlayer.GetGold, '(CFixedPoint)250'), 'SETTLE_RUIN_HOLDING_TOOLTIP_MISSING_GOLD')]"
 SETTLE_RUIN_HOLDING_TOOLTIP_MISSING_GOLD: "@warning_icon! #X Missing [Concept('gold','@gold_icon!')] [Add_CFixedPoint(Abs_CFixedPoint(GetPlayer.GetGold), '(CFixedPoint)250')|0]#!"
 SETTLE_RUIN_HOLDING_TOOLTIP_COST: "[Concept('gold','@gold_icon!')]#V 250#!"
 colonization_cost_value_base_desc: "Base Cost"
 colonization_cost_value_tribal_colonization: "Tribal Colonization"
 colonization_cost_value_habitability_penalty_desc: "Habitability"
 colonization_cost_value_overseas_desc: "Overseas"
 colonization_cost_value_land_grants_perk_desc: "[GetPerk('land_grants_perk').GetName(GetPlayer)]"