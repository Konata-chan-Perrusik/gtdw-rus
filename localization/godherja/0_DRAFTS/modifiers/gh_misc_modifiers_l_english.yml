 harbour_modifier: "Major Harbour"
 harbour_modifier_desc: "This province hosts a major world harbour in which goods from all over the world enter the bustling port. This brings in considerable income, ideas and people from all over [aeras|E]."
 
 entrepot_modifier: "Major Commerce Hub"
 entrepot_modifier_desc: "This territory is a hub of commerce. Here merchants can be found bringing precious cargo from as far afield as distant and mythical Kathun-Kai, and the tongues of over a hundred nations can be heard in its teeming markets and crowded ports. Nearly anything can be bought and sold — for the right price."
 stapleport_modifier: "Port brings Prosperity"
 
 pirate_king: "Pirate King"
 pirate_king_desc: "This character is known as the bane of the land, the taker of gold, the sinker of ships, and is feared wherever people live on the coast"
 
 scourge_of_rovarska: "Scourge of Rovarska"
 scourge_of_rovarska_desc: "This character is known as the greatest evil to reave the seas of the Pirate Coast, and has claimed more lives and gold than the sea itself"
 
 low_food: "Low Food"
 low_food_desc: "Due to poor planning, or bad luck, this character has lost provisions while hunting."
 
 surplus_food: "Surplus Food"
 surplus_food_desc: "Due to good planning or better luck, this character has provisions that will last far longer than expected."
 
 tribal_settlement_target: "Tribal Settlement Ongoing"
 tribal_settlement_target_desc: "This [county|E] is the destination of an influx of tribal settlers aligned with its overlord, to the chagrin of the local populace."
 
 small_island: "Small Islands"
 small_island_desc: "This county is an archipelago of many small islands."
 large_island: "Large Islands"
 large_island_desc: "This county is a small archipelago of many large islands."

 
 cyrat_hell_modifier: "Verdant Hellscape"
 cyrat_hell_modifier_desc: "The jungle of [Concept('cyrat_biozone','Cyrat')|E] itself seems to actively resist humanity, and is home to countless horrifying monsters. It is nearly impossible to survive in this place, much less build a civilization."

 cyrat_maa_modifier: "Impossible Logistics"
 cyrat_maa_modifier_desc: "In the jungle of [Concept('cyrat_biozone','Cyrat')|E], is is practically impossible to field any form of professional army."

 fools_curse_modifier: "Fool's Gold"
 fools_curse_modifier_desc: "The [Concept('fools_coast_biozone','Fools Coast')|E] is well known for the seemingly unending sources of gold found on its shores, as well as the deadly diseases that seem to follow the region's wealth wherever it goes."

 opakasijan_highkingdom_modifier: "Opakasijan Capital"
 opakasijan_highkingdom_modifier_desc: "Once devastated, the golden hills of Opakasija bloom once more, and people flock in droves to this mighty capital."
 high_tide_modifier: "High Tide"
 high_tide_modifier_desc: "This county is currently experiencing a [high_tide|E], flooding the wilderness."
 low_tide_modifier: "Low Tide"
 low_tide_modifier_desc: "This county is currently experiencing a [low_tide|E], exposing the soil."
 religious_turmoil: "Religious Turmoil"
 religious_turmoil_desc:  "This county is beset with religious turmoil."

 krikatama_purges_modifier: "Krikatama Purges"
 krikatama_purges_modifier_desc: "The merciless purges inflicted by the Scourge upon his people in his relentless crusade has severely compromised his capabilities in maintaining and launching further campaigns."

 banner_of_the_champion_modifier: "Banner of the Champion"
 banner_of_the_champion_modifier_desc: "The last bastion of Daramarjaratan in the region, Shahu valiantly rallies his people and those who fled the wrath of the Scourge against the Scourge himself."

 razed_sophocos_modifier: "Flame of Sophocos"
 razed_sophocos_modifier_desc: "This character is both revered and feared across [sarradon|E] for their brutal razing of the tower of Sophocos."

 isles_naval_expedition_modifier: "Naval Expeditions"
 isles_naval_expedition_modifier_desc: "This character is currently leading their realm on naval expeditions and colonization projects in the [shatteredisles|E]."

 isles_retribution_modifier: "Islander Champion"
 isles_retribution_modifier_desc: "This character has taken up arms against supposed invaders of the [shatteredisles|E]."

 quality_arrows_modifier: "High-Quality Arrows"
 quality_arrows_modifier_desc: "This character has a large stock of excellent arrowheads."
 barbed_arrows_modifier: "Barbed Arrows"
 barbed_arrows_modifier_desc: "This character's troops use wicked and deadly arrows."

 falcons_killing_rodents_modifier: "$cat_killing_rodents_modifier$"
 falcons_killing_rodents_modifier_desc: "This character's capital is almost entirely devoid of rats."

 vitrific_grace_modifier: "Vitrific Grace"
 vitrific_grace_modifier_desc: "You are the better version of yourself, now and forever."

 fogeater_recuperating: "Gathering Forces"

 recovery_efforts_modifier: "Recovery Efforts"
 recovery_efforts_modifier_desc: "This county is trying to rebuild after a devastating raid."

 county_neglect_modifier: "Neglected Recovery"
 county_neglect_modifier_desc: "This county has been left abandoned after a devastating raid."

 partic_secrets_revealed_modifier: "Revealed Religous Secrets"
 partic_secrets_revealed_modifier_desc: "This character has revealed the secrets and practices of their religion to outsiders."

 partic_secrets_severing_modifier: "Told of the Severing"
 partic_secrets_severing_modifier_desc: "This character has been taught the history of the [Concept('the_severing_of_the_vales', 'Severing of the Vales')|E] by a Partic close to them."
 partic_secrets_circles_modifier: "Told of the Partic Scions"
 partic_secrets_circles_modifier_desc: "This character knows of the [Concept('scions_of_the_greensea', 'Scions of the Greensea')|E], taught by a Partic close to them."
 partic_secrets_council_modifier: "Told of the Arch-Council"
 partic_secrets_council_modifier_desc: "This character has heard stories of the [Concept('the_druid_arch_council', 'Druid Arch-Council')|E] of the Partic, taught by a Partic close to them."

 extreme_desert_modifier: "Extreme Desert"
 extreme_desert_modifier_desc: "The sun-scorched sands of the Sarradonian Interior leave this county unsuitable for sustained human settlement\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -50#!"
 whisperveil_modifier: "Whisperveil"
 whisperveil_modifier_desc: "The depths of Whisperveil hide many unknown dangers, and only the brave or foolish (or both) dare to step under the dense forest canopies of the region\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -45#!"
 pristine_paradise_modifier: "Pristine Paradise"
 pristine_paradise_modifier_desc: "[eripomvuno_biozone|E] has sat untouched for millennia, unfettered by the countless attempts to settle it and claim its riches\n\n#flavor The island chain should be littered with dozens of ruined colonies — yet to this day, its shores remain as pristine as ever#!\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#positive_value +50#!"
 settling_ruins_modifier: "Settling Ruins"
 settling_ruins_modifier_desc: "This colony has been founded on an extensive ruin complex, which provides the settlers with shelter and materials\n[colonization_progress|E]: [Concept('colonization','@colonization_progress_icon!')]#positive_value +20%#!"
 legacy_of_eons_modifier: "Legacy of Eons"
 legacy_of_eons_modifier_name: "This county has been brought back into the fold of civilization, and its current inhabitants build upon the legacy of their forebearers"

 kadtarak_modifier: "Kadtarak"
 kadtarak_modifier_desc: "The lands surrounding the Kadtarak are not only broken from its impact, but also filled with an invisible miasma, which, alongside bright flashes of light that suddenly appear, instantly slay any who draws near.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -100#!"

 takaday_forest_modifier: "Takaday Forest"
 takaday_forest_modifier_desc: "The forest of Takaday is full of all manner of creatures and plants that pose a grave danger to any that brave to traverse it. It has long served as a natural barrier separating western Dahangon from the more inhospitable east, and only the most foolhardy of rulers have dared march their armies through its treacherous canopies.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -100#!"

 haryaadad_modifier: "The Eternal Night"
 haryaadad_modifier_desc: "The [sabar_lambay_raad|E] brought night unceasing unto Haryaadad, enshrouding it in a lightless void even long after the sun's return.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -60#!"

 dorajpor_modifier: "Consequences of Chojakaan"
 dorajpor_modifier_desc: "The [chojakaan_ka_ghatada|E] saw Dorajpor and its people burst into pillars of flame, scorching the land to naught but ash and dust.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -50#!"

 seared_outcast_modifier: "Anohêla Exile"
 seared_outcast_modifier_desc: "This character has been an branded as an [Concept('anohelis_outcasts','Anohêla')|E] and exiled from their homelands. Their scalp has been scorched and raked bare, and it will take years until the wounds heal\nCannot progress in the [GetTrait('lifestyle_gh_steppe_queen').GetName( GetNullCharacter )] [trait|E]"

 former_seared_outcast_modifier: "Former Anohêla Exile"
 former_seared_outcast_modifier_desc: "This character was once exiled as an [Concept('anohelis_outcasts','Anohêla')|E], but has since regained the right to rejoin the society. Their wounds have healed, yet the scars still linger"

 silky_locks_modifier: "Silky Locks"
 silky_locks_modifier_desc: "This character's hair is shiny and silky, inviting both envy and admiration from the onlookers"

 split_ends_modifier: "Split Ends"
 split_ends_modifier_desc: "This character's hair is fraying at the ends, giving them an unkempt and dishevelled appearance"

 toxic_lye_modifier: "Toxic Lye"
 toxic_lye_modifier_desc: "This character's hair fell out after being exposed to a particularly toxic lye\nCannot progress in the [GetTrait('lifestyle_gh_steppe_queen').GetName( GetNullCharacter )] [trait_level_track|E]"

 unproven_orzopaja_modifier: "Unproven Zsêrhêni"
 unproven_orzopaja_modifier_desc: "This character has been accepted into the ranks of [Glossary('Órzopajad','GH_ORZOPAJA_GLOSS')] as a [Glossary('Zsêrhêni','GH_ZSERHENI_GLOSS')], but has nothing to show for it"

 redlander_punishment_1: "Chains Upon the Heart"
 redlander_punishment_1_desc: "This character has tarried in doing the gods' bidding"

 redlander_punishment_2: "Chains Upon the Mind"
 redlander_punishment_2_desc: "This character has neglected the gods"

 redlander_punishment_3: "Chains Upon the Soul"
 redlander_punishment_3_desc: "This character has incurred divine wrath"

 mainland_refugees_modifier: "Mainland Refugees"
 mainland_refugees_modifier_desc: "The Isles have been overrun by hosts of mainland refugees pouring into the region.\n\n#N Will disappear entirely if held by a Redlander or after the year 1274 IS#!"

 redlander_runaway_stopped: "Prevented Escape from the Redlands."
 redlander_runaway_stopped_desc: "[GetHerHis] escape has been thwarted."

 redrunner_recruitment_effort: "Legion Recruitment"
 redrunner_recruitment_effort_desc: "The Legion has begun to step up its focus on supply and new soldiers."

 redrunner_recruitment_malus: "Pathetic Recruitment"
 redrunner_recruitment_malus_desc: "The Legion's trying its best to recruit new soldiers, but not to great effect."
 
 collapsed_administration_modifier: "Collapsed Administration"
 collapsed_administration_modifier_desc: "Local administration has disappeared practically overnight, causing cities to fall into disarray.\n\n#N Will disappear entirely if held by a [Concept('aversaria','non-Aversarian')|E] or after the year 1274 IS#!"

 patient_zero_modifier: "Patient Zero"
 patient_zero_modifier_desc: "This character became a host for the Fleshcurse"

 sacked_vounill_modifier: "Vounill Conqueror"
 sacked_vounill_modifier_desc: "This character became infamous for sacking the ancient [GetBuilding('01_vounill').GetName]"

 union_of_two_shores_modifier: "Union of Two Shores"
 union_of_two_shores_modifier_desc: "With the unification of the [kasiryat_biozone|E], counties along the river bask in the rich trade passing through their domain"

 city_of_kasiryat_county_modifier: "Fruits of the Kasiryat"
 city_of_kasiryat_county_modifier_desc: "As the master of the [kasiryat_biozone|E], this city commands awe and respect from all who view it"
 
 disguntled_populace_modifier: "Disgruntled Populace"
 disgruntled_populace_modifier_desc: "The inhabitants of this county have been deemed lesser by their overlord, provoking outrage and resistance among the peasantry"

 agadari_resurgence_culture_modifier: "Agadari Resurgence"
 agadari_resurgence_culture_modifier_desc: "[promote_culture|E] ($agadari_group$ cultures only) Speed: #P +75%#!"

 agadari_exodus_cyrat_modifier: "Agadari Exodus"
 agadari_exodus_cyrat_modifier_desc: "Despite their leader's stubborn refusal to leave [Concept('cyrat_biozone','Cyrat')|E], the inhabitants of this county have taken flight back to their ancestral homeland"

 exiled_one_modifier: "Exiled One"
 exiled_one_modifier_desc: "Banished from their ancestral homeland for their worship of Korlacu and their rejection of the teachings of the Twin Gods, this character is scorned by the Nattanan faithful."

 scourge_of_the_heretics_modifier: "Scourge of the Heretics"
 scourge_of_the_heretics_desc: "This character is a relentless instrument of divine wrath, feared by all who dare to defy the sacred doctrines of the Nattanan faith. With unyielding fervor, they have purged the land of heresy, leaving no refuge for the wicked. Their name is both a warning and a curse among those who oppose the purity of the true faith."


 restore_astilik_empire_culture_modifier: "Astilik Resurgence"
 restore_astilik_empire_culture_modifier_desc: "Large numbers of settlers are arriving in this [county|E] under the watchful gaze of the renascent [astilik_empire|E]\n[promote_culture|E] ([GetCulturePillar('heritage_kherkeloi').GetName] [cultures|E] only) Speed: #P +75%#!"

 heart_of_the_labyrinth_modifier: "Heart of the Labyrinth"
 heart_of_the_labyrinth_modifier_desc: "This character has braved the hungering darkness and reached the center of the [GetBuilding('01_abandoned_labyrinth').GetName]"

 kinilam_regency_modifier: "Kinilami Regent"
 kinilam_regency_modifier_desc: "This character rules their kingdom as a mere regent, their claim to throne little more than a scrap of paper."

 legitimate_kinilam_ruler: "Rightful Ruler of Kinilam"
 legitimate_kinilam_ruler_desc: "This character has established as the rightful ruler of Kinilam, overcoming years of regency and stagnation."

 legitimate_heirs_to_kinilam: "Heirs to the Sea Throne"
 legitimate_heirs_to_kinilam_desc: "This dynasty has become the ruling family of Kinilam, and enjoy all the rights and privledges therein."

 domineering_culture_modifier: "Domineering Culture"
 domineering_culture_modifier_desc: "Inhabitants of this county are unusually imperious and warlike, and are always eager to assert their dominance"

 harsh_subjugation_modifier: "Harsh Subjugation"
 harsh_subjugation_modifier_desc: "The people of this county are straining under an overbearing rule"

 adventurous_culture_modifier: "Adventurous Culture"
 adventurous_culture_modifier_desc: "The people of this county are not content with a quiet life"

 lasting_unity_modifier: "Lasting Unity"
 lasting_unity_modifier_desc: "This county is prospering through the efforts of its peoples"

 newborn_yuankang_republic_modifier: "Newborn Yuan-kang Republic"
 newborn_yuankang_republic_modifier_desc: "The newborn Republic is like a vibrant youth, and everything is efficient and fast."

 clear_kathunkai_culture_modifier: "Clear Kathunkai Culture"
 clear_kathunkai_culture_modifier_desc: "The policy of removing Kathun-Kai identity that we are implementing has caused many officials to have ideological confusion and greatly reduced administrative efficiency."

 corniche_modifier: "Coastal Avenue"
 corniche_modifier_desc: "The Dahangon Coastal Avenue is a road traversing the Takaday Forest, protected by countless fortresses and the soldiers garrisoned within them, offering some shelter to traveling merchants. As the only overland route connecting the east and west, the Dahangon Coastal Avenue holds significant value for both commerce and military purposes. Maintaining the road's efficiency is crucial for better governance of the Dahangon region."
 corniche_text_desc: "#weak Performance at 100% operational efficiency#!"

 corniche_range_modifier: "Coastal Avenue Range"
 corniche_range_modifier_desc: "This region is benefiting from the Dahangon Coastal Avenue. Merchants travel between areas once separated by the Takaday Forest, bringing substantial profits to the local rulers. However, it's important to note that the amount of this profit hinges on the condition of the road system's maintenance. Therefore, preserving this prosperity requires constant attention to the Coastal Avenue's operation."

