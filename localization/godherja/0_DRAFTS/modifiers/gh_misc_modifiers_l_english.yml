l_english:

 claimant_to_the_high_kingdom: "Claimant to the High Kingdom"
 claimant_to_the_high_kingdom_desc: "This character has, through pedigree, intrigue, or financial transaction, gained a [piece_of_the_broken_crown_concept|E]."
 
 adabyss_invasion_leader_modifier: "Lelmand"
 adabyss_invasion_leader_modifier_desc: "This character has been proclaimed the Lelmand, commander of the Amber Corps."

 champion_of_the_first_ring: "Champion of the First Ring"
 champion_of_the_second_ring: "Champion of the Second Ring"
 champion_of_the_third_ring: "Champion of the Third Ring"
 champion_of_the_fourth_ring: "Champion of the Fourth Ring"
 champion_of_the_fifth_ring: "Champion of the Fifth Ring"
 
 legacy_of_elysia: "Legacy of Elysia"
 legacy_of_elysia_desc: "The catastrophe at the Elysian Pass has left what remains of the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] berefit of fighting men for decades to come.\n\n#N Will disappear entirely if held by a [Concept('aversaria','non-Aversarian')|E] or after the year 1304 IS#!"
 
 legacy_of_icw: "Legacy of the Imperial Civil War"
 legacy_of_icw_desc: "Though it has been decades since the [imperial_civil_war|E] was brought to an end, its effects can still be felt throughout what remains of the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )].\n\n#N Will disappear entirely if held by a non-Aversarian or after the year 1286 IS#!"
 
 malcoisiac_anarchy: "Anarchy"
 malcoisiac_anarchy_desc: "Once the mining and logistical hub of [Concept('aversaria','Aversaria')|E], the death of Aversaria and the collapse of the region's Governorial institutions has led to the Malcoisiac Governorial Legions — once the only remaining ones in Aversaria — to be nearly completely wiped out. In there place, the slaves have completely taken much of the Governorate, and the once productive region now sits in economic freefall.\n\n#N Will only disappear from non-Aversarian [counties|E]#!"
 
 ruined_by_ulfirx: "Raided by Ulfirx"
 ruined_by_ulfirx_desc: "When Ulfirx and his merry drunk band came through these islands, they were undefeated and have drained the islands of many of its able men.\n\n#N Will disappear entirely if held by a [Concept('aversaria','non-Aversarian')|E] or after the year 1284 IS#!"
 
 freed_slaves: "Freed Slaves"
 freed_slaves_desc: "This character has earned a reputation as a liberator, earning the love of the despised and downtrodden, but also the ire of their former masters."
 
 cenware_cheat_modifier: "Favored by the Gods"
 cenware_cheat_modifier_desc: "Whether it be luck, destiny or matchless ability, this character seems to have the aid of the divine itself when working towards their goals."
 
 sarradonian_rebel_desertions: "Sarradonian Rebellion"
 sarradonian_rebel_desertions_desc: "The attack of the Father of Sarradon has sparked mass popular uprising in this province, directing their arms and money to fight against their foreign occupiers."

 aftermath_of_the_ash_war: "Aftermath of the Ash War"
 aftermath_of_the_ash_war_desc: "The inhabitants of the Black Mountains have suffered through [Concept('the_black_mountain_war','successive')|E] [Concept('ash_war','wars')|E], greatly depleting their manpower.\n\n#N Will disappear after 1264 IS#!"
 
 adabyss_opinion_modifier: "Awestruck Subjects"
 adabyss_opinion_modifier_desc: "Those conquered by the Adabyssian advance are struck by awe upon seeing their grand army and advanced technologies, and are unlikely to revolt against such a seemingly unstoppable force."
 
 gh_debased_currency_modifier: "Debased Currency"
 gh_debased_currency_modifier_desc: "By lowering the quality of their realms currency, and thus its value, this ruler has caused long term economic problems for their realm."
 
 gh_debased_currency_modifier_2: "Debased Quality Currency"
 gh_debased_currency_modifier_2_desc: "Despite enjoying a high quality and respected currency, this ruler has chosen to now reduce the quality, and thus its value, for short term gain."
 
 gh_strengthen_currency_modifier: "Strong Currency"
 gh_strengthen_currency_modifier_desc: "By introducing new economic measures, this ruler has improved the standing of their currency."
 
 gh_strengthen_currency_modifier_2: "Powerful Currency"
 gh_strengthen_currency_modifier_2_desc: "The introduction of new measures and quality coinage has significantly boosted this rulers economic power."
 
 gh_sjalvolki_resettlement_modifier: "Sjalvolki Resettlement"
 gh_sjalvolki_resettlement_modifier_desc: "A vast influx of migrants has invigorated the ailing prosperity of this county."

 gh_sjalvolki_resettlement_focus_modifier: "Sjalvolki Settler"
 gh_sjalvolki_resettlement_focus_modifier_desc: "This character was a part of the vast influx of migrants coming from the [foglands|E] and has settled in new lands."
 
 gh_sjalvolki_resettlement_focus_cenware_modifier: "Sjalvolki Settler"
 gh_sjalvolki_resettlement_focus_cenware_modifier_desc: "This character was a part of the vast influx of migrants coming from the [foglands|E] and has settled in new lands."

 gh_sjalvolki_rebuilding_focus_modifier: "Rebuilding"
 gh_sjalvolki_rebuilding_focus_modifier_desc: "This character has gained newfound economic independence & strength in the wake of migrants flowing through their lands."

 gh_imperrech_debuff_modifier: "Coalition"
 gh_imperrech_debuff_modifier_desc: "The Imperrech is less of a proper realm and more a coalition of wildly disparate tribes and peoples, and hence does not field a 'levy' in the classical sense of the word. The High King must instead rely on the voluntary contributions of his underlings."
 
 gh_sound_of_body: "Sound of Body"
 gh_sound_of_body_desc: "This character is unusually stubborn to the normal ravages of the world upon the body, either due to natural predisposition or an excellent daily routine."
 
 survived_dovatkning: "Patched up after the [dovatkning]"
 survived_dovatkning_desc: "After losing a round and being spared, you were hastily brought to a nearby healer who patched up the scrapes and wounds you have sustained." 
 INQUISITOR_CONVERSION_PERK_BONUS_VALUE: "Inquisitors uprooting heresy"
 conquered_by_the_sjalvolki: "Increasing Sjalvolki military business"

 boczoj_modifier: "Bóczoj"
 boczoj_modifier_desc: "This character is a [Glossary('Bóczoj','GH_BOCZOJ_GLOSS')], the appointed commander of Salazsek armies under the authority of the Kizengana"

 last_stand_of_the_clans_modifier: "Last Stand of the Clans"
 last_stand_of_the_clans_modifier_desc: "This character controls a great host, yet it threatens to disintegrate beneath them"

 daughters_of_the_sky_modifier: "Daughters of the Sky"
 daughters_of_the_sky_modifier_desc: "This house has united the disparate Sarminian tribes under the new royal authority"
 
