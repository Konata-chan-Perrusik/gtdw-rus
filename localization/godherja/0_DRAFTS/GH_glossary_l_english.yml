 # Amsari Language
 GH_ZENDA_GLOSS: "Meaning 'The Prophecy', the [gh_zenda|E] is the book of divine revelations in Zaoranian beliefs."
 GH_SAZAN_MAHNDAZI_GLOSS: "Sazān, meaning 'that which is declared' and Mahndāzi, meaning 'virtues,' often translated as 'The Testimony of Virtues.'  [gh_sazan_mahndazi|E] is the sacred book of moral guidance and rituals within Zaoranian beliefs."
 GH_UNIJ_KAHDERZ_GLOSS: "Meaning 'House of Illumination,' Unij-e Kahderz is the foremost center of learning in [amsar|E]."
 GH_ARSIN_ZAH_NUMAK_GLOSS: "The Ārsin-Zah Numak, meaning Bind-Cursed Oath in Amsari, refers to the oath imposed on Qanamsar Ashakhet in the late 7th century. Enforced through the Keening Wall, a Sirhad-devised enchantment, it drained the souls of any Amsari bearing arms who attempted to cross into Wardenite lands. For three centuries, the Numak remained unbroken until Qanamsar Aushedar, with the aid of his Frazan-Magi, shattered the enchantment and led his forces on Wardenite lands for the first time."
 GH_WUJADIH_GLOSS: "Wujādih is the Amsari term used to refer to the various [sirhad|E] cabals, borrowed and derived from an older local form, Wujāhida, once a common word to describe the cabals across [Glossary('#G_light Erd Lakhdir#!,'GH_ERD_LAKHDIR_GLOSS)]."
 GH_ERD_LAKHDIR_GLOSS: "Meaning 'The Green/Verdant Territory' in Old Thalite, Erd Lakhdir was the name given to the coast later known as the Ayyar Coast, prior to the migration of the early 8th century. Though less popular today, the term is still occasionally used."
 GH_QHESH_ILAHIA_GLOSS: "Term used by the thyssaen to refer to their region in [amsar|E]."


# Kathunian language
 GH_CEOVBAISE_GLOSS: "From [GetCulturePillar('language_easterner').GetName] #italic Ceov Báise#!, meaning #italic [Concept('the_fog','The Fog')|E]#!."
 GH_NOLAN_GLOSS: "It referred to as [naklan_the_golden|E] in the [GetCulturePillar('language_easterner').GetName] [language|E]."
 GH_YUYDU_GLOSS: "Yuydu is a new name given to [GetBuilding('02_dawang_tarmak').GetName] by the kathuni ruler, It represents the long-term expectation of the chinlin royal family for their rule."
 GH_HIGH_WALL_GLOSS: "In Kathuni society, those specialized cities built for a specific purpose are called High Wall."
 GH_OVERTHROW_THE_MANDATE_OF_HEAVEN: "In the society of Kathuni, this term is generally used to describe the process by which the First of Dragon overthrew the theocratic rule of [yizhou|E] and established Kathun-Kai, interpreting the actions of Yao Ren Cai as a righteous act aligned with the popular will rather than a rebellion. After [Concept('frodbrokna','Tianqing')|E], it was further employed by Xin Xue to legitimize the overthrow of the old systems and the establishment of a new order of universal harmony."
