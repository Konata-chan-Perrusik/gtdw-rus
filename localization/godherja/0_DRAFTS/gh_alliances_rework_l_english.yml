 #Game Concept
 game_concept_gh_defensive_alliance:0 "Defensive Alliance"
 game_concept_gh_defensive_alliances:0 "Defensive Alliances"
 game_concept_gh_defensive_alliance_i:0 "@defensive_alliance_icon!"
 game_concept_gh_defensive_alliance_desc: "A $game_concept_gh_defensive_alliance$ is a diplomatic relation between two [rulers|E]. Unlike [Concept('alliance', 'Full Alliances')|E], defensive alliances are formed solely for mutual protection. $game_concept_allies$ will only join each other's [wars|E] when they are defending.\n\n$game_concept_gh_defensive_alliances$ can be created and maintained through a [marriage|E] or [betrothal|E], as long as the two characters who are wed are closely enough related to the two Rulers. For example, if a [king|E] marries off his daughter to another King's son, the two Kings become $game_concept_allies$.\n\nBoth $game_concept_gh_defensive_alliances$ and full [Concept('alliance', 'Full Alliances')|E] can also be negotiated directly.\n\n[lieges|E] can also create $game_concept_alliances$ with their [vassals|E]. The Liege cannot call the Vassal to War, but it prevents them from joining [factions|E]."

 #Game Rule
 rule_gh_alliance_mechanic: "@godherja_logo! Alliance Mechanics"
 setting_godherja_alliance_default: "Default"
 setting_godherja_alliance_default_desc: "Marriage no longer directly grant [alliances|E], but instead create a [truce|E] between the two parties. [gh_defensive_alliances|E] and full [alliances|E] are treated as separate mechanics and must be negotiated. Allies from [gh_defensive_alliances|E] will only join defensive [war|E]."
 setting_vanilla_alliance: "#high Vanilla#!"
 setting_vanilla_alliance_desc: "Marriage pacts grant full [alliances|E] automatically, as in vanilla gameplay. [gh_defensive_alliances|E] are disabled, and all allies may be called to both offensive and defensive [wars|E]."