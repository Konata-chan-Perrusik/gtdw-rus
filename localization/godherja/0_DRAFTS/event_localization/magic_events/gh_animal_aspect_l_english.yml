l_english:

 # Initial Event
 magic.9100.t: "Communion with the Wild"
 magic.9100.desc: "The ritual circle is prepared, the incense burns with an otherworldly fragrance, and the boundary between the mundane and magical grows thin. Through this ancient rite, I may attune my spirit to a creature of the wild, binding a fragment of its essence to my own.\n\nThe process is not without risk — the spirits that answer such calls are unpredictable, and I may need to reject unsuitable bonds before finding one that resonates with my soul. But should I succeed, I will carry a piece of that creature's nature within me forever."
 magic.9100.a: "Begin the search for a kindred spirit"
 magic.9100.b: "The time is not right for this ritual"

 # Magical Creature
 magic.9101.t: "A Magical Creature Appears"
 magic.9101.desc: "The air shimmers with ethereal light as a creature of pure [magic|E] manifests before me. Its form shifts and flows like living starlight, radiating an aura of arcane power that makes my skin tingle. This being exists between worlds, a creature born of raw magical essence.\n\nTo attune with such a being would deepen my connection to the celestial forces and the natural flow of [magic|E] itself. I would gain insight into the fundamental nature of the arcane arts."
 magic.9101.a: "Attune with this magical creature"
 magic.9101.b: "This is not the spirit I seek"

 # Fodder Creature
 magic.9102.t: "A Common Creature Appears"
 magic.9102.desc: "A humble creature emerges from the shadows — nothing impressive at first glance. A scavenger, a survivor, the kind of beast that adventurers dismiss as mere fodder. Yet there is wisdom in its eyes, the cunning of countless generations that have endured where greater beasts have fallen.\n\nTo attune with such a creature would grant me its resilience, its stubborn will to survive against all odds. Sometimes the greatest strength lies in simply refusing to die."
 magic.9102.a: "Attune with this humble survivor"
 magic.9102.b: "I seek something greater"

 # Humanoid Creature
 magic.9103.t: "A Humanoid Creature Appears"
 magic.9103.desc: "The ground trembles as a massive humanoid form lumbers into view — a troll, ogre, or perhaps something even older. Its muscles ripple beneath thick hide, and its eyes hold a primal intelligence. These creatures have walked [aeras|E] since before the rise of civilization, and their strength is legendary.\n\nTo attune with such a being would grant me a portion of its raw physical power and the intimidating presence that makes lesser beings flee in terror."
 magic.9103.a: "Attune with this mighty humanoid"
 magic.9103.b: "Brute strength is not what I seek"

 # Intelligent Creature
 magic.9104.t: "An Intelligent Creature Appears"
 magic.9104.desc: "The creature that manifests before me regards me with eyes that hold depths of ancient wisdom. Whether sphinx, sage-serpent, or something stranger still, this being has accumulated knowledge across centuries of existence. It speaks not with words, but with thoughts that brush against my mind like silk.\n\nTo attune with such a creature would sharpen my intellect and grant me insights into the hidden workings of the world. Secrets long buried would become clearer to my enhanced perception."
 magic.9104.a: "Attune with this wise being"
 magic.9104.b: "I seek a different kind of wisdom"

 # Inorganic Creature
 magic.9105.t: "An Inorganic Creature Appears"
 magic.9105.desc: "Stone grinds against stone as a creature of living rock takes form before me. Whether elemental, golem, or some primordial spirit of the earth itself, this being knows nothing of flesh and blood. It is eternal, unchanging, patient beyond mortal comprehension.\n\nTo attune with such a creature would grant me a portion of its incredible durability. My body would become more resilient, better able to withstand the ravages of battle and time."
 magic.9105.a: "Attune with this enduring spirit"
 magic.9105.b: "I am not ready to become stone"

 # Enormous Creature
 magic.9106.t: "An Enormous Creature Appears"
 magic.9106.desc: "The very earth shakes as something vast approaches. A titan, a leviathan, a beast of such immense proportions that my mind struggles to comprehend its scale. Where it walks, the world itself seems to bend in acknowledgment of its presence.\n\nTo attune with such a creature would grant me a fraction of its overwhelming presence. Armies would quail before me, and my very footsteps would carry the weight of ancient power."
 magic.9106.a: "Attune with this colossal being"
 magic.9106.b: "Such power would be too conspicuous"

 # Monstrous Creature
 magic.9107.t: "A Monstrous Creature Appears"
 magic.9107.desc: "What emerges from the shadows defies natural law — a chimeric horror, a thing of fused flesh and impossible anatomy. Multiple heads, too many limbs, features that belong to a dozen different beasts all merged into one nightmarish whole. It is beautiful in its grotesquerie, perfect in its wrongness.\n\nTo attune with such a creature would grant me power drawn from chaos itself. I would become something more than human — and perhaps something less as well."
 magic.9107.a: "Attune with this aberrant being"
 magic.9107.b: "Some bonds are too dangerous to forge"

 # Incorporeal Creature
 magic.9108.t: "An Incorporeal Creature Appears"
 magic.9108.desc: "The temperature plummets as a presence manifests — not truly visible, but felt. A ghost, a wraith, a spirit unbound by flesh. It exists between the world of the living and whatever lies beyond, seeing truths hidden from mortal eyes.\n\nTo attune with such a creature would thin the veil between myself and the spirit world. I would perceive things others cannot, but I would also draw the attention of things best left unnoticed."
 magic.9108.a: "Attune with this spectral being"
 magic.9108.b: "I will not court the attention of the dead"

 # Extremely Dangerous Creature
 magic.9109.t: "Something Terrible Approaches"
 magic.9109.desc: "Every instinct screams at me to flee. What manifests before me is a apex predator of the highest order — an ancient dragon, a demon lord, a being of such overwhelming power that my ritual circle feels like a child's drawing against it. Its mere presence is oppressive, suffocating.\n\nTo attune with such a creature would grant me power beyond imagining — but also mark me forever. I would carry a piece of this horror within my soul for the rest of my days."
 magic.9109.a: "Steel myself and attune with this terrible being"
 magic.9109.b: "Even I am not so foolish"

 # Rejection Events
 magic.9110.t: "The Search Continues"
 magic.9110.desc.first_rejection: "The creature fades back into the ethereal realm, and the ritual circle pulses with renewed energy. There are other spirits that might answer my call — I need only reach out again. But I sense that the window for this communion will not remain open forever."
 magic.9110.desc.second_rejection: "Again I have rejected a potential bond, and I feel the magical energies growing weaker. The spirits grow wary of one who spurns their offerings so readily. I may have one more chance to find a suitable creature, but no more."
 magic.9110.desc.final_rejection: "The ritual circle flickers and dies. I have rejected too many offerings, and the spirits have withdrawn their presence. The opportunity for attunement has passed — at least for now. Perhaps in time, I may attempt this ritual again."
 magic.9110.a: "Search for another spirit"
 magic.9110.b: "Abandon the ritual"
 magic.9110.c: "Accept that the spirits have departed"

 # Failure Event
 magic.9111.t: "The Spirits Depart"
 magic.9111.desc: "The last wisps of magical energy dissipate into the night air, leaving me alone in the darkened ritual space. I was too selective, too hesitant, and now the opportunity has slipped through my fingers like smoke.\n\nThe exhaustion of the failed ritual settles into my bones. It will be some time before I have recovered enough to attempt such a communion again."
 magic.9111.a: "Accept this failure and move on"

 # Success Event
 magic.9120.t: "The Bond is Forged"
 magic.9120.desc: "Power flows through me like lightning through a copper wire. The creature's essence merges with my own, not replacing what I am but adding to it, expanding my capabilities in ways I am only beginning to understand.\n\nI am changed now, forever marked by this communion. When I close my eyes, I can still sense the creature's presence, a constant companion bound to my very soul. Whatever challenges lie ahead, I will face them with this new strength."
 magic.9120.a: "Embrace this new power"

 # Tooltips
 animal_attunement_magical_tooltip: "You will gain bonuses to [learning|E], [arcana|E], and [piety|E], along with increased [lifestyle|E] experience gain."
 animal_attunement_fodder_tooltip: "You will gain bonuses to [health|E] and [stress|E] resistance, becoming remarkably hard to kill."
 animal_attunement_humanoid_tooltip: "You will gain bonuses to [prowess|E], [martial|E], and [dread|E], becoming a more fearsome warrior."
 animal_attunement_intelligent_tooltip: "You will gain bonuses to [learning|E] and [intrigue|E], along with improved [scheme|E] capabilities."
 animal_attunement_inorganic_tooltip: "You will gain significant bonuses to [health|E] and [prowess|E], becoming incredibly resilient."
 animal_attunement_enormous_tooltip: "You will gain bonuses to [martial|E], [prowess|E], and [prestige|E], along with improved army performance."
 animal_attunement_monstrous_tooltip: "You will gain powerful bonuses to [prowess|E] and [dread|E], but suffer [opinion|E] penalties with others."
 animal_attunement_incorporeal_tooltip: "You will gain bonuses to [intrigue|E] and [scheme|E] defense, but become more susceptible to [stress|E]."
 animal_attunement_dangerous_tooltip: "You will gain exceptional bonuses to combat abilities, but suffer [opinion|E] penalties and increased [stress|E] gain."

