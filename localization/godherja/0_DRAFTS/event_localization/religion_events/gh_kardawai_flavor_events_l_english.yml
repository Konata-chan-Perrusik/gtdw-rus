l_english:

 kardawai_flavor.0002.t: "Fate of the Fallen"
 kardawai_flavor.0002.desc.intro: "The battlefield is silent.\n\nNot even a day ago, the [combat_location.Custom('GetTerrainTypePlural')] of [combat_location.GetName] ran red with blood — steel, men, and beasts clashing in brutal combat. We were victorious, and now the land lies littered with the fallen warriors of [combat_loser.GetTitledFirstName]. Did [combat_loser.GetSheHe] know any of their names, I wonder? Did they believe in what they fought for?\n\n"
 kardawai_flavor.0002.desc.killer: "Still lost in thought, I retrace my steps from yesterday and come upon the corpse of [skull_donor.GetFullNameRegnal], whom I slew in the fight. [skull_donor.GetHerHis|U] wounds are many, but the skull appears intact."
 kardawai_flavor.0002.desc.casualty: "I walk among the dead until I spot the corpse of [skull_donor.GetFullNameRegnal], who perished in the fight. [skull_donor.GetHerHis|U] wounds are many, but the skull appears intact."
 kardawai_flavor.0002.a: "A fine addition to my collection!"
 kardawai_flavor.0002.a.flavor: "Through [skull_donor.GetHerHis] spirit, I claim [skull_donor.GetHerHis] strength."
 kardawai_flavor.0002.b: "Set [skull_donor.GetHerHis] spirit free."
 kardawai_flavor.0002.b.flavor: "The fallen need not suffer so."

 kardawai_flavor.1000.t:0 "A Feast for Kardwen"
 kardawai_flavor.1000.desc:0 "Returning from our raid, my soldiers have brought back several captives taken by me personally during our reaving. As a Kardawai of high rank it's my right to take my first feast from these defeated soldiers, and secure my place in the afterlife."
 kardawai_flavor.1000.a:0 "As Kardwen did to the Lothbroki, so shall I do to them!"
 kardawai_flavor.1000.b:0 "No, I don't think I will."
 kardawai_flavor.1001.t:0 "A Feast for Kardwen"
 kardawai_flavor.1001.desc:0 "As I rest after the battle, my soldiers have bring in several captives, soldiers defeated by me personally during the fighting. As a Kardawai of high rank it's my right to take my first feast from these defeated soldiers, and secure my place in the afterlife."
 kardawai_flavor.1001.a:0 "As Kardwen did to the Lothbroki, so shall I do to them!"
 kardawai_flavor.1001.b:0 "No, I don't think I will."