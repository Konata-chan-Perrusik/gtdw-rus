l_english:
 sjalvolki_reformation.0011.t: "The Preacher"
 sjalvolki_reformation.0011.desc: "The famed preacher, [sjalvolki_reformer.GetFullNameNicknamed] has, after having swayed nearly every noble in my court, finally appeared before my throne. Despite his disheveled appearance, his influence among both the nobility and peasantry alike means I have to at least hear him out.\n\nHe introduces himself briefly before entering into his request. According to this preacher, the Sjalvolki realms will fall to infighting over petty differences and the faith will be subsumed by the more organized religions that live in our midst. They ask for assistance in recording the various Sjalvolki beliefs throughout my realm to compile in a book that will guide followers to salvation in the final war. He states that, although his mission is going along well, he is limited by the fact that he is only a single man. My aid would be incredibly useful for his cause.\n\nMy choices are simple. I can choose to banish him from the realm, hopefully curtailing his influence. Doing nothing — allowing him to say his piece before moving on — is likely the least risky option, however might also allow his faith to take root. His ideas do sound interesting, such as centralization perhaps allowing me to improve my realm. Though it would be risky, I could also try to capture and execute him, though the death of holy men has an unfortunate tendency to create more of them."
 sjalvolki_reformation.0011.a: "Have this [SelectLocalization(ROOT.Char.HasTrait(GetTrait('zealous').Self),'heretic','wretch')] executed!" 
 sjalvolki_reformation.0011.b: "[sjalvolki_reformer.GetSheHe|U] can preach [sjalvolki_reformer.GetHerHis] drivel elsewhere."
 sjalvolki_reformation.0011.c: "Eh, this is none of my business."
 sjalvolki_reformation.0011.d: "[sjalvolki_reformer.GetSheHe|U] does have a point..."
 
 sjalvolki_reformation.0012.t: "Acolytes of the Preacher"
 sjalvolki_reformation.0012.desc: "A group of shamans burst into my court proselytizing the words of the Preacher. They are a diverse lot, young and old, hailing from different corners of the Sjalvolki homeland. However, they all share a fire in their eyes that I cannot ignore.\n\nThey warn that a new world has formed, and the Sjalvolki must change with it. Without an organizational structure of the faith, they state, the Sjalvolki realms will fall to infighting over petty differences and the faith will be subsumed by the more organized religions that live in our midst. They ask for assistance in recording the various Sjalvolki beliefs throughout my realm to compile in a book that will guide followers to salvation in the final war. Then, they hand me a tome of their efforts so far. As I assess their writing, I realize that it is not just a collection, but a merging of different tales into a single, comprehensive narrative.\n\nThey state that if the Preacher's efforts take root, the Sjalvolki faith will no longer be disparate. Followers will still be able to continue their old ways while knowing they have the same beliefs as a Sjalvolki thousands of miles away. The new faith needs the realm's shamans to chronicle their own stories and to spread the word."
 sjalvolki_reformation.0012.a: "Have these syncophants executed."
 sjalvolki_reformation.0012.b: "Banish them!"
 sjalvolki_reformation.0012.c: "Let them speak"
 sjalvolki_reformation.0012.d: "They have a point..."
 
 sjalvolki_reformation.0031.t: "The Death of a Preacher"
 sjalvolki_reformation.0031.desc: "Our holy founder, [sjalvolki_reformer.GetFullNameNicknamed], has died.\n\nA few of his most devoted adherents have cried foul, citing that his death has benefitted his enemies greatly, and it is clear that his death was through underhanded trickery, or open murder. The followers of the [GetTitleByKey('c_oraispol').GetNameNoTier] Rite mourn his passing and have promised to continue his work in finally organizing the faith to face this new world."
 sjalvolki_reformation.0031.a: "This is going to get ugly."
 
 sjalvolki_reformation.0202.t: "The Veloscoup"
 sjalvolki_reformation.0202.desc: "Only a decade after the birth of the [GetTitleByKey('c_oraispol').GetNameNoTier] Rite, the faith is already strained. And yet, it is still shocking when a priest presents himself at my court, claiming that he has been chosen by the a group of high priests to guide the Sjalvolki in their time of crisis, as evidenced by the struggling unity of the faith. In a self-righteous tone, he explains that I must accept his authority as the Veloschosen, and aid him in bringing the decentralized chaos that has arisen since the death of the Preacher. He is backed by the ailing remnants of several of the ancient stewards of the Sjalvolki faith, having survived the [Concept('sjalvolki_migration','Migrations')|E] and, at least supposedly, maintained spiritual authority.\n\nHowever, there is another possibility. His authority is based, in effect, on self-proclamation, as he is the chosen leader of a self-declared high priesthood. Other theologians have also presented their thoughts to me, suggesting that perhaps it is the High King that we must look towards for an example. They claim that the triumphs of the Imperrech prove that the Sjalvolki need a strong leader to guide them into the future. Were I to accept this, it would certainly be controversial, for the Imperrech is understood to have dissolved with the Witch-Breaker's death. However, the scholars highlight, some of his recorded statements suggest that it was never truly meant to be unique, and that by becoming something which they describe as a Holy King, and leading the followers of [Glossary('Velos','VELOS_GLOSS')] into a new age of glory, I would merely be fulfilling Cenware's intentions.\n\nWhatever I choose, it is likely that another ruler will claim the mantle I deny, so I must be ready to uphold the faith, whatever may come."
 sjalvolki_reformation.0202.a: "The Veloschosen has been sent by the divine."
 sjalvolki_reformation.0202.b: "I will take up this Holy Kingdom."
 sjalvolki_reformation.0202.c: "I will remain with the Preacher's path." 
 
 sjalvolki_reformation.0203.t: "[piety_embracer.GetFirstNameNoTooltip] Embraces the Velosgrave Rite"
 sjalvolki_reformation.0203.desc: "Heralds have arrived in my court, bearing distressing news. The [GetTitleByKey('c_oraispol').GetNameNoTier] Rite, so recently born, has now been torn asunder. Heeding the words of the self-appointed leader of the faithful, [piety_founder.GetFirstName], [piety_embracer.GetFirstNameNoTooltip] has proclaimed his support for a designated priesthood, which has itself claimed leadership of all of the faithful. Already, messages travel across the Sjalvolki realms, demanding that the other great rulers accept their spiritual authority.\n\nIn response, several skilled philosophers, priests, and theologians have flocked to my court, demanding that I aid them in tearing down this usurper, and any who aid him. Instead, they request that I accept the mantle of a Holy King, taking up the spiritual authority of the great Witch-Breaker, and helping to guide the followers of [Glossary('Velos','VELOS_GLOSS')] into the future. They claim that the Imperrech was always meant to be succeeded, and that it is my sacred duty to lead them to glory. In such times, they say, I have no choice but to accept."
 sjalvolki_reformation.0203.a: "I will take up this Holy Kingdom"
 sjalvolki_reformation.0203.b: "I will follow the Preacher's path"
 
 sjalvolki_reformation.0204.t: "[piety_embracer.GetFirstNameNoTooltip] Embraces the Velosgrave Rite"
 sjalvolki_reformation.0204.desc: "Heralds have arrived in my court, bearing distressing news. The [GetTitleByKey('c_oraispol').GetNameNoTier] Rite, so recently born, has now been torn asunder. In response to the declaration of spiritual authority by [piety_founder.GetFirstName], [authority_founder.GetFirstName], [piety_embracer.GetFirstNameNoTooltip] has instead proclaimed himself as the leader of a new 'Holy Kingdom', which has itself claimed leadership of all of the faithful. Already, messages travel across the Sjalvolki realms, demanding that the other great rulers accept their spiritual authority.\n\nIn response, the supporters of the Veloscoup have flocked to my court, including [piety_founder.GetFirstName], demanding that I aid them in tearing down this usurper, and any who aid him. Instead, they request that I accept the authority of the Veloschosen, supporting the spiritual authority of the ancient priests of the Velosgrave, and helping them to guide the followers of [Glossary('Velos','VELOS_GLOSS')] into the future. They claim that as one of the oldest and most prestiguous groups in the Sjalvolki faith, it is their perogative to lead their fellows. In such times, they say, I have no choice but to heed them."
 sjalvolki_reformation.0204.a: "The Veloschosen has been sent by the divine."
 sjalvolki_reformation.0204.b: "I will follow the Preacher's path"
 
 sjalvolki_reformation.0205.t: "The Veloscoup"
 sjalvolki_reformation.0205.desc: "Only a decade after the birth of the [GetTitleByKey('c_oraispol').GetNameNoTier] Rite, the faith is already strained. And yet, it is still shocking when a priest presents himself at my court, claiming that he has been chosen by the a group of high priests to guide the Sjalvolki in their time of crisis, as evidenced by the struggling unity of the faith. In a self-righteous tone, he explains that I must accept his authority as the Veloschosen, and aid him in bringing the decentralized chaos that has arisen since the death of the Preacher. He is backed by the ailing remnants of several of the ancient stewards of the Sjalvolki faith, having survived the [Concept('sjalvolki_migration','Migrations')|E] and, at least supposedly, maintained spiritual authority.\n\nHowever, there is another possibility. His authority is based, in effect, on self-proclamation, as he is the chosen leader of a self-declared high priesthood. Other theologians have also presented their thoughts to me, suggesting that perhaps it is the High King that we must look towards for an example. They claim that the triumphs of the Imperrech prove that the Sjalvolki need a strong leader to guide them into the future. Were I to accept this, it would certainly be controversial, for the Imperrech is understood to have dissolved with the Witch-Breaker's death. However, the scholars highlight, some of his recorded statements suggest that it was never truly meant to be unique, and that by becoming something which they describe as a Holy King, and leading the followers of [Glossary('Velos','VELOS_GLOSS')] into a new age of glory, I would merely be fulfilling Cenware's intentions.\n\nWhatever I choose, it is likely that another ruler will claim the mantle I deny, so I must be ready to uphold the faith, whatever may come."
 sjalvolki_reformation.0205.a: "The Veloschosen has been sent by the divine."
 sjalvolki_reformation.0205.b: "I will take up this Holy Kingdom."
 sjalvolki_reformation.0205.c: "I will remain with the Preacher's path." 
 
 sjalvolki_reformation.0206.t: "The Great Schism"
 sjalvolki_reformation.0206.desc: "Messengers have reached my court, and those of the entire Sjalvolki world, with shocking news. The [GetTitleByKey('c_oraispol').GetNameNoTier] Rite has splintered. After the Veloscoup, an attempt by the ancient priesthoods to seize power, [piety_embracer.GetFirstNameNoTooltip] has embraced their authority over the faith, even as [authority_founder.GetFirstName] has seized upon the legacy of the Witch-Breaker to claim spiritual power. Both have sent messages across the lands won in the Conquest, demanding that all rulers accept them as the leader of the faithful, and reject the other's overtures.\n\nThe emissaries of the so-called "Velosgrave Rite" have made their arguments clear. As their spiritual authority descends from priesthoods centered on the Velosgrave, within the ancient homeland of our people, their seizure of power is merely setting the order of the faithful straight.\n\nOn the other hand, the supporters of the self-styled "Holy King" claim that a series of statements made by the late Cenware prove that the Imperrech was always meant as an example for the Sjalvolki, and that the declaration of the Holy Kingdom is merely fulfilling Cenware's wishes.\n\nHowever valid their arguments, the choice, it seems, is up to me."
 sjalvolki_reformation.0206.a: "[piety_founder.GetFirstName] is legitimate"
 sjalvolki_reformation.0206.b: "I stand for the Holy King!"
 sjalvolki_reformation.0206.c: "Usurpers all."
 
 sjalvolki_reformation.0208.t: "The Rite Wars"
 sjalvolki_reformation.0208.desc: "The Sjalvolki world is torn asunder. Across the [Concept('aversaria','Shattered Coast')|E], the [GetTitleByKey('c_oraispol').GetNameNoTier] Rite faces schism and strife, with the Veloscoup and Krona Rites having each claimed the mantle of leadership over its faithful. The armies of a people so recently settled atop a dead empire are once more on the march, this time turned against each other in the names of their gods. And it is even considered likely by some that this is only the beginning, and that yet further fragmentation lies in the future for the Sjalvolki."
 sjalvolki_reformation.0208.a: "From his grave, Cenware weeps..."
 
 sjalvolki_reformation.0212.t: "The Marcher Alternative"
 sjalvolki_reformation.0212.desc: "As the chaos of the Rite Wars tears the realms of my fellows apart, my lands have become home to a large number of [Concept('marchers','Chevalien')|E] preachers, teaching my people of their Life Path faith, and hoping that the Sjalvolki can join them in its practice. The local faith has been restructured to suit the traditions of my people, amending the Paths themselves to fit with the Sjalvolki way of life.\n\nWith the populace of my realm beginning to embrace these new ways, the pressure upon me, both from my own courtiers and foreign missionaries, is growing. It would, according to them, be for the best that I adapt the faith of the Marchers."
 sjalvolki_reformation.0212.a: "I will follow these Paths"
 sjalvolki_reformation.0212.b: "I follow [Glossary('Velos','VELOS_GLOSS')]!"
 
 sjalvolki_reformation.0213.t: "The Marcher Alternative"
 sjalvolki_reformation.0213.desc: "As the chaos of the Rite Wars tears the realms of my fellows apart, my lands have become home to a large number of [Concept('marchers','Chevalien')|E] preachers, teaching my people of their Life Path faith, and hoping that the Sjalvolki can join them in its practice. The local faith has been restructured to suit the traditions of my people, amending the Paths themselves to fit with the Sjalvolki way of life.\n\nWith the populace of my realm beginning to embrace these new ways, the pressure upon me, both from my own courtiers and foreign missionaries, is growing. In addition, [opakasija_conclave_embracer.GetFirstName], a nearby ruler, has already converted, and is pushing my people to embrace this new way of life regardless of my approval. It would, according to many in my court, be for the best that I adapt the faith of the Marchers."
 sjalvolki_reformation.0213.a: "I will follow these Paths"
 sjalvolki_reformation.0213.b: "I follow [Glossary('Velos','VELOS_GLOSS')]!"
 
 sjalvolki_reformation.0215.t: "The Rites of the East"
 sjalvolki_reformation.0215.desc: "The realms of the west are consumed by the fire of religious schism. The supporters of the High King and the Veloschosen do battle over the lands won in the glorious Conquest of only a few decades ago. But here, in the eastern stretches of the Sjalvolki world, it is becoming evident that neither side truly enjoys a powerful sway over us. We are far from the centers of power, and our practices are drifting further and further from the competing orthodoxies laid out by far-away priests and kings.\n\nInstead, our land is becoming home to a new Eastern Rite, attempting to reconcile the fragments of the faith. Priests, noblemen, and commoners alike are beginning to delight in this new faith, and it is rapidly becoming politically impossible for me to avoid its ascendency."
 sjalvolki_reformation.0215.a: "We are of the east."
 sjalvolki_reformation.0215.b: "I will stick to my ways." 
 
 sjalvolki_reformation.0216.t: "The Rites of the East"
 sjalvolki_reformation.0216.desc: "The realms of the west are consumed by the fire of religious schism. The supporters of the High King and the Veloschosen do battle over the lands won in the glorious Conquest of only a few decades ago. But here, in the eastern stretches of the Sjalvolki world, it is becoming evident that neither side truly enjoys a powerful sway over us. We are far from the centers of power, and our practices are drifting further and further from the competing orthodoxies laid out by far-away priests and kings.\n\nInstead, our land is becoming home to a new Eastern Rite, attempting to reconcile the fragments of the faith. Priests, noblemen, and commoners alike are beginning to delight in this new faith, in addition to [eastern_rite_embracer.GetFirstName], a fellow Sjalvolki ruler in the east. As pressure mounts on me from all directions, it is rapidly becoming politically impossible for me to avoid this new faith's ascendency."
 sjalvolki_reformation.0216.a: "We are of the east."
 sjalvolki_reformation.0216.b: "I will stick to my ways." 
 
 sjalvolki_reformation.0301.t: "A New High Kingdom"
 sjalvolki_reformation.0301.desc: "Knights and warriors from across the Partharian have begun to flock to [high_kingdom_opakasija_founder.GetFullNameRegnal]'s court in hopes of gaining status. It wont be long before the Rite and Marcher Princes take notice and try to do something. Only time will tell if this is a new beginning for Opakasija, or the latest in a bloody history."
 sjalvolki_reformation.0301.a: "Our paths shall guide us."

 sjalvolki_reformation.0302.t: "A New Petty Kingdom"
 sjalvolki_reformation.0302.desc: "Knights and warriors from across the Partharian have begun to flock to [high_kingdom_opakasija_founder.GetFullNameRegnal]'s court in hopes of gaining status or favor. Bandits and rapscallions most likely. We can only hope that this 'High Kingdom of Opakasija' will crumble into to dust as quickly as it came to be."
 sjalvolki_reformation.0302.a: "What will they think of next?"

 sjalvolki_reformation.0303.t: "A New High Kingdom"
 sjalvolki_reformation.0303.desc: "In the years since our people first settled these rocky shores, we have come to see these lands as home. From the golden valleys to the cypress woods — Opakasija was ours.\n\nIt took years of hard work, but we can finally say that triumphantly. I stand before my court as I am crowned [high_kingdom_opakasija_founder.GetFullNameRegnal], first of their name. None shall threaten our lands again!"
 sjalvolki_reformation.0303.a: "For the glory of the Conclave!"
 sjalvolki_reformation.0303.b: "Long may our people prosper!"
 sjalvolki_reformation.0303.c: "Long live Opakasija!"
 sjalvolki_reformation.0303.d: "Long live Opakasija!"

 sjalvolki_reformation.0304.t: "The Sun Rises in Opakhasia"
 sjalvolki_reformation.0304.desc: "For too long our beautiful homeland has suffered the ravages of war. First by our ancestors, and then by the Sjalvolki. With the strength of our hearts, we've finally pushed the bloodshed out of Opakhasia. For the first time in decades, people seem to rest. All we can do now is hope that this peace lasts."
 sjalvolki_reformation.0304.a: "May the Concordat prosper!"
 
 sjalvolki_reformation.conversion_success.tt: "The locals are swayed by [sjalvolki_reformer.GetFirstNameNoTooltip]"
 sjalvolki_reformation.conversion_failure.tt: "The locals are not swayed by [sjalvolki_reformer.GetFirstNameNoTooltip]"
 sjalvolki_reformer_is_executed.tt: "[sjalvolki_reformer.GetFirstNameNoTooltip] is captured and executed"
 sjalvolki_reformer_escapes.tt: "[sjalvolki_reformer.GetFirstNameNoTooltip] escapes"
 sjalvolki_faith_splintering.tt: "The Sjalvolki faith is fragmenting, heralding a new age of religious division..."
 
 story_sjalvolki_reformation_story_name: "The Sjalvolki Reformation"
 story_sjalvolki_reformation_story_desc: "The winds of change are sweeping the Sjalvolki world, the old ways of the homeland finding themselves increasingly at odds with the new reality of life on the drastically different [Concept('aversaria','Shattered Coast')|E]. Though some staunch traditionalists may grumble, most leaders — both secular and clerical — are beginning to see that the old religious order is in need of great changes."
 
 reform_fervor_name: "Reform Fervor"
 
 the_reformer_name: "The Reformer"
 the_priest_name: "The Priest"
 the_patron_name: "The Patron"
 the_king_name: "The King"

 sjalvolki_reformation.0401.t: "The Gethian Faith Reformed"
 sjalvolki_reformation.0401.desc: "The mountain traditions, once scattered like scree, are now gathered into a coherent whole. While our elders debate whether the strengths and weaknesses of it, none can deny that our faith now has a clearer shape— and sharper edges."
 sjalvolki_reformation.0401.a: "Our faith stands as a mountain."

 sjalvolki_reformation.0402.t: "The Sky Rite Takes Form"
 sjalvolki_reformation.0402.desc: "The disparate storm-cults, wind-whispers and spirit guides now hold to a doctrine, a hierarchy, a purpose.\n\nSome complain that organizing the sky is like caging the wind. Others see in this new structure a way to make Sarminian spirituality a force to be reckoned with."
 sjalvolki_reformation.0402.a: "Let us hold to our values."
 sjalvolki_reformation.0402.b: "Let our faith be as far-reaching as the sky."
 sjalvolki_reformation.0402.c: "We build towers that might touch clouds."
 sjalvolki_reformation.0402.d: "All are welcomed beneath our sky."

 sjalvolki_reformation.0403.t: "The Prohen Rite Established"
 sjalvolki_reformation.0403.desc: "The old ways of tradition no longer need stay in the shadows. [Glossary('Prohen','PROHEN_GLOSS')] will now guide us in all things, and not be forgotten as he who remains in the dark."
 sjalvolki_reformation.0403.a: "Our faith shall have the deepest of roots."

 sjalvolki_reformation.0404.t: "The Zaumiere Rite Forged"
 sjalvolki_reformation.0404.desc: "The blending of Sjalvolki and Kakarataki traditions has led to something new. A faith of synthesis, of finding common ground between different spiritual paths in earth and sun.\n\n[court_priest.GetTitledFirstName] may have theological reservations, but the political wisdom is clear: a faith that bridges cultures can unite realms."
 sjalvolki_reformation.0404.a: "Our faith will shine on all peoples."

 sjalvolki_reformation.0405.t: "The Pathos Rite Channeled"
 sjalvolki_reformation.0405.desc: "Our people that once flowed in many directions now follow a single course, or at least, a course with defined banks.\n\nThe Pathos guides us, like the rivers of old, and let its flowing waters flourish for all to prosper. "
 sjalvolki_reformation.0405.a: "Where the river flows, life is richest."

 sjalvolki_reformation.0406.t: "The Whispering Rite Sings"
 sjalvolki_reformation.0406.desc: "The old way have made us strong, but how can we reach our full potential in this world to be granted peace in Kardwen's hall if we do not remember what we have lost? Our stories, hidden amongst the bird calls, are too fragile and easy to be lost."
 sjalvolki_reformation.0406.a: "If we are to survive, we must always remember how."
 sjalvolki_reformation.0406.b: "...and perhaps with a different approach to our rituals..."