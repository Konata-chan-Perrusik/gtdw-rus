 gh_search_in_library.0001.t: "Search for Knowledge"
 gh_search_in_library.0001.intro: "If I am to devote my time to study, I must choose a subject and see what knowledge these writings may yield."
 gh_search_in_library.0001.desc_tiny_library: "\n\nOnly a modest number of works are kept here, a handful of volumes and scrolls gathered in one place. The choice is limited, yet even a narrow selection may conceal something of value."
 gh_search_in_library.0001.desc_small_library: "\n\nThe collection is not vast, yet neither is it sparse. A reasonable assortment of subjects lies before me, enough to warrant careful consideration."
 gh_search_in_library.0001.desc_medium_library: "\n\nThe shelves hold a respectable range of writings. There is variety here, and likely substance."
 gh_search_in_library.0001.desc_large_library: "\n\nRow upon row of shelves stretch across the chamber, filled with volumes and scrolls from many hands. The breadth of subjects alone demands deliberation."
 gh_search_in_library.0001.desc_enormous_library: "\n\nThe collection is immense, its shelves heavy with accumulated learning. The range of subjects is wide, and the depth within each may prove considerable."
 gh_search_in_library.0001.a: "Search on this topic."
 gh_search_in_library.0001.b: "I have reconsidered..."
 gh_search_in_library.0001.c: "It is enough for a day."
 gh_search_in_library.0001.c.tt: "You end your study for today."
 
 gh_search_in_library.0002.t: "Search for Knowledge"
 gh_search_in_library.0002.desc_first: "The writings are before me, closed and undisturbed. Their contents remain entirely unknown, and nothing has yet been committed to memory.\n\nThe decision rests solely on whether I will give them my time at all."
 gh_search_in_library.0002.desc_second: "I turn to the study in earnest and begin working through the available writings. Pages are read carefully, and the first portions of several texts are now behind me.\n\nA modest amount has been covered, enough to move beyond mere curiosity."
 gh_search_in_library.0002.desc_third: "The reading continues without interruption. One work follows another, and I advance steadily through their pages.\n\nA meaningful share of the material has now been examined, and the hours spent are evident in the growing weight of what I have taken in."
 gh_search_in_library.0002.desc_fourth: "I devote much of the day to study, moving directly from text to text with sustained focus. Page after page is read in full, with little time lost between them.\n\nA substantial body of writing has now been covered, and the scope of what I have read is considerable."
 gh_search_in_library.0002.desc_fifth: "The greater part of the day is consumed by study. I remain with the writings for hours on end, working through them at length and in depth.\n\nBy the time I finally rise, I have read extensively across many texts and absorbed an exceptional amount for a single day."
 gh_search_in_library.0002.desc_sixth: "I refuse to stop when fatigue first sets in. The light grows dim, yet I remain with the writings, continuing from one text to the next without allowing myself rest.\n\nAn extraordinary amount has now been read. What would suffice for most has long since been surpassed."
 gh_search_in_library.0002.desc_seventh: "I press on well beyond prudence. My eyes burn and my thoughts strain under the weight of so many pages, yet I continue turning them.\n\nA vast quantity of material has passed before me today, far more than I had first intended to attempt."
 gh_search_in_library.0002.desc_eighth: "I give myself over entirely to the pursuit, reading until time itself seems uncertain. Work after work is taken in, examined, and set aside only when thoroughly covered.\n\nBy the end, I have pushed myself to the limits of endurance and read an immense share of what is available here."
 gh_search_in_library.0002.a: "Search different topic."
 gh_search_in_library.0002.b: "I can push through..."
 gh_search_in_library.0002.b.tt: "You attempt to learn more today."
 gh_search_in_library.0002.c: "It is enough for a day."
 gh_search_in_library.0002.c.tt: "You end your study for today."
 
 gh_search_in_library.0002.d: "#N The text will be mine.#!"
 gh_search_in_library.0002.d.tt: "You attempt to steal #high [Localize(Concatenate(GetPlayer.MakeScope.Var('gh_attempt_to_buy_book_in_collection').GetFlagName, '_title'))]#!."
 
 gh_search_in_library.0002.d.tt.success: "You successfully steal [Localize(Concatenate(GetPlayer.MakeScope.Var('gh_attempt_to_buy_book_in_collection').GetFlagName, '_title'))]."
 gh_search_in_library.0002.d.tt.failure_small: "You are caught"
 gh_search_in_library.0002.d.tt.failure_death: "You are caught and executed"
 gh_search_in_library.0002.d.tt.failure_banned: "You are caught and released"
 gh_search_in_library.0002.d.tt.failure_prison: "You are imprisoned"
 gh_search_in_library.0002.d.tt.prevented_from_entering_library: "#N You will no longer be allowed to enter places of learning outside your realm.#!"
 

 add_collection_of_knowledge_temporary_bonus_effect.tt.success: "Learned knowledge while reading"
 add_collection_of_knowledge_permanent_skill_bonus_effect.tt.success: "Skill Improved"
 add_collection_of_knowledge_permanent_arcana_bonus_effect.tt.success: "Gained #P +1#! @skill_arcana_icon![arcana|E] while reading" 

 gh_search_in_library.0003.t: "Placed Among the Collection"
 gh_search_in_library.0003.desc: "[gh_book_holder.MakeScope.Var('gh_transfer_book_to_collection').Artifact.GetName] will now be kept and preserved in [gh_book_holder.GetCurrentLocation.GetTitle.GetNameNoTier]\n\nFrom this place it may be read, copied, and returned to again in years to come." #ASKIL NOTE: If collections should be county-based, change value here
 gh_search_in_library.0003.a: "Let it remain here."

 gh_search_in_library.0004.t: "The Copy Arrives"
 gh_search_in_library.0004.desc: "The copy of [Localize(Concatenate(GetPlayer.MakeScope.Var('gh_attempt_to_buy_book_in_collection').GetFlagName, '_title'))] I ordered has finally been completed and delivered. Fresh ink still marks the pages, and the hand that reproduced it has followed the original with careful attention.\n\nThe work now rests before me, ready to be read and consulted as I see fit."
 gh_search_in_library.0004.a: "At last."