l_english:
 kathuni_decision.0001.t:0 "The restoration of order on the Cang River"
 kathuni_decision.0001.desc:0 "The crushing defeat at Shangn-yi Port nearly shattered the Command of the Lanonan. Our remaining forces retreated north in disarray, and the fierce onslaught of the Shrunfan rebels plunged us into unprecedented desperation. Soon after, our entire faction splintered and teetered on the brink of collapse.\n\nYet, all of that now belongs to the past. Today, Lanonan has risen from the ashes and been reborn from despair. United firmly under the guidance of a visionary leader, we have rallied strength like never before. The great campaign to reclaim our lost territories is about to begin—let those barbarians tremble before the wrath of the Celestial Army!"
 kathuni_decision.0001.a:0 "Forward! Lanonan!"
 kathuni_decision.0002.t:0 "Tongkang Society"
 kathuni_decision.0002.desc:0 "When our forebears were driven out and wandered until they settled in Southsea, they could never have imagined the prosperity of Xin Xue today. In Bronzeport, governance rests with merchants, elections are widely practiced, and the social environment is open. Moreover, the local scholars, far from their homeland in Kathun-kai, place little emphasis on intellectual pursuits—a stark contrast to the stagnation of their native land. This has provided fertile ground for the spread of Xin Xue’s ideas, enabling us to permeate the entire nation and ultimately take hold of power. Today, many officials and common people alike have come to embrace our doctrines. While loose associations served us well in our days of weakness, allowing us to operate in the shadows, they are clearly no longer suitable for the flourishing of Xin Xue. Taking inspiration from the structure of the Xin Xue organization in the northern region of Donghai, we shall establish a united and tightly knit new organization—one that will stand as a steadfast shield in defense of the Yuankang regime."
 kathuni_decision.0002.a:0 "For the development and growth of Xin Xue."
 kathuni_decision.0003.t:0 "Declaration Against Rebellion"
 kathuni_decision.0003.desc:0 "The southern state has proven disloyal, abandoning righteousness and betraying grace. Savage tribes seize the opportunity to tear apart our border territories. They burn our defenses and plunder our people, slaughter our garrison soldiers and defile our sacred lands. In the past, we upheld justice to pacify the distant regions, cultivating the barren lands to spread the king's influence across the southern wilderness. Little did we expect to nurture traitors right at our elbows!\n\nNow, the rebel chieftain, with a heart of venomous serpents and the nature of jackals and wolves, drives his disorderly troops to invade our borders, wielding poisoned arrows to torment our people. As a result, the roads of Cangwu are littered with exposed bones, and the beacon fires of Zhuyuan City darken the sky even at noon. This is indeed a time for loyal hearts to beat with anguish and for righteous men to shed their blood!\n\nThough we are but remnants of a once-great force, how could we forget the duty to defend our land? Even amidst the miasmic rains and savage smogs of the south, we still hold our halberds firm under the heavens. Now, we muster our mighty army and raise the banner of loyalty and righteousness. We vow to cleanse this land of its foul influences and restore our rivers and mountains. To all our former people those who can take up arms to strike down the rebels shall become the bulwarks of our nation. Where the might of heaven points, the rebellious foes shall surely crumble. Upon the arrival of this declaration, let all strive together!"
 kathuni_decision.0003.a:0 "Against the rebels! Against the rebels! Against the rebels!"
 kathuni_decision.0004.t:0 "The tactics to be employed"
 kathuni_decision.0004.desc:0 "The flame that never died out has once again risen across the land of Lanonan. Before long, our armies have set foot on familiar territory once more. This time, we will surely sweep away all obstacles, reclaim our lost lands, take back Shangnyi Port from the rebels of Míat Shrunfan, and restore order to the Southsea.\n\nThe generals of various forces have gathered to discuss strategies for this war. Many believe that a steady and methodical approach is best—gradually recapturing towns from the rebels, consolidating gains before advancing further, thus minimizing vulnerabilities. Some younger officers argue that speed is essential in warfare, as a slow advance would allow the rebels to amass their forces for a decisive counterattack, potentially leading to a protracted stalemate. Instead, they advocate for prioritizing the destruction of the enemy’s effective strength, defeating them piecemeal while they are dispersed. These differing views reflect not only military disagreements but also underlying tensions within the Lanonan army. As the commander-in-chief, you have your own unique plan, distinct from both approaches. Yet, regardless of the strategy, only one that leads to victory can be considered a good strategy."
 kathuni_decision.0004.a:0 "Adopt a more prudent approach."
 kathuni_decision.0004.b:0 "Opportunity knocks but once."
 kathuni_decision.0004.c:0 "I have my own plan."
 kathuni_decision.0005.t:0 "The Betrayer's Betrayal Once More"
 kathuni_decision.0005.desc:0 "As the war reached a critical stalemate, an unexpected visitor appeared in your court—an emissary from the Emberclan, who conveyed their intent: these nomadic warriors were willing to launch a rebellion against the regime of Miat Shrunfan, in exchange for retaining their autonomy after the war. For you, while this presented a means to significantly hasten the conflict, the memory of the Emberclan's betrayal during the Battle of Shangnyi Port still lingered. If they had betrayed once, what was to stop them from doing so again? Or perhaps this was nothing but a trap? As you weighed the pros and cons, the emissary's gaze growing increasingly anxious, you ultimately made your decision—"
 kathuni_decision.0005.a:0 "We will not accept traitors again."
 kathuni_decision.0005.b:0 "Good deal."
 kathuni_decision.0006.t:0 "Under our governance"
 kathuni_decision.0006.desc:0 "Even after teetering on the brink of annihilation, we ultimately surmounted countless obstacles and brought an end to decades of war. The inept and brutal rebels can no longer terrorize the people of Lanonan; under the rule of Command, peace and stability have descended upon this land. The displaced refugees have returned to their homeland, and once-deserted villages have been revitalized, steadily supplying grain to Lanonan's great cities. Trade routes have gradually flourished, allowing people to purchase all manner of daily necessities in the markets. In short, Lanonan has entered a rare period of prosperity, laying a solid foundation for our future endeavors."
 kathuni_decision.0006.a:0 "This is the success of Lanonan."
 kathuni_decision.0007.t:0 "Transform Social Customs"
 kathuni_decision.0007.desc:0 "The history of contact between Kathun-kai and the Saielaians spans centuries. As early as [northern_and_southern_dynasties_period|E] in the 5th century, the Chenka Dynasty in the north engaged in trade with merchants from [yizhou|E]. Whether through armed conflict or peaceful exchanges, influences from Kathuni left a profound mark on the Southland. Over time, it has become difficult to distinguish today's Saielaians from Kathuni immigrants; the once desolate lands are now dotted with cities in the Yizhou style. Both sides are more inclined to regard each other as kin bound by blood rather than as adversaries, and a sense of shared interests has taken root. The Protectorate, benefiting from their religious and cultural similarities, is thus better positioned to govern these territories effectively."
 kathuni_decision.0007.a:0 "The concept of Kathun-kai is further expanded."
 kathuni_decision.0008.t:0 "Southsea under one authority"
 kathuni_decision.0008.desc:0 "The fall of [bureau_bronzeport|E] was, in comparison to the process that brought it about, remarkably unceremonious—there was no grand spectacle, no solemn proclamation. It was merely that the last High Minister, accompanied by a few officials, presented at the gates of Bronzeport to the Protector General the seal and official robes bestowed by the Dragon Emperor in years past. After the reading of the charges concerning his transgressions, the last High Minister was taken away by soldiers of the Protectorate, marking the collapse of the vast commercial empire that had once dominated the coast of Dahangon. The rise of the Protectorate was now beyond anyone's power to halt. Though some territories still lay beyond the reach of Kathuni's influence, there could be little doubt that their conquest was merely a matter of time."
 kathuni_decision.0008.a:0 "Three cheers for the protectorate! Long live it!"