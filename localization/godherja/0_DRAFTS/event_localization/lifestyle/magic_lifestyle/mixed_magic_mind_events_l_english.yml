l_english:
 not_enough_magic_tt: "You do not have enough magic to select this option"

 mixed_magic_mind.0001.t: "Child Having Nightmares"
 mixed_magic_mind.0001.desc: "Your Child is having recurring nightmares (GH TODO: Get a proper description for this)"
 mixed_magic_mind.0001.a: "Do nothing."
 mixed_magic_mind.0001.b: "Try to help using magic"

 mixed_magic_mind.0011.t: "The Sleepwalker"
 mixed_magic_mind.0011.desc: "My courtier, [dreamer.GetName], has been sleepwalking in the middle of the night, speaking erratically and acting out [dreamer.GetHerHis] terrible nightmares. [dreamer.GetHerHis|U] dreams speak of powerful rituals and beings beyond my comprehension, and a constant undercurrent of magic flows out as [dreamer.GetSheHe] sleepwalks. However, when they wake they seem perfectly normal. They beg me to heal them, but I run the risk of making their nightmares even worse. Alternatively, what they dream could be studied intensely and tapping into their mind as they walk would give me great insight into the study of Mixed Magic.\n\nAlthough, if they somehow fell asleep permanently, their dreams would be a powerful source of magic..."
 mixed_magic_mind.0011.a: "I will cure your mind of these ills"
 mixed_magic_mind.0011.b: "Think of what I could learn!"
 mixed_magic_mind.0011.c: "Your dreams will be a powerful boon"
 mixed_magic_mind.0011.success.t: "You cure [dreamer.GetFirstNamePossessive] sleepwalking"
 mixed_magic_mind.0011.failure.t: "Your efforts amounted to nothing"

 minor_magic_cost_tooltip: "You will lose #negative_value; 10#!@magic_icon![magic|E]"
 small_magic_gain_tooltip: "You will gain #positive_value; 25#!@magic_icon![magic|E]"

 large_magic_cost_tooltip: "You will lose #negative_value; 100#!@magic_icon![magic|E]"