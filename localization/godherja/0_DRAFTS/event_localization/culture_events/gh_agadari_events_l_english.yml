l_english:

 agadari.0001.t: "A Land Reclaimed"
 agadari.0001.desc: "As I gaze out upon the land of my forebearers, I feel a sense of accomplishment. Since the [war_of_all_islands|E], our people had been reduced to treading water, clinging to lost glories as we waited for the tide of history to wash us away. But the [warrior_women_ehatm|E] have always been masters of the tides. Through our strength of arms, we have arrested our descent and reclaimed the ancestral homelands. The vast ocean beckons to me, ripe with plunder and opportunity. "
 agadari.0001.a: "Let none find us wanting"

 agadari_resurgence_modifier.0001.custom: "All [counties|E] in Krehejad"

 agadari_exodus_modifier.0015.custom: "All [counties|E] in Cyrat"
 
 agadari.0010.t: "Reunited once more"
 agadari.0010.desc: "Following the [war_of_all_islands|E], our people were exiled to our colonies in [Glossary('Cyrat','cyrat_encyclopedia_desc')]. And yet we found no succor nor respite. Our people were prey to innumerable beasts outside our settlements and stalked by pestilence within them. Despite our reclaimation of Krehejad, we now rule as a minority over a large population of [Concept('aversaria','Aversarians')|E] that harbor no love for us in their hearts. By inviting our jungle-dwelling kin to abandon their holdings and return home, we could resettle our homelands with proper [GetCulturePillar('heritage_agadari').GetName] and establish a firm grip over our subjects."
 agadari.0010.a: "Draft the letters"

 agadari.0015.opening: "[actor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 agadari.0015.desc: "Rejoice my kindred! Our homelands have been reclaimed from the foul [Concept('aversaria','Aversarians')|E]. As the ruler of [GetTitleByKey('e_krehejad').GetNameNoTier] I shall offer safe passage for any [GetCulturePillar('heritage_agadari').GetName] who wish to live once more in our homeland as free women and men."
 agadari.0015.a: "Set sail for home!"
 agadari.0015.b: "Better to rule in [ROOT.Char.GetFaith.NegativeAfterLife2]..."
 