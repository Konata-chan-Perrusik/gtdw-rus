l_english:

 aversaria.0001.t: "Aversaria United!"
 aversaria.0001.desc: "After many years of chaos and horror, [aversaria|E] stands tall once more. Though it is not yet whole again, and may perhaps never be as mighty as it once was, I have saved our people from certain destruction. Not even the [chaos_of_the_seventh_century|E] heralded such doom for us, and I have entered into the annals of history as one of the greatest Aversarians there ever was.\n\nAcross the renewed empire, hundreds of statues have been built of me, and thousands of citizens place helmets at their feet and pedestals in emulation of the Stilto Katharoteras, wishing me good fortune and victory. Now that I have done the impossible, many desire to know what title I shall take as a commemoration of this event. Therefore, I shall be called..."
 aversaria.0001.a: "the Restorer of the World."
 aversaria.0001.b: "Only a Manifest God could have done as I have."
 aversaria.0001.c: "They shall know me as their God and Master."
 aversaria.0001.d: "I am the Purest incarnate."
 aversaria.0001.e: "the Avenger."
 aversaria.0001.f: "the God of the Ashes."
 aversaria.0001.g: "Beloved of the Purest."
 aversaria.0001.h: "the Invincible Sun."
 aversaria.0001.i: "the God of Blood."
 aversaria.0001.j: "Thrice-Greatest."
 aversaria.0001.k: "the Liberator."
 aversaria.0001.l: "the Herald of the Deep."
 aversaria.0001.m: "the Saint."
 aversaria.0001.n: "the Restorer of the Mandate."
 aversaria.0001.o: "the Tamer of Barbarians."
 aversaria.0001.p: "the Liberator of the Iyrossi."
 aversaria.0001.q: "the Slayer of the Gods."
 aversaria.0001.r: "the Steward of Aersodiax."
 aversaria.0001.s: "the Chosen of the Gods."
  
 aversaria.0002.t: "Aversaria United!"
 aversaria.0002.desc: "Out of the chaos of near-perpetual war and anarchy, [aversaria|E] has been reunified for the first time since the [imperial_civil_war|E]. Surviving both [frodbrokna|E] and the [sjalvolki_migration|E], Aversaria is battered and beatened, but not defeated. Though it will never reclaim its old glory, it still poses a substantial threat to all in what remains of the former empire."
 aversaria.0002.a: "An interesting development."
 
 aversaria.0003.t: "Aversaria United!"
 aversaria.0003.desc: "Out of the chaos of near-perpetual war and anarchy, [aversaria|E] has been reunified for the first time since the [imperial_civil_war|E] and has taken my lands during the reorganization. Higher nobles state that it is for the good of the realm, but they cannot hide their smirks when they look upon me. Whatever am I to do?"
 aversaria.0003.a: "Troubling times."

 aversaria.1101.t: "The Last Aautokrata"
 aversaria.1101.desc: "[aversaria|E] lies in ruins, its ancient cities filled either with barbarians or with corpses, mirroring the fates of the two capitals. Only in Krehejad has Aversaria survived. Despite the long years of anarchy and civil war, we have pulled ourselves from the fire, and now gaze outwards upon a new world.\n\nAnd in this new world, we are the last Aversarians, the only ones uncorrupted by barbarism. From Stellios, then, will Aversaria now reign, and preserve on these islands the last realm of humanity."
 aversaria.1101.a: "Long live Aversaria!"


 aversaria.1110.t: "The End is a New Beginning"
 aversaria.1110.desc: "The years have been harsh in the wake of the [imperial_civil_war|E]; our empire is in shambles, and our blood and culture have begun to mingle with those of our neighbors along [kasiryat_biozone|E]. A great debate has erupted among my people, and it falls to me as their leader to decide: shall we cling to the tatters of the [Concept('aversaria', 'Aautokrata')|E] and keep our bloodlines pure, or has the time come to forsake the past and embrace a new destiny?"
 aversaria.1110.a: "Let two peoples become one under the Purest!"
 aversaria.1110.b: "The light of the Purest shines for us alone!"
 aversaria.1110.a.tt: "You will no longer be able to reform [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]"
 aversaria.1110.b.tt: "You will still be able to reform [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]"