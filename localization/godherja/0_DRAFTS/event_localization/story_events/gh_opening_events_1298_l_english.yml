l_english:

 ##############################
 # Arshab                     #
 # By Askil         	        #
 ##############################
 opening_event_sarradon_1298.1.t: "A Crown of Thorns"
 opening_event_sarradon_1298.1.desc: "Peace is a whisper I've never known, a word echoing from tales of a bygone era. The elders tell of a glorious past, when the Hiklahnate could withstand anything. But I only know the constant struggle, the gnawing hunger of a realm devouring itself. Curse Pejman for his weakness, for had he acted as his predecessors, perhaps the [GetTitleByKey('e_amsari_hiklahn').GetNameNoTier] wouldn't be a fragmented dream today. I fight because it is all I have ever known, all I have been taught. But it is my bloodright, after all; I am of the lineage of [gh_the_amsari_prophet|E], chosen to rule over the faithful, my father said.\n\nBy the grace of Zaoran, I will reclaim what's mine and expel the greedy [marchers|E] from our lands. I led the desperate and the dispossessed against their seasoned mercenaries. We bled them, making them pay for every inch of our sacred soil. I was so close then, close enough to see the holy capital of [GetTitleByKey('c_tchouran').GetNameNoTier] held in the claws of the Marchers. It is a bitter wound, a loss I feel in my bones, even though I never knew it whole. I will see it once more, free from their grasp, and I will see the Amsari Hiklahn rise again."
 opening_event_sarradon_1298.1.a: "The war continues, as it always has."

 #############################
 # Zehur                     #
 # By Askil         	       #
 #############################
 opening_event_sarradon_1298.2.t: "The Sane Zealot"
 opening_event_sarradon_1298.2.desc: "Zaoran speaks to me in the thunder of crashing armies, in the screams of the unrighteous. The world is a canvas of divine wrath, and I am the brush! I hear only the righteous roar of His Voice, demanding to cast away darkness! For too long have our people strayed, lured by the honeyed lies of charlatans. Every enemy, every BLASPHEMOUS SCUM, is a festering, rotting abscess to be CUT OUT! I've felt it, the glory, the ECSTASY of His power surging through me as their lies crumble to dust beneath my feet!\n\nThe Synod has commanded me to prepare. Soon, the false Hixartii prophet will be silenced, and the profane will be cleansed from this cursed land. I AM THE STORM! THE JUDGMENT! A FLOOD OF HOLY FIRE SENT TO WASH AWAY THE SINS OF THIS AGE! I will not stop. I CANNOT STOP! Not until every inch of this pathetic world bends to His absolute will, or until my own purified corpse lies triumphant on the ashes of creation!"
 opening_event_sarradon_1298.2.a: "THE WORLD WILL BURN FOR ZAORAN!"
 
 #############################
 # Arderith                  #
 # By Askil         	       #
 #############################
 opening_event_sarradon_1298.3.t: "The Hand of the Righteous"
 opening_event_sarradon_1298.3.desc: "I can still remember the world at peace under Pejman's reign when I was but a young child. When I reached 15, I joined a minor ruler's army as a lowly soldier, and by 24 I had become a seasoned mercenary. I didn't know it then, but I was already lost, adrift in a world of endless conflict. And when that cursed false prophet took my family, I crumbled into nothingness, a soul of despair without purpose. I wandered the sun-baked streets of Qum Qal'eh, a ghost among the living, certain my end was near. But then, a Frazan of Tahkedar found me. In his words, I found the clarity of Zaoran's divine light. I saw the righteous path that was to be carved through the deceit of this fallen world.\n\nNow, I am a weapon in the hand of Zaoran, a First Hand of the Faith, bound to His will through the Synod. We will weed out the heresies that have taken root, no matter how deeply they've poisoned the land or how fiercely their followers cling to their lies. Zaoran's triumph is inevitable. This is the will of Him of a Hundred Virtues, the just and merciful, and I am His instrument."
 opening_event_sarradon_1298.3.a: "For Zaoran's Glory!"
 
 ##############################
 # Ielih                      #
 # By Askil         	        #
 ##############################
 opening_event_sarradon_1298.4.t: "The Shadow on her Absence"
 opening_event_sarradon_1298.4.desc: "Again and again I see the dream that consumes my nights and days, and though I did not live it, I know it was thus. I see Arisha's beautiful face turning toward me just before the world explodes into white darkness. My soul cries out for her embrace, her nearness binding my scattered thoughts whole. She dies in it, she dies and calls and begs me to pull her back from the eternal cage. I know she will not seek Baizar Mahna until her purpose is fulfilled.\n\nI need our people to keep their faith in her a little longer. Lately, they have begun to avoid the doorway where she lies. They say her place is beyond, they think it is an affront to the order of He Above All. They do not understand. They never understood her.\n\nUnder the guise of Animeistos they have kept her body in that lichen-still state of in-between, but his knowledge goes only so far. She is waiting. She is so close. I must bring her back."
 opening_event_sarradon_1298.4.a: "But I am running out of time."
 
 ##############################
 # Tebouin                    #
 # By Askil         	        #
 ##############################
 opening_event_sarradon_1298.5.t: "Just Another Merchant"
 opening_event_sarradon_1298.5.desc: "Yes, I told them exactly what they wanted to hear. That the trade would double, that the ports would never sleep. They looked at me, a simple trader, a man who had pulled his family's business from the brink of ruin, and they saw someone desperate, someone who would risk everything and, most importantly, someone who would owe them everything. They thought I'd be their puppet, easily called back to heel once the dirty work was done. Unambitious fools. Now people line the streets of my own capital: Mercenaries in polished mail, [Concept('marchers','Chevaliens')|E] chasing my fortune, and Amsari lords who whisper behind their hands but bite their tongues when I name my price.\n\nThe Company? They think they made me. They sent letters stuffed with promises followed by threats. I even stopped sending reports and they send ships anyway. I've built something grander than anything they dared to imagine — and no man, no prince, no prophet, no merchant on this side of the sea or the other, will ever take it from me."
 opening_event_sarradon_1298.5.a: "And it is only the beginning..."


 ##############################
 # Damiane                    #
 # By Skootstreeter           #
 ##############################
 opening_event_sarradon_1298.6.t: "The Last Order"
 opening_event_sarradon_1298.6.desc: "Ḥārthah ibn Sarradon broke my fellow orders in the Saints War, driving many of us into the sea.Only by the grace of the Saints and the Purest I was able to stop the rapid collapse of the Order of the Bleeding Martyr in the face of the advancing Sarradonian hordes. Even after the death of ibn Sarradon, the tide of violence against the Agionists hardly slackened. The Hudi Twins, bandit lords swathed in the bloody rags of their false religion, besieged my lands and slaughtered my people, only hurled back across the border after Abdal fell afoul of a dose of Aqua Thysia. Now, the Other Twin hungers for vengeance and I am happy to oblige.\n\nI am the last Ordermaster of any importance in Sarradon, the last toehold of Agionism on this godsforsaken continent. In my right hand, I hold the healing cup of Saint Thysia. In my left, I hold the sword.\n\nThese are the final days of Agionism in Sarradon. The Order of Bleeding Martyrs shall drip our lives upon the pages of history."
 opening_event_sarradon_1298.6.a: "By the Chalice or by the Sword, so shall it be!"

 opening_event_aironoi_1298.1.t: "A Falcon Among Magpies"
 opening_event_aironoi_1298.1.desc: "Every once in a while, I reminisce about growing up during the last years of the [Concept('sjalvolki_migration','Migration')|E]. Things were more honest back then, truer to their essence. People fought, people bled, and the survivors kept the spoils of conquest. And yet, what of their daughters and sons?\n\nWeak! Soft! Pathetic! Both within and without, the unworthy claw and lust above their station, eager for scraps but hungry for the world. Do they, like foolish brother mine, not see how feeble they are, how thin is their blood? Do they not fear the swiftness of the blade coming for their necks?\n\nLet the fractured [GetCulturePillar('heritage_sjalvolki').GetName] squabble and bicker over their new farms, gods, and dogmas; let the last dregs of [aversaria|E] cower beyond the mountain passes and debate on the bones their dead empire; let the Ölteni downcoast assemble their hosts in retaliation — the swords and arrows of my [Glossary('Órzopajad','GH_ORZOPAJA_GLOSS')] will come for all of them, in time."
 opening_event_aironoi_1298.1.a: "It matters not if they fight or falter, their end will be the same."

 opening_event_aironoi_1298.2.t: "Heart of the Matter"
 opening_event_aironoi_1298.2.desc: "There are a great many things that I do not understand about other people. Why can't they speak plainly about what is on their minds? Why must they struggle to the bitter end in defiance, doubly so when simple compliance would spare them so much pain and suffering?\n\nI ask these questions of myself and of others as I ride down foes with my sisters; I have asked them countless times of the wretched and the downtrodden who are sent my way to be hidden from sky and sun; I asked them of [GetScriptedCharacterByHistoryID('sarminians_salacad_16').GetFirstName] as I delivered [GetScriptedCharacterByHistoryID('sarminians_salacad_16').GetHerHis] punishment.\n\nIn truth, I hardly mind asking these questions at all. Each answer I receive, peeled as it is from wayward hearts after layers of skin, falsehoods, and sweet lies are discarded aside, brings me closer to finding the last piece that will finally make me complete."
 opening_event_aironoi_1298.2.a: "If I were wrong, why would the songs they sing allure me so?"

 opening_event_aironoi_1298.3.t: "A Lifetime of Trouble"
 opening_event_aironoi_1298.3.desc: "So what if some gold found its way back into my coffers? So what if some unlucky stablehand got crushed by an errant rotten beam — I am not a carpenter, so how would I have known? I have seen my sisters do far more and far worse, so why was it me that got singled out for something so utterly trivial?\n\nNeither of them listened, and neither of them cared. If I am to claim being equal to one of the [Glossary('Órzopajad','GH_ORZOPAJA_GLOSS')], I was told, then I must be prepared to be punished as such. Handed to [GetScriptedCharacterByHistoryID('sarminians_salacad_15').GetFirstName], my own [GetTrait('twin').GetName( GetNullCharacter )|l] gleefully seared me as an [Concept('anohelis_outcasts','Anohêla')|E] and cast me out, heedless of my words and reasoning.\n\nSo here I am, miserable and alone, denied to my rights and honor. It cannot be fear that I feel, so it must be anger. One day, they will regret what they have done. One day, they will be the ones in my place."
 opening_event_aironoi_1298.3.a: "I #EMP will#! come back, that I swear."
 opening_event_aironoi_1298.3.b: "Damn their braids and their customs and all; I'm out."

 opening_event_aironoi_1298.4.t: "The Rulers and the Ruled"
 opening_event_aironoi_1298.4.desc: "It was through sheer coincidence that I was at the [GetScriptedCharacterByHistoryID('daukeni_sjalvolki_1').GetNickname]#L 's#! court in [GetTitleByKey('c_oraispol').GetNameNoTier] the day [GetScriptedCharacterByHistoryID('pactlander_banstur_1').GetFirstName]#L  #![GetScriptedCharacterByHistoryID('pactlander_banstur_1').GetHouse.GetName] made her case for the rights of the [GetCulturePillar('heritage_sjalvolki').GetName] womenfolk. It felt most peculiar, for someone of my position and standing, to see such arguments being made in inversion of what was but a marginal thought back home in [GetTitleByKey('k_szamazonas').GetNameNoTier]. A few courtiers kept glancing my way, no doubt wary of inflicting a slight against the [ROOT.Char.GetCulture.GetName] envoy, ignorant of the differences between their women and the [Glossary('Órzopajad','GH_ORZOPAJA_GLOSS')].\n\nStill, the old [GetScriptedCharacterByHistoryID('pactlander_banstur_1').GetWomanMan] spoke, and spoke well. I could see the thought and attention the $emperor_male_kholmvolki$ gave to [GetScriptedCharacterByHistoryID('pactlander_banstur_1').GetHerHis] reasoning, and could not help but start counting myself what might be done with twice the artisans, twice the soldiers. It was a most sobering thought, to imagine other peoples and kindoms suddenly becoming twice as powerful overnight.\n\nI left [GetTitleByKey('c_oraispol').GetNameNoTierNoTooltip] on the next morn, restless and contemplative. Our current position is strong, but the others might still outpace us. We have changed so much already; so what is one more?"
 opening_event_aironoi_1298.4.a: "One way or another, we will not be left behind."

 opening_event_aironoi_1298.5.t: "In the Service of the Warden"
 opening_event_aironoi_1298.5.desc: "I am not the [ROOT.Char.GetWomanMan] others think me to be, nor the same one whom [ROOT.Char.GetFaith.HighGodName|l] entrusted with [ROOT.Char.GetFaith.HighGodHerHis|U] righteous rebellion all those decades ago. How could I claim to be [ROOT.Char.GetFaith.HighGodHerHis|U] champion with all the blood I've spilled, with all the oaths I've broken? People only remember the victors, not the victims, no matter how just their sacrifice.\n\nStill, I would have done the same again if I had to. From the $holy_site_hill_of_the_golden_saint_aruvasue_name$, where I betrayed the last of the [GetScriptedCharacterByHistoryID('jarakmar_ertomax_16').GetHouse.GetName]#L s#! and raised the banner of the Queen of Heroes; to $holy_site_glass_temple_aruvasue_name$ and beyond, where the final [Concept('aversaria','Aversarian')|E] holdovers were vanquished — the [GetCulturePillar('heritage_kherkeloi').GetName] were made free.\n\nIn the end, with the rigors of age upon me and my old body failing, I still cannot share my doubts with those who look up to me, not even with my own wife and children. Only [GetScriptedCharacterByHistoryID('zelkavani_sarmuyr_2').GetFirstName] and late [GetScriptedCharacterByHistoryID('jarakmar_ertomax_8').GetFirstName] know the crimes we committed on our path, for which [ROOT.Char.GetFaith.HighGodName|l] will judge us in the afterlife."
 opening_event_aironoi_1298.5.a: "Will it be salvation or damnation, I truly do not know."

 opening_event_aironoi_1298.7.t: "The Boy Who Became a Man"
 opening_event_aironoi_1298.7.desc: "Growing up as a street urchin, I cannot say for certain how old I was when my whole life changed. It must have been sheer stupidity — or divine providence — that made me turn my back on the ragtag band of ruffians and brigands that I was a part of, and help a group of hopeless adventurers escape. I joined them then, more out of desperation and hunger than any genuine desire for companionship, and listened as they spoke about their then-strange goddess while they gave me bread and shelter.\n\nIt took me some years to understand, but I found my family that day. Through thick and thin, and with the benevolent guidance of [ROOT.Char.GetFaith.HighGodName|l], we have liberated the people and the land from the corrupt and the unworthy, from darkness and despair. Now, it is my duty to protect this freedom, as I have done by putting down the bloody rebellion of [GetScriptedCharacterByHistoryID('jarakmar_ertomax_20').GetFirstNameNicknamed].\n\nI have come far, from a nameless child to the [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetCapitalLocation.GetName]. By now, I fear neither battle nor a blade at my neck; my only fear that remains is being unworthy of the trust and responsibility entrusted onto me."
 opening_event_aironoi_1298.7.a: "I yearn for no glory other than that of my duty."
 
 ##############################
 # Unwan                   #
 # By Grand Monkey Marshal      #
 ##############################
 opening_event_opakhasia_1298.1.t: "The Inheritance of Ten Trees"
 opening_event_opakhasia_1298.1.desc: "I was born on the first marches of the [GetScriptedCharacterByHistoryID('daukeni_sjalvolki_1').GetNickname] himself, I grew to manhood on the days after [GetTitleByKey('k_palitake').GetNameNoTier]'s fall, I was sculpted to be his finest soldier. And now Cenware is dead, my victories and glories against the [GetScriptedCharacterByHistoryID('southernimperial_aversarian_gorassos_1').GetNickname] and his accursed peers fading into history, the corpse of [aversaria|E] I helped bury turning anew. I see it in my humble lands, my humble people.\n\nThis was not the destiny of a soldier! I fought for a cause, I fought for heroes! I have waited so long, for a cause renewed, for new glory by blade hand. My patience has been rewarded, our Conclave has given me a rite to follow for my true self, and it's controversy to those coin chasing [marchers|E] has granted me a cause to raise my blade for.\n\nThe Marchers position in that golden palace they swept is strong, their steel is sterner, their treasury full. All the more to make them arrogant and unprepared in face of the true grit of the [GetCulturePillar('heritage_sjalvolki').GetName]!\n\nI wonder, though, if this life was what my parents wanted for me when they fled with The Witch-Breaker?"
 opening_event_opakhasia_1298.1.a: "I have never been to Ten Trees, yet my fate has been cast by it"



 #############################
 # Beksultan of Sas Nattana  #
 # By Aidan                  #
 #############################
 opening_event_kashirya_1298.1.t: "Akkaradhamma's Chosen"
 opening_event_kashirya_1298.1.desc: "The Black Whirlwind betrayed me, casting me out for counseling destruction of the backwards Nattanan people. He had become tired of war, so tasked his servants to kill me as I rode the plains. Mortally wounded, my horse, may Akkaradhamma grant him rest, brought me deep underground to my master’s prison. I was captured by his servants and brought before the seal to be judged. Akkaradhamma had prophesied the need for the Pale Rider once more and judged me worthy. He warned that donning the mask would grant me all the knowledge of its previous wielders but bind me to his will. I saw him as a much more worthy God than Arlikhaan, so I agreed.\n\nSince that great and glorious day, I have had my revenge, slaying the Black Whirlwind and controlling my people.  I have dispatched many servants to disrupt the region, thereby fulfilling my task. Akkaradhamma has tasked me with destroying the worshipers of the Twin Gods and Korlacu, and preparing the way for his return, and I will do so gladly. "
 opening_event_kashirya_1298.1.a: "Nattanan will Burn"

