 gh_fund_inspiration.2005.d: "You can never go wrong with copper."
 gh_fund_inspiration.2005.d.flavor: "Copper Glass is well-known and equally well-represented across both [aversaria|E] and [sarradon|E], being especially popular in the former due to its wide spectrum of possible red and blue colorations"
