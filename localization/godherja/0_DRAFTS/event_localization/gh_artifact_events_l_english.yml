 gh_fund_inspiration.2005.c: "I have heard interesting things about the uses of antimony..."
 gh_fund_inspiration.2005.c.flavor: "A relatively obscure glass usually only found in Aironoi and Amaghea, Antimony Glass is typically of a yellowish-red color"
 gh_fund_inspiration.2005.c.domestic.tt: "The materials will be procured for no additional cost because you are [Concept('location','Located')|E] within the [GetGeographicalRegion('antimony_glass_domestic_region').GetName] [region|E]"
