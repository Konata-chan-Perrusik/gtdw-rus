 gh_fund_inspiration.2005.e: "The twin minerals of magnesia, perhaps?"
 gh_fund_inspiration.2005.e.flavor: "Magnesia Glass is derived from the mixing of two black and white minerals rarely encountered alongside iron. Magnesia glassware usually comes in grays and purples"
 gh_fund_inspiration.2005.e.domestic.tt: "The materials will be procured for no additional cost because you are [Concept('location','Located')|E] within the [GetGeographicalRegion('magnesia_glass_domestic_region').GetName] [region|E]"
