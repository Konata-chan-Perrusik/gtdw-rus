 fund_inspiration.2005.desc_glassware: "Let's just say that if you want the [inspiration_owner.Custom('ArtifactGlasswareType')] to be anything but slag"

 gh_fund_inspiration.0011.desc: ""Thank you for your patronage, [ROOT.Char.Custom('FormOfAddressForLiege')]," [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] bows deeply to hide the large smile on [inspiration_owner.GetHerHis] face.\n\n"There is a great many things I can make, but perhaps you would desire something #EMP specific#!?""
 gh_fund_inspiration.0011.difficulty.easy: "The [inspiration_owner.Custom('GetInspirationCategory')] will have an #EMP easy#! difficulty"
 gh_fund_inspiration.0011.difficulty.medium: "The [inspiration_owner.Custom('GetInspirationCategory')] will have a #EMP medium#! difficulty"
 gh_fund_inspiration.0011.difficulty.hard: "The [inspiration_owner.Custom('GetInspirationCategory')] will have a #EMP hard#! difficulty"
 gh_fund_inspiration.0011.beads: "Simple beads will do."
 gh_fund_inspiration.0011.beads.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] will create an $trinket$ [inventory_artifact|E] based on your instructions"
 gh_fund_inspiration.0011.beads.difficulty: "$gh_fund_inspiration.0011.difficulty.easy$"
 gh_fund_inspiration.0011.flask: "A handy flask is what I desire."
 gh_fund_inspiration.0011.flask.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] will create an $trinket$ [inventory_artifact|E] based on your instructions"
 gh_fund_inspiration.0011.flask.difficulty: "$gh_fund_inspiration.0011.difficulty.easy$"
 gh_fund_inspiration.0011.beaker: "A regal beaker to drink from."
 gh_fund_inspiration.0011.beaker.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] will create an $pedestal$ [court_artifact|E] based on your instructions"
 gh_fund_inspiration.0011.beaker.difficulty: "$gh_fund_inspiration.0011.difficulty.medium$"
 gh_fund_inspiration.0011.beaker.difficulta: ""
 gh_fund_inspiration.0011.ewer: "I could use a graceful ewer."
 gh_fund_inspiration.0011.ewer.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] will create an $pedestal$ [court_artifact|E] based on your instructions"
 gh_fund_inspiration.0011.ewer.difficulty: "$gh_fund_inspiration.0011.difficulty.medium$"
 gh_fund_inspiration.0011.vase: "An opulent new vase is what my [ROOT.Char.Custom('ResidenceBuilding')] needs."
 gh_fund_inspiration.0011.vase.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] will create an $sculpture$ [court_artifact|E] based on your instructions"
 gh_fund_inspiration.0011.vase.difficulty: "$gh_fund_inspiration.0011.difficulty.hard$"
 gh_fund_inspiration.0011.sculpture: "I will settle for no less than a grand sculpture!"
 gh_fund_inspiration.0011.sculpture.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] will create an $sculpture$ [court_artifact|E] based on your instructions"
 gh_fund_inspiration.0011.sculpture.difficulty: "$gh_fund_inspiration.0011.difficulty.hard$"
 gh_fund_inspiration.0011.they_decide: "Master's choice."

 gh_fund_inspiration.0012.t: "$glassware_inspiration$ Funded"

 personal_inspiration.title: "Personal Inspiration"

 gh_fund_inspiration.0013.t: "$personal_inspiration.title$ Funded"
 gh_fund_inspiration.0013.desc: "At times — in the quiet moments between never-ending meetings and everyday burdens — I find myself yearning to do something, to leave a legacy of artistry done by my own hands. The choice of craft is obvious, for who else but the [ROOT.Char.GetCulture.GetName] could claim mastery over the grace and beauty of glass?\n\nIndeed, the only decision left is what to make…"
 gh_fund_inspiration.0013.beads.tt: "You will initiate a #V Glassware#! [personal_inspiration|E] to create a $trinket$ [inventory_artifact|E]"
 gh_fund_inspiration.0013.flask.tt: "You will initiate a #V Glassware#! [personal_inspiration|E] to create a $trinket$ [inventory_artifact|E]"
 gh_fund_inspiration.0013.beaker.tt: "You will initiate a #V Glassware#! [personal_inspiration|E] to create a $pedestal$ [court_artifact|E]"
 gh_fund_inspiration.0013.ewer.tt: "You will initiate a #V Glassware#! [personal_inspiration|E] to create a $pedestal$ [court_artifact|E]"
 gh_fund_inspiration.0013.vase.tt: "You will initiate a #V Glassware#! [personal_inspiration|E] to create a $sculpture$ [court_artifact|E]"
 gh_fund_inspiration.0013.sculpture.tt: "You will initiate a #V Glassware#! [personal_inspiration|E] to create a $sculpture$ [court_artifact|E]"
 gh_fund_inspiration.0013.exit: "On other hand, I would rather not."
 gh_fund_inspiration.0013.exit.gold_refund: "You decide to pursue glassmaking at some other time"

 gh_fund_inspiration.0501.t.very_good: "[GetPlayer.Custom('GetPersonalInspirationVeryGoodQualityReason')]"
 gh_fund_inspiration.0501.t.good: "[GetPlayer.Custom('GetPersonalInspirationGoodQualityReason')]"
 gh_fund_inspiration.0501.t.experience: "Knowledge Exchange"
 personal_inspiration_skill_level_gain: "[GetPlayer.GetUIName|U] have exchanged pointers with local artisans"
 gh_fund_inspiration.0501.t.bad: "[GetPlayer.Custom('GetPersonalInspirationBadQualityReason')]"
 gh_fund_inspiration.0501.t.very_bad: "[GetPlayer.Custom('GetPersonalInspirationVeryBadQualityReason')]"

 gh_fund_inspiration.1012.t: "$personal_inspiration.title$ Realized"
 gh_fund_inspiration.1012.desc: "After many days of toil, my labors are finished. The forge is cool, the tools put away, and I can finally step back and gaze upon what my hands have brought into this world.\n\n"
 gh_fund_inspiration.1012.common: "A learning experience, if nothing more."
 gh_fund_inspiration.1012.masterwork: "Well-crafted, albeit not an heirloom."
 gh_fund_inspiration.1012.famed: "Now this is something to be proud about."
 gh_fund_inspiration.1012.illustrious: "My perseverance is rewarded hundredfold!"

 gh_fund_inspiration.1013.t: "$personal_inspiration.title$ Ended"
 gh_fund_inspiration.1013.desc: "With the death of [dead_personal_inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] whatever he had been working on these last few months will forever remain unfinished.\n\nAlthough much of the money invested in [dead_personal_inspiration_owner.GetHerHis] project has long since been spent, some of it can still be salvaged to recoup a part of the cost."
 gh_fund_inspiration.1013.a: "Woe!"
 gh_fund_inspiration.1013.a.tt: "[dead_personal_inspiration_owner.GetTitledFirstNamePossessive] [personal_inspiration|E] has been invalidated"

 gh_fund_inspiration.1014.t: "$personal_inspiration.title$ Ended"
 gh_fund_inspiration.1014.desc: "I swim through rings of darkness, each one swallowing me deeper beneath the inky surface of oblivion. What was I doing? I cannot remember. What purpose did my hands serve, that I miss my labours so?"
 gh_fund_inspiration.1014.a: "How did it come to this?"
 gh_fund_inspiration.1014.a.tt: "[GetPlayer.GetUINamePossessive|U] [personal_inspiration|E] has been invalidated"

 gh_fund_inspiration.2001.t: "$fund_inspiration.title$ Essence and Emulation"
 gh_fund_inspiration.2001.desc: "\"My [ROOT.Char.GetLadyLord|U], please take a look at these casts.\"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] arranges a handful of plaster masks on the table before me; some of the faces on them are more recognisable than the others.\n\n\"These are meant to represent mighty heroes and leaders of old, your Highness. By donning the likeness of their visage, one could lay claim to a part of their legacy, as well as all that comes with it.\"\n\n[inspiration_owner.GetSheHe|U] clasps [inspiration_owner.GetHerHis] hands behind [inspiration_owner.GetHerHis] back. \"Should your [ROOT.Char.GetLadyLord]ship wish it, I could create the mask in the desired image of your choosing.\""
 gh_fund_inspiration.2001.otached: "I shall become the second Otached!"
 gh_fund_inspiration.2001.otached.tt: "#EMP Otached#! was a legendary Ölteni warlord and conqueror, founder of the [otachedian_empire|E], and the wielder of the mythical [Concept('iorne_seld', 'Sword of Eons')|E]. Descending onto [kashirya|E] with his enormous [Concept('iorne_horde', 'horde')|E], he created what is perhaps the greatest empire that the region has ever seen.\n"
 gh_fund_inspiration.2001.otached_bonus: "Your artifact may gain a rulership modifier"
 gh_fund_inspiration.2001.ayran: "Ayran is the one to emulate."
 gh_fund_inspiration.2001.ayran.tt: "Ayran was the eldest son of Otached and the inheritor of the [Concept('kashirya', 'Kashiryan')|E] heartlands of the [otachedian_empire|E]. Having spent most of his reign consolidating the young realm that was left to him, many consider his time to be the golden age of the region before the chaos of the Five Brothers' War and [bayyuralar|E].\n"
 gh_fund_inspiration.2001.ayran_bonus: "Your artifact may gain a majesty modifier"
 gh_fund_inspiration.2001.kusan: "I seek Kusan's tenacity."
 gh_fund_inspiration.2001.kusan.tt: "#EMP Kusan#! was the youngest of [Concept('otachedian_empire', 'Otached\\'s')|E] children, and the one who was given leadership of the few Ölteni who had made it across [Concept('kasiryat_biozone', 'Kasiryat')|E] before the [aironoian_migration|E]. Endowed with neither wealth nor large warbands under his command, he had nevertheless persisted through the brutal succession wars and remained in power until he was felled by Baytor's hand at the outset of [bayyuralar|E].\n"
 gh_fund_inspiration.2001.kusan_bonus: "Your artifact may gain a personal modifier"
 gh_fund_inspiration.2001.ayar: "Ayar's industriousness was unmatched."
 gh_fund_inspiration.2001.ayar.tt: "#EMP Ayar#! was one of the sons of [Concept('otachedian_empire', 'Otached')|E] who had inherited his father's southern holdings and the empire's tributaries in the [pirate_coast|E]. He greatly expanded the region's spice plantations, which in their day almost single-handedly financed the operations of the imperial court.\n"
 gh_fund_inspiration.2001.ayar_bonus: "Your artifact may gain a gold-related modifier"
 gh_fund_inspiration.2001.ioa: "The exploits of Ioa are second to none."
 gh_fund_inspiration.2001.ioa.tt: "#EMP Ioa#! was the daughter of [Concept('otachedian_empire', 'Otached')|E] and the inheritor of the steppe portion of his empire. Far more concerned with personal glory than rulership, she nevertheless had the backing of the major clans of the Kolrgii steppes, and her realm persisted for longer than those of her brothers.\n"
 gh_fund_inspiration.2001.ioa_bonus: "Your artifact may gain a vassal opinion modifier"
 gh_fund_inspiration.2001.baytor: "Say what you will, but Baytor had #EMP ambition#!."
 gh_fund_inspiration.2001.baytor.tt: "#EMP Baytor#! was the last Kagakhatan of the [otachedian_empire|E], claiming it as the victor of the Five Brothers' War. With his death at the [battle_of_the_wall_of_astila|E] during the [bayyuralar|E], his empire shattered, and he remains a divisive figure ever since.\n"
 gh_fund_inspiration.2001.baytor_bonus: "Your artifact may gain a combat modifier"
 gh_fund_inspiration.2001.mogha: "It is Mogha who outlasted them all."
 gh_fund_inspiration.2001.mogha.tt: "#EMP Mogha#! was the eldest son of Ayran and one of the few survivors of the Five Brothers' War. Having become Baytor's bannerman in its aftermath and surviving through the [bayyuralar|E], he had returned to [kashirya|E] to tend to the remains of the [otachedian_empire|E].\n"
 gh_fund_inspiration.2001.mogha_bonus: "Your artifact may gain a prowess modifier"
 gh_fund_inspiration.2001.ogotei: "Ögotei is remembered for his honor."
 gh_fund_inspiration.2001.ogotei.tt: "#EMP Ögotei Tankhatan#! was the leader of the Khaiasheg, Baytor's elite guard at the time of [bayyuralar|E]. Skilled with the blade, bow, and on horseback, it was said that he had grown on the milk of the Horse-beneath-the-Sky herself.\n"
 gh_fund_inspiration.2001.ogotei_bonus: "Your artifact may gain a knight-related modifier"
 gh_fund_inspiration.2001.korsakai: "Korsakai built an empire out of ashes."
 gh_fund_inspiration.2001.korsakai.tt: "#EMP Korsakai Hayakhatan#! was an [Concept('otachedian_empire', 'Otachedian')|E] general-turned-warlord who had carved a realm for himself in the wake of the [bayyuralar|E]. A renowned warrior and a skilled diplomat, he had cowed as many tribes with his word as he did with his sword.\n"
 gh_fund_inspiration.2001.korsakai_bonus: "Your artifact may gain a rulers' opinion modifier"
 gh_fund_inspiration.2001.toragei: "The Mahratians would not be here without Töragei."
 gh_fund_inspiration.2001.toragei.tt: "[toragei_mahratian|E] was a self-proclaimed son of Otached and the leader of the Ölteni clans that had pushed into Amaghea during the [aironoian_migration|E], eventually settling around the [north_kharadan_biozone|E] and adopting many [GetCulturePillar('heritage_lerrardin').GetName] rites and customs.\n"
 gh_fund_inspiration.2001.toragei_bonus: "Your artifact may gain an acceptance modifier"
 gh_fund_inspiration.2001.none: "Staying true to oneself is enough."
 gh_fund_inspiration.2001.none_bonus: "Your artifact may gain a prestige modifier"

 gh_fund_inspiration.2002.t: "$fund_inspiration.title$ Crystal Blood"
 gh_fund_inspiration.2002.desc: "Stepping inside the workshop of [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)], I am immediately gripped by a sense of unease. The place is dark, humid, and a tangy metallic smell assaults my nostrils. By [ROOT.Char.GetFaith.HighGodName], how can this [inspiration_owner.GetWomanMan] even work here?\n\n\"Ah, My [ROOT.Char.GetLadyLord|U], I was just about to go searching for you!\" [inspiration_owner.GetTitledFirstNameNoTooltip] emerges from somewhere deeper within the room, a strange glint in [inspiration_owner.GetHerHis] bloodshot [inspiration_owner.Custom('EyeEyes')].\n\n\"I beg you, please, take a look.\" [inspiration_owner.GetSheHe|U] presents me with a small box that contains a shimmering crimson gem, its sharp glow causing a prickling sensation on my skin.\n\n\"This is but a sliver of [bloodcrystal|El], the noblest of gems. With just a bit of extra funds, I will be able to obtain one large enough to make a mask unlike any seen before.\""
 gh_fund_inspiration.2002.a: "No, just... No."
 gh_fund_inspiration.2002.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] will craft the mask from more traditional materials"
 gh_fund_inspiration.2002.b: "It is... beautiful..."
 gh_fund_inspiration.2002.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] will craft the mask out of [bloodcrystal|El]"
 gh_fund_inspiration.2002.c: "You are a madman, get out of my sight!"

 gh_fund_inspiration.2003.t: "$fund_inspiration.title$ Salt in the Wound"
 gh_fund_inspiration.2003.desc.inspiration_owner: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] approaches me in the throne room, an eclectic assortment of smith's tools — and a personal grimoire — strapped to [inspiration_owner.GetHerHis] belt. Somewhat conspiratorially, [inspiration_owner.GetSheHe] glances about, before finally addressing me.\n\n\"My [ROOT.Char.GetLadyLord|U], I've been doing #EMP research#!,\" [inspiration_owner.GetSheHe] says, gesturing loosely, \"and believe that, with but a modest sum more, I could craft a weapon no lesser than those of legend.\"\n\n\"I speak of an enchanted blade, my [ROOT.Char.GetLadyLord|U],\" [inspiration_owner.GetNameNoTooltip] adds, \"not dissimilar to the [perdition_armaments|E] that were once carried by the guards of the Halite Temple. I have no doubt it will be a great boon — and a fell weapon besides.\""
 gh_fund_inspiration.2003.desc.court_magi: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] approaches me in the throne room, [court_magi|E] [magi.GetName] in tow. Somewhat conspiratorially, they glance about each other, before [inspiration_owner.GetNameNoTooltip] finally addresses me.\n\n\"My [ROOT.Char.GetLadyLord|U], [magi.GetNameNoTooltip] and I, we have spoken,\" [inspiration_owner.GetSheHe] says, gesturing loosely, \"and believe that, with but a modest sum more, we could craft a weapon no lesser than those of legend.\"\n\n\"We speak of an enchanted blade, my [ROOT.Char.GetLadyLord|U],\" [magi.GetNameNoTooltip] adds, \"not dissimilar to the [perdition_armaments|E] that were once carried by the guards of the Halite Temple. I have no doubt it will be a great boon — and a fell weapon besides.\""
 gh_fund_inspiration.2003.desc.outside_magi: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] approaches me in the throne room, an unknown [magi.GetWomanMan]—a [magi|E], judging by [magi.GetHerHis] garb — in tow. Somewhat conspiratorially, [inspiration_owner.GetNameNoTooltip] glances about, before finally addressing me.\n\n\"My [ROOT.Char.GetLadyLord|U], this is [magi.GetFullName], a well-known enchanter of great renown,\" [inspiration_owner.GetSheHe] says, gesturing at the [magi.GetWomanMan], \"I believe that with [magi.GetHerHis] assistance — and but a modest sum more — we could craft a weapon no lesser than those of legend.\"\n\n\"I speak of an enchanted blade, my [ROOT.Char.GetLadyLord|U],\" [inspiration_owner.GetNameNoTooltip] adds, \"not dissimilar to the [perdition_armaments|E] that were once carried by the guards of the Halite Temple. I have no doubt it will be a great boon — and a fell weapon besides.\""
 gh_fund_inspiration.2003.a: "Very well, you shall have all the funds you need."
 gh_fund_inspiration.2003.a.flavor: "Magical weapons oftentimes cost more than just gold — surely, this is a bargain."
 gh_fund_inspiration.2003.enchantment.tt: "The [artifact|E] produced through [artifact_quality_scope.GetShortUINamePossessive|U] [inspiration.GetName] will have a [Concept('perdition_armaments', 'Perdition')|E] enchantment"
 gh_fund_inspiration.2003.b: "Would [magi.GetFirstNameNoTooltip] be interested in a more #EMP permanent#! position?"
 gh_fund_inspiration.2003.b.flavor: "I was looking for a competent Court Magi anyway."
 gh_fund_inspiration.2003.c: "I can do it myself, actually."
 gh_fund_inspiration.2003.c.flavor: "I have knowledge of this ritual, and scarcely need any help to cast it by myself."
 gh_fund_inspiration.2003.d: "I am not spending my money on this."
 gh_fund_inspiration.2003.d.flavor: "The economy, fools!"

 gh_fund_inspiration.2004.t: "$personal_inspiration.title$: Finding a Tutor"
 gh_fund_inspiration.2004.desc: "My summons for a tutor is answered by a [tutor.Custom('quirk_pos_adjective')] [tutor.GetWomanMan] who presents [tutor.GetHerselfHimself] before me.\n\n\"My name is [tutor.GetFirstName], [tutor.Custom2('RelationToMeAddress', ROOT.Char)], and I happen to be a glassmith of considerable renown,\" [tutor.Custom('quirk_pos_standalone')|l]. \"For a small patronage fee, I would be honored to share my knowledge with you,\" [tutor.GetFirstNameNoTooltip] finishes with an obsequious bow."
 gh_fund_inspiration.2004.a: "A single lesson will be enough."
 gh_fund_inspiration.2004.a.flavor: "A proper introduction is all that I need to succeed."
 gh_fund_inspiration.2004.a.tt: "You pay [tutor.GetTitledFirstName] for a lesson in glassmaking"
 gh_fund_inspiration.2004.b: "Several study sessions should see me through."
 gh_fund_inspiration.2004.b.flavor: "An honest effort for an honest art."
 gh_fund_inspiration.2004.b.tt: "You pay [tutor.GetTitledFirstName] for a couple of lessons"
 gh_fund_inspiration.2004.c: "My studies will be #EMP comprehensive#!!"
 gh_fund_inspiration.2004.c.flavor: "The mysteries of glassmaking shall unravel before me!"
 gh_fund_inspiration.2004.c.tt: "You pay [tutor.GetTitledFirstName] to teach you everything [tutor.GetSheHe] knows"
 gh_fund_inspiration.2004.d: "I would be interested in a more permanent arrangement."
 gh_fund_inspiration.2004.d.flavor: "Every self-respecting [ROOT.Char.GetTitleAsNameNoTooltip|l] must have a master artisan in [ROOT.Char.GetHerHis] employ, after all."
 gh_fund_inspiration.2004.d.gaffer.aptitude: "[court_gaffer.GetFirstNamePossessiveNoTooltip] [aptitude|E] is [court_gaffer.GetCourtPositionAptitude(GetCourtPositionType('court_gaffer_court_position'))]"
 gh_fund_inspiration.2004.d.tutor.aptitude: "[tutor.GetFirstNamePossessiveNoTooltip] [aptitude|E] is [tutor.GetCourtPositionAptitude(GetCourtPositionType('court_gaffer_court_position'))]"
 gh_fund_inspiration.2004.e: "On second thought, I would rather not."
 gh_fund_inspiration.2004.e.flavor: "How hard could it possibly be to do it myself?"
 gh_fund_inspiration.2004.e.tt: "You dismiss [tutor.GetTitledFirstNamePossessive] offer of tutoring and advise"
 gh_fund_inspiration.2004.e.warning.tt: "@alert_icon! #alert_trial You will #BOL not#! be able to use this [Concept('inspiration_actions', 'Inspiration Action')|E] again#!"

 gh_fund_inspiration.2005.t: "$personal_inspiration.title$ What Does a Glass Make"
 gh_fund_inspiration.2005.desc: "I sit down in my study, surrounded by scrolls and books and more, each covering one aspect of glassmaking or another. What ratio of flux should I use? When is it best to add frit? How do I get rid of these damn blisters!?\n\nUltimately, the question presented before me is one of composition. For my vision to be realised in its entirety, I must settle on a specific type of glass to make."
 gh_fund_inspiration.2005.toast.success.t: "Your experimentation is successful"
 gh_fund_inspiration.2005.toast.failure.t: "Your experiments are unsuccessful"
 gh_fund_inspiration.2005.a: "Forest Glass is quite fetching, I think."
 gh_fund_inspiration.2005.a.flavor: "Popular in [chevalie|E] and the [Concept('the_continent','Continental Interior')|E], Forest Glass is produced from wood ash and usually has a green-brownish color"
 gh_fund_inspiration.2005.a.domestic.tt: "The materials will be procured for no additional cost because you are [Concept('location','Located')|E] within the [GetGeographicalRegion('forest_glass_domestic_region').GetName] [region|E]"
 gh_fund_inspiration.2005.a.import.tt: "The materials will be procured from somewhere in the [GetGeographicalRegion('forest_glass_domestic_region').GetName] [region|E]"
 gh_fund_inspiration.2005.a.effect.tt: "Forest Glass [artifacts|E] of #color:{0.125,0.454,0.894,0.8} Famed#! [rarity|E] and above may gain a [stewardship|E]-related [modifier|E]"
 gh_fund_inspiration.2005.a.mastery.tt: "Creating an #color:{0.721,0.321,0.894,0.8} Illustrious#! [artifact|E] will grant a [GetModifier('forest_glass_master_modifier').GetNameWithTooltip] [modifier|E]"
 gh_fund_inspiration.2005.a.toast.success.tt: "You successfully create Forest Glass"
 gh_fund_inspiration.2005.a.toast.failure.tt: "Your Forest Glass is rife with impurities"
 gh_fund_inspiration.2005.b: "Smalt Glass is the most noble of them all!"
 gh_fund_inspiration.2005.b.flavor: "Smalt Glass is intensely blue in color and is derived from rare minerals mined primarily in [kashirya|E] and [amsar|E]"
 gh_fund_inspiration.2005.b.domestic.tt: "The materials will be procured for no additional cost because you are [Concept('location','Located')|E] within the [GetGeographicalRegion('smalt_glass_domestic_region').GetName] [region|E]"
