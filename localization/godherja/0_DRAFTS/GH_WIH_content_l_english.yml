 gh_war_in_heaven_struggle_ender_name: "The Fate of [GetTitleByKey('h_sarradon').GetNameNoTierNoTooltip|U]"
 gh_war_in_heaven_struggle_ender_desc:0 "Central Sarradon nearly fell. But when the bonds frayed and the Pillars groaned beneath the weight of centuries of conflict, [founder.GetNameNoTooltip] stood as iron. The War in Heaven may not have yet ended but darkness shall not pass here again."
 gh_eastern_war_in_heaven_struggle_ender_name: "Eastern Sarradon Reclamation"
 gh_eastern_war_in_heaven_struggle_ender_desc:0 "They will say it was here that the tide began to shift across the dust-choked lands of Eastern Sarradon. [founder.GetNameNoTooltip] brought peace and prosperity, enough to hold and to last."
 gh_far_eastern_war_in_heaven_struggle_ender_name: "The Fate of the Far-East"
 gh_far_eastern_war_in_heaven_struggle_ender_desc:0 "A hundred campaigns had failed to hold it. Realms and names forgotten, ground lost and taken again. But when [founder.GetNameNoTooltip] started taking over Far Eastern Sarradon, all new its fate had been decided."
 gh_western_war_in_heaven_struggle_ender_name: "Western Sarradon Restored"
 gh_western_war_in_heaven_struggle_ender_desc:0 "For generations, Western Sarradon wavered—torn between warlords and unbelievers. But under [founder.GetNameNoTooltip] peace was restored, and the War in Heaven in the region, now a just memory."
 gh_far_western_war_in_heaven_struggle_ender_name: "The West Secured"
 gh_far_western_war_in_heaven_struggle_ender_desc:0 "The Far Western Sarradon was distant, in the hands of heretics, and thought beyond reach. [founder.GetNameNoTooltip] proved otherwise. With one campaign after another, [founder.GetNameNoTooltip] achieved what none thought could be possible."


