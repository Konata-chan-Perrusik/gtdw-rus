 maa_kharazadim_footmen: "Kharazadim"
 maa_kharazadim_flavor:0 "Damp undergrowth and rough terrain seem ill-suited to heavy infantry, yet the formations known as Kharazadim specialize in ambushes and close battle beneath the canopy. Their ranks are trained to force a path through uneven ground and hold ground where cavalry or archers cannot advance."

 maa_jarifin_lancers: "Jarifin Lancers"
 maa_jarifin_lancers_flavor:0 "Lancer formations drawn from the more arid plains of Khenemhat and the Sirwali Coast. Jarifin ride sturdy horses bred for long marches. Their tactics favor swift charges and pursuit over open ground, with equipment adapted to withstand heat and dust."

 maa_sarathem_magi: "Sarathem"
 maa_sarathem_flavor:0 "Disciplined warbands of magi trained in the lowlands and crater rim of Aekershaan. Sarathem practice a form of magical group combat unique to the region, blending minor spellcraft with aggressive hand-to-hand fighting, typically in groups of three. Their ranks are drawn from lesser local families, often fighting for the highest bidder."

 maa_safri_archers: "Safri"
 maa_safri_archers_flavor:0 "The Safrit archers are equipped with unusually long and heavy bows. Lacking mobility, they wear heavy armor to compensate. Their arrows, equally heavier, can penetrate armor at long distances and bring down large game that most ordinary archers avoid.