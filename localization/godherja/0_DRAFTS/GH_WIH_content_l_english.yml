 ######################################
 #                                    #
 #          GAME CONCEPTS             #
 #                                    #
 ######################################
 
 game_concept_great_struggle: "Great Struggle"
 game_concept_great_struggle_desc:0 "Great Struggles are vast, sometimes continent-spanning conflicts that encompass multiple [Concept('struggle','Struggles')|E] and their respective [struggle_region_regions|E]. While each $game_concept_struggle$ plays out according to its own local tensions, all contribute to the broader momentum of a single $game_concept_great_struggle$.\n\nUnder the right conditions, neighboring regions may be drawn into a $game_concept_great_struggle$. [struggle_phase_phases|E] in individual regions may be shaped by the trajectory of the overarching $game_concept_great_struggle$ itself."
 
 game_concept_gh_war_in_heaven_struggle: "War in Heaven Struggle"
 game_concept_gh_war_in_heaven_struggle_desc:0 "[war_in_heaven|E] encapsulates the centuries-long conflict of belief and power between the [Concept('wardenism','Wardenites')|E] and the [Concept('ritualism','Ritualists')|E] across Sarradon. While countless [rulers|E] and sects have risen and fallen, the central divide has endured since the [the_first_warden|E] rose up at the end of the 3rd Century. Regions involved in the [struggle|E] consistently shift between [Concept('wardenism','Wardenite')|E] or [Concept('ritualism','Ritualist')|E] dominance, and [struggle_phase_phases|E] of varying intensity, where neither side fully succeeds in subduing the other."

 game_concept_struggle_wih_phase_wardenite_dominance: "Wardenite Dominance Phase"
 game_concept_struggle_wih_phase_wardenite_dominance_desc:0 "The Wardenites have secured an upper hand in the $game_concept_gh_war_in_heaven_struggle$, asserting their teachings and purging rival doctrines where possible.\n\nOpposition persists in pockets in the region. Over time, pressure will mount the conflict may slide into a precarious [struggle_wih_phase_detente|E] or reignite into [struggle_wih_phase_all_out_war|E]."
 
 game_concept_struggle_wih_phase_ritualist_dominance: "Ritualist Dominance Phase"
 game_concept_struggle_wih_phase_ritualist_dominance_desc:0 "The $game_concept_struggle_wih_phase_ritualist_dominance$ reflects a period in which [Concept('ritualism','Ritualist')|E] rulers command the broader balance of power.\n\nOver time, the region might transition into a [struggle_wih_phase_detente|E] through mutual weariness, or escalate into an [struggle_wih_phase_all_out_war|E] as the conflict intensifies."
 
 game_concept_struggle_wih_phase_agionist_dominance: "Agionist Dominance Phase"
 game_concept_struggle_wih_phase_agionist_dominance_desc:0 "The Agionists have decisively seized control in the $game_concept_gh_war_in_heaven_struggle$, imposing their order in foreign lands.\n\nThough pockets of resistance remain, the region now bends to Agionist authority. Over time, the situation may settle into a tense [struggle_wih_phase_detente|E], or give way once more to [struggle_wih_phase_all_out_war|E] should the conquered fight back."

 game_concept_struggle_wih_phase_detente: "Detente Phase"
 game_concept_struggle_wih_phase_detente_desc:0 "The $game_concept_struggle_wih_phase_detente$ marks a lull in the broader struggle. Neither Wardenite nor Ritualist powers dominate fully, and control remains contested across multiple fronts. Open conflict is mich more limited, but tensions persist.\n\nThis phase often precedes major shifts. It may lead to renewed [struggle_wih_phase_wardenite_dominance|E] or [struggle_wih_phase_ritualist_dominance|E], or escalate into [struggle_wih_phase_all_out_war|E].

 game_concept_struggle_wih_phase_all_out_war: "All-Out War Phase"
 game_concept_struggle_wih_phase_all_out_war_desc:0 "The $game_concept_struggle_wih_phase_all_out_war$ represents the collapse of compromise. Hostilities intensify across the region, with large-scale wars and widespread instability. Attempts at neutrality are rarely respected.\n\nAs exhaustion sets in or one side gains the upper hand, the [struggle|E] may transition into [struggle_wih_phase_wardenite_dominance|E] or [struggle_wih_phase_ritualist_dominance|E]."


