 gh_war_in_heaven_struggle.0001.t: "The War in Heaven"
 gh_war_in_heaven_struggle.0001.desc.intro: "Sarradon bleeds from a thousand wounds, each torn open by old hatreds with no end in sight. Ancient grudges run deeper than the deepest wells, and the price of this endless strife grows ever steeper.\n\n"
 gh_war_in_heaven_struggle.0001.desc.wardenite: "The Dead God stirs, threatening to break free from Its prison. It falls to me, and all true Wardenites, to reinforce the Pillars and cleanse this land of their heresies before Sarradon is consumed by primordial darkness!"
 gh_war_in_heaven_struggle.0001.desc.ritualist: "The misguided Wardenites, in their heretical beliefs, threaten to obscure the true path of Sophocos. I will not let the truth be shackled by false dogma!"
 gh_war_in_heaven_struggle.0001.desc.involved: "I find myself caught between two forces that care nothing for the people who suffer in their shadow. Perhaps it is time for a different voice to be heard."
 gh_war_in_heaven_struggle.0001.desc.interloper: "This endless war between Wardenites and Ritualists has bled Sarradon dry. I will carve out a place for my people from the ashes of their conflict."
 gh_war_in_heaven_struggle.0001.a: "For Sarradon!"
 
 # Wardenite Victory
 gh_war_in_heaven_struggle.0100.t: "Wardenite victory"
 gh_war_in_heaven_struggle.0100.desc.opening: "At last, the chaos subsides as the final cries of our enemies fade."
 gh_war_in_heaven_struggle.0100.multiple_rulers: "Yet, even as we celebrate, other so-called 'Wardens' squabble over various interpretations of the teachings of the [Concept('the_first_warden','First Warden')|E]. Ours is the only one that can secure this land's future. They must be brought into line, through persuasion or by force."
 gh_war_in_heaven_struggle.0100.desc.single_ruler: "\n\nMy authority in this region is now absolute. From the ashes of the old world, House [ROOT.Char.GetHouse.GetNameNoTooltip] has risen as the undisputed master of [ROOT.Char.Custom('WIHStruggleSubRegionName')]. There is no power left that can challenge our dominion here."
 gh_war_in_heaven_struggle.0100.ritualists_remain: "The Ritualist filth has been broken, yet some still cling to their wretched holdings in the shadows of the region. They are a blight that must be scoured clean before our work can truly be complete."
 gh_war_in_heaven_struggle.0100.ritualists_gone: "The Ritualists have been utterly vanquished. Their profane rites are extinguished, and their followers scattered to the winds."
 gh_war_in_heaven_struggle.0100.agionists_remain: "Even now, the Agionist vultures circle, hoping to pick at the scraps of our hard-won peace. Their opportunism is a threat that cannot be ignored for long."
 gh_war_in_heaven_struggle.0100.agionists_gone: "The Agionist vultures have been driven off, their hopes of profiting from our struggle dashed against the rock of our conviction."
 gh_war_in_heaven_struggle.0100.desc.closing: "\n\nLet the word go forth: [ROOT.Char.Custom('WIHStruggleSubRegionName')] is under our protection now."
 gh_war_in_heaven_struggle.0100.a: "Only when all believe can peace endure."
 gh_war_in_heaven_struggle.0100.b: "The land bleeds, we must bind its wounds."
 gh_war_in_heaven_struggle.0100.c: "They will rise again if left breathing."

 #Involved Wardenite-Aligned Rulers
 gh_war_in_heaven_struggle.0101.t: "A Shared Victory"
 gh_war_in_heaven_struggle.0101.desc.intro: "The war in [struggle_ender.Char.Custom('WIHStruggleSubRegionName')] is over. Our alliance has prevailed and our common enemies in the region lie broken. The Wardenites, for all their zeal, have proven to be devastatingly effective allies."
 gh_war_in_heaven_struggle.0101.desc.single_ruler: "\n\nNow, [struggle_ender.GetTitledFirstName] rules a powerful new wardenite heartland.\n\nThis victory serves the interests of House [struggle_ender.Char.GetHouse.GetNameNoTooltip] for now, but I have helped give rise to a neighbour whose intensity is matched only by [struggle_ender.GetHerHis] strength. This alliance must be managed with care."
 gh_war_in_heaven_struggle.0101.desc.multiple_ruler: "\n\nThe region has not fallen to a single hand, but rather to a chorus of Wardenite rulers and allies, each laying claim to part of the triumph. Where this leads is unclear. For now, the war is won — and I stood on the side that endured."
 gh_war_in_heaven_struggle.0101.a: "A successful partnership."
 gh_war_in_heaven_struggle.0101.b: "Their fervor is... concerning."

 # For other non-wardenite rulers for wardenite victory
 gh_war_in_heaven_struggle.0102.t: "The Wardens' Peace"
 gh_war_in_heaven_struggle.0102.t.wardenite: "A Wardenite Triumph"
 gh_war_in_heaven_struggle.0102.desc.non_wardenite: "News from [struggle_ender.Char.Custom('WIHStruggleSubRegionName')] has reached my court, bearing word of an end to the conflict that has consumed the region for so long.\n\nWardenite forces have crushed all opposition, bringing all of [struggle_ender.Char.Custom('WIHStruggleSubRegionName')] under their control.\n\nThough the greater War in Heaven is far from over, the Wardenites have secured a powerful new heartland. From this bastion, they have proclaimed a new era of prosperity for their people. The Wardenite cause has gained immense strength, and its gaze will likely soon turn outwards."
 gh_war_in_heaven_struggle.0102.desc.opening: "Word has reached us from afar! A great victory has been won in the name of the First Warden. [struggle_ender.Char.Custom('WIHStruggleSubRegionName')] has been claimed by our brethren."
 gh_war_in_heaven_struggle.0102.desc.same_faith: "\n\nFrom afar, I watch with pride — and perhaps a touch of envy. What they have accomplished is no small feat. If peace has been forged there, what is my duty here? Where do I stand in the shape of things to come?"
 gh_war_in_heaven_struggle.0102.desc.different_faith: "\n\nHouse [struggle_ender.GetHouse.GetNameNoTooltip] has achieved a victory for the Wardenite cause as a whole, and for that we are grateful. However, their consolidation of power in Sarradon is a development that must be watched. While we share a common foe in the Ritualists, the strength of their particular sect could one day challenge our own." #Same religion but different faith
 gh_war_in_heaven_struggle.0102.a: "A tyrant's peace is still peace."
 gh_war_in_heaven_struggle.0102.b: "How long until they look to our lands?"
 gh_war_in_heaven_struggle.0102.c: "The future has begun to take shape."
 gh_war_in_heaven_struggle.0102.d: "We will see whose truth endures."
 
 # Ritualist Victory
 gh_war_in_heaven_struggle.0200.t: "Ritualist Triumph"
 gh_war_in_heaven_struggle.0200.desc.opening: "The banners of the faithful flutter in the wind as the last of the heretical forces retreat beyond the borders of [ROOT.Char.Custom('WIHStruggleSubRegionName')]."
 gh_war_in_heaven_struggle.0200.wardenites_remain: "Yet we must be careful, for minor Wardenite lords still hold sway in remote corners of the region."
 gh_war_in_heaven_struggle.0200.wardenites_gone: "The wardenite heresy has been utterly crushed in [ROOT.Char.Custom('WIHStruggleSubRegionName')]. Not a single lord of their twisted faith remains to challenge the righteous order we have established."
 gh_war_in_heaven_struggle.0200.multiple_rulers: "However, I am not the sole ruler in the region. Though united in faith, we remain divided in ambition, and I wonder how long this fragile alliance of convenience will endure."
 gh_war_in_heaven_struggle.0200.desc.single_ruler: "All of [ROOT.Char.Custom('WIHStruggleSubRegionName')] lies within my grasp, I alone must decide the fate of this war-torn land and all who dwell within it."
 gh_war_in_heaven_struggle.0200.agionists_remain: "$gh_war_in_heaven_struggle.0100.agionists_remain$"
 gh_war_in_heaven_struggle.0200.agionists_gone: "$gh_war_in_heaven_struggle.0100.agionists_gone$"
 gh_war_in_heaven_struggle.0200.desc.closing: "\n\nThe future of [ROOT.Char.Custom('WIHStruggleSubRegionName')] will be forged in our image, by our hand alone."
 gh_war_in_heaven_struggle.0200.a: "We must convert the rest of the region."
 gh_war_in_heaven_struggle.0200.b: "Focus should be on rebuilding"
 gh_war_in_heaven_struggle.0200.c: "We cannot allow our enemies to remain."
 
 #Involved Ritualist-Aligned Rulers
 gh_war_in_heaven_struggle.0201.t: "$gh_war_in_heaven_struggle.0101.t$"
 gh_war_in_heaven_struggle.0201.desc.intro: "The war in [ROOT.Char.Custom('WIHStruggleSubRegionName')] is over. Our alliance has prevailed and the heretical Wardenites have been cast down. The faithful, for all their devotion to old rites, have proven to be formidable allies in this conflict."
 gh_war_in_heaven_struggle.0201.desc.single_ruler: "\n\nNow, [struggle_ender.GetTitledFirstName] rules a unified Ritualist domain in [struggle_ender.Char.Custom('WIHStruggleSubRegionName')].\n\nThis victory advances the cause of House [struggle_ender.Char.GetHouse.GetNameNoTooltip], but I have helped create a neighbor whose religious fervor runs as deep as [struggle_ender.GetHerHis] ambition. This partnership must be maintained with wisdom."
 gh_war_in_heaven_struggle.0201.desc.multiple_ruler: "\n\nThe region has fallen not to one hand, but to a confederation of Ritualist lords and their allies, each claiming their portion of the triumph. What shape this new order will take remains to be seen. For now, the war is won — and I stood with the victors."
 gh_war_in_heaven_struggle.0201.a: "The faithful have been rewarded."
 gh_war_in_heaven_struggle.0201.b: "Their devotion runs deep... perhaps too deep."

 # For other non-ritualist rulers for ritualist victory
 gh_war_in_heaven_struggle.0202.t: "A Ritualist Victory"
 gh_war_in_heaven_struggle.0202.t.ritualist: "Ritualist Triumph in [struggle_ender.Char.Custom('WIHStruggleSubRegionName')]"
 gh_war_in_heaven_struggle.0202.desc.non_ritualist: "Word arrives from [struggle_ender.Char.Custom('WIHStruggleSubRegionName')] of a momentous conclusion to the long struggle that has torn the region asunder.\n\nRitualist forces have achieved total victory, sweeping away all Wardenite resistance and bringing the entire region under their dominion.\n\nWhile the greater War in Heaven continues to rage across other lands, the Ritualists have secured a powerful stronghold. From this sacred heartland, they proclaim the restoration of the old ways and the triumph of ancient faith. Whether this heralds a new golden age or a return to darker times, one thing is certain: the Ritualist cause has grown immeasurably stronger."
 gh_war_in_heaven_struggle.0202.desc.opening: "Glorious news reaches us from distant [ROOT.Char.Custom('WIHStruggleSubRegionName')]! Our fellow faithful have achieved a great victory in the name of the old gods and ancient ways."
 gh_war_in_heaven_struggle.0202.desc.same_faith: "\n\nFrom this distance, I watch with both pride and concern. What they have accomplished validates our shared beliefs, yet their success raises questions about my own position. If they have brought peace to their lands through strength, what path should I follow here?"
 gh_war_in_heaven_struggle.0202.desc.different_faith: "\n\nHouse [struggle_ender.GetHouse.GetNameNoTooltip] has won a victory for the broader Ritualist movement, and for this we must be grateful. Yet their consolidation of power in [ROOT.Char.Custom('WIHStruggleSubRegionName')] bears watching. While we stand united against the Wardenite heresy, the influence of their particular sect may one day threaten the purity of our own traditions."
 gh_war_in_heaven_struggle.0202.a: "The old ways endure."
 gh_war_in_heaven_struggle.0202.b: "How long before they seek to expand?"
 gh_war_in_heaven_struggle.0202.c: "A new chapter begins."
 gh_war_in_heaven_struggle.0202.d: "Which interpretation will prevail?"

 # Generic Victory
 gh_war_in_heaven_struggle.0300.t: "Victory at Last"
 gh_war_in_heaven_struggle.0300.desc: "The dust settles over [ROOT.Char.Custom('WIHStruggleSubRegionName')] and I stand alone atop a mountain of conquered foes.\n\nThe entirety of [ROOT.Char.Custom('WIHStruggleSubRegionName')] bends the knee to House [ROOT.Char.GetHouse.GetNameNoTooltip]. I have succeeded where centuries zealots and fanatics have failed."
 gh_war_in_heaven_struggle.0300.a: "This is only the beginning."
 gh_war_in_heaven_struggle.0300.b: "We must forge something greater from these ashes."

 # For other observing rulers for generic victory
 gh_war_in_heaven_struggle.0301.t: "A New Power Rises"
 gh_war_in_heaven_struggle.0301.t.same_faith: "Victory in [ROOT.Char.Custom('WIHStruggleSubRegionName')]"
 gh_war_in_heaven_struggle.0301.desc.different_religion: "Reports arrive from [ROOT.Char.Custom('WIHStruggleSubRegionName')] telling of the end to the brutal conflict that has ravaged the region for years.\n\n[struggle_ender.GetTitledFirstName] has emerged triumphant, crushing both Wardenite zealots and Ritualist devotees alike to claim dominion over the entire region. A new power has risen, and its intentions remain to be seen."
 gh_war_in_heaven_struggle.0301.desc.opening: "Word reaches us from [ROOT.Char.Custom('WIHStruggleSubRegionName')], [struggle_ender.GetTitledFirstName] has triumphed over the warring factions and claimed the region."
 gh_war_in_heaven_struggle.0301.desc.same_faith: "\n\nA fellow believer has succeeded where others failed. The faithful have shown their strength."
 gh_war_in_heaven_struggle.0301.desc.different_faith: "\n\nHouse [struggle_ender.GetHouse.GetNameNoTooltip] has achieved a great victory, though their ways are not entirely our own. Their triumph in [ROOT.Char.Custom('WIHStruggleSubRegionName')] must be watched with interest."
 gh_war_in_heaven_struggle.0301.a: "Victory speaks for itself."
 gh_war_in_heaven_struggle.0301.b: "They may look elsewhere to expand next."


 # Agionist Victory
 gh_war_in_heaven_struggle.0400.t: "Victory Achieved"
 gh_war_in_heaven_struggle.0400.desc.opening: "The war for [ROOT.Char.Custom('WIHStruggleSubRegionName')] has ended. I stands victorious over all who opposed us. "
 gh_war_in_heaven_struggle.0400.multiple_rulers: "Several lords now hold dominion across the region, each having played their part in this triumph. The question of what comes next remains to be answered."
 gh_war_in_heaven_struggle.0400.desc.single_ruler: "\n\nThe entirety of [ROOT.Char.Custom('WIHStruggleSubRegionName')] is mine. From the highest tower to the smallest hamlet, all acknowledge my rule."
 gh_war_in_heaven_struggle.0400.wardenites_remain: " Wardenite holdouts persist in scattered strongholds, but their influence wanes with each passing day."
 gh_war_in_heaven_struggle.0400.wardenites_gone: " No Wardenite lord remains to challenge our authority in this region."
 gh_war_in_heaven_struggle.0400.ritualists_remain: " Ritualist enclaves still dot the landscape, though their power has been thoroughly broken."
 gh_war_in_heaven_struggle.0400.ritualists_gone: " The Ritualist fanatics have been entirely swept away from [ROOT.Char.Custom('WIHStruggleSubRegionName')]."
 gh_war_in_heaven_struggle.0400.a: "Order from chaos."
 gh_war_in_heaven_struggle.0400.b: "Who would've doubted this outcome."
 
 #Involved Agionist-Aligned Rulers
 gh_war_in_heaven_struggle.0401.t: "$gh_war_in_heaven_struggle.0101.t$"
 gh_war_in_heaven_struggle.0401.desc.intro: "The war in [ROOT.Char.Custom('WIHStruggleSubRegionName')] is over. Our alliance has prevailed and the religious extremists have been cast aside. The Agionists have proven to be remarkably effective partners in this endeavor."
 gh_war_in_heaven_struggle.0401.desc.single_ruler: "\n\nNow, [struggle_ender.GetTitledFirstName] rules over a prosperous new commercial heartland in [ROOT.Char.Custom('WIHStruggleSubRegionName')].\n\nThis victory serves the interests of House [struggle_ender.Char.GetHouse.GetNameNoTooltip] well, but I have helped establish a neighbor whose ambitions are as boundless as [struggle_ender.GetHerHis] coffers. This partnership must be managed with shrewd calculation."
 gh_war_in_heaven_struggle.0401.desc.multiple_ruler: "\n\nThe region has fallen to a consortium of Agionist lords and their allies, each claiming their share of the spoils. What manner of order they will establish from their competing interests remains to be seen. For now, the war is won — and I chose the profitable side."
 gh_war_in_heaven_struggle.0401.a: "A successful arrangement."
 gh_war_in_heaven_struggle.0401.b: "Their appetite may prove insatiable..."
 
 # For other observing rulers for agionist victory
 gh_war_in_heaven_struggle.0402.t: "News from [ROOT.Char.Custom('WIHStruggleSubRegionName')]"
 gh_war_in_heaven_struggle.0402.t.agionist: "An Agionist Triumph"
 gh_war_in_heaven_struggle.0402.desc: "Word arrives from [ROOT.Char.Custom('WIHStruggleSubRegionName')] that the long struggle there has finally ended.\n\n[struggle_ender.GetTitledFirstName] has emerged as victor, having defeated all opposition from native sarradonians to claim Agionist superiority over the entire region.\n\nWhat this means for the wider conflict remains unclear, but one thing is certain, the balance of power has shifted."
 gh_war_in_heaven_struggle.0402.a: "We shall see what follows."
 gh_war_in_heaven_struggle.0402.b: "New powers emerge."




 gh_great_struggle_ending.0001.t: "Laws of Heaven"
 gh_great_struggle_ending.0001.desc: "The final army of the faithless is broken. the conflict that has defined generations and drowned a continent in blood, is over. Every soul lost, every city burned, every sacrifice made has led to this moment of absolute, final victory. Surely the continent will know only peace from now on..."
 gh_great_struggle_ending.0001.a: "A new wardenite era begins."

 gh_great_struggle_ending.0003.t: "Heaven Restored"
 gh_great_struggle_ending.0003.desc: "The angels have delivered us from wardenite darkness and the world, at last, breathes free again.\n\nGenerations have known nothing but the shadow of their cold, sterile 'order.' They promised peace, but offered only a cage. I have seen the end of the world's greatest heresy. Let all remember that House [ROOT.Char.GetHouse.GetNameNoTooltip] delivered this world from darkness."
 gh_great_struggle_ending.0003.a: "Let the world hear of this."
 gh_great_struggle_ending.0003.b: "We begin from here."


