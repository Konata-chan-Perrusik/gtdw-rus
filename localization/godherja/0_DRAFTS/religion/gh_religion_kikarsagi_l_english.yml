l_english:

 kikarsagi_high_god_name: "Yarkorč"
 kikarsagi_high_god_name_possessive: "Yarkorč"


 #kikarsagi Loc 
 kikarsagi_religion: "Tegęrnaq"
 kikarsagi_religion_adj: "Tegęrnaqi"
 kikarsagi_religion_adherent: "Tegęrnaqi"
 kikarsagi_religion_adherent_plural: "Tegęrnaqs"
 kikarsagi_religion_desc: "Yarkorč created the first humans from spirits by sharing his divine [ardara|E], revealing to them the nature of the world. Those who nurture their soul will ascend to the heavens and attain divinity themselves; those who squander their Ardara are banished back to the Spirit Plains to eternally hunger after the souls of others."
 
 kikarsagi_aagio: "Kikarsagi Aagiokrata"
 kikarsagi_aagio_adj: "Kikarsagi Aagiokratan"
 kikarsagi_aagio_adherent: "Kikarsagi Aagiokratan"
 kikarsagi_aagio_adherent_plural: "Kikarsagi Aagiokratan"
 kikarsagi_aagio_desc: "The [Glossary('Prātogonoi','GH_PRATOGONOI_GLOSS')] were the firstborn children of Yarkorč-Purest, elevated before others and imbued with divine [ardara|E] to guide and shepherd all men. But jealous spirits and weak men attacked the empire, almost destroying it. The Prātogonoi now seek to continue their original mission. Those who obey the ones with inherent Ardara and help with this holy mission will be guaranteed a place with Yarkorč."
 
 kikarsagi_aagiokrata: "Kikarsagi Teligonoi"
 kikarsagi_aagiokrata_adj: "Teligonoi"
 kikarsagi_aagiokrata_adherent: "Teligonoi"
 kikarsagi_aagiokrata_adherent_plural: "Teligonois"
 kikarsagi_aagiokrata_desc: "[frodbrokna|E] has shown that the descendants of the [Glossary('Prātogonoi','GH_PRATOGONOI_GLOSS')] have lost their [ardara|E], condemning them to ruin. Those who will vanquish them will be crowned as the [Glossary('Teligonoiar', 'GH_TELIGONOIAR_GLOSS')] and be rewarded for all eternity for fulfilling the Yarkorč-Purest's judgement.  Those imbued with Ardara must spread it to the lesser peoples through the acts of great power and subjugation, showing others the blessed nature of their rank and seeking worthy servants who can know the true nature of the world."
 
 kikarsagi_old: "Ruha Binekçile" #spirit rider
 kikarsagi_old_adj: "Ruha Binekçile"
 kikarsagi_old_adherent: "Ruha" 
 kikarsagi_old_adherent_plural: "Ruhas" 
 kikarsagi_old_desc: "The $kikarsagi_old_adherent_plural$ have known of [ardara|E] ever since Yarkorč had elevated men from among the spirits of the Spirit Plains, and crafted the first masks to shield their souls.  Others may have forgotten the ways of Yarkorč, but he will return to his faithful in the times of need, born a mortal under the auspicious stars to live and lead before returning to his divine throne in the sky."
 
 kikarsagi_atrakar: "Kutsalsag Anmau" #Sacred Rememberance
 kikarsagi_atrakar_adj: "Anmau"
 kikarsagi_atrakar_adherent: "Anmaun"
 kikarsagi_atrakar_adherent_plural: "Anmauni"
 kikarsagi_atrakar_desc: "$kikarsagi_atrakar_adherent_plural$ preserve the memory of the holy Nartakhatan Ozkan and Nartakhatun Betun, who chose [ardara|E] and death over faithlessness and [Concept('aversaria','Aversarian')|E] subjugation. The faithful preserve the memory of their sacrifice through secret communions, and [ardara|E] is believed to be earned through the emulation of the two Nartakhatans through defending one's home, fostering future generations, and preserving the sacred creed."
 

