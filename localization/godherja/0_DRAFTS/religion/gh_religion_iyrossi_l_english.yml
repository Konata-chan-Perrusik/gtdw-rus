 iyrossi_religion_desc:0 "Emphasizing the relationship with the natural world and refusal to submit to cruelty inflicted on its practitioners, the highest focus of the Iyrossi faith is in the belief that no slight should ever be forgiven without a settling of scores first. Any insult or offense must be paid for, with the price ranging from a few coins to the offender's life. Any other path would be an insult Deiphartoros, God of Justice."
