 selvarossi_iyrossi:0 "Selocha"
 selvarossi_iyrossi_adj:0 "Selochaian"
 selvarossi_iyrossi_adherent:0 "Selocha"
 selvarossi_iyrossi_adherent_plural:0 "Selochaian"
 selvarossi_iyrossi_desc:0 "When the Aversarians were driven from our shores, a great gathering was called to collect and debate the old stories and rituals of our people. We rejected joining a meeting of those who still worshiped [Glossary( 'Deiphartora', 'DEIPHARTORA_GLOSS')] the Deciever, God of Mountains. The Kinambrosti clan chose to return to Lady [Glossary( 'Selva’s', 'SELVA_GLOSS')] home and cast off the false faith the Aversarians had imposed. The Aversarians banished the clan from the lake to weaken Lady Selva, who held the world in balance, so no one could become too powerful and break the world. The Aversarians fall was inevitable when they cut off the empowerment of Lady Selva and sought to rule the world. Now that the world has been broken, the clan seeks to stave off further collapse and hope to one day heal it by strengthening the Lady with sacred rituals and celebrations."

