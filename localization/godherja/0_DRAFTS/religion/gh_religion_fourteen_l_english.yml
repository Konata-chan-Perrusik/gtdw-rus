 fourteen_heavenly_methods_religion_desc:0 "Kai-jiao, or simply "god-worship," is the term used to describe the faiths derived from the indigenous folk religion of Kathun-Kai. These faiths center on the worship of a pantheon of godsled by Shenwang the Grand King of Heaven. Virtuous souls believe they serve the gods in the divine realm of Guodi, while the wicked suffer in Guiyu for eternity."

