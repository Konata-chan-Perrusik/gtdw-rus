 fourteen_heavenly_methods_adherent:0 "Method-keeper"

 fourteen_heavenly_methods_adherent_plural:0 "Method-keepers"

 fourteen_heavenly_methods_desc:0 "The Fourteen Heavenly Methods is the name given to the eponymous philosophical tracts attributed to the legendary Empress Yao Ren Cai, also known as the God-Empress or the Dragon Empress. She was a powerful [magi|E], and credited with both unifying the cities of Kathun-Kai and fully subjugating the Miaosi monasteries under the state. During her two-century-long reign, she authored essays on how people of fourteen professions and lifestyles in Kathun-Kai can live virtuously and achieve passage to Heaven.\n\nAfter her death, Yao Ren Cai's soul was said to have merged with the seed of Shenwang to create the first dragon; alternate claims say that her soul possessed the very earth and sky to watch over her people in death.\n\nStarting with her son Yao Lingxu, claimants to the throne of Kathun-Kai have claimed to be possessed by the spirit of the first dragon to bolster their legitimacy. Many of these possessed emperors are worshiped alongside Yao Ren Cai, and her Heavenly Methods are rigorously adhered to."

 xin_xue:0 "Xin Xue"

 xin_xue_adj:0 "Xin Xue"

 xin_xue_adherent:0 "Zhuzi"

 xin_xue_adherent_plural:0 "Zhuzi"

 xin_xue_desc:0 "Xin Xue emerged amidst the intellectual clashes towards the end of [zhengfa_movement|E]. The anachronistic tenets within the Fourteen Heavenly Methods led some scholars to reflect on their meaning and attempt to refine them. Subsequently, these scholars discovered with astonishment that fabricators had created many of the so-called teachings of the 'First of the Dragon',' which sparked a wave of skepticism toward the scriptures. At this stage, however, the focus remained on textual criticism and inquiry, without a unified core ideology.\n\nWhat truly transformed Xin Xue into a mature philosophical system was the work "Divine Artisanology" published in 1057 IS, which systematically expounded the core concept of "applying knowledge to practical governance and innovating through change," thus laying the theoretical foundation for Xin Xue. Thereafter, works on Xin Xue sprouted like bamboo shoots after rain, eventually forming the comprehensive and diverse intellectual system we see today."

 lanonan_bynjar_institute:0 "Bynjar Institute"

 lanonan_bynjar_institute_adj:0 "Bynjar Institute"

 lanonan_bynjar_institute_adherent:0 "Bynjar Disciples"

 lanonan_bynjar_institute_adherent_plural:0 "Bynjar Disciples"

 lanonan_bynjar_institute_desc:0 "T'ai-wu's [GetFaithDoctrine('tenet_thirteen_precepts').GetBaseName] form the ideological system known as Bynjar. Followers are expected to possess skill in the arts of war. They view death in battle as the highest honor and fervently dedicate themselves to expanding the territories of their rulers. \n\nDue to the absence of a unified organization, adherents primarily gather in loose regional associations. This has given rise to vastly divergent specific doctrines across different regions. However, regardless of the regional Bynjar school, the entity known as [chiang_hsiang_shou|E] holds an exceptionally exalted position within its doctrine."

 muzacuh:0 "Muzacuh"

 muzacuh_adj:0 "Muzacuh"

 muzacuh_adherent:0 "Haimin"

 muzacuh_adherent_plural:0 "Haimin"

 muzacuh_desc:0 "The Muzacuh faith originated in the coastal regions of eastern Kathun-Kai as an offshoot of an ancient oceanic worship. It venerates a female deity personified from the sea, whom devotees commonly refer to as [Glossary( 'Muza', 'MUZA_GLOSS' )]. \n\nBefore each voyage, priests of Muza conduct brief divination rituals and present offerings to her, praying for the ocean's protection to ensure calm seas and bountiful catches. \n\nFishermen and merchants who follow Muza rarely dare to lie in her presence. When disputes arise among believers, they invite Muza's statue to serve as arbiter. This custom stems from their understanding of the sea: as the embodiment of the ocean, Muza sees into the hearts of mortals, delivering impartial judgment—she sends tempests to swallow wrongdoers while granting honest navigators generous bounty."

