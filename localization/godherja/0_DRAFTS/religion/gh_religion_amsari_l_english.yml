 tenet_blood_of_the_prophet_name: "Prophet's Blood" 
 tenet_blood_of_the_prophet_desc: "The Prophet's blood is a sacred gift, a mark of divine favor and authority. Those who carry this legacy are bound by destiny to lead the righteous. To honor the bloodline is to honor the will of Zaoran Himself."
 doctrine_parameter_blood_of_the_prophet_temple_holding_active: "Qanamsars with sufficient [piety|E] can hold [temple|E] holdings"
 doctrine_parameter_blood_of_the_prophet_ancestry_decision_active: "[rulers|E] can further legitimize their rule by tracing their ancestry back to the Prophet"
 doctrine_parameter_blood_of_the_prophet_prestige_marriage_active: "Marrying a [character|E] with the [GetTrait('gh_blood_of_prophet').GetName( GetNullCharacter )] [trait|E] confers additional [prestige|E]" 
 
 mahndayana: "Mahndayanism" # Mainstream Tradition
 mahndayana_adj: "Mahndayana"
 mahndayana_adherent: "Zaoranian"
 mahndayana_adherent_plural: "Zaoranians"
 mahndayana_desc: "[frodbrokna|E] was the confirmation of many Zaoranians' worst fears, especially because it happened exactly when the $amsari_prophet_link$ Prophet#! predicted their god's defeat. The people were left listless, wondering how they could possibly continue to function in a world where evil has triumphed over good. Their answer was surprisingly simple: keep functioning as if it hadn't. Many Zaoranians continue to perform the rituals and sing the songs of their ancestors, out of desperate hope that their gestures will one day drive Zaoran to prophesied victory."
 
 mahnda_yathekar: "Mahnda Yathekar"
 mahnda_yathekar_adj: "Mahnda Yathekar"
 mahnda_yathekar_adherent: "Yathekarian"
 mahnda_yathekar_adherent_plural: "Yathekari"
 mahnda_yathekar_desc: "Centered around a figure believed to be the reincarnation of tne $amsari_prophet_link$ Prophet#!, the exact teachings of the 'False Prophet,' have been lost over the centuries. His followers, however, were said to have turned away from key aspects of mainstream Mahndayanism, placing absolute faith in their leader's divine authority."
 
 #Maybe good for secret faith system?
 daenavad: "Daenavadism" # Mainstream Tradition
 daenavad_adj: "Daenavad"
 daenavad_adherent: "Daenavadian"
 daenavad_adherent_plural: "Daenavadi"
 daenavad_desc: "Founded within the Amonnid ruling dynasty, Daenavadism holds that the Amsari Hiklahn should be ruled by a descendant of the $amsari_prophet_link$ Prophet#!, a principle it extends to all positions of authority. It asserts that every position of power must be held by those who can directly trace their lineage to the Prophet. While no Qanamsar has ever officially adhered to Daenavad, its influence persists in the higher echelons of society among the Prophet's descendants, where the purity of one's lineage is regarded as the ultimate marker of authority and legitimacy."
 
 tirazhidar: "Tahkedarism" # Mainstream Tradition
 tirazhidar_adj: "Tahkedar"
 tirazhidar_adherent: "Zaoranian"
 tirazhidar_adherent_plural: "Zaoranians"
 tirazhidar_desc: "Its adherents blame the unfaithful for Zaoran's recent defeat and the catastrophe brought by [frodbrokna|E], seeing it as the hand of Maiya upon the world through the actions of humans. Their doctrine rests on a strictly literal reading of the [gh_zenda|E], treating verses that most scholars regard as metaphorical as direct commands? Salvation is not an individual pursuit but a collective duty.\n\nAn interpretation that has driven many of them toward violent actions, inclduing enacting forced conversion upon the wandering people of Amsar. To them, humanity must be brought beneath Zaoran's divine order for His triumph to be absolute. Only then will the world be made whole, and the Last Struggle at last be won."
 
 #Disappeared for a long time is gathering dust in late startdates
 mahazhadar: "Mahazhadarism"  # Tazāyan Tradition
 mahazhadar_adj: "Mahazhadar"
 mahazhadar_adherent: "Zaoranian"
 mahazhadar_adherent_plural: "Zaoranians"
 mahazhadar_desc: "Emerging in the years following the $amsari_prophet_link$ Prophet's#! death, Mahazhadarism persisted briefly after the [Concept('gh_amsari_rebellion','Amsari Rebellion')|E] before disappearing. Mahazhadari interpreted the Prophet's teachings not as straightforward declarations but as symbolic expressions of deeper truths. Its adherents believed that the events described for the future were not literal prophecies but abstract concepts that required thoughtful interpretation. They maintained that the future, as described by the Prophet, was not fixed but could be understood through reflection and debate."
 
 khebaranism: "Khebarānism"  # Tazāyan Tradition
 khebaranism_adj: "Khebarāna"
 khebaranism_adherent: "Khebarān"
 khebaranism_adherent_plural: "Khebarāni"
 khebaranism_desc: "Khebarāni believe that the teachings of the $amsari_prophet_link$ Prophet#! conceal deeper truths, accessible only to those with the wisdom to perceive them. To them, the [gh_zenda|E] is layered, and what is forbidden to the ignorant may be permitted to the enlightened if it serves a higher purpose. This has led to unorthodox interpretations of religious law, where morality is dictated by wisdom rather than rigid doctrine. Khebarānism flourished for some time in Western Siral, despite facing harsh persecution from orthodox [Concept('gh_frazan','Frazani')|E], who condemn its teachings as dangerous heresy."
 
 mezrai: "Mezra'ī"
 mezrai_adj: "Mezra'ī"
 mezrai_adherent: "Mezra'īsan"
 mezrai_adherent_plural: "Mezra'īsi"
 mezrai_desc: "Originating in Lirkak in North Levan, the Mezra'īsi trace their teachings to Sarvān i-Khizrad, a man who, they claim, received a secret revelation from the $amsari_prophet_link$ Prophet#! while passing through the region. The Prophet is said to have entrusted him with truths too complex for the simple minds of commoners, teachings meant only for those chosen to fully understand Zaoran's deeper wisdom. Rejecting the idea of writing down their secretive knowledge, the Mezra'īsi passed them orally through strict initiatory rites."
 
 hazrandanism: "Hazrandānism" # Tazāyan Tradition
 hazrandanism_adj: "Hazrandāna"
 hazrandanism_adherent: "Hazrandān"
 hazrandanism_adherent_plural: "Hazrandāni"
 hazrandanism_desc: "Once among the most popular movement following the $amsari_prophet_link$ Prophet's#! death and some time after the establishment of the Amsari Hiklahn, Hazrandānism rejects written scriptures, believing that they distort the eternal and adaptable nature of divine truth. To the Hazrandāni, faith must be preserved through oral tradition, as the evolution of language and personal understanding is essential to keeping its true meaning alive. Over time, the movement suffered steep decline, facing repression from the [Concept('gh_frazan','Frazani')|E], who viewed its teachings as a direct threat to the integrity of the Prophet's message. Now, only small and scattered communities continue to uphold its traditions."
 
 ihzafeh: "Ihzāfehism"  # Tazāyan Tradition
 ihzafeh_adj: "Ihzāfeh"
 ihzafeh_adherent: "Ihzāfehsan"
 ihzafeh_adherent_plural: "Ihzāfehsi"
 ihzafeh_desc: "The Ihzāfehsi arose in defiance of what they saw as the corruption of society, particularly among the ruling elite and the [gh_frazan|E] clergy, whom they viewed as decadent and estranged from true faith. Rejecting rigid doctrine, they hold that personal interpretation is the purest means of understanding Zaoran's will, elevating direct spiritual experience over the authority of religious institutions. To the Ihzāfeh, faith is not bound by hierarchy, but by the sincerity of one's devotion."
 
 nashadism: "Nashadism" # Mainstream Tradition
 nashadism_adj: "Nashadi"
 nashadism_adherent: "Nashadan"
 nashadism_adherent_plural: "Nashadi"
 nashadism_desc: "Nashadism properly emerged in the wake of the [gh_massacre_of_the_ten_heirs|E]. However, many Zaoranian thinkers such as Arvashdān Izhākhet, along with the local population, had already begun questioning the long-held belief that legitimacy passed solely through blood. Dissatisfaction with both past and present rulers led them to argue that struggle and righteousness solely determined a ruler's right to rule.\n\nIronically, in an effort to gain further traction across [amsar|E] and strengthen their political position, they rallied behind Nashad. Who was the alleged surviving son of Qanamsar Parashād's eldest heir, and rejected the 'usurper' Qanamsara Tōvah. To the Nashadi, the rightful line of succession passed through Radesh and his son Nashad, whom they believed was destined to lead them to prophesied victory. History would repeat itself when, after his death and the failure of the [gh_emerald_rebellion|E], his most ardent followers insisted that he had hidden away a child who would one day reclaim his birthright."
 
 elaahism: "Elaahism" # Belrukian Tradition
 elaahism_adj: "Elaahi
 elaahism_adherent: "Elaahan"
 elaahism_adherent_plural: "Elaahi"
 elaahism_desc: "The Elaahi are one of the few Amsari sects that maintained their own beliefs for centuries after the [gh_the_amsari_prophet|E]'s death and the formation of the Hiklahn. They reject the very story of creation and the [gh_amsari_story_first_struggle|E] as described in the [gh_zenda|E]. Believing Belruk's actions to have been misunderstood and instead that Iralya was an agent of Maiya, leading the [gh_amsari_first_dreamers|E] astray from Zaoran. As such, they consider The Prophet to have reinforced a corrupted version of faith, one that fails to recognize the true struggle against deception and falsehood. The Elaahi hold that true faith in Zaoran requires rejecting the lies imposed upon the world since the First Struggle."

 kaelenyanism: "Kaelenyanism"
 kaelenyanism_adj: "Kaelenyana"
 kaelenyanism_adherent: "Zaoranian"
 kaelenyanism_adherent_plural: "Zaoranians"
 kaelenyanism_desc: "Kaelenyanism is founded on the absolute conviction that Kaelen, the 'Chosen Vessel,' is the living incarnation of Zaoran's will, sent to purge the world of its pervasive falsehoods and usher in an age of divine order. Adherents believe that Kaelen's every pronouncement and every decree is a direct emanation from Zaoran Himself, rendering all past interpretations secondary. To live by the will of Kaelen is to live in perfect alignment with Zaoran, for the new Prophet embodies the very essence of purification. Their faith demands unwavering obedience and an ardent dedication to Kaelen's vision, believing that only through his direct guidance can humanity be redeemed and the world made whole."

 shehzarani: "Shehzaranism" #GH ASKIL TODO: Find better name
 shehzarani_adj: "Shehzaranic"
 shehzarani_adherent: "Shehzaranian"
 shehzarani_adherent_plural: "Shehzaranians"
 shehzarani_desc: "Many have attempted to explain the similarities and reconcile the differences between Zaoranic and Sheharddi faiths. Shehzaranism represents an ancient confluence, proposing that the ultimate High God is one universal deity, known by countless names across the ages, be it ELOI, Zaoran, or others. Its followers believe that this singular divine being has never ceased to guide humanity, sending a multitude of Prophets throughout history descending from the First Dreamers, the Malikiyah, each tailored to their time and people, to teach the eternal message of righteousness against deception. The Faithful can not only return to God's heavenly grace but also aid in His ultimate, prophesied victory over all deception, by rejecting the primordial deceit of Eir'Shaytan."

 #Perhaps more radical?
 arishayana: "Arishayanism"
 arishayana_adj: "Arishayana"
 arishayana_adherent: "Zaoranian"
 arishayana_adherent_plural: "Zaoranians"
 arishayana_desc: "The Arishani Faith follows the radical revelations of Prophetess Arisha az-Behni, who asserted that the Last Struggle had already occurred, and that Zaoran had died when Maiya broke the moon—marking the end of the Prophecy and of direct divine guidance. She believed, however, that Zaoran had left the world one final gift: His essence had been infused into all things, and by cultivating heightened awareness—as she had—one could perceive the divine interplay of Zaoran's Will in everything, a presence that would guide the Faithful in His absence.\n\nHaving traveled the world and witnessed the first Great Sleeper's awakening, Arisha proclaimed that she would lead the Faithful in the Last Battle, soon to fall upon humanity, and deliver them from darkness. Her death on the eve of the prophesied conflict left her followers in disarray, seemingly forced to face the Last Battle without their leader."

 beshanida: "Bēshanidism"
 beshanida_adj: "Bēshanida"
 beshanida_adherent: "Zaoranian"
 beshanida_adherent_plural: "Zaoranians"
 beshanida_desc: "Considered a reformist current within Post-Prophet early Zaoranianism, the Bēshanidi are today mainly remembered for their absolute rejection of any sort of apotheosis of the prophetic lineage, in contrast to the growing cult-like movement tolerated, if not encouraged, by the first daughter of Qanamsar Aushedar, Mehreva. The name Bēshanida derives from the enigmatic figure known as the [gh_last_witness_conflict|E], though little is agreed upon regarding this figure's origin, intentions, or disappearance.\n\nThe movement is believed to have influenced certain liturgical simplifications and certainly played a role in the iconoclastic decrees issued under Qanamsara Sha'Nira who, after the figure's disappearance, positioned herself as the central authority within the movement. The sect gradually lost coherence and withered soon after."

 holy_order_swords_of_the_faithful: "Swords of the Faithful"  
 holy_order_sun_sworn: "The Sun-Sworn"  
 holy_order_spear_of_god: "The Spear of God"
 
 

 
 
 
 
 amsari_interpretative_tradition_name: "Interpretative Tradition"
 amsari_mainstream_doctrine_name: "Mahndayāni Tradition"
 amsari_mainstream_doctrine_desc: "The Mahndayāni Tradition is the mainstream understanding of the Zenda and the Sazān-e Mahndāzi, as taught by the Frazani of the Unij-e Kahderz and other prominent centers of learning that have developed over the centuries. It regards the Prophecy as the literal unfolding of the future and the words of the Prophet as absolute and final, rejecting deviations that compromise the established moral and spiritual framework.\n\nWhile its adherents allows interpretation, it does so strictly within the bounds of tradition and only within Frazani institutions under the guidance of the most learned scholars. Any radical deviation from their interpretation is viewed as heretical and subject to repression by the Frazani."
 
 amsari_nezrakh_doctrine_name: "Nezrākh'si Tradition"
 amsari_nezrakh_doctrine_desc: "Flourishing within the traditionally unstructured Zaoranian movements of the early days of the Hiklahn, as well as in earlier times, this broad category encompasses various faiths that emphasize personal interpretation of the holy texts and encourage spiritual discussion at all levels of society.\n\nThis has traditionally led its adherents to a more tolerant and open approach regarding differing interpretations. While the mainstream has rarely been openly violent toward what it considers astray interpretations of the Zenda, it has often viewed them with suspicion and sought to curb their influence."
 
 amsari_belrukan_doctrine_name: "Belrukan Tradition"
 amsari_belrukan_doctrine_desc: "The Belruki reject the traditional account of creation as expressed in the Zenda, believing that the truth of Zaoran has been obscured since the First Struggle. They place special importance on Belruk, whom they see as misjudged. To them, those who believe or teach the traditional account of creation are heretics who must be eliminated for true faith to prevail."

 amsari_vehuj_doctrine_name: "Vehuj Tradition"
 amsari_vehuj_doctrine_desc: "The Vehuj Tradition believes that divine truth must remain fluid, passed through oral tradition. The Zenda is a living memory, evolving through speech and the wisdom of generations. Anything else severs faith from its fluid and ever-evolving essence."
 
 amsari_suhdrash_doctrine_name: "Suhdrash Tradition"
 amsari_suhdrash_doctrine_desc: "Suhdrash is a broad term that has historically been used to describe any that considers its interpretation of the Zenda as the sole and absolute truth. While the specifics of their doctrines vary, all Suhdrashi sects share an uncompromising stance against reinterpretation or theological divergence."
 
 amsari_no_doctrine_name: "No Tradition"
 amsari_no_doctrine_desc: "Its adherents do not conform to any traditional Zaoranian interpretation of the world. But is still considered Zaoranian in nature."

