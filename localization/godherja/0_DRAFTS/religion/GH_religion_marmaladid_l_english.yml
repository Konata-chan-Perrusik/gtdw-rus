 marmaladid_religion_desc: "The Shuraebada is an ancient system of oral customs and beliefs thought to originate deep in the [Glossary('Sarradonian Desert','sarradonian_desert_encyclopedia_desc')] from amongst the [marmaladid_great_tribes|E] of the Marmaladid. Little holds the Shuraebada together beyond common stories, traditions, and a reverence for the powers of [magic|E]."
 
