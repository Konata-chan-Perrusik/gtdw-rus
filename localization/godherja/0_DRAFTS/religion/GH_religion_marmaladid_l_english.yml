 talita_namit: "Talita Namit"
 talita_namit_adj: "Talita Namit"
 talita_namit_desc: "The Talita Namit is as much a mode of religious belief as it is a political system. The most striking element of the faith is the belief espoused by zealous adherents that certain [marmaladid_chosen_magi|E] can serve as messengers from the [realm_above|E], serving as emissaries of the will of the Heavens and exerting rightful rulership over the lands of Aeras."
 talita_namit_adherent: "Chosen"
 talita_namit_adherent_plural: "Chosen"
 
 talfasmolline: "Talfasem"
 talfasmolline_adj: "Talfasem"
 talfasmolline_adherent: "Talfasmolline"
 talfasmolline_adherent_plural: "Talfasmolline"
 talfasmolline_desc: "[Concept('marmaladid_great_tribes','Marmaladids')|E] have traditionally revered the deadly toxins of the [Glossary('Sarradonian Desert','sarradonian_desert_encyclopedia_desc')] and the animals which harbour them as a source of immense power. Zealous adherents take part in a ritual known as the [Glossary('Talfasomoll','tafasomoll_glossary_desc')]. It is uncommon to find any Talfasamolline without a vial of venom, for it is not only to be used against one's enemies, but also for honourable suicide when all hope is lost."
 tafasomoll_glossary_desc: "Talfasomoll is a ritual where one is placed in a pit of scorpions and ordered to recite a prayer to the Goddess of Death. For those that survive this dangerous rite, praise and reverence is abundant, for they have been blessed by Nettat Yettsen herself."
 
 albot_al_mamurism: "Albot-al-Mamurism"
 albot_al_mamurism_adj: "Albot-al-Mamurism"
 albot_al_mamurism_adherent: "Spider Wardenite"
 albot_al_mamurism_adherent_plural: "Spider Wardenites"
 albot_al_mamurism_desc: "Centuries of trade and communication have converted many within the [Glossary('Sarradonian Desert','sarradonian_desert_encyclopedia_desc')] to the [Concept('wardenism','Wardenite')|E] tradition with varying degrees of success. Although nomadic tribunals are often styled as courts, their decisions are largely based on the discretion of village elders rather than judicial experts. The rarity of legal texts within many of these communities, has led to a corrosion of authority, the Mamur merely a figure to swear nominal allegiance, their name, personality and status largely unknown and uncared for. The failure to eradicate local superstition has led to a number of strange and antiquated holdovers, such as the trial of [Glossary('Talfasomoll','tafasomoll_glossary_desc')], or [Glossary('Tirga Tissit','tirga_tissit_glossary_desc')], leading many in the Wardenite core to name these priests 'Albot-al-Mamurs,' or 'Spider Mamurs.'"
 tirga_tissit_glossary_desc: "Tirga Tissit is the practice of immersing a spider inside the blood of a sacrificed camel, with the arachnid then being placed upon its dried skin. The pattern left behind is interpreted by local shamans or 'judges' to gain a sentence, believing it to be the word of Desert Gods or, in Mamurist sects, He Who Was."
