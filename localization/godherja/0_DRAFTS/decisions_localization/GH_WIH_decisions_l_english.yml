 # =================================================== Central Sarradon ===================================================
 # Wardenite 
 gh_central_sarradon_wardenite_victory_ending_decision: "Secure Wardenite Rule"
 gh_central_sarradon_wardenite_victory_ending_decision_tooltip: "Bring the War in Heaven to an end in the region."
 gh_central_sarradon_wardenite_victory_ending_decision_desc: "For millennia, the War in Heaven has fractured Central Sarradon, each conflict a chisel chipping away at the Pillars that keep the Dead God imprisoned. Now, I stand ready to end this ceaseless strife and bring about a new era of peace in the region."
