 gh_align_in_war_in_heaven_decision: "Take a Side in the War in Heaven"
 gh_align_in_war_in_heaven_decision_tooltip: "You will choose a side in the War in Heaven"
 gh_align_in_war_in_heaven_decision_desc: "The long conflict between the Ritualists and the Wardenites continues to shape the fate of Sarradon. No ruler can afford to stand idle forever, neutrality is as dangerous as conviction."
 gh_align_in_war_in_heaven_decision_confirm: "Declare your alignment"
 gh_align_in_war_in_heaven_decision_effect_tooltip: "You will choose to align with either the [Concept('wardenism','Wardenite')|E] or [Concept('ritualism','Ritualist')|E] cause\n\n@warning_icon! Your decision will affect how other [rulers|E] see you"
 align_with_wardenite_item: "The only sensible path is to side with the Wardenites."
 align_with_ritualist_item: "There is more to gain in openly supporting the ritualists."
 align_with_agionist_item: "The Agionists are the only ones worth backing."
 align_with_wardenite_item_tooltip: "You side with the Wardenites, they are less likely to take action against you."
 align_with_wardenite_item_enemy_tooltip: "[characters|E] of the [Concept('ritualism','Ritualist')|E] [religion|E] will consider you an [struggle_involved|E] character in the [struggle|E]."
 align_with_ritualist_item_tooltip: "You side with the Ritualists, they are less likely to take action against you."
 align_with_ritualist_item_enemy_tooltip: "[characters|E] of the [Concept('wardenism','Wardenite')|E] [religion|E] will consider you an [struggle_involved|E] character in the [struggle|E]."
 align_with_agionist_item_tooltip: "You side with the Agionists, they are less likely to take action against you."
 align_with_agionist_item_enemy_tooltip: "[characters|E] of the [Concept('wardenism','Wardenite')|E] and [Concept('ritualism','Ritualist')|E] [faiths|E] may consider you an [struggle_involved|E] character in the [struggle|E]."
 recently_left_side_in_war_in_heaven_tt: "Has recently left a faction in the War in Heaven Struggle - Can join again after [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'recently_left_side_in_war_in_heaven') )|V]"
 align_with_wardenite_item_desc: "Align with Wardenites"
 align_with_ritualist_item_desc: "Align with Ritualists"
 align_with_agionist_item_desc: "Align with Agionists"
 
 gh_unalign_in_war_in_heaven_decision: "Abandon Side in the War in Heaven"
 gh_unalign_wardenite_decision_desc: "Whatever purpose I once saw in siding with the Wardenites, I no longer feel bound to it. The struggle continues, but I will not carry their burden any longer."
 gh_unalign_ritualist_decision_desc: "The Ritualists can carry on without me. I once lent them my sword, but I've no wish to be part of their cause anymore. Let them argue and reach for what they will. I will not follow." 
 gh_unalign_in_war_in_heaven_decision_tooltip: "You will no longer take an active role in the War in Heaven"
 gh_unalign_in_war_in_heaven_decision_confirm: "Step back from the conflict"
 gh_unalign_in_war_in_heaven_decision_effect_tooltip: "You will cease active alignment with either side in the [struggle|E]\n\n@warning_icon! Both [Concept('ritualism','Ritualist')|E] and [Concept('wardenism','Wardenite')|E] actors may come to doubt your intentions"
 recently_joined_side_in_war_in_heaven_tt: "Has recently joined a faction in the War in Heaven Struggle - Can join again after [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'recently_joined_side_in_war_in_heaven') )|V]"
 
 
