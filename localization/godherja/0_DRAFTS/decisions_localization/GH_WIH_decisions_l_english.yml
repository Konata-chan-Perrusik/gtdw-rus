#####################################
 iyrossi_monthly.0001.t: "Embrace the Ways of Our Ancestors"
 iyrossi_monthly.0001.desc: "Now that the Aversarians are destroyed in Malcois, we must now decide how we will worship \n\n Many Iyrossi clans have called a great gathering to collect and debate the old stories and rituals of our people. They call themselves the Athbhanian, should we join them?"
 iyrossi_monthly.0001.a: "Yes we will go to the Gathering and share my family's knowledge" 
 iyrossi_monthly.0001.b: "No the Selochaian's remember the true goddess of the Iyrossi, Selva goddess of the Lake, we will join them."
 iyrossi_monthly.0001.c: "No The Qialóenan's tell of House Yaon who has shared the sacred fourteen heavenly methods, this will show us the way to enlightenment."
 iyrossi_monthly.0001.d: "No we will follow the Sjalvolki's ways and follow the faith of those the gods have blessed."
 iyrossi_monthly.0001.e: "We will not change to some barbaric religion, we know the true faith."    