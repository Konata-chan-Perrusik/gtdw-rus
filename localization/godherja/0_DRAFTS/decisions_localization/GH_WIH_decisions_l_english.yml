 gh_great_struggle_wardenite_ending_decision: "Fulfill the First Warden's Dream"
 gh_great_struggle_wardenite_ending_decision_tooltip: "Declare Victory and end the War in Heaven"
 gh_great_struggle_wardenite_ending_decision_desc: "Nearly a thousand years of bloodshed have finally come to an end. Let all witness what I have wrought! The First Warden saw the corruption of the Ritualists and lit the flame that would consume them utterly. The War in Heaven, that ancient scourge which devoured kings and kingdoms, bows before my might. I will stand triumphant where countless others fell against evil."
 gh_great_struggle_wardenite_ending_decision_confirm: "End the War in Heaven Struggle"
 
 gh_great_struggle_ritualist_ending_decision: "Heaven's Remade"
 gh_great_struggle_ritualist_ending_decision_tooltip: "Declare Ritualist victory and end the War in Heaven"
 gh_great_struggle_ritualist_ending_decision_desc: "The stars that witnessed the War in Heaven's beginning shall see its ending. More than a thousand years have passed since the first heretic drew sword against the faithful. I will take back everything the heathens have stolen and I shall speak the words that seal this age and open the next."
 gh_great_struggle_ritualist_ending_decision_confirm: "End the War in Heaven Struggle"

 gh_great_struggle_sarradon_divided_ending_decision: "Divide Sarradon"
 gh_great_struggle_sarradon_divided_ending_decision_tooltip: "The War in Heaven shall end inconclusively"
 gh_great_struggle_sarradon_divided_ending_decision_desc: "Those who came before us looked upon Sarradon's vastness and believed they could make every tongue speak the same words, every heart beat with the same devotion. How distant and naive that dream now seems. We can see a new path for Sarradon."
 gh_great_struggle_sarradon_divided_ending_decision_confirm: "Let the new era begin!"
 
 
