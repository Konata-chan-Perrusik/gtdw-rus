 gh_central_sarradon_ending_struggle_less_ritualist_rulers_tt: "Less than 10% of the [counties|E] in [GetGeographicalRegion('GH_central_sarradon_struggle_region').GetName] must controlled by independent [Concept('ritualism','Ritualist')|E] [rulers|E] #weak (Current: [SCOPE.ScriptValue('gh_wih_central_sarradon_ritualist_controlled_counties_percent_value')|0]%)#!"

 
 # Ritualist
 gh_central_sarradon_ritualist_victory_ending_decision: "Achieve Ritualist Hegemony"
 gh_central_sarradon_ritualist_victory_ending_decision_tooltip: "Bring the War in Heaven to an end."
 gh_central_sarradon_ritualist_victory_ending_decision_desc: "The heavens themselves shall bear witness to our triumph. No longer will the lands of Central Sarradon suffer under the shadow of Wardenite lies. By my hand, we will reassert the true teachings of the Thousand-and-One Steps across this holy land."
