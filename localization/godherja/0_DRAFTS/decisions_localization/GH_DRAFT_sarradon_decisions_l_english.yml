 gh_reclaim_wardenite_the_eastern_lands_decision: "Reclaim the Eastern Lands"
 gh_reclaim_wardenite_the_eastern_lands_decision_desc: "The Battle of Al-Jaferraz in 1283 IS and the death of Ḥārthah 'the Younger' left the eastern Sirwali Coast undefended, and desert nomads seized its shores. Yet their rule was born of our weakness, not of right. If we secure the coast once more, the lands of Khenemhat and the Sirwali Coast may stand united under a single kingdom again."
 gh_reclaim_wardenite_the_eastern_lands_decision_confirm: "Let the eastern lands return to our rule"
 gh_reclaim_wardenite_the_eastern_lands_decision_tooltip: "Bring the lands of Khenemhat and the Sirwali Coast under your [kingdom|E]"
 create_greater_hammuhat_decision_effect_tooltip: "The $k_greater_hammuhat$ kingdom will be established"
 gh_reclaim_wardenite_the_eastern_lands_decision_tt: "[duchies|E] [title|E] Khenemhat and the Sirwali Coast in  will become [de_jure|E] of the [k_greater_hammuhat.GetName]"

 establish_almusid_culture_decision: "Adopt the Ways of the Settled"
 establish_almusid_culture_decision_desc: "Our forebears did not remain strangers in the lands they took; they endured by learning the ways of those they ruled. These lands are now ours by conquest, yet conquest alone does not secure generations. If we are to hold what was won, we must take from the customs of the settled and make them our own, as our ancestors once did."
 establish_almusid_culture_decision_confirm: "As our ancestors did, so shall we."
 establish_almusid_culture_decision_tooltip: "Blend your culture with that of the local [culture|E]"
 establish_almusid_culture_decision_effect.tt: "All [old_culture_1.GetName], [old_culture_2.GetName] and [old_culture_3.GetName] counties and characters in the region  become [new_culture.GetName]"
 gh_ten_years_past_for_settling_nomad_requirement_tt: "Current year is later than #high 1308#! IS"