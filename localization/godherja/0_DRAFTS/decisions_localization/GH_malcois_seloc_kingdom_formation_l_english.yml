l_english:
 gh_found_kingdom_seloc_decision: "Establish Kingdom of Seloc"
 gh_found_kingdom_seloc_decision_title: "Establish Kingdom of Seloc"
 gh_found_kingdom_seloc_decision_desc: "Since the fall of our people to the [Concept('aversaria','Aversarians')|E], we were banished to the mountains while [GetTitleByKey('c_lapithymna').GetNameNoTier] has been the center of their power. As the capital of a new [ROOT.Char.GetFaith.GetAdjective] realm, it will once more be a seat of kings."
 gh_found_kingdom_seloc_decision_confirm: "Seloc is the heart of Malcois!"
 gh_found_kingdom_seloc_decision_tooltip: "Establish a new [GetFaithByKey('selvarossi_iyrossi').GetAdjective] [kingdom|E] based in [GetTitleByKey('k_seloc').GetNameNoTier]"
 gh_found_kingdom_seloc_culture_tt: "Your [culture|E] is Kinambrosti"
 gh_found_kingdom_seloc_faith_tt: "Your [faith|E] is [GetFaithByKey('selvarossi_iyrossi').GetName], or was created from it"
 gh_found_kingdom_seloc_duchy_tt: "You [hold|E] and [completely_control|E] any [duchy|E] which [de_jure|E] borders the [GetTitleByKey('d_eretrona').GetName], and which is part of a [kingdom|E] with more than two [de_jure|E] [duchies|E]"
 gh_found_kingdom_seloc_capital_tt: "[GetTitleByKey('c_lapithymna').GetNameNoTier] is your [realm_capital|E]"  
 iyrossi_monthly.1100.t: "The Kingdom of Seloc"
 iyrossi_monthly.1100.desc: "With the strength of my position now beyond all doubt, the coronation in [GetTitleByKey('c_lapithymna').GetNameNoTier] has at last gone ahead as planned.\n\nIt is high time we [ROOT.Char.GetFaith.GetAdherentNamePlural] carved out our own domain, distinct from our neighbors to worship Selva and guard her holy lake!"
 iyrossi_monthly.1100.a: "Long may our kingdom prosper." 
 iyrossi_monthly.1101.desc: "Going from strength to strength, [seloc_former.GetTitledFirstName] has had [seloc_former.GetHerselfHimself] formally crowned in [GetTitleByKey('c_lapithymna').GetNameNoTier].\n\nThe strength of this new [seloc_former.GetFaith.GetAdjective] kingdom, is now beyond doubt.\n\n"
 iyrossi_monthly.1101.stolen: "These vexatious upstarts will have to be dealt with sooner rather than later!"
 iyrossi_monthly.1101.selvarossi_iyrossi: "Though this bodes well for our faith, it may be a double-edged sword..."
 iyrossi_monthly.1101.a: "They will not last long!"
 iyrossi_monthly.1101.b: "Something to keep an eye on."
 iyrossi_monthly.1101.c: "Interesting."  
 fp2_form_kingdom_seloc_modifier: "$iyrossi_monthly.1100.t$"
 fp2_form_kingdom_seloc_modifier_desc: "This character has established a new kingdom centered around lake Selva"

