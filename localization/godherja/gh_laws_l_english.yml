 otachedian_bureaucracy_1_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 Non-[governor|E] [vassals|E] cannot wage [war|E] against other Vassals unless they use a [hook|E] on their [liege|E]#!"
 otachedian_bureaucracy_2: "Centralized Ministries"
 otachedian_bureaucracy_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Rulers can change between all available [succession_laws|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 All Vassals who refuse Title revocation or Vassal retraction are considered [criminals|E]#!\n$EFFECT_LIST_BULLET$#high $demand_admin_interaction$#! cost is reduced"
 otachedian_bureaucracy_2_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 Non-[governor|E] [vassals|E] cannot wage any [war|E] unless they use a [hook|E] on their [liege|E]#!"
 otachedian_bureaucracy_3: "Lawful Mandate"
 otachedian_bureaucracy_3_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Non-[governor|E] [vassals|E] can never declare [war|E]#!"

