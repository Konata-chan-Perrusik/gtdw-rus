 camp_purpose_beast_hunters: "Beast Hunters"
 camp_purpose_beast_hunters_effects: "$EFFECT_LIST_BULLET$Finds more [slayer_task_contracts|E]\n$EFFECT_LIST_BULLET$Finds slightly more [prowess|E], [martial|E] and [Concept('transport_task_contracts','Transport')|E] [task_contracts|E]\n$EFFECT_LIST_BULLET$Unlocks [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n\n#WEAK As long as mankind has existed on [aeras|E], there have been whole species of wild, evil and [Concept('aelfir','alien')|E] creatures to slay for glory and profit.#!"

 camp_purpose_migration_band: "Migrant Band"
 camp_purpose_migration_band_effects: "$EFFECT_LIST_BULLET$Finds more [migration_task_contracts|E]\n$EFFECT_LIST_BULLET$Finds slightly more [diplomacy|E] [task_contracts|E]\n$EFFECT_LIST_BULLET$Unlocks [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n\n#WEAK Great hosts of survivors, warriors, and ragged refugees have banded together in a [Concept('sjalvolki_migration','great host')|E] seeking refuge farther south from [the_fog|E].#!"