 ## EVENTS ##
 gh_oasis_event.0001.t: "Water From the Depths"
 gh_oasis_event.0001.desc: "Reports have begun pouring in that the sands have shifted. Fresh mud and young flora appear in greater abundance with each day. It is almost certainly a new Oasis forming in our land."
 gh_oasis_event.0001.a: "Praise be, the water rises!"
 gh_oasis_event.0002.t: "The Ephemeral Oasis"
 gh_oasis_event.0002.desc: "Enough time has past for the Oasis to blossom. Fresh water is freely available, and more flora and fauna appears with each dawn. Soon the news will spread far and wide, and we must be prepared to meet the demand."
 gh_oasis_event.0002.a: "Let us enjoy this blessing while it lasts."
 gh_oasis_event.0003.t: "Return to the Sands"
 gh_oasis_event.0003.desc: "The beauty of the Oasis does not last forever.\n\nAlready, the sands have begun to swallow our once bountiful paradise back into the dunes. The wild animals have long since gone, and soon there will be nothing but the sand left behind."
 gh_oasis_event.0003.a: "All returns to the desert, given time."
 gh_oasis_event.1001.t: "Scarab Stampede!"
 gh_oasis_event.1001.desc: "With how numerous our herd of beetles has grown, it was only a matter of time until something happened.\n\nI just didn't expect it so soon.\n\nAlmost at the break of dawn, the beetles managed to break through their pens and wreak havoc upon our camps. If we do not do something soon, we may risk losing the entire herd."
 gh_oasis_event.1001.a: "To arms! Do not let any escape!"
 gh_oasis_event.1001.a.success: "You successfully curtail the stampede"
 gh_oasis_event.1001.a.failure: "You fail to curtail the stampede"
 gh_oasis_event.1001.c.success: "The hired mercenaries succeed in stopping the stampede"
 gh_oasis_event.1001.c.failure: "The hired mercenaries give up at stopping the stampede"
 gh_oasis_event.1001.d.success: "You succeed in calming the herd with [magic|E]"
 gh_oasis_event.1001.b: "Eh, let them run free, I'm tired."
 gh_oasis_event.1001.c: "We should hire a few mercenaries to bring them back."
 gh_oasis_event.1001.d: "I know just the spell for this!"
 gh_oasis_event.1011.t: "Skiff Relics Beneath the Sand"
 gh_oasis_event.1011.desc: "Our Skiff Loremasters have reported to me that very near our Ahan, numerous ancient relics are buried deep beneath the sands that could prove very beneficial to our [sand_skiffs|E]. It will take great effort to bring them to the surface, but their benefits may be worth it."
 gh_oasis_event.1011.a: "Fine, hire what workers you need."
 gh_oasis_event.1011.a.success: "The hired workers successfully recover the skiff parts"
 gh_oasis_event.1011.a.failure: "The hired workers fail to recover the skiff parts"
 gh_oasis_event.1011.b.success: "You successfully recover the entire skiff"
 gh_oasis_event.1011.b.partial: "You recover some of the skiff parts"
 gh_oasis_event.1011.b.catastrophe: "You fail to recover anything"
 gh_oasis_event.1011.b: "We must recover all that we can!"
 gh_oasis_event.1011.c: "No, this is too costly."
 gh_oasis_event.1011.d: "Perhaps there's a spell that can help?"
 gh_oasis_event.1021.t: "Skiff Expansion"
 gh_oasis_event.1021.desc: "Our Skiff Loremasters have come to me with several plans they feel could expand and improve upon our [sand_skiffs|E]. While each has its costs, the benefits may be the edge we need to do more than survive in the [Glossary('harsh desert','sarradonian_desert_encyclopedia_desc')]."
 gh_oasis_event.1021.a: "The economic approach is best."
 gh_oasis_event.1021.b: "The militaristic approach is best."
 gh_oasis_event.1021.c: "Maybe another time."
 gh_oasis_event.1021.d: "Perhaps there's a better way?"
 gh_oasis_event.1021.d.success: "You successfully improve the skiffs with skill"
 gh_oasis_event.1021.d.failure: "You manage to make the skiffs worse"
 gh_oasis_event.1041.t: "Overcrowded Waters"
 gh_oasis_event.1041.desc: "Always, the [sarradon_oasis|E] attracts people from all corners of the desert seeking water, fresh food, and a little relaxation from the harsh sands. This time is no different, but quickly our patch of oasis has been nearly overrun with travelers and strangers. Supplies will not last forever, the waters will dry sooner rather than later, and unless something is done violence could break between the disparate groups taking shade at our oasis."
 gh_oasis_event.1041.a: "We should start charging for entry."
 gh_oasis_event.1041.b: "Let them come! There's room for all."
 gh_oasis_event.1041.c: "No one else is allowed in, kill any who disobey my order."
 gh_oasis_event.1041.d: "Surely we can reach a compromise?"
 gh_oasis_event.1041.e: "There must be some magic I can use to raise the waters."
 gh_oasis_event.1041.d.success: "#weak You successfully raise the oasis' waters above normal levels#!"
 gh_oasis_event.1041.d.failure: "#weak You fail to raise the oasis' waters, descending the land into chaos#!"
 gh_oasis_event.1051.t: "Oasis [attacked_county.Custom('GetAnimalType')|U]"
 gh_oasis_event.1051.desc: "Travelers in [attacked_county.GetNameNoTierNoTooltip] have reported in recent days the sighting of a monstrous [attacked_county.Custom('GetAnimalType')|U] in the oasis. While the [sarradon_oasis|E] attracts many creatures, such a beast is likely to scare away both people and more common game that could feed our camps."
 gh_oasis_event.1051.a: "Such worries do not matter."
 gh_oasis_event.1051.b: "We shall station extra guards at the water sites."
 gh_oasis_event.1061.t: "For Sale: Holy Waters"
 gh_oasis_event.1061.desc: "A merchant in our [sarradon_oasis|E] has been reported selling 'holy waters' that can heal any ailments and even extend one's life. [good_merchant_template.GetName] has been brought before me for their alleged falsehoods, but [good_merchant_template.GetSheHe] still claims innocence."
 gh_oasis_event.1061.a: "[good_merchant_template.GetSheHe] will pay a fine."
 gh_oasis_event.1061.b: "[good_merchant_template.GetSheHe] will pay with their hand, for theft."
 gh_oasis_event.1061.c: "[good_merchant_template.GetSheHe] will serve me until I decide otherwise."
 gh_oasis_event.1061.d: "[good_merchant_template.GetSheHe] will pay with [good_merchant_template.GetHerHis] life!"
 gh_oasis_event.1061.e: "I will teach [good_merchant_template.GetHerHim] the error of [good_merchant_template.GetHerHis] ways."
 gh_oasis_event.1061.e.success: "#weak You successfully convince the merchant of [good_merchant_template.GetHerHis] crimes#!"
 gh_oasis_event.1061.e.failure: "#weak The merchant manages to negotiate [good_merchant_template.GetHerHis] freedom#!"
 gh_oasis_event.1061.f: "...Could I buy one?"


