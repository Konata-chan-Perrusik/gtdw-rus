 # Season Names
 the_sarradonian_desert_situation_sand_blessed_bloom_season_situation_phase:0 "The Waking Sands"
 the_sarradonian_desert_situation_sand_blessed_bloom_season_situation_phase_desc:0 "A bloom sweeps the desert sands. Hardy flora bursts forth, creating fleeting oases that sustain both mundane and [Concept('magic','Magical')|E] life."
  
 the_sarradonian_desert_situation_sand_scorching_zenith_season_situation_phase:0 "Sun's Fury"
 the_sarradonian_desert_situation_sand_scorching_zenith_season_situation_phase_desc:0 "The sun beats down with unnatural, oppressive heat. Mirages shimmer across the sands, and metal becomes too hot to touch."
  
 the_sarradonian_desert_situation_sand_sand_scribe_season_situation_phase:0 "Whispering Winds"
 the_sarradonian_desert_situation_sand_sand_scribe_season_situation_phase_desc:0 "Constant winds reshape the desert daily, revealing ancient secrets only to bury them again, and carry whispers of lost knowledge to those who listen."
  
 the_sarradonian_desert_situation_sand_veil_thin_nights_season_situation_phase:0 "Ethereal Nights"
 the_sarradonian_desert_situation_sand_veil_thin_nights_season__situation_phasedesc:0 "The barrier between worlds grows thin under the cold, desert moon. [Glossary('Spirits','animal_type_spirit_encyclopedia_desc')] are said to roam the desert in great number, though who knows what may be encountered in the deep sands."
  
 the_sarradonian_desert_situation_sand_sand_devil_season_situation_phase:0 "The Howling"
 the_sarradonian_desert_situation_sand_sand_devil_season_situation_phase_desc:0 "Vicious, [Concept('magic','Magical')|E] sandstorms roar across the desert, believed to be the wrath of great [Glossary('Spirits','animal_type_spirit_encyclopedia_desc')] or the breath of slumbering [Glossary('Elementals','animal_type_elemental_encyclopedia_desc')]. Travel is suicide, and even fortified settlements are besieged by the storms."
  
 the_sarradonian_desert_situation_sand_celestial_stillness_season_situation_phase:0 "Oasis of Stars"
 the_sarradonian_desert_situation_sand_celestial_stillness_season_situation_phase_desc:0 "The desert falls silent, and the night sky blazes with constellations so bright they cast shadows. This stillness enhances meditation, astronomy, and powerful rituals."

