 trait_track_confucian_education: "Humanism"
 trait_track_confucian_education_desc: "Through abstemiousness and benevolence we build a better society, together.\n\n#weak This [trait|E] can be levelled through #V $request_mentoring_interaction$#! [character_interaction|E] or [court_position_tasks|E] of #V $grand_mentor_court_position$#! or #V $court_tutor_court_position$#! [court_positions|E]"
 trait_confucian_education_character_desc: "This character has just started the journey on the road towards sagacity."
 trait_confucian_education: "Humanist Education"
 trait_confucian_education_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has just started [ROOT.GetCharacter.GetHerHis] journey on the road towards sagacity."
 trait_confucian_education_1: "Genuine Humanist"
 trait_confucian_education_1_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has glimpsed the vast wisdom of the Humanist Ways."
 trait_confucian_education_2: "Studious Classicist"
 trait_confucian_education_2_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] modestly applies the teachings of Confucius to [ROOT.GetCharacter.GetHerHis] everyday life."
 trait_confucian_education_3: "Virtuous Ethicist"
 trait_confucian_education_3_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] is getting a grasp of what it means to be a virtuous Humanistist."
 trait_confucian_education_4: "Moral Paragon"
 trait_confucian_education_4_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] is living up to the Way as a true role model."
 trait_confucian_education_5: "Immaculate Sage"
 trait_confucian_education_5_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a virtual saint in Humanist circles. Other Humanistists far and wide have heard of [ROOT.GetCharacter.GetHerHis] moral and ethical prowess."
