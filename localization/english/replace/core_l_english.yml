 BOOKMARK_YEAR:0 "[Select_int32( GreaterThan_int32( GameSetup.GetSelectedBookmark.GetDate.GetYear, '(int32)5000'), Subtract_int32( GameSetup.GetSelectedBookmark.GetDate.GetYear, '(int32)5000'), Subtract_int32( '(int32)5000', GameSetup.GetSelectedBookmark.GetDate.GetYear) )]"
 RD_YEAR:0 "[Select_int32( GreaterThan_int32( RulerDesignerWindow.GetBirthYear, '(int32)5000'), Subtract_int32( RulerDesignerWindow.GetBirthYear, '(int32)5000'), Subtract_int32( '(int32)5000', RulerDesignerWindow.GetBirthYear) )]"
