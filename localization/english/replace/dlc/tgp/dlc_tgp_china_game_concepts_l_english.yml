l_english:

 game_concept_merit_level_desc: "A [character_possessive|E] $game_concept_merit_level$ indicates how appropriate they are as a [governor|E] in Aversarian [administrative_governments|E].\n\nIt represents their documented achievements and moral conduct according to Humanist ideals through the amount of [merit|E] they have gained.\n\nAn official with a high $game_concept_merit_level$ has a higher [candidate_score|E] and [governor_salary|E].\n\nThe Ranks are:\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_5' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_8' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_9' ).GetNameWithTooltip|L]"

 game_concept_seal_of_investiture_desc: "Simultaneously a legal document and a revered symbol of the grace of the Purest, the $game_concept_seal_of_investiture$ signifies the holder's special status as a loyal and favored [tributary|E] of [SelectLocalization( GetPlayer.IsValid, 'game_concept_seal_of_investiture_desc_ingame', 'h_aversarinas_aautokrata' )].\n\nA $game_concept_seal_of_investiture$ may be granted to $game_concept_tributaries$ with high [imperial_grace|E] during the closing ceremonies of a successful #bold Tribute Mission#!."
 game_concept_seal_of_investiture_desc_ingame: "[GetTitleByKey('h_aversarinas_aautokrata').GetDefinitiveName]"

 game_concept_son_of_heaven: "Incarnation of the Purest"
 game_concept_son_of_heaven_possessive: "Incarnation of the Purest's"
 game_concept_son_of_heaven_desc: "The $game_concept_son_of_heaven$ is the [hegemon|E] of [aversaria|E] and the [top_liege|E] of the [celestial_government|E].\n\nThe $game_concept_son_of_heaven$ has a special form of [legitimacy|E], the [mandate_of_heaven|E], and a unique [situation_participant_group|E] simply called $game_concept_son_of_heaven$."

 game_concept_mandate_of_heaven: "Mandate of Light"
 game_concept_mandate_of_heaven_mandate: "Mandate"
 game_concept_mandate_of_heaven_desc: "The $game_concept_mandate_of_heaven$ is a special type of [legitimacy|E] only available to [son_of_heaven|E]. It represents the monarch's right to rule, and who is considered the supreme ruler under all of humanity.\n\nThe Mandate is closely connected to the [dynastic_cycle|E]. The Cycle affect how the reigning monarch gains Legitimacy and may also change [situation_dynastic_cycle_phase|E] based on the monarch's level of Mandate."