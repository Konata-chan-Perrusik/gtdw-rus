 visit_silk_road_market_decision_desc: "The riches of the Imperial Sea Road aren't all stored in coins. Sometimes there's new... #italic thoughts#! that travel on camelback from bazaar to bazaar. Visit the right market, talk to the right people, and learn of secrets unknown to the wider world."
